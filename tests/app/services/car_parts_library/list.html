<script>
// 下载模板函数
function downloadTemplate() {
    window.location.href = '/new/api/car-parts/template';
}

layui.use(['table', 'layer', 'form', 'jquery', 'upload', 'dropdown'], function(){
    const table = layui.table;
    const layer = layui.layer;
    const form = layui.form;
    const $ = layui.jquery;
    const upload = layui.upload;
    const dropdown = layui.dropdown;
    
    // 表格是否已渲染
    let tableRendered = false;

    // 处理价格显示
    function formatPrice(price) {
        if (!price) return '-';
        return '¥' + parseFloat(price).toFixed(2);
    }

    // 表格配置
    const tableConfig = {
        elem: '#partsTable',
        id: 'partsTable',
        url: '/new/api/car-parts/list',
        method: 'get',
        page: true,
        limit: 10,
        limits: [10,20,50,100],
        toolbar: '#tableHeaderToolBar',
        defaultToolbar: ['filter', 'exports'],
        request: {
            pageName: 'page',
            limitName: 'page_size'
        },
        parseData: function(res){
            if(res.code === 200){
                return {
                    "code": 0,
                    "msg": res.msg,
                    "count": res.data.count,
                    "data": res.data.data || []
                };
            } else {
                return {
                    "code": res.code,
                    "msg": res.msg,
                    "count": 0,
                    "data": []
                };
            }
        },
        cols: [[
            {type: 'checkbox', fixed: 'left'},
            {field: 'part_number', title: '配件编号', width: 180},
            {field: 'description_cn', title: '中文描述', width: 200},
            {field: 'descriptions', title: '英文描述', width: 200},

    // 刷新/渲染表格
    function reloadTable(){
        const partNumber = $('#partNumber').val().trim();

        // 检查是否有查询条件
        if (!partNumber) {
            layer.msg('请输入查询条件', {icon: 0});
            return;
        }

        // 合并查询参数
        const config = {
            ...tableConfig,
            page: {
                curr: 1
            },
            where: {
                part_number: partNumber
            }
        };

        if (tableRendered) {
            table.reload('partsTable', {
                url: config.url,
                method: config.method,
                page: config.page,
                where: config.where
            });
        } else {
            table.render(config);
            tableRendered = true;

    // 打开添加/编辑弹窗
    function openPartForm(data = null, isEdit = false) {
        const getTpl = partFormTemplate.innerHTML;
        const layerIndex = layer.open({
            title: isEdit ? '编辑配件' : '添加配件',
            type: 1,
            area: ['600px', '800px'],
            content: getTpl,
            success: function(layero, index) {
                // 重新渲染表单
                form.render();

                // 如果是编辑模式，填充数据
                if (isEdit && data) {
                    // 禁用配件编号编辑
                    const partNumberInput = layero.find('input[name="part_number"]');
                    partNumberInput.val(data.part_number).prop('readonly', true);

                    // 填充其他字段
                    const fields = ['description_cn', 'descriptions', 'brand', 'category', 
                                    'marketing_code', 'marketing_code_description', 
                                    'dealer_discount_group', 'dealer_fixed_nominal_margin',
                                    'wholesale_price', 'msrp', 'purchase_price', 
                                    'quantity_unit', 'sales_pack_size', 'weight', 
                                    'length', 'width', 'height', 'volume', 
                                    'effective_date', 'ccc_mark', 'hazmat_code', 
                                    'origin_country', 'shelf_life', 'is_hazmat', 'l_model_zh'];
                    
                    fields.forEach(field => {
                        if (data[field] !== undefined && data[field] !== null) {
                            const input = layero.find(`[name="${field}"]`);
                            if (input.length) {
                                if (input.is('textarea')) {
                                    input.val(data[field]);
                                } else {
                                    input.val(data[field]);
                                }
                            }
                        }
                    });

                    form.render();
                }

                // 保存按钮点击事件
                $('#savePartBtn').off('click').on('click', function() {
                    const formData = {};
                    layero.find('input, textarea').each(function() {
                        const name = $(this).attr('name');
                        let value = $(this).val();
                        
                        // 处理数字字段，空值设为null
                        if (['dealer_fixed_nominal_margin', 'wholesale_price', 'msrp', 'purchase_price', 'weight', 'volume'].includes(name)) {
                            value = value === '' ? null : parseFloat(value);
                        }
                        
                        if (name) {
                            formData[name] = value;
                        }
                    });

                    // 验证配件编号
                    if (!formData.part_number) {
                        layer.msg('配件编号不能为空', {icon: 0});
                        return;
                    }

                    const loading = layer.load(2, {
                        shade: [0.3, '#000'],
                        content: '正在保存...'
                    });

                    const url = isEdit ? '/new/api/car-parts/update' : '/new/api/car-parts/add';

                    $.ajax({
                        url: url,
                        method: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify(formData),
                        success: function(res) {
                            layer.close(loading);
                            if (res.code === 200) {
                                layer.msg(res.msg || '保存成功', {icon: 1, time: 1500});
                                layer.close(layerIndex);
                                // 刷新表格
                                if (tableRendered) {
                                    table.reload('partsTable');
                                }
                            } else {
                                layer.msg(res.msg || '保存失败', {icon: 2});
                            }
                        },
                        error: function() {
                            layer.close(loading);
                            layer.msg('请求失败，请稍后重试', {icon: 2});
                        }
                    });
                });

                // 取消按钮点击事件
                $('#cancelPartBtn').off('click').on('click', function() {
                    layer.close(layerIndex);
                });
            }
        });
    }

                upload.render({
                    elem: '#uploadArea',

                        'check-error': '选择的文件中包含不支持的格式，请使用 .xlsx 或 .csv 格式上传'
                    },
                    before: function(obj) {

                    done: function(res) {
                        layer.closeAll('loading');
                        
                        if(res.code === 200) {
                            layer.msg(res.msg || '导入成功', {icon: 1});
                            
                            // 显示结果
                            $('#importResult').show();
                            $('#resultTotal').text(res.data.total || 0);
                            $('#resultSuccess').text(res.data.success || 0);
                            $('#resultFailed').text(res.data.failed || 0);
                            
                            // 显示错误详情
                            if(res.data.errors && res.data.errors.length > 0) {
                                $('#errorList').show();
                                const errorList = $('#errorItems');
                                errorList.empty();
                                res.data.errors.forEach(function(err) {
                                    errorList.append('<li style="margin-bottom: 5px; color: #ff5722;">第' + (err.row || '') + '行：' + (err.part_number || '') + ' - ' + err.error + '</li>');

                                $('#errorList').hide();
                            }
                            
                            // 刷新表格
                            if(tableRendered) {
                                table.reload('partsTable');
                            }
                        } else {
                            layer.msg(res.msg || '导入失败', {icon: 2});
                            
                            // 如果有错误信息也显示
                            if(res.data) {
                                $('#importResult').show();
                                $('#resultTotal').text(res.data.total || 0);
                                $('#resultSuccess').text(res.data.success || 0);
                                $('#resultFailed').text(res.data.failed || 0);
                                
                                if(res.data.errors && res.data.errors.length > 0) {
                                    $('#errorList').show();
                                    const errorList = $('#errorItems');
                                    errorList.empty();
                                    res.data.errors.forEach(function(err) {
                                        errorList.append('<li style="margin-bottom: 5px; color: #ff5722;">' + (err.row ? '第' + err.row + '行：' : '') + (err.part_number || '') + ' - ' + err.error + '</li>');
                                    });
                                }
                            }
                        }
                    },
                    error: function() {
                        layer.closeAll('loading');
                        layer.msg('上传失败，请重试', {icon: 2});
                    }
                });
            }
        });

                                        return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
                                    }},
                                    {title: '操作', width: 120, fixed: 'right', align: 'center', templet: '#favoritesRowToolBar'}
                                ]],
                                done: function(res, curr, count){
                                    if(res.code !== 0 && res.msg){
                                        layer.msg(res.msg, {icon: 2});
                                    }
                                }
                            });
                        }
                    }
                });

                table.on('toolbar(favoritesTable)', function(obj){
                    var checkStatus = table.checkStatus(obj.config.id);
                    
                    if(obj.event === 'batchRemoveFavorite'){
                        if(!checkStatus.data.length) return layer.msg('请先选择要删除的收藏', {icon: 0});
                        
                        layer.confirm('确定要删除选中的收藏吗？', function(confirmIndex){
                            var partNumbers = checkStatus.data.map(function(item){
                                return item.part_number;
                            });
                            
                            const loading = layer.load(1, {shade: [0.3, '#000'], content: '正在删除...'});
                            
                            $.ajax({
                                url: '/new/api/car-parts/remove-favorites',
                                method: 'POST',
                                contentType: 'application/json',
                                data: JSON.stringify({
                                    part_numbers: partNumbers
                                }),
                                success: function(res){
                                    layer.close(loading);
                                    layer.close(confirmIndex);
                                    if(res.code === 200){
                                        layer.msg(res.msg || '删除成功', {icon: 1});
                                        table.reload('favoritesTable');
                                    } else {
                                        layer.msg(res.msg || '删除失败', {icon: 2});
                                    }
                                },
                                error: function(xhr, status, error){
                                    layer.close(loading);
                                    layer.close(confirmIndex);
                                    if(xhr.status === 401){
                                        layer.msg('请先登录', {icon: 2});
                                    } else {
                                        layer.msg('请求失败: ' + error, {icon: 2});
                                    }
                                }
                            });
                        });
                    } else if(obj.event === 'batchMoveToMain'){
                        if(!checkStatus.data.length) return layer.msg('请先选择要移动的收藏', {icon: 0});
                        
                        layer.confirm('确定要将选中的收藏移动到主收藏吗？', function(confirmIndex){
                            var partNumbers = checkStatus.data.map(function(item){
                                return item.part_number;
                            });
                            
                            const loading = layer.load(1, {shade: [0.3, '#000'], content: '正在移动...'});
                            
                            $.ajax({
                                url: '/new/api/car-parts/move-to-main',
                                method: 'POST',
                                contentType: 'application/json',
                                data: JSON.stringify({
                                    part_numbers: partNumbers
                                }),
                                success: function(res){
                                    layer.close(loading);
                                    layer.close(confirmIndex);
                                    if(res.code === 200){
                                        layer.msg(res.msg || '移动成功', {icon: 1});
                                        table.reload('favoritesTable');
                                    } else {
                                        layer.msg(res.msg || '移动失败', {icon: 2});
                                    }
                                },
                                error: function(xhr, status, error){
                                    layer.close(loading);
                                    layer.close(confirmIndex);
                                    if(xhr.status === 401){
                                        layer.msg('请先登录', {icon: 2});
                                    } else {
                                        layer.msg('请求失败: ' + error, {icon: 2});
                                    }
                                }
                            });
                        });
                    } else if(obj.event === 'batchCopyToMain'){
                        if(!checkStatus.data.length) return layer.msg('请先选择要复制的收藏', {icon: 0});
                        
                        layer.confirm('确定要将选中的收藏复制到主收藏吗？', function(confirmIndex){
                            var partNumbers = checkStatus.data.map(function(item){
                                return item.part_number;
                            });
                            
                            const loading = layer.load(1, {shade: [0.3, '#000'], content: '正在复制...'});
                            
                            $.ajax({
                                url: '/new/api/car-parts/copy-to-main',
                                method: 'POST',
                                contentType: 'application/json',
                                data: JSON.stringify({
                                    part_numbers: partNumbers
                                }),
                                success: function(res){
                                    layer.close(loading);
                                    layer.close(confirmIndex);
                                    if(res.code === 200){
                                        layer.msg(res.msg || '复制成功', {icon: 1});
                                        table.reload('favoritesTable');
                                    } else {
                                        layer.msg(res.msg || '复制失败', {icon: 2});
                                    }
                                },
                                error: function(xhr, status, error){
                                    layer.close(loading);
                                    layer.close(confirmIndex);
                                    if(xhr.status === 401){
                                        layer.msg('请先登录', {icon: 2});
                                    } else {
                                        layer.msg('请求失败: ' + error, {icon: 2});
                                    }
                                }
                            });
                        });
                    } else if(obj.event === 'batchRefreshFavorite'){
                        if(!checkStatus.data.length) return layer.msg('请先选择要更新的数据', {icon: 0});
                        
                        var partNumbers = checkStatus.data.map(function(item){
                            return item.part_number;
                        });
                        
                        var loading = layer.load(1, {shade: [0.3, '#000'], content: '正在更新数据...'});
                        
                        $.ajax({
                            url: '/new/api/car-parts/batch-refresh',
                            method: 'POST',
                            contentType: 'application/json',
                            data: JSON.stringify({
                                part_numbers: partNumbers
                            }),
                            success: function(res){
                                layer.close(loading);
                                if(res.code === 200){
                                    layer.msg(res.msg || '数据更新成功', {icon: 1});
                                    table.reload('favoritesTable');
                                } else {
                                    layer.msg(res.msg || '数据更新失败', {icon: 2});
                                }
                            },
                            error: function(xhr, status, error){
                                layer.close(loading);
                                layer.msg('请求失败: ' + error, {icon: 2});
                            }
                        });
                    } else if(obj.event === 'clearCategoryFavorites'){
                        layer.confirm('确定要清空当前分类下的所有收藏吗？此操作不可恢复！', function(confirmIndex){
                            const loading = layer.load(1, {shade: [0.3, '#000'], content: '正在清空...'});
                            
                            $.ajax({
                                url: '/new/api/car-parts/clear-category',
                                method: 'POST',
                                contentType: 'application/json',
                                data: JSON.stringify({
                                    category: currentCategory
                                }),
                                success: function(res){
                                    layer.close(loading);
                                    layer.close(confirmIndex);
                                    if(res.code === 200){
                                        layer.msg(res.msg || '清空成功', {icon: 1});
                                        table.reload('favoritesTable');
                                    } else {
                                        layer.msg(res.msg || '清空失败', {icon: 2});
                                    }
                                },
                                error: function(xhr, status, error){
                                    layer.close(loading);
                                    layer.close(confirmIndex);
                                    if(xhr.status === 401){
                                        layer.msg('请先登录', {icon: 2});
                                    } else {
                                        layer.msg('请求失败: ' + error, {icon: 2});
                                    }
                                }
                            });
                        });
                    }
                });

                table.on('tool(favoritesTable)', function(obj){
                    const data = obj.data;

                    if(obj.event === 'removeFavorite'){
                        layer.confirm('确定要删除该收藏吗？', function(confirmIndex){
                            const loading = layer.load(1, {shade: [0.3, '#000'], content: '正在删除...'});
                            
                            $.ajax({
                                url: '/new/api/car-parts/remove-favorites',
                                method: 'POST',
                                contentType: 'application/json',
                                data: JSON.stringify({
                                    part_numbers: [data.part_number]
                                }),
                                success: function(res){
                                    layer.close(loading);
                                    layer.close(confirmIndex);
                                    if(res.code === 200){
                                        layer.msg(res.msg || '删除成功', {icon: 1});
                                        table.reload('favoritesTable');
                                    } else {
                                        layer.msg(res.msg || '删除失败', {icon: 2});
                                    }
                                },
                                error: function(xhr, status, error){
                                    layer.close(loading);
                                    layer.close(confirmIndex);
                                    if(xhr.status === 401){
                                        layer.msg('请先登录', {icon: 2});
                                    } else {
                                        layer.msg('请求失败: ' + error, {icon: 2});
                                    }
                                }
                            });
                        });
                    }
                });
            }
        });
    });

    $('#settingsBtn').on('click', function(){
        const getTpl = settingsTemplate.innerHTML;
        const layerIndex = layer.open({
            title: '奔驰大库配置',
            type: 1,
            area: ['600px', '550px'],
            content: getTpl,
            success: function(layero, index){
                $.ajax({
                    url: '/new/api/car-parts/get-config',
                    method: 'GET',
                    success: function(res){
                        if(res.code === 200 && res.data){
                            $('#cookieInput').val(res.data.cookie || '');
                            $('#customerIdInput').val(res.data.customer_id || '');
                            $('#salesOrganizationIdInput').val(res.data.sales_organization_id || '');
                            $('#taxRateInput').val(res.data.tax_rate || 1.13);
                            $('#discountRateInput').val(res.data.discount_rate || 0.83);
                        }
                    }
                });

                $('#saveSettingsBtn').off('click').on('click', function(){
                    const cookie = $('#cookieInput').val();
                    const customerId = $('#customerIdInput').val();
                    const salesOrganizationId = $('#salesOrganizationIdInput').val();
                    const taxRate = parseFloat($('#taxRateInput').val()) || 1.13;
                    const discountRate = parseFloat($('#discountRateInput').val()) || 0.83;

                    if(!cookie || !customerId || !salesOrganizationId){
                        layer.msg('Cookie、客户ID和销售组织ID不能为空', {icon: 0});
                        return;
                    }

                    const loading = layer.load(2, {
                        shade: [0.3, '#000'],
                        content: '正在保存...'
                    });

                    $.ajax({
                        url: '/new/api/car-parts/set-config',
                        method: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({
                            cookie: cookie,
                            customer_id: customerId,
                            sales_organization_id: salesOrganizationId,
                            tax_rate: taxRate,
                            discount_rate: discountRate
                        }),
                        success: function(res){
                            layer.close(loading);
                            if(res.code === 200){
                                layer.msg('保存成功', {icon: 1, time: 1500});
                                layer.close(layerIndex);
                            } else {
                                layer.msg(res.msg || '保存失败', {icon: 2});
                            }
                        },
                        error: function(){
                            layer.close(loading);
                            layer.msg('请求失败，请稍后重试', {icon: 2});
                        }
                    });
                });

                $('#cancelSettingsBtn').off('click').on('click', function(){
                    layer.close(layerIndex);
                });
            }
        });
    });
});
</script>
