<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日库存</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <link rel="stylesheet" href="/static/soulTable/soulTable.css">
    <style>
        /* 固定列和非固定列的视觉区分 */
        .layui-table-header th[fixed] {
            background-color: #f0f7ff !important;
        }
        .layui-table-body td[fixed] {
            background-color: #f0f7ff !important;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f2f5;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* 头部 */
        .header {
            background: #fff;
            padding: 20px 24px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .header-title {
            font-size: 15px;
            font-weight: 600;
            color: #262626;
            height: 15px;
        }

        .header-subtitle {
            font-size: 14px;
            color: #8c8c8c;
            margin-top: 4px;
        }

        /* 搜索区域 */
        .search-panel {
            background: #fff;
            padding: 20px 24px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .search-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .search-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-item label {
            font-size: 14px;
            color: #595959;
            white-space: nowrap;
        }

        .search-item input,
        .search-item select {
            width: 200px;
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .search-item input:focus,
        .search-item select:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24,144,255,0.2);
        }

        /* 按钮 */
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: #1890ff;
            color: #fff;
        }

        .btn-primary:hover {
            background: #40a9ff;
        }

        .btn-default {
            background: #fff;
            color: #595959;
            border: 1px solid #d9d9d9;
        }

        .btn-default:hover {
            color: #40a9ff;
            border-color: #40a9ff;
        }

        /* 主内容区 */
        .main-content {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        /* 表格样式 */
        .layui-table-view {
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #e8e8e8;
        }

        .layui-table-header {
            background-color: #fafafa;
            border-bottom: 2px solid #e8e8e8;
        }

        .layui-table th {
            font-weight: 600;
            color: #333;
            font-size: 13px;
            padding: 10px 5px;
        }

        .layui-table td {
            padding: 6px 5px;
            font-size: 13px;
            height: 36px;
            line-height: 1.5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .layui-table tbody tr:hover {
            background-color: #f5f7fa;
        }

        /* 工具栏按钮样式 */
        .toolbar-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div>
                <div class="header-title">每日库存</div>
                <!-- <div class="header-subtitle">每日库存数据查询与管理</div> -->
            </div>
        </div>

        <!-- 搜索区域 -->
        <div class="search-panel">
            <div class="search-row">
                <div class="search-item">
                    <label>日期：</label>
                    <input type="text" id="datePicker" placeholder="请选择日期" autocomplete="off">
                </div>
                <div class="search-item">
                    <label>采购单号：</label>
                    <input type="text" id="searchInput" placeholder="请输入采购单号" autocomplete="off">
                </div>
                <div class="search-item">
                    <label>订单类型：</label>
                    <select id="orderTypeSelect">
                        <option value="">全部</option>
                        <option value="1">采购入库单</option>
                        <option value="2">采购退货单</option>
                    </select>
                </div>
                <div class="search-item">
                    <label>业务类型：</label>
                    <select id="businessTypeSelect">
                        <option value="">全部</option>
                        <option value="1">外购</option>
                        <option value="2">普通</option>
                        <option value="3">调货</option>
                    </select>
                </div>
                <div class="search-item">
                    <button class="btn btn-primary" id="searchBtn">
                      <i class="layui-icon layui-icon-search"></i> 搜索
                    </button>
                    <button class="btn btn-default" id="resetBtn">
                      <i class="layui-icon layui-icon-refresh"></i> 重置
                    </button>
                    <button class="btn btn-primary" id="updateBtn" style="background: #52c41a;">
                      <i class="layui-icon layui-icon-refresh-3"></i> 更新数据
                    </button>
                  </div>
            </div>
        </div>

        <!-- 主内容区 -->
        <div class="main-content">
            <table id="dailyInventoryTable" lay-filter="dailyInventoryTable"></table>
        </div>
    </div>
    
    <!-- 工具栏模板 -->
    <script type="text/html" id="toolbarTemplate">
      <div class="toolbar-btn">
        <button class="layui-btn layui-btn-sm" id="batchViewBtn" lay-event="batchView">
          <i class="layui-icon layui-icon-ok"></i> 批量查看确认
        </button>
      </div>
    </script>

    <!-- 主表订单级操作列模板：点击确认查看该订单下所有明细 -->
    <script type="text/html" id="orderToolBar">
      <div class="action-btns">
        <a class="layui-btn layui-btn-xs" lay-event="orderDetail">确认查看</a>
      </div>
    </script>

    <script src="/static/layui/layui.js"></script>
    <script>
        // 配置 soulTable 扩展
        layui.config({
            version: 'v1.9.0'
        }).extend({
            soulTable: '/static/soulTable/soulTable.slim',
            tableChild: '/static/soulTable/tableChild'
        });

        layui.use(['table', 'soulTable', 'tableChild', 'laydate', 'jquery', 'layer'], function() {
            var table = layui.table;
            var soulTable = layui.soulTable;
            var tableChild = layui.tableChild;
            var laydate = layui.laydate;
            var $ = layui.jquery;
            var layer = layui.layer;
            
            // 初始化日期选择器，默认今天
            var today = new Date();
            var todayStr = today.getFullYear() + '-' + 
                          String(today.getMonth() + 1).padStart(2, '0') + '-' + 
                          String(today.getDate()).padStart(2, '0');
            laydate.render({
                elem: '#datePicker',
                type: 'date',
                value: todayStr,
                format: 'yyyy-MM-dd'
            });
            
            // 渲染表格
            var tableIns = table.render({
                elem: '#dailyInventoryTable',
                id: 'dailyInventoryTable',
                url: '/new/api/daily_inventory/purchase-orders',
                method: 'GET',
                page: true,
                limit: 10,
                limits: [10, 20, 50, 100],
                height: 'full-260',
                toolbar: '#toolbarTemplate',
                defaultToolbar: ['filter', 'exports'],
                where: {
                  date: todayStr,
                  keyword: ''
                },
                parseData: function(res) { // 将返回的数据解析成 table 组件所要求的格式
                  // 将200转换为0，因为layui table期望code:0表示成功
                  var tableCode = res.code === 200 ? 0 : res.code;
                  var rows = res.data ? res.data.list : [];
                  // 后端返回的是"订单+明细"拍平数据（每行一条明细），这里按订单分组：
                  // 订单级字段放父行，明细级字段放 details 数组，
                  // 配合 tableChild 实现"一行一订单，点击展开明细子表"
                  var grouped = [];
                  var orderMap = {};
                  for (var i = 0; i < rows.length; i++) {
                    var row = rows[i];
                    var key = row.list_purchase_order_id;
                    if (!orderMap[key]) {
                      var order = { details: [] };
                      for (var k in row) {
                        if (k.indexOf('list_') === 0) {
                          order[k] = row[k];
                        }
                      }
                      // 主表"操作人"列：取该订单第一条明细的操作人
                      order.list_operator = row.detail_operator || '';
                      orderMap[key] = order;
                      grouped.push(order);
                    }
                    var detail = {};
                    for (var k2 in row) {
                      if (k2.indexOf('detail_') === 0) {
                        detail[k2] = row[k2];
                      }
                    }
                    orderMap[key].details.push(detail);
                  }
                  return {
                    "code": tableCode, // 接口状态
                    "msg": res.msg, // 提示信息
                    "count": res.data ? res.data.total : 0, // 数据总数（订单数）
                    "data": grouped // 分组后的订单列表
                  };
                },
                cols: [[
                    {type: 'checkbox', fixed: 'left'},
                    // 子表格展开列：点击展开/收起该订单的明细子表
                    {
                      field: 'childTable', title: '', width: 30, align: 'center',
                      childTitle: false, // 不显示子表的 tab 标题
                      templet: function(){ return ''; },
                      children: [
                        {
                          title: '订单明细',
                          height: 'auto',
                          // 子表不启用列筛选；unresize:false 显式开启子表列宽拖动
                          unresize: false,
                          cols: [[
                            {field: 'detail_no', title: '序号', width: 80},
                            {field: 'detail_purchase_order_line_id', title: '订单明细ID', width: 100, hide: true},
                            {field: 'detail_frey_no', title: '条码', width: 180},
                            {field: 'detail_number', title: 'oe号', width: 140},
                            {field: 'detail_l_name_zh', title: '商品名称', width: 200},
                            {field: 'detail_brand', title: '品牌', width: 100},
                            {field: 'detail_brand_code', title: '品牌编码', width: 100, hide: true},
                            {field: 'detail_company_remark', title: '内部备注', width: 100, hide: true},
                            {field: 'detail_l_model_zh', title: '车型', width: 250, hide: true},
                            {field: 'detail_purchase_quantity', title: '采购数量', width: 100},
                            {field: 'detail_received_quantity', title: '收货数量', width: 100, hide: true},
                            {field: 'detail_unit', title: '单位', width: 80, hide: true},
                            {field: 'detail_price', title: '采购价', width: 100, templet: function(d) {
                                return '¥' + (d.detail_price || 0);
                              }},
                            {field: 'detail_unit_cost', title: '单件成本', hide: true, width: 100, templet: function(d) {
                                return '¥' + (d.detail_unit_cost || 0);
                              }},
                            {field: 'detail_amount_money', title: '商品金额', width: 110, templet: function(d) {
                                return '¥' + (d.detail_amount_money || 0);
                              }, hide: true},
                            {field: 'detail_ks_price', title: '开思价', width: 110, templet: function(d) {
                                return d.detail_ks_price ? '¥' + d.detail_ks_price : '-';
                              }},
                            {field: 'detail_gross_profit', title: '毛利额', width: 110, templet: function(d) {
                                var ks = parseFloat(d.detail_ks_price);
                                var purchase_price = parseFloat(d.detail_price);
                                if (isNaN(ks) || ks <= 0 || isNaN(purchase_price) || purchase_price < 0) return '-';
                                var gross_profit = ks - purchase_price;
                                return '¥' + gross_profit.toFixed(2);
                              }},
                            {field: 'detail_gross_margin', title: '毛利率', width: 110, templet: function(d) {
                                var ks = parseFloat(d.detail_ks_price);
                                var purchase_price = parseFloat(d.detail_price);
                                if (isNaN(ks) || ks <= 0 || isNaN(purchase_price) || purchase_price < 0) return '-';
                                var gross_profit = ks - purchase_price;
                                var gross_margin = (gross_profit / ks * 100);
                                return gross_margin.toFixed(2) + '%';
                              }},
                            {field: 'detail_operator', title: '操作人', width: 100}
                          ]],
                          data: function(d) {
                            return d.details || [];
                          }
                        }
                      ]
                    },
                    {field: 'list_purchase_order_id', title: '订单ID', width: 100, hide: true},
                    {field: 'list_create_date', title: '订单日期', width: 160},
                    {field: 'list_pono', title: '采购单号', width: 170},
                    {field: 'list_fullname', title: '供应商名称', width: 280},
                    {field: 'list_order_type_id', title: '订单类型', width: 120, templet: function(d) {
                        var statusMap = {1: '采购入库单', 2: '采购退货单'};
                        return statusMap[d.list_order_type_id] || d.list_order_type_id;
                      }
                    },
                    {field: 'list_order_source_type', title: '业务类型', hide: true, width: 120, templet: function(d) {
                        var statusMap = {1: '外购', 2: '普通', 3: '调货'};
                        return statusMap[d.list_order_source_type] || d.list_order_source_type;
                      }
                    },
                    {field: 'list_end_date', title: '入库日期', width: 180, hide: true},
                    {field: 'list_total', title: '订单总数', width: 100},
                    {field: 'list_received_quantity', title: '实发总数', width: 100, hide: true},
                    {field: 'list_amount_money', title: '订单总价', width: 120, templet: function(d) {
                        return '¥' + (d.list_amount_money || 0);
                      }},
                    {field: 'list_received', title: '实发总价', width: 110, templet: function(d) {
                        return '¥' + (d.list_received || 0);
                      }},
                    {field: 'list_payment_description', title: '付款方式', width: 100, hide: true},
                    {field: 'list_shipping_fee', title: '运费', width: 100, templet: function(d) {
                        return '¥' + (d.list_shipping_fee || 0);
                      }, hide: true},
                    {field: 'list_packing_fee', title: '包装费', width: 100, templet: function(d) {
                        return '¥' + (d.list_packing_fee || 0);
                      }, hide: true},
                    {field: 'list_name', title: '采购员', width: 120},
                    {field: 'list_remarks', title: '备注', width: 200, hide: true},
                    {field: 'list_status', title: '订单状态', width: 100, templet: function(d) {
                        var statusMap = {1: '已调单', 4: '已收货', 7: '已拣货'};
                        return statusMap[d.list_status] || d.list_status;
                      }, hide: true},
                    {field: 'list_operator', title: '操作人', width: 100, templet: function(d) {
                        // 显示该订单第一条明细的操作人
                        return d.list_operator || (d.details && d.details.length ? d.details[0].detail_operator || '' : '');
                      }},
                    { title: '操作', width: 130, fixed: 'right', align: 'center', templet: '#orderToolBar' }
                ]],
                done: function() {
          // 表格渲染完成后，调用 tableChild.render() 初始化子表格展开/收起
          tableChild.render(this);
          // 调用 soulTable.render() 实现列拖拽功能，soulTable会自动禁止固定列与非固定列之间交换
          // 暂时禁用拖拽功能
          // soulTable.render(this);
        }
            });

            // 工具函数：收集一组订单（父表行，含 details）下的所有明细ID
            function collectOrderLineIds(orders) {
              var ids = [];
              for (var i = 0; i < orders.length; i++) {
                var details = orders[i].details || [];
                for (var j = 0; j < details.length; j++) {
                  if (details[j].detail_purchase_order_line_id) {
                    ids.push(details[j].detail_purchase_order_line_id);
                  }
                }
              }
              return ids;
            }

            // 工具函数：批量确认查看一组订单明细
            function doBatchMarkView(ids, onSuccess) {
              $.ajax({
                url: '/new/api/daily_inventory/batch-mark-viewed',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ purchase_order_line_ids: ids }),
                success: function(res) {
                  if (res.code === 200) {
                    layer.msg(res.msg || '批量确认查看成功', { icon: 1 });
                    if (onSuccess) onSuccess(res);
                  } else {
                    layer.msg(res.msg || '批量确认查看失败', { icon: 2 });
                  }
                },
                error: function (xhr) {
                  var errMsg = '网络错误，请稍后重试';
                  try {
                    var errData = JSON.parse(xhr.responseText);
                    if (errData && errData.msg) {
                      errMsg = errData.msg;
                    }
                  } catch (e) {}
                  layer.msg(errMsg, { icon: 2 });
                }
              });
            }

            // 表格行工具事件：主表订单级"确认查看" -> 该订单下所有明细全部确认
            table.on('tool(dailyInventoryTable)', function(obj) {
                if (obj.event === 'orderDetail') {
                    var data = obj.data;
                    var ids = collectOrderLineIds([data]);
                    if (ids.length === 0) {
                        layer.msg('该订单没有有效的订单明细', { icon: 2 });
                        return;
                    }
                    layer.confirm('确定要确认查看该订单下的 ' + ids.length + ' 条明细吗？', { icon: 3, title: '提示' }, function(index) {
                        doBatchMarkView(ids, function(res) {
                            layer.close(index);
                            // 只更新该订单行：刷新主表"操作人"列，不整表重载
                            if (res && res.data && res.data.operator) {
                                obj.data.list_operator = res.data.operator;
                                // 同步该订单下所有明细的操作人
                                var dts = obj.data.details || [];
                                for (var di = 0; di < dts.length; di++) {
                                    dts[di].detail_operator = res.data.operator;
                                }
                                obj.update({ list_operator: res.data.operator });
                                // 若该订单的子表已展开，同步刷新子表中各明细的"操作人"单元格
                                if (obj.tr) {
                                    $(obj.tr).next('.childTr').find('td[data-field="detail_operator"]').each(function() {
                                        $(this).find('.layui-table-cell').text(res.data.operator);
                                    });
                                }
                            }
                        });
                    });
                }
            });

            // 表格头工具栏事件
            table.on('toolbar(dailyInventoryTable)', function(obj) {
                var checkStatus = table.checkStatus('dailyInventoryTable');
                var data = checkStatus.data;
                if (obj.event === 'batchView') {
                    if (data.length === 0) {
                        layer.msg('请至少选择一条记录', { icon: 2 });
                        return;
                    }
                    // 勾选主表的是订单，这里收集所有被勾选订单下的全部明细ID，
                    // 即"勾选订单 -> 该订单下所有明细全部确认查看"
                    var purchase_order_line_ids = collectOrderLineIds(data);
                    if (purchase_order_line_ids.length === 0) {
                        layer.msg('选中的订单中没有有效的订单明细', { icon: 2 });
                        return;
                    }
                    // 确认对话框
                    layer.confirm('确定要批量确认查看选中的 ' + purchase_order_line_ids.length + ' 条订单明细吗？', { icon: 3, title: '提示' }, function(index) {
                        doBatchMarkView(purchase_order_line_ids, function() {
                            layer.close(index);
                            // 刷新表格以更新操作人字段
                            tableIns.reload();
                        });
                    });
                }
            });

            // 搜索按钮点击事件
            $('#searchBtn').on('click', function() {
                var date = $('#datePicker').val();
                var keyword = $('#searchInput').val();
                var orderType = $('#orderTypeSelect').val();
                var businessType = $('#businessTypeSelect').val();
                tableIns.reload({
                    where: {
                        date: date,
                        keyword: keyword,
                        order_type: orderType,
                        business_type: businessType
                    },
                    page: {
                        curr: 1
                    }
                });
            });
            
            // 重置按钮点击事件
            $('#resetBtn').on('click', function() {
              $('#datePicker').val(todayStr);
              $('#searchInput').val('');
              $('#orderTypeSelect').val('');
              $('#businessTypeSelect').val('');
              tableIns.reload({
                where: {
                  date: todayStr,
                  keyword: '',
                  order_type: '',
                  business_type: ''
                },
                page: {
                  curr: 1
                }
              });
            });
            
            // 更新数据按钮点击事件
            $('#updateBtn').on('click', function() {
              var date = $('#datePicker').val();
              var updateBtn = $(this);
              
              // 禁用按钮防止重复点击
              updateBtn.prop('disabled', true).html('<i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop"></i> 更新中...');
              
              // 调用更新数据API
              $.ajax({
                url: '/new/api/daily_inventory/update-data',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                  date: date
                }),
                success: function(res) {
                  if (res.code === 200) {
                    layer.msg(res.msg || '数据更新完成', { icon: 1 });
                    // 更新完成后自动刷新表格
                    tableIns.reload();
                  } else {
                    layer.msg(res.msg || '数据更新失败', { icon: 2 });
                  }
                },
                error: function(xhr) {
                  // 尝试解析后端返回的 JSON（权限不足、未登录等 HTTP 4xx 会走到这里）
                  var errMsg = '网络错误，请稍后重试';
                  try {
                    var errData = JSON.parse(xhr.responseText);
                    if (errData && errData.msg) {
                      errMsg = errData.msg;
                    }
                  } catch (e) {
                    // 解析失败时使用默认错误消息
                  }
                  layer.msg(errMsg, { icon: 2 });
                },
                complete: function() {
                  // 恢复按钮状态
                  updateBtn.prop('disabled', false).html('<i class="layui-icon layui-icon-refresh-3"></i> 更新数据');
                }
              });
            });
        });
    </script>
</body>
</html>
