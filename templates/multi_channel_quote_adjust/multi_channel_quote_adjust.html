<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多渠道报价调价</title>

    <!-- LayUI -->
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <script src="/static/layui/layui.js"></script>

    <!-- Handsontable -->
    <link rel="stylesheet" href="/static/js/handsontable/handsontable.full.min.css">
    <script src="/static/js/handsontable/handsontable.full.min.js"></script>

    <!-- Handsontable Builder -->
    <script src="/static/js/components/handsontable-builder/handsontable-builder.js"></script>

    <!-- Grid Column Menu -->
    <link rel="stylesheet" href="/static/js/components/grid-column-menu/grid-column-menu.css">
    <script src="/static/js/components/grid-column-menu/grid-column-menu.js"></script>

    <!-- Column Preference -->
    <script src="/static/js/components/column-preference/column-preference.js"></script>

    <!-- Custom Pagination -->
    <script src="/static/js/components/custom-pagination/custom-pagination.js"></script>

    <!-- TabNav -->
    <link rel="stylesheet" href="/static/js/components/tab-nav/tab-nav.css">
    <script src="/static/js/components/tab-nav/tab-nav.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container { max-width: 100%; margin: 0 auto; }

        .toolbar {
            margin-bottom: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .toolbar .layui-btn {
            height: 32px;
            line-height: 32px;
            padding: 0 16px;
        }

        #importFileInput {
            display: none;
        }

        .table-container {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            height: calc(100vh - 180px);
            min-height: 500px;
            padding: 12px;
            display: flex;
            flex-direction: column;
        }

        #supplierQuoteGrid {
            width: 100%;
            flex: 1;
            min-height: 0;
        }

        #supplierQuoteGrid .handsontable .htCore td {
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            vertical-align: middle !important;
        }

        #supplierQuoteGrid .handsontable .htCore tbody tr {
            height: 28px !important;
            min-height: 28px !important;
            max-height: 28px !important;
        }

        .ht-yes { color: #1890ff; font-weight: 600; }
        .ht-no { color: #ff4d4f; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="tab-nav">
            <div class="tab-title">多渠道报价调价</div>
            <button class="tab-btn active" data-tab="supplier">供应商核价</button>
        </div>

        <div class="toolbar">
            <button class="layui-btn layui-btn-normal" id="importOeBtn">
                导入 OE
            </button>
            <input type="file" id="importFileInput" accept=".xlsx,.xls">
            <button class="layui-btn layui-btn-normal" id="downloadTemplateBtn">
                下载模板
            </button>
        </div>

        <div class="tab-content">
            <div id="tab-supplier" class="tab-pane active">
                <div class="table-container">
                    <div id="supplierQuoteGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calcProfitRate(sell, cost) {
            sell = parseFloat(sell);
            cost = parseFloat(cost);
            if (!sell || !cost || sell <= 0) return '';
            return ((sell - cost) / sell * 100).toFixed(2) + '%';
        }

        function calcProfitAmount(sell, cost) {
            sell = parseFloat(sell);
            cost = parseFloat(cost);
            if (isNaN(sell) || isNaN(cost)) return '';
            return (sell - cost).toFixed(2);
        }

        function yesNoRenderer(instance, td, row, col, prop, value, cellProperties) {
            td.innerText = value || '';
            td.style.textAlign = 'center';
            td.className = '';
            if (value === '是') {
                td.classList.add('ht-yes');
            } else if (value === '否') {
                td.classList.add('ht-no');
            }
            return td;
        }

        var gridData = [];

        var columns = [
            { data: 'oe', title: 'OE 号', width: 140, readOnly: true },
            { data: 'brand', title: '品牌', width: 90, readOnly: true },
            { data: 'car_brand', title: '车辆品牌', width: 90, readOnly: true },
            { data: 'system_oe', title: '系统 OE', width: 130, readOnly: true },
            { data: 'supplier', title: '询价供应商', width: 160, readOnly: true },
            { data: 'sell_price', title: '卖价', width: 80, type: 'numeric', numericFormat: { pattern: '0.00' }, readOnly: true },
            { data: 'cost_price', title: '成本', width: 80, type: 'numeric', numericFormat: { pattern: '0.00' }, readOnly: true },
            { data: 'profit_rate', title: '利润率', width: 80, readOnly: true },
            { data: 'profit_amount', title: '毛利额', width: 80, readOnly: true },
            { data: 'supplier_selected', title: '供应商', width: 120, readOnly: true },
            { data: 'new_sell_price', title: '修改后的卖价', width: 120, type: 'numeric', numericFormat: { pattern: '0.00' } },
            { data: 'new_profit_rate', title: '利润率', width: 80, readOnly: true },
            { data: 'new_profit_amount', title: '毛利额', width: 80, readOnly: true },
            { data: 'product_id', title: '产品 ID', width: 130, readOnly: true },
            { data: 'barcode', title: '条码', width: 120, readOnly: true },
            { data: 'modify', title: '修改', width: 80, type: 'text', renderer: yesNoRenderer, readOnly: false }
        ];

        function createGrid() {
            return HandsontableBuilder.create('#supplierQuoteGrid', {
                pageKey: 'multi_channel_quote_adjust',
                gridKey: 'supplier_quote_grid',
                containerSelector: '#supplierQuoteGrid',
                columns: columns,
                dataUrl: null,
                localData: gridData,
                paramsBuilder: function() {
                    return {};
                },
                readOnly: false,
                selectionMode: 'multiple',
                components: {
                    pagination: {
                        pageSizeOptions: [50, 100, 200, 500],
                        defaultPageSize: 100,
                        showScrollToTop: true
                    },
                    columnMenu: { persist: true },
                    columnPreference: { persist: true },
                    doubleClickCopy: true,
                    copyToast: true,
                    contextMenu: false,
                    shortcuts: true
                },
                beforeChange: function(changes, source) {
                    if (source === 'loadData' || !changes) return;
                    for (var i = 0; i < changes.length; i++) {
                        var prop = changes[i][1];
                        var newValue = changes[i][3];
                        if (prop === 'modify' && newValue !== '是' && newValue !== '否') {
                            layui.layer.msg('请输入是/否', { icon: 2 });
                            return false;
                        }
                    }
                },
                afterChange: function(changes, source) {
                    if (source === 'loadData' || !changes) return;
                    changes.forEach(function(change) {
                        var row = change[0];
                        var prop = change[1];
                        if (prop === 'new_sell_price') {
                            var item = gridData[row];
                            var cost = parseFloat(item.cost_price) || 0;
                            item.new_profit_rate = item.new_sell_price ? calcProfitRate(item.new_sell_price, cost) : '';
                            item.new_profit_amount = item.new_sell_price ? calcProfitAmount(item.new_sell_price, cost) : '';
                            window.builder.hot.render();
                        }
                    });
                }
            });
        }

        function loadQuoteList() {
            layui.layer.load(2);
            fetch('/new/api/multi_channel_quote_adjust/supplier-quote/quote-list', {
                method: 'GET',
                credentials: 'same-origin'
            })
            .then(function(r) { return r.json(); })
            .then(function(result) {
                layui.layer.closeAll('loading');
                if (result.code !== 0) {
                    layui.layer.msg(result.msg || '加载失败', { icon: 2 });
                    return;
                }
                gridData.length = 0;
                if (Array.isArray(result.data.list)) {
                    gridData.push.apply(gridData, result.data.list);
                }
                window.builder.hot.loadData(gridData);
                window.builder.pagination.update(gridData.length, 1, window.builder.pageSize);
            })
            .catch(function(e) {
                layui.layer.closeAll('loading');
                console.error('[加载报价列表] 失败:', e);
                layui.layer.msg('加载失败', { icon: 2 });
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            TabNav.init({
                navSelector: '.tab-nav',
                contentSelector: '.tab-content'
            });

            window.builder = createGrid();

            window.refreshSupplierQuoteGrid = function(page, pageSize) {
                if (window.builder) window.builder.refresh(page, pageSize);
            };

            loadQuoteList();

            var importBtn = document.getElementById('importOeBtn');
            var importInput = document.getElementById('importFileInput');
            var downloadBtn = document.getElementById('downloadTemplateBtn');

            importBtn.addEventListener('click', function() {
                importInput.click();
            });

            importInput.addEventListener('change', function() {
                var file = this.files[0];
                if (!file) return;

                var formData = new FormData();
                formData.append('file', file);

                layui.layer.load(2);

                fetch('/new/api/multi_channel_quote_adjust/supplier-quote/import-excel', {
                    method: 'POST',
                    body: formData,
                    credentials: 'same-origin'
                })
                .then(function(r) { return r.json(); })
                .then(function(result) {
                    layui.layer.closeAll('loading');
                    if (result.code !== 0) {
                        layui.layer.msg(result.msg || '导入失败', { icon: 2 });
                        return;
                    }
                    layui.layer.msg('导入成功，共 ' + (result.data.count || 0) + ' 条 OE', { icon: 1 });
                    loadQuoteList();
                })
                .catch(function(e) {
                    layui.layer.closeAll('loading');
                    console.error('[导入OE] 失败:', e);
                    layui.layer.msg('导入失败', { icon: 2 });
                });

                importInput.value = '';
            });

            downloadBtn.addEventListener('click', function() {
                window.open('/static/excel/multi_price_edit.xlsx', '_blank');
            });
        });
    </script>
</body>
</html>
