<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CRM 零件品牌别名管理</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <style>
        .alias-input-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .alias-input-group input {
            flex: 1;
        }
        .alias-input-group .layui-btn {
            margin-left: 10px;
        }
    </style>
</head>
<body>
<div style="padding: 20px;">
    <table id="aliasTable" lay-filter="aliasTable"></table>
</div>

<script src="/static/layui/layui.js"></script>
<script>
    layui.use(['table', 'form', 'layer'], function () {
        var table = layui.table;
        var form = layui.form;
        var layer = layui.layer;
        var $ = layui.$;

        // 渲染表格
        var tableIns = table.render({
            elem: '#aliasTable',
            url: '/new/api/pp-alias/list',
            method: 'GET',
            page: true,
            limit: 20,
            limits: [10, 20, 50, 100],
            toolbar: '#toolbarDemo',
            parseData: function(res) {
                return {
                    "code": res.code === 200 ? 0 : res.code,
                    "msg": res.msg,
                    "count": res.count,
                    "data": res.data
                };
            },
            cols: [[
                {field: 'pp_name', title: '品牌主名', minWidth: 200, sort: true},
                {field: 'alias_text', title: '别名', minWidth: 300},
                {title: '操作', toolbar: '#barDemo', width: 150, fixed: 'right'}
            ]]
        });

        // 搜索栏
        table.on('toolbar(aliasTable)', function (obj) {
            if (obj.event === 'add') {
                openForm();
            } else if (obj.event === 'search') {
                var ppName = $('#searchPpName').val();
                var aliasName = $('#searchAliasName').val();
                tableIns.reload({
                    where: {
                        pp_name: ppName,
                        alias_name: aliasName
                    },
                    page: {curr: 1}
                });
            }
        });

        // 行工具：编辑、删除
        table.on('tool(aliasTable)', function (obj) {
            var data = obj.data;
            if (obj.event === 'edit') {
                openForm(data);
            } else if (obj.event === 'del') {
                layer.confirm('确定删除该品牌主名【' + data.pp_name + '】及其所有别名吗？', function (index) {
                    $.ajax({
                        url: '/new/api/pp-alias/delete',
                        type: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({pp_name: data.pp_name}),
                        success: function (res) {
                            if (res.code === 200) {
                                layer.msg('删除成功');
                                tableIns.reload();
                            } else {
                                layer.msg(res.msg || '删除失败');
                            }
                        },
                        error: function () {
                            layer.msg('删除失败');
                        }
                    });
                    layer.close(index);
                });
            }
        });

        // 打开新增/编辑表单
        function openForm(data) {
            var isEdit = !!data;
            var title = isEdit ? '编辑别名' : '新增别名';
            var ppName = isEdit ? data.pp_name : '';
            var aliases = isEdit ? (data.items || []) : [{id: null, alias_name: ''}];

            var aliasInputsHtml = '';
            aliases.forEach(function (item, index) {
                aliasInputsHtml += buildAliasInput(item.alias_name || '', item.id || '', index);
            });

            var html = '<form class="layui-form" style="padding: 20px;">' +
                '<div class="layui-form-item">' +
                '<label class="layui-form-label">品牌主名</label>' +
                '<div class="layui-input-block">' +
                '<input type="text" id="formPpName" value="' + ppName + '" required lay-verify="required" placeholder="请输入品牌主名" class="layui-input">' +
                '</div>' +
                '</div>' +
                '<div class="layui-form-item">' +
                '<label class="layui-form-label">别名列表</label>' +
                '<div class="layui-input-block" id="aliasInputsContainer">' +
                aliasInputsHtml +
                '</div>' +
                '</div>' +
                '<div class="layui-form-item">' +
                '<div class="layui-input-block">' +
                '<button type="button" class="layui-btn layui-btn-sm layui-btn-normal" id="btnAddAliasInput"><i class="layui-icon">&#xe608;</i> 新增别名</button>' +
                '</div>' +
                '</div>' +
                '</form>';

            layer.open({
                type: 1,
                title: title,
                area: ['520px', 'auto'],
                maxHeight: 600,
                btn: ['保存', '取消'],
                content: html,
                success: function(layero, index) {
                    // 绑定新增别名输入框按钮
                    layero.find('#btnAddAliasInput').on('click', function() {
                        var container = layero.find('#aliasInputsContainer');
                        var count = container.find('.alias-input-group').length;
                        container.append(buildAliasInput('', '', count));
                    });

                    // 绑定删除别名输入框按钮（事件委托）
                    layero.find('#aliasInputsContainer').on('click', '.btn-remove-alias', function() {
                        var container = layero.find('#aliasInputsContainer');
                        if (container.find('.alias-input-group').length <= 1) {
                            layer.msg('至少保留一个别名');
                            return;
                        }
                        $(this).closest('.alias-input-group').remove();
                    });
                },
                yes: function (index, layero) {
                    var ppNameVal = $.trim(layero.find('#formPpName').val());
                    var aliasInputs = layero.find('.alias-input');
                    var aliasNames = [];
                    var aliasesData = [];

                    if (!ppNameVal) {
                        layer.msg('品牌主名不能为空');
                        return;
                    }

                    var hasEmpty = false;
                    aliasInputs.each(function() {
                        var val = $.trim($(this).val());
                        if (!val) {
                            hasEmpty = true;
                            return false;
                        }
                        aliasNames.push(val);
                        aliasesData.push({
                            id: $(this).data('id') || null,
                            alias_name: val
                        });
                    });

                    if (hasEmpty) {
                        layer.msg('别名不能为空');
                        return;
                    }

                    if (isEdit) {
                        // 编辑：批量更新
                        var postData = {
                            old_pp_name: data.pp_name,
                            pp_name: ppNameVal,
                            aliases: aliasesData
                        };
                        $.ajax({
                            url: '/new/api/pp-alias/update',
                            type: 'POST',
                            contentType: 'application/json',
                            data: JSON.stringify(postData),
                            success: function (res) {
                                if (res.code === 200) {
                                    layer.msg('更新成功');
                                    layer.close(index);
                                    tableIns.reload();
                                } else {
                                    layer.msg(res.msg || '更新失败');
                                }
                            },
                            error: function () {
                                layer.msg('更新失败');
                            }
                        });
                    } else {
                        // 新增：批量创建
                        var postData = {
                            pp_name: ppNameVal,
                            alias_names: aliasNames
                        };
                        $.ajax({
                            url: '/new/api/pp-alias/create',
                            type: 'POST',
                            contentType: 'application/json',
                            data: JSON.stringify(postData),
                            success: function (res) {
                                if (res.code === 200) {
                                    layer.msg('新增成功');
                                    layer.close(index);
                                    tableIns.reload();
                                } else {
                                    layer.msg(res.msg || '新增失败');
                                }
                            },
                            error: function () {
                                layer.msg('新增失败');
                            }
                        });
                    }
                }
            });
        }

        // 构建别名输入框 HTML
        function buildAliasInput(value, id, index) {
            return '<div class="alias-input-group">' +
                '<input type="text" class="layui-input alias-input" data-id="' + (id || '') + '" value="' + value + '" placeholder="请输入别名" required>' +
                '<button type="button" class="layui-btn layui-btn-danger layui-btn-sm btn-remove-alias"><i class="layui-icon">&#xe640;</i></button>' +
                '</div>';
        }
    });
</script>

<script type="text/html" id="toolbarDemo">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm" lay-event="add">新增</button>
        <input type="text" id="searchPpName" placeholder="品牌主名" class="layui-input" style="display:inline-block;width:150px;height:30px;margin-left:10px;">
        <input type="text" id="searchAliasName" placeholder="别名" class="layui-input" style="display:inline-block;width:150px;height:30px;margin-left:10px;">
        <button class="layui-btn layui-btn-sm layui-btn-normal" lay-event="search">搜索</button>
    </div>
</script>

<script type="text/html" id="barDemo">
    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
</script>
</body>
</html>
