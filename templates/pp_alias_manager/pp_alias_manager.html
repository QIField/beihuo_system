<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CRM 品牌别名池管理</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <style>
        .pool-input-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .pool-input-group input {
            flex: 1;
        }
        .pool-input-group .layui-btn {
            margin-left: 10px;
        }
        .pool-tag {
            display: inline-block;
            padding: 2px 8px;
            margin: 2px;
            background: #e6f7ff;
            border: 1px solid #91d5ff;
            border-radius: 4px;
            color: #1890ff;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div style="padding: 20px;">
    <table id="poolTable" lay-filter="poolTable"></table>
</div>

<script src="/static/layui/layui.js"></script>
<script>
    layui.use(['table', 'form', 'layer'], function () {
        var table = layui.table;
        var layer = layui.layer;
        var $ = layui.$;

        // 渲染表格
        var tableIns = table.render({
            elem: '#poolTable',
            url: '/new/api/pp-alias/pool/list',
            method: 'GET',
            page: true,
            limit: 20,
            limits: [10, 20, 50, 100],
            toolbar: '#toolbarDemo',
            parseData: function(res) {
                return {
                    "code": res.code === 200 ? 0 : res.code,
                    "msg": res.msg,
                    "count": res.count,
                    "data": res.data
                };
            },
            cols: [[
                {field: 'pool_id', title: '池编号', width: 100, sort: true},
                {field: 'name_text', title: '池内名称', minWidth: 400},
                {field: 'count', title: '名称数', width: 100, sort: true},
                {title: '操作', toolbar: '#barDemo', width: 150, fixed: 'right'}
            ]]
        });

        // 搜索栏
        table.on('toolbar(poolTable)', function (obj) {
            if (obj.event === 'add') {
                openForm();
            } else if (obj.event === 'search') {
                var name = $('#searchName').val();
                tableIns.reload({
                    where: {
                        name: name
                    },
                    page: {curr: 1}
                });
            }
        });

        // 行工具：编辑、删除
        table.on('tool(poolTable)', function (obj) {
            var data = obj.data;
            if (obj.event === 'edit') {
                openForm(data);
            } else if (obj.event === 'del') {
                layer.confirm('确定删除别名池 #' + data.pool_id + ' 吗？', function (index) {
                    $.ajax({
                        url: '/new/api/pp-alias/pool/delete',
                        type: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({pool_id: data.pool_id}),
                        success: function (res) {
                            if (res.code === 200) {
                                layer.msg('删除成功');
                                tableIns.reload();
                            } else {
                                layer.msg(res.msg || '删除失败');
                            }
                        },
                        error: function () {
                            layer.msg('删除失败');
                        }
                    });
                    layer.close(index);
                });
            }
        });

        // 打开新增/编辑表单
        function openForm(data) {
            var isEdit = !!data;
            var title = isEdit ? '编辑别名池 #' + data.pool_id : '新增别名池';
            var names = isEdit ? (data.names || []) : ['', ''];

            var inputsHtml = '';
            names.forEach(function (name, index) {
                inputsHtml += buildNameInput(name, index);
            });

            var html = '<form class="layui-form" style="padding: 20px;">' +
                '<div class="layui-form-item">' +
                '<label class="layui-form-label">名称列表</label>' +
                '<div class="layui-input-block" id="nameInputsContainer">' +
                inputsHtml +
                '</div>' +
                '</div>' +
                '<div class="layui-form-item">' +
                '<div class="layui-input-block">' +
                '<button type="button" class="layui-btn layui-btn-sm layui-btn-normal" id="btnAddNameInput"><i class="layui-icon">&#xe608;</i> 添加名称</button>' +
                '<span class="layui-word-aux" style="margin-left: 10px;">别名池至少需要 2 个名称</span>' +
                '</div>' +
                '</div>' +
                '</form>';

            layer.open({
                type: 1,
                title: title,
                area: ['520px', 'auto'],
                maxHeight: 600,
                btn: ['保存', '取消'],
                content: html,
                success: function(layero, index) {
                    // 绑定添加名称按钮
                    layero.find('#btnAddNameInput').on('click', function() {
                        var container = layero.find('#nameInputsContainer');
                        var count = container.find('.pool-input-group').length;
                        container.append(buildNameInput('', count));
                    });

                    // 绑定删除名称按钮（事件委托）
                    layero.find('#nameInputsContainer').on('click', '.btn-remove-name', function() {
                        var container = layero.find('#nameInputsContainer');
                        if (container.find('.pool-input-group').length <= 2) {
                            layer.msg('至少保留两个名称');
                            return;
                        }
                        $(this).closest('.pool-input-group').remove();
                    });
                },
                yes: function (index, layero) {
                    var nameInputs = layero.find('.name-input');
                    var names = [];

                    var hasEmpty = false;
                    nameInputs.each(function() {
                        var val = $.trim($(this).val());
                        if (!val) {
                            hasEmpty = true;
                            return false;
                        }
                        names.push(val);
                    });

                    if (hasEmpty) {
                        layer.msg('名称不能为空');
                        return;
                    }

                    if (names.length < 2) {
                        layer.msg('别名池至少需要 2 个名称');
                        return;
                    }

                    // 去重
                    var uniqueNames = [];
                    var seen = {};
                    for (var i = 0; i < names.length; i++) {
                        var lower = names[i].toLowerCase();
                        if (!seen[lower]) {
                            seen[lower] = true;
                            uniqueNames.push(names[i]);
                        }
                    }
                    if (uniqueNames.length !== names.length) {
                        layer.msg('名称列表中存在重复项');
                        return;
                    }

                    if (isEdit) {
                        var postData = {
                            pool_id: data.pool_id,
                            names: uniqueNames
                        };
                        $.ajax({
                            url: '/new/api/pp-alias/pool/update',
                            type: 'POST',
                            contentType: 'application/json',
                            data: JSON.stringify(postData),
                            success: function (res) {
                                if (res.code === 200) {
                                    layer.msg('更新成功');
                                    layer.close(index);
                                    tableIns.reload();
                                } else {
                                    layer.msg(res.msg || '更新失败');
                                }
                            },
                            error: function () {
                                layer.msg('更新失败');
                            }
                        });
                    } else {
                        var postData = {
                            names: uniqueNames
                        };
                        $.ajax({
                            url: '/new/api/pp-alias/pool/create',
                            type: 'POST',
                            contentType: 'application/json',
                            data: JSON.stringify(postData),
                            success: function (res) {
                                if (res.code === 200) {
                                    layer.msg('创建成功');
                                    layer.close(index);
                                    tableIns.reload();
                                } else {
                                    layer.msg(res.msg || '创建失败');
                                }
                            },
                            error: function () {
                                layer.msg('创建失败');
                            }
                        });
                    }
                }
            });
        }

        // 构建名称输入框 HTML
        function buildNameInput(value, index) {
            return '<div class="pool-input-group">' +
                '<input type="text" class="layui-input name-input" value="' + (value || '') + '" placeholder="请输入品牌名称" required>' +
                '<button type="button" class="layui-btn layui-btn-danger layui-btn-sm btn-remove-name"><i class="layui-icon">&#xe640;</i></button>' +
                '</div>';
        }
    });
</script>

<script type="text/html" id="toolbarDemo">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm" lay-event="add">新增别名池</button>
        <input type="text" id="searchName" placeholder="搜索名称" class="layui-input" style="display:inline-block;width:200px;height:30px;margin-left:10px;">
        <button class="layui-btn layui-btn-sm layui-btn-normal" lay-event="search">搜索</button>
    </div>
</script>

<script type="text/html" id="barDemo">
    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
</script>
</body>
</html>
