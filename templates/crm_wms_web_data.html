<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS仓库数据看板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: white;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background-color: #16213e;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #0f3460;
            flex-shrink: 0;
        }
        
        .header-left {
            font-size: 14px;
        }
        
        .header-center {
            font-size: 18px;
            font-weight: bold;
            color: #4cc9f0;
        }
        
        .header-right {
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .header-right span {
            margin-right: 15px;
        }
        
        .header-right a {
            color: white;
            text-decoration: none;
            margin-left: 10px;
        }
        
        .dashboard {
            flex: 1;
            padding: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        
        .stat-card {
            background-color: #16213e;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #0f3460;
        }
        
        .pie-chart {
            grid-column: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .pie-chart .circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: conic-gradient(
                #ff6b6b 0deg 90deg,
                #4ecdc4 90deg 270deg,
                #45b7d1 270deg 360deg
            );
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }
        
        .pie-chart .circle-inner {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: #16213e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }
        
        .stat-numbers {
            grid-column: 2 / 5;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-item .number {
            font-size: 24px;
            font-weight: bold;
            color: #4cc9f0;
        }
        
        .stat-item .label {
            font-size: 12px;
            color: #b0b0b0;
            margin-top: 5px;
        }
        
        .top-section {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-shrink: 0;
            align-items: stretch;
        }
        
        .stats-area {
            flex: 1;
            display: flex;
            gap: 30px;
            background-color: #16213e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 20px;
            align-items: center;
        }
        
        .stats-area .pie-chart {
            flex: 0 0 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .stats-area .stat-numbers {
            flex: 1;
            display: flex;
            gap: 30px;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        .stats-area .stat-item {
            display: flex;
            gap: 30px;
        }
        
        .stats-area .stat-item .number {
            font-size: 28px;
            font-weight: bold;
            color: #4cc9f0;
            line-height: 1;
        }
        
        .stats-area .stat-item .label {
            font-size: 14px;
            color: #b0b0b0;
            line-height: 1;
        }
        
        .number-label-pair {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .charts-area {
            flex: 2;
            display: flex;
            gap: 20px;
            align-items: stretch;
        }
        
        .charts-area .chart-card {
            flex: 1;
            background-color: #16213e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 20px;
        }
        
        .bar-charts {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        
        .chart-card {
            background-color: #16213e;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #0f3460;
            display: flex;
            flex-direction: column;
        }
        
        .chart-header {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }
        
        .chart-header .status {
            font-size: 12px;
        }
        
        .chart-header .status span {
            margin-left: 10px;
        }
        
        .chart-header .status .completed {
            color: #4ecdc4;
        }
        
        .chart-header .status .in-progress {
            color: #ffd166;
        }
        
        .chart-bars {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            flex: 1;
            min-height: 150px;
        }
        
        .bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        
        .bar .bar-container {
            width: 40px;
            background-color: #0f3460;
            border-radius: 4px 4px 0 0;
            position: relative;
            margin-bottom: 10px;
            flex: 1;
            min-height: 100px;
        }
        
        .bar .bar-fill {
            background-color: #4cc9f0;
            border-radius: 4px 4px 0 0;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
        }
        
        .bar .bar-label {
            font-size: 12px;
            color: #b0b0b0;
        }
        
        .tasks-section {
            background-color: #16213e;
            border-radius: 8px;
            border: 1px solid #0f3460;
            overflow: hidden;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .tasks-header {
            padding: 15px 20px;
            border-bottom: 1px solid #0f3460;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        
        .tasks-header h2 {
            font-size: 16px;
            font-weight: bold;
        }
        
        .tasks-header .pagination {
            font-size: 14px;
        }
        
        .tasks-table-container {
            flex: 1;
            overflow: hidden;
        }
        
        .tasks-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .tasks-table th {
            background-color: #0f3460;
            padding: 12px 15px;
            text-align: left;
            font-size: 14px;
            font-weight: bold;
            position: sticky;
            top: 0;
        }
        
        .tasks-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #0f3460;
            font-size: 14px;
        }
        
        .tasks-table tr:nth-child(even) {
            background-color: rgba(15, 52, 96, 0.3);
        }
        
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .status-pending {
            background-color: #ff6b6b;
            color: white;
        }
        
        .status-processing {
            background-color: #ffd166;
            color: #1a1a2e;
        }
        
        .status-completed {
            background-color: #4ecdc4;
            color: #1a1a2e;
        }
        
        .status-error {
            background-color: #ff6b6b;
            color: white;
        }
        
        .completed {
            color: #4ecdc4;
        }
        
        .ellipsis {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #4cc9f0;
            margin-right: 5px;
        }
        
        .hidden {
            display: none;
        }
        
        .task-row {
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }
        
        .fade-out {
            opacity: 0;
            transform: translateY(10px);
        }
        
        .fade-in {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* 旋转动画 */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 响应式调整 */
        @media screen and (max-width: 1200px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            
            .pie-chart {
                grid-column: 1;
            }
            
            .stat-numbers {
                grid-column: 2;
                grid-template-columns: 1fr;
            }
            
            .bar-charts {
                grid-template-columns: 1fr;
            }
        }
        
        @media screen and (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .pie-chart {
                grid-column: 1;
            }
            
            .stat-numbers {
                grid-column: 1;
                grid-template-columns: repeat(3, 1fr);
            }
            
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            
            .header-center {
            font-size: 16px;
        }
    }
    
    /* 设置对话框样式 */
    .settings-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        display: none;
    }
    
    .settings-modal.show {
        display: flex;
    }
    
    .settings-content {
        background-color: #16213e;
        border: 1px solid #0f3460;
        border-radius: 8px;
        padding: 20px;
        width: 400px;
        max-width: 90%;
    }
    
    .settings-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        border-bottom: 1px solid #0f3460;
        padding-bottom: 10px;
    }
    
    .settings-header h3 {
        margin: 0;
        color: #4cc9f0;
    }
    
    .close-btn {
        background: none;
        border: none;
        color: white;
        font-size: 20px;
        cursor: pointer;
    }
    
    .settings-form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    
    .form-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }
    
    .form-group label {
        font-size: 14px;
        color: #b0b0b0;
    }
    
    .form-group input {
        background-color: #0f3460;
        border: 1px solid #1a1a2e;
        border-radius: 4px;
        padding: 8px 12px;
        color: white;
        font-size: 14px;
    }
    
    .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
        padding-top: 15px;
        border-top: 1px solid #0f3460;
    }
    
    .btn {
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        cursor: pointer;
    }
    
    .btn-primary {
        background-color: #4cc9f0;
        color: #1a1a2e;
    }
    
    .btn-secondary {
        background-color: #0f3460;
        color: white;
    }
    
    .date-picker-container {
        display: flex;
        align-items: center;
        margin-right: 20px;
        background-color: rgba(255, 255, 255, 0.1);
        padding: 8px 12px;
        border-radius: 6px;
    }
    
    .date-picker-container input[type="date"] {
        padding: 6px 10px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 4px;
        margin: 0 8px;
        font-size: 14px;
        background-color: rgba(255, 255, 255, 0.2);
        color: white;
        outline: none;
        transition: all 0.3s ease;
    }
    
    .date-picker-container input[type="date"]:focus {
        border-color: #4cc9f0;
        box-shadow: 0 0 0 2px rgba(76, 201, 240, 0.2);
    }
    
    .date-picker-container input[type="date"]::-webkit-calendar-picker-indicator {
        filter: invert(1);
    }
    
    .date-picker-container span {
        margin: 0 5px;
        color: white;
        font-weight: 500;
    }
    
    .date-picker-container .btn {
        margin-left: 12px;
        padding: 6px 16px;
        border-radius: 4px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    
    .date-picker-container .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 2px 8px rgba(76, 201, 240, 0.3);
    }
    
    /* 切换开关样式 */
    .toggle-switch {
        position: relative;
        display: inline-block;
        width: 60px;
        height: 34px;
    }
    
    .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
    }
    
    .toggle-switch label {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        transition: .4s;
        border-radius: 34px;
    }
    
    .toggle-switch label:before {
        position: absolute;
        content: "";
        height: 26px;
        width: 26px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        transition: .4s;
        border-radius: 50%;
    }
    
    .toggle-switch input:checked + label {
        background-color: #4cc9f0;
    }
    
    .toggle-switch input:focus + label {
        box-shadow: 0 0 1px #4cc9f0;
    }
    
    .toggle-switch input:checked + label:before {
        transform: translateX(26px);
    }
    
    /* 外部展示模式关闭按钮 */
    .external-mode-close {
        position: fixed;
        top: 20px;
        right: 20px;
        background-color: #ff6b6b;
        color: white;
        border: none;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        font-size: 24px;
        cursor: pointer;
        z-index: 1001;
        box-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
        display: none;
    }
    
    body.external-mode .external-mode-close {
        display: block;
    }
</style>

</head>
<body>
    <div class="header">
        <div class="header-left" id="datetime-display">2023.03.04 08:56:05 星期一 天气晴</div>
        <div class="header-center">WMS仓库数据看板</div>
        <div class="header-right">
            <div class="date-picker-container">
                <input type="date" id="start-date" placeholder="开始日期">
                <span>至</span>
                <input type="date" id="end-date" placeholder="结束日期">
                <button class="btn btn-primary" id="date-query-btn">查询</button>
            </div>
            <a href="#" id="settings-btn">设置</a>
            <a href="#">退出</a>
        </div>
        
        <!-- 设置对话框 -->
        <div class="settings-modal" id="settings-modal">
            <div class="settings-content">
                <div class="settings-header">
                    <h3>系统设置</h3>
                    <button class="close-btn" id="close-settings">×</button>
                </div>
                <form class="settings-form" id="settings-form">
                    <div class="form-group">
                        <label for="rows-per-page">每页显示条数</label>
                        <input type="number" id="rows-per-page" min="1" max="20" value="5">
                    </div>
                    <div class="form-group">
                        <label for="api-interval">API请求间隔(分钟)</label>
                        <input type="number" id="api-interval" min="1" max="60" value="10">

                    <div class="form-group">
                        <label>外部展示模式</label>
                        <div class="toggle-switch">
                            <input type="checkbox" id="external-mode-toggle">
                            <label for="external-mode-toggle"></label>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="cancel-settings">取消</button>
                        <button type="submit" class="btn btn-primary">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <div class="dashboard">
        <div class="top-section">
            <div class="stats-area">
                <div class="stat-card pie-chart">
                    <div class="circle">
                        <div class="circle-inner">请等待</div>
                    </div>
                </div>
                <div class="stat-numbers">
                    <div class="stat-item">
                        <div class="number-label-pair">
                            <div class="number">请等待</div>
                            <div class="label">待拣</div>
                        </div>
                    </div>
                    <div class="stat-item">
                        <div class="number-label-pair">
                            <div class="number">请等待</div>
                            <div class="label">已拣</div>
                        </div>
                        <div class="number-label-pair">
                            <div class="number">请等待</div>
                            <div class="label">已发货</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="charts-area">
                <div class="chart-card">
                    <div class="chart-header">
                        <span>待拣</span>
                        <div class="status">
                            <span class="completed">已完成</span>
                            <span class="in-progress">进行中</span>
                        </div>
                    </div>
                    <div class="chart-bars">
                        <div style="text-align:center;flex:1;display:flex;align-items:center;justify-content:center;color:#b0b0b0;">正在加载请等待</div>
                    </div>
                </div>
                <div class="chart-card">
                    <div class="chart-header">
                        <span>已拣</span>
                        <div class="status">
                            <span class="completed">已完成</span>
                            <span class="in-progress">进行中</span>
                        </div>
                    </div>
                    <div class="chart-bars">
                        <div style="text-align:center;flex:1;display:flex;align-items:center;justify-content:center;color:#b0b0b0;">正在加载请等待</div>
                    </div>

        </div>
        
        <div class="tasks-section">
            <div class="tasks-header">
                <h2>仓库任务</h2>
                <div class="pagination">共20条 3/1</div>
            </div>
            <div class="tasks-table-container">
                <table class="tasks-table">
                    <thead>
                        <tr>
                            <th>序号</th>
                            <th>金蝶单号</th>
                            <th>客户名称</th>

                    </thead>
                    <tbody>
                        <tr id="loading-row">
                            <td colspan="12" style="text-align:center;padding:50px;color:#4cc9f0;">正在加载数据...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            /**
             * 全局变量定义
             */
            let rowsPerPage = 5;         // 每页显示的行数
            let currentPage = 1;         // 当前页码
            let isAnimating = false;     // 是否正在动画中
            let data = [];               // 存储从API获取的数据
            let totalRows = 0;           // 总数据条数
            let totalPages = 0;          // 总页数
            let apiInterval = 10;        // API请求间隔（分钟）
            let apiIntervalId = null;    // API请求定时器ID
            let autoPageIntervalId = null; // 自动翻页定时器ID
            let startDate = null;        // 开始日期（时间戳）
            let endDate = null;          // 结束日期（时间戳）
            
            /**
             * 更新日期时间显示
             * 功能：实时更新页面顶部的日期、时间、星期和天气信息
             */
            function updateDateTime() {
                // 获取当前日期时间
                const now = new Date();
                // 获取年、月、日、时、分、秒，并补零格式化
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                
                // 获取星期几（使用中文显示）
                const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                const weekday = weekdays[now.getDay()];
                
                // 天气信息（固定为晴，实际项目中可以从天气API获取）
                const weather = '天气晴';
                
                // 拼接完整的日期时间字符串
                const datetimeStr = `${year}.${month}.${day} ${hours}:${minutes}:${seconds} ${weekday} ${weather}`;
                // 更新页面显示
                document.getElementById('datetime-display').textContent = datetimeStr;
            }
            
            // 初始更新日期时间
            updateDateTime();
            // 设置定时器，每秒更新一次日期时间
            setInterval(updateDateTime, 1000);
            
            /**
             * 时间戳转标准时间格式
             * @param {number} timestamp - 时间戳（秒）
             * @returns {string} 格式化后的时间字符串，格式为：年/月/日 时:分
             */
            function timestampToDate(timestamp) {
                // 将时间戳（秒）转换为Date对象
                const date = new Date(timestamp * 1000);
                // 获取年、月、日、时、分，并补零格式化
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                // 返回格式化后的时间字符串
                return `${year}/${month}/${day} ${hours}:${minutes}`;
            }
            
            /**
             * 日期字符串转时间戳（毫秒）
             * @param {string} dateStr - 日期字符串，格式为：YYYY-MM-DD
             * @param {boolean} isEndOfDay - 是否为当天结束时间
             * @returns {number} 时间戳（毫秒）
             */
            function dateToTimestamp(dateStr, isEndOfDay = false) {
                if (!dateStr) return null;
                const date = new Date(dateStr);
                if (isEndOfDay) {
                    date.setHours(23, 59, 59, 999);
                } else {
                    date.setHours(0, 0, 0, 0);
                }
                return date.getTime();
            }
            
            /**
             * 计算用时并格式化
             * @param {number} startTime - 开始时间戳（秒）
             * @param {number} endTime - 结束时间戳（秒）
             * @returns {string} 格式化后的用时字符串，如：12小时20分钟、2小时5分钟
             */
            function calculateDuration(startTime, endTime) {
                // 如果没有结束时间，返回'-'
                if (!endTime) return '-';
                // 计算时间差（秒）
                const duration = endTime - startTime;
                // 转换为小时
                const hours = Math.floor(duration / 3600);
                // 转换为分钟
                const minutes = Math.floor((duration % 3600) / 60);
                // 根据小时数返回不同格式的字符串
                if (hours > 0) {
                    return `${hours}小时${minutes}分钟`;
                } else {
                    return `${minutes}分钟`;
                }
            }
            
            /**
             * 客户名称中间打*号
             * @param {string} name - 客户名称
             * @returns {string} 中间打*号的客户名称
             */
            function maskCustomerName(name) {
                // 名称为空或长度小于等于4时直接返回
                if (!name || name.length <= 4) return name;
                // 获取前两个字符
                const firstTwo = name.substring(0, 2);
                // 获取最后两个字符
                const lastTwo = name.substring(name.length - 2);
                // 计算中间需要替换的字符数
                const middleLength = name.length - 4;
                // 中间用*号填充
                const middle = '*'.repeat(middleLength);
                // 拼接并返回结果
                return firstTwo + middle + lastTwo;
            }

            /**
             * 更新饼图
             * @param {number} waitPick - 待拣数量
             * @param {number} picked - 已拣数量
             * @param {number} shipped - 已发货数量
             * 功能：根据待拣、已拣和已发货的数量更新饼图
             */
            function updatePieChart(waitPick, picked, shipped) {
                const total = waitPick + picked + shipped;
                let completionRate = 0;
                if (total > 0) {
                    completionRate = Math.round(((picked + shipped) / total) * 100);
                }
                
                // 更新饼图中心的完成率
                const circleInner = document.querySelector('.pie-chart .circle-inner');
                if (circleInner) {
                    circleInner.textContent = completionRate;
                }
                
                // 计算各部分的角度
                let waitPickAngle = 0;
                let pickedAngle = 0;
                let shippedAngle = 0;
                
                if (total > 0) {
                    waitPickAngle = (waitPick / total) * 360;
                    pickedAngle = (picked / total) * 360;
                    shippedAngle = (shipped / total) * 360;
                }
                
                // 计算角度的累积值
                let waitPickEndAngle = waitPickAngle;
                let pickedEndAngle = waitPickEndAngle + pickedAngle;
                let shippedEndAngle = pickedEndAngle + shippedAngle;
                
                // 更新饼图的背景
                const circle = document.querySelector('.pie-chart .circle');
                if (circle) {
                    circle.style.background = `conic-gradient(
                        #ff6b6b 0deg ${waitPickEndAngle}deg,
                        #4ecdc4 ${waitPickEndAngle}deg ${pickedEndAngle}deg,
                        #45b7d1 ${pickedEndAngle}deg ${shippedEndAngle}deg
                    )`;
                }
            }
            
            /**
             * 更新图表
             * @param {string} title - 图表标题
             * @param {Array} data - 图表数据
             * @param {string} field - 数据字段名
             * 功能：根据标题找到对应图表，更新图表内容
             */
            function updateChart(title, data, field) {
                // 找到对应标题的图表卡片
                const chartCards = document.querySelectorAll('.chart-card');
                let chartCard = null;
                
                // 遍历所有图表卡片，找到标题匹配的卡片
                chartCards.forEach(card => {
                    const header = card.querySelector('.chart-header span:nth-child(1)');
                    if (header && header.textContent.trim() === title) {
                        chartCard = card;
                    }
                });
                
                // 没有找到对应图表，直接返回
                if (!chartCard) return;
                
                // 获取图表的柱状图容器
                const chartBars = chartCard.querySelector('.chart-bars');
                // 清空原有内容
                chartBars.innerHTML = '';
                
                // 没有数据时显示提示信息
                if (data.length === 0) {
                    chartBars.innerHTML = '<div style="text-align:center;flex:1;display:flex;align-items:center;justify-content:center;color:#b0b0b0;">暂无数据</div>';
                    return;
                }
                
                // 检查是否处于外部展示模式
                const isExternalMode = document.body.classList.contains('external-mode');
                
                // 计算最大值用于设置柱子高度
                const maxValue = Math.max(...data.map(item => item[field]));
                
                // 遍历数据，创建柱子
                data.forEach(item => {
                    // 创建柱子容器
                    const bar = document.createElement('div');
                    bar.className = 'bar';
                    
                    // 计算柱子高度（相对于最大值的百分比）
                    let height = maxValue > 0 ? (item[field] / maxValue) * 100 : 0;
                    
                    // 外部展示模式下，所有柱子拉满
                    if (isExternalMode) {
                        height = 100;
                    }
                    
                    // 创建柱子HTML结构
                    bar.innerHTML = `
                        <div class="bar-container" style="height: 120px;">
                            <div class="bar-fill" style="height: ${height}%;"></div>
                        </div>
                        <div class="bar-label">${item.name}</div>
                    `;
                    
                    // 添加到图表中
                    chartBars.appendChild(bar);
                });
            }
            
            /**
             * 加载数据
             * 功能：从API获取数据，处理后渲染到表格中
             * 流程：
             * 1. 暂停自动翻页
             * 2. 构建API请求URL，添加日期范围参数
             * 3. 发送GET请求获取数据
             * 4. 处理API返回的NaN值
             * 5. 解析JSON数据
             * 6. 处理数据获取成功的情况：
             *    - 存储数据到全局变量
             *    - 计算总数据条数和总页数
             *    - 处理待拣和已拣数据
             *    - 渲染表格
             *    - 显示第一页
             * 7. 处理API返回错误的情况
             * 8. 处理加载数据出错的情况
             * 9. 数据加载完成后，重新启动自动翻页
             * @returns {Promise} 返回一个Promise对象
             */
            function loadData() {
                console.log('开始加载数据...');
                
                // 暂停自动翻页
                if (autoPageIntervalId) {
                    clearInterval(autoPageIntervalId);
                    autoPageIntervalId = null;
                }
                
                // 构建API请求URL
                let apiUrl = '/new/api/dashboard_crm_wms';
                let params = [];
                
                // 添加日期范围参数
                if (startDate) {
                    params.push(`start_date=${startDate}`);
                }
                if (endDate) {
                    params.push(`end_date=${endDate}`);
                }
                
                // 如果有参数，添加到URL
                if (params.length > 0) {
                    apiUrl += '?' + params.join('&');
                }
                
                console.log('API请求URL:', apiUrl);
                
                // 返回一个Promise对象
                return fetch(apiUrl)
                    .then(response => {
                        console.log('响应状态:', response.status);
                        // 检查响应状态
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        // 先获取文本（为了处理NaN值）
                        return response.text();
                    })
                    .then(text => {
                        // 处理API返回的NaN值，将其替换为null
                        const sanitizedText = text.replace(/: NaN/g, ': null').replace(/: NaN,/g, ': null,').replace(/: NaN\}/g, ': null}').replace(/: NaN\]/g, ': null]');
                        // 解析JSON
                        return JSON.parse(sanitizedText);
                    })
                    .then(jsonData => {
                        console.log('获取到的数据:', jsonData);
                        // 检查API返回的状态码
                        if (jsonData.code === 200) {
                            // 数据获取成功
                            data = jsonData.data;
                            // 存储数据到全局变量，供外部展示模式使用
                            window.currentData = data;
                            totalRows = data.length;
                            totalPages = Math.ceil(totalRows / rowsPerPage);
                            // 重置当前页码为1，确保每次数据加载后都从第一页开始
                            currentPage = 1;
                            // 重置动画标志，确保自动翻页能够正常执行
                            isAnimating = false;
                            console.log('数据条数:', totalRows, '总页数:', totalPages);
                            
                            // 处理待拣和已拣数据
                            processPickData(data);
                            
                            // 渲染表格
                            renderTable();
                            // 显示第一页
                            showPage(1);
                        } else {
                            // API返回错误
                            console.error('API返回错误:', jsonData.msg);
                        }
                    })
                    .catch(error => {
                        // 加载数据出错
                        console.error('加载数据错误:', error);
                        // 如果API加载失败，显示错误提示
                        const tbody = document.querySelector('.tasks-table tbody');
                        tbody.innerHTML = '<tr><td colspan="12" style="text-align:center;color:#ff6b6b;">数据加载失败: ' + error.message + '</td></tr>';
                    })
                    .finally(() => {
                        // 数据加载完成后，重新启动自动翻页
                        if (!autoPageIntervalId) {
                            autoPageIntervalId = setInterval(nextPage, 5000);
                        }
                    });
            }
            
            /**

                        console.log('没有数据可渲染');
                        tbody.innerHTML = '<tr><td colspan="12" style="text-align:center;color:#ff6b6b;">暂无数据</td></tr>';

                    }
                
                // 遍历数据，创建表格行

                    const row = document.createElement('tr');
                    row.classList.add('task-row');

                    let statusText = '未开始';

                        statusClass = 'status-error';

                    } else if (item.status_df2 == 2) {
                        statusText = '已完成';
                        statusClass = 'status-completed';
                    }
                    
                    // 拣货人 - 处理可能的null/undefined
                    let picker = '-';
                    if (item.name_df2 && item.name_df2 !== 'NaN' && item.name_df2 !== 'null') {
                        picker = item.name_df2;
                    }
                    
                    // 业务员 - 使用 handler_df1 字段
                    const salesman = item.handler_df1 && item.handler_df1 !== 'NaN' && item.handler_df1 !== 'null' ? item.handler_df1 : '-';
                    
                    // 客户名称 - 使用 fullname_df1 字段
                    const customerName = item.fullname_df1 && item.fullname_df1 !== 'NaN' && item.fullname_df1 !== 'null' ? item.fullname_df1 : '-';
                    
                    // 金蝶单号
                    const orderNo = item.pono_new || '-';
                    
                    // 开始拣货时间
                    const jhDate = item.jhdate_timestamp && item.jhdate_timestamp !== 'NaN' && item.jhdate_timestamp !== 'null' ? timestampToDate(item.jhdate_timestamp) : '-';
                    
                    // 计算用时（开始拣货时间到现在的时间差）
                    let duration = '-';
                    if (item.jhdate_timestamp && item.jhdate_timestamp !== 'NaN' && item.jhdate_timestamp !== 'null') {
                        const now = Math.floor(Date.now() / 1000); // 当前时间戳（秒）
                        const jhTimestamp = parseInt(item.jhdate_timestamp);
                        const diff = now - jhTimestamp;
                        const hours = Math.floor(diff / 3600);
                        const minutes = Math.floor((diff % 3600) / 60);
                        duration = `${hours}小时${minutes}分钟`;
                    }
                    
                    // 发货员
                    const shipper = item.shipper && item.shipper !== 'NaN' && item.shipper !== 'null' ? item.shipper : '-';
                    
                    // 发货时间
                    const shipDate = item.shipDate && item.shipDate !== 'NaN' && item.shipDate !== 'null' ? item.shipDate : '-';

                    let photosHtml = '-';

                        photosHtml = photoUrls.map(photo => {
                            const fullUrl = `https://jh.fsbbr.net/uploads/${photo}`;
                            return `<img src="${fullUrl}" alt="图片" style="width: 50px; height: 50px; margin-right: 5px; border-radius: 4px;">`;

                        <td>${duration}</td>
                        <td>${shipper}</td>
                        <td>${shipDate}</td>
                        <td>${photosHtml}</td>

                    // 添加到表格中
                    tbody.appendChild(row);
                });
                
                console.log('表格渲染完成');

            /**
             * 显示指定页的数据
             * @param {number} page - 页码
             * 功能：隐藏所有行，显示指定页的行，并添加淡入效果
             */
            function showPage(page) {
                // 获取所有表格行
                const rows = document.querySelectorAll('.tasks-table tbody tr');
                
                // 隐藏所有行
                rows.forEach(row => {
                    row.style.display = 'none';
                });
                
                // 计算当前页的起始和结束索引
                const startIndex = (page - 1) * rowsPerPage;
                const endIndex = Math.min(startIndex + rowsPerPage, totalRows);
                
                // 显示当前页的行
                for (let i = startIndex; i < endIndex; i++) {
                    if (rows[i]) {
                        // 显示行
                        rows[i].style.display = '';
                        // 触发重排，确保动画效果正常
                        void rows[i].offsetWidth;
                        // 添加淡入效果
                        rows[i].classList.add('fade-in');
                    }
                }
                
                // 更新页码信息
                document.querySelector('.tasks-header .pagination').textContent = `共${totalRows}条 ${currentPage}/${totalPages}`;
            }
            
            /**
             * 翻到下一页
             * 功能：添加淡出效果，然后显示下一页，循环翻页
             */
            function nextPage() {
                // 如果正在动画中，直接返回
                if (isAnimating) return;
                // 设置动画标志
                isAnimating = true;
                
                // 获取所有表格行
                const rows = document.querySelectorAll('.tasks-table tbody tr');
                
                // 计算当前页的起始和结束索引
                const currentStartIndex = (currentPage - 1) * rowsPerPage;
                const currentEndIndex = Math.min(currentStartIndex + rowsPerPage, totalRows);
                
                // 淡出完成的行数
                let fadeOutCount = 0;
                // 需要淡出的总行数
                const fadeOutTotal = currentEndIndex - currentStartIndex;
                
                // 处理没有数据或数据加载失败的情况
                if (fadeOutTotal === 0) {
                    // 页码加1
                    currentPage++;
                    // 如果超过总页数，循环回到第一页
                    if (currentPage > totalPages) {
                        currentPage = 1;
                    }
                    // 显示下一页
                    showPage(currentPage);
                    // 重置动画标志
                    isAnimating = false;
                    return;
                }
                
                // 为当前页的每一行添加淡出效果
                for (let i = currentStartIndex; i < currentEndIndex; i++) {
                    if (rows[i]) {
                        // 移除淡入效果
                        rows[i].classList.remove('fade-in');
                        // 添加淡出效果
                        rows[i].classList.add('fade-out');
                        
                        // 监听动画结束事件
                        rows[i].addEventListener('transitionend', function onTransitionEnd() {
                            // 隐藏行
                            rows[i].style.display = 'none';
                            // 移除淡出效果
                            rows[i].classList.remove('fade-out');
                            // 移除事件监听器
                            rows[i].removeEventListener('transitionend', onTransitionEnd);
                            
                            // 淡出完成的行数加1
                            fadeOutCount++;
                            // 当前页所有行淡出完成
                            if (fadeOutCount === fadeOutTotal) {
                                // 页码加1
                                currentPage++;
                                // 如果超过总页数，循环回到第一页
                                if (currentPage > totalPages) {
                                    currentPage = 1;
                                }
                                // 显示下一页
                                showPage(currentPage);
                                // 重置动画标志
                                isAnimating = false;
                            }
                        });
                    }
                }
            }
            
            // 初始化加载数据 - 移到设置默认日期范围后调用
            
            // 设置自动翻页定时器，每5秒翻一次页
            autoPageIntervalId = setInterval(nextPage, 5000);
            
            /**
             * 设置API请求间隔
             * 功能：清除旧的定时器，设置新的定时器
             */
            function setApiInterval() {
                // 如果已有定时器，清除它
                if (apiIntervalId) {
                    clearInterval(apiIntervalId);
                }
                // 设置新的定时器，按指定间隔调用loadData函数
                apiIntervalId = setInterval(loadData, apiInterval * 60 * 1000);
            }
            
            // 初始设置API请求间隔
            setApiInterval();
            
            // 获取设置相关的DOM元素
            const settingsBtn = document.getElementById('settings-btn');
            const settingsModal = document.getElementById('settings-modal');
            const closeSettings = document.getElementById('close-settings');
            const cancelSettings = document.getElementById('cancel-settings');
            const settingsForm = document.getElementById('settings-form');
            const rowsPerPageInput = document.getElementById('rows-per-page');
            const apiIntervalInput = document.getElementById('api-interval');
            
            // 获取日期选择器相关的DOM元素
            const startDateInput = document.getElementById('start-date');
            const endDateInput = document.getElementById('end-date');
            const dateQueryBtn = document.getElementById('date-query-btn');
            
            // 设置日期选择器默认值为前一天到今天
            function setDefaultDateRange() {
                const today = new Date();
                const yesterday = new Date(today);
                yesterday.setDate(yesterday.getDate() - 1);
                
                // 格式化日期为YYYY-MM-DD
                const formatDate = (date) => {
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    return `${year}-${month}-${day}`;
                };
                
                const yesterdayStr = formatDate(yesterday);
                const todayStr = formatDate(today);
                
                // 设置日期选择器的值
                startDateInput.value = yesterdayStr;
                endDateInput.value = todayStr;
                
                // 计算默认时间戳
                startDate = dateToTimestamp(yesterdayStr);
                endDate = dateToTimestamp(todayStr, true);
            }
            
            // 调用函数设置默认日期范围
            setDefaultDateRange();
            
            // 初始加载数据
            loadData();
            
            /**
             * 打开设置对话框
             * 功能：点击设置按钮时，显示设置对话框，并填充当前设置值
             */
            settingsBtn.addEventListener('click', function(e) {
                // 阻止默认行为
                e.preventDefault();
                // 填充当前每页显示条数
                rowsPerPageInput.value = rowsPerPage;
                // 填充当前API请求间隔
                apiIntervalInput.value = apiInterval;
                // 显示设置对话框
                settingsModal.classList.add('show');
            });
            
            /**
             * 关闭设置对话框
             * 功能：隐藏设置对话框
             */
            function closeSettingsModal() {
                // 隐藏设置对话框
                settingsModal.classList.remove('show');
            }
            
            // 点击关闭按钮关闭设置对话框
            closeSettings.addEventListener('click', closeSettingsModal);
            // 点击取消按钮关闭设置对话框
            cancelSettings.addEventListener('click', closeSettingsModal);
            
            // 点击模态框外部关闭设置对话框
            settingsModal.addEventListener('click', function(e) {
                if (e.target === settingsModal) {
                    closeSettingsModal();
                }
            });
            
            /**
             * 日期查询按钮点击事件
             * 功能：获取用户选择的日期范围，转换为时间戳，然后重新加载数据
             */
            dateQueryBtn.addEventListener('click', function() {
                // 获取用户选择的日期
                const startDateStr = startDateInput.value;
                const endDateStr = endDateInput.value;
                
                // 转换为时间戳
                startDate = dateToTimestamp(startDateStr);
                endDate = dateToTimestamp(endDateStr, true);
                
                console.log('日期范围:', {
                    startDateStr,
                    endDateStr,
                    startDate,
                    endDate
                });
                
                // 保存按钮原文本
                const originalText = dateQueryBtn.innerHTML;
                // 禁用按钮
                dateQueryBtn.disabled = true;
                // 改变按钮样式为等待中
                dateQueryBtn.innerHTML = '<div style="display: flex; align-items: center; justify-content: center; gap: 5px;"><div style="width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite;"></div>等待中...</div>';
                
                // 重新加载数据
                loadData().finally(() => {
                    // 恢复按钮状态
                    dateQueryBtn.disabled = false;
                    dateQueryBtn.innerHTML = originalText;
                });
            });
            
            /**
             * 保存设置
             * 功能：保存用户设置的每页显示条数和API请求间隔
             */
            settingsForm.addEventListener('submit', function(e) {
                // 阻止表单默认提交行为
                e.preventDefault();
                
                // 获取用户输入的新值
                const newRowsPerPage = parseInt(rowsPerPageInput.value);
                const newApiInterval = parseInt(apiIntervalInput.value);
                
                // 如果每页显示条数有变化
                if (newRowsPerPage !== rowsPerPage) {
                    // 更新每页显示条数
                    rowsPerPage = newRowsPerPage;
                    // 如果有数据，重新计算总页数并回到第一页
                    if (data.length > 0) {
                        totalPages = Math.ceil(totalRows / rowsPerPage);
                        currentPage = 1;
                        showPage(currentPage);
                    }
                }
                
                // 如果API请求间隔有变化
                if (newApiInterval !== apiInterval) {
                    // 更新API请求间隔
                    apiInterval = newApiInterval;
                    // 重新设置API请求定时器
                    setApiInterval();
                }
                
                // 关闭设置对话框
                closeSettingsModal();
            });
            
            /**
             * 外部展示模式
             * 功能：通过切换开关控制外部展示模式的启动和关闭
             */
            const externalModeToggle = document.getElementById('external-mode-toggle');
            const externalModeClose = document.getElementById('external-mode-close');
            
            // 切换开关状态变化事件
            externalModeToggle.addEventListener('change', function() {
                if (this.checked) {
                    // 启动外部展示模式
                    document.body.classList.add('external-mode');
                    // 关闭设置对话框
                    // closeSettingsModal();
                    // 重新处理数据，使用静态高数据
                    if (window.currentData) {
                        processPickData(window.currentData);
                    }
                } else {
                    // 关闭外部展示模式
                    document.body.classList.remove('external-mode');
                    // 重新处理数据，使用真实数据
                    if (window.currentData) {
                        processPickData(window.currentData);
                    }
                }
            });
            
            // 关闭外部展示模式按钮点击事件
            externalModeClose.addEventListener('click', function() {
                // 移除外部展示模式类
                document.body.classList.remove('external-mode');
                // 重置切换开关状态
                externalModeToggle.checked = false;
                // 重新处理数据，使用真实数据
                if (window.currentData) {
                    processPickData(window.currentData);
                }
            });
        });






        
    </script>
</body>
</html>
