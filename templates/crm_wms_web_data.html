<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS仓库数据看板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #1a2340;
            color: #ffffff;
            overflow: hidden;
        }
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background-color: #161e38;
            border-bottom: 1px solid #2a385f;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .date-time {
            font-size: 14px;
            color: #8fa4d9;
        }
        .header-title {
            font-size: 18px;
            font-weight: bold;
            color: #40a9ff;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .date-picker {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #1e2847;
            padding: 6px 12px;
            border-radius: 4px;
        }
        .date-picker input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 14px;
            width: 120px;
        }
        .btn {
            background-color: #40a9ff;
            color: #ffffff;
            border: none;
            padding: 6px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .link-btn {
            background: transparent;
            border: none;
            color: #8fa4d9;
            cursor: pointer;
            font-size: 14px;
        }
        .main-container {
            padding: 20px;
        }
        .timeline-section {
            background-color: #1e2847;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .timeline-table {
            width: 100%;
            border-collapse: collapse;
        }
        .timeline-table th,
        .timeline-table td {
            padding: 10px;
            text-align: center;
            border: 1px solid #2a385f;
            font-size: 14px;
        }
        .timeline-table th {
            background-color: #161e38;
            color: #8fa4d9;
            font-weight: normal;
        }
        .timeline-table .time-col {
            width: 120px;
        }
        .timeline-table .worker-col {
            width: 200px;
        }
        .table-section {
            background-color: #1e2847;
            border-radius: 8px;
            padding: 20px;
        }
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .table-header h3 {
            font-size: 16px;
        }
        .table-count {
            font-size: 14px;
            color: #8fa4d9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #161e38;
            color: #8fa4d9;
            font-weight: normal;
        }
        tr {
            border-bottom: 1px solid #2a385f;
        }
        tr:hover {
            background-color: #25315a;
        }
        .status-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .status-tag.picking {
            background-color: #faad14;
            color: #1a2340;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="date-time">2025.04.07 09:28:24 星期二 天气晴</div>
            <div class="header-title">WMS仓库数据看板</div>
        </div>
        <div class="header-right">

            <button class="link-btn">设置</button>
            <button class="link-btn">退出</button>
        </div>
    </div>
    <div class="main-container">
        <div class="timeline-section">
            <table class="timeline-table">
                <thead>
                    <tr>
                        <th class="time-col">时间轴</th>
                        <th>未分配</th>
                        <th class="worker-col">张三</th>
                        <th class="worker-col">李四</th>
                    </tr>
                </thead>
                <tbody id="timelineBody">
                </tbody>
            </table>
        </div>
        <div class="table-section">
            <div class="table-header">
                <h3>仓库任务</h3>
                <div class="table-count" id="tableCount">共0条 1/1</div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>金蝶单号</th>
                        <th>客户名称</th>
                        <th>业务员</th>
                        <th>状态</th>
                        <th>下单时间</th>
                        <th>拣货人</th>
                        <th>开始拣货时间</th>
                        <th>用时</th>
                        <th>发货员</th>
                        <th>发货时间</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>
    <script>
        // 时间轴数据，包含不同时间点的未分配任务和工人任务情况
        const timelineData = [
            { time: '合计', unassigned: '100', zhangsan: '100 100个/50个', lisi: '100个/50个' },
            { time: '10:00', unassigned: '10', zhangsan: '20 3个/3个', lisi: '3个/6个' },
            { time: '10:30', unassigned: '2', zhangsan: '12 3个/4个', lisi: '3个/7个' },
            { time: '11:00', unassigned: '0', zhangsan: '16 3个/5个', lisi: '3个/8个' },
            { time: '11:30', unassigned: '1', zhangsan: '17 3个/6个', lisi: '3个/9个' },
            { time: '12:00', unassigned: '0', zhangsan: '18 3个/7个', lisi: '3个/10个' },
            { time: '12:30', unassigned: '1', zhangsan: '19 3个/8个', lisi: '3个/11个' },
            { time: '13:00', unassigned: '0', zhangsan: '20 3个/9个', lisi: '3个/12个' }
        ];

        // 仓库任务数据，通过AJAX从后端获取
        let tasksData = [];

        // 后端API地址配置
        const API_CONFIG = {
            // 任务列表API地址，请根据实际情况修改
            tasksUrl: '/new/api/dashboard_crm_wms?start_date=1775491200000&end_date=1775577599000',
            // 时间轴数据API地址，请根据实际情况修改
            timelineUrl: '/api/timeline'
        };

        /**
         * 渲染时间轴表格
         * @param {Array} data - 时间轴数据数组
         */
        function renderTimelineTable(data) {
            // 获取时间轴表格的tbody元素
            const tbody = document.getElementById('timelineBody');
            // 清空表格内容
            tbody.innerHTML = '';

            // 遍历数据，创建表格行
            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.time}</td>
                    <td>${item.unassigned}</td>
                    <td>${item.zhangsan}</td>
                    <td>${item.lisi}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 每页显示的数据条数
        const pageSize = 5;
        // 当前页码，从1开始
        let currentPage = 1;
        // 自动翻页的定时器变量
        let autoPageInterval;

        /**
         * 渲染任务表格
         * @param {Array} data - 任务数据数组
         */
        function renderTable(data) {
            // 获取任务表格的tbody元素
            const tbody = document.getElementById('tableBody');
            // 获取表格计数元素
            const tableCount = document.getElementById('tableCount');

            // 清空表格内容
            tbody.innerHTML = '';

            // 计算总页数
            const totalPages = Math.ceil(data.length / pageSize);
            // 计算当前页的起始索引
            const startIndex = (currentPage - 1) * pageSize;
            // 计算当前页的结束索引
            const endIndex = startIndex + pageSize;
            // 获取当前页的数据
            const pageData = data.slice(startIndex, endIndex);

            // 遍历当前页数据，创建表格行
            pageData.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.pono_new}</td>
                    <td>${item.fullname_crm}</td>
                    <td>${item.handler_crm}</td>
                    <td>${item.status_wms}</td>
                    <td>${item.create_date_crm}</td>
                    <td>${item.name_wms}</td>
                    <td>${item.jhdate_timestamp}</td>
                    <td>${item.duration}</td>
                    <td>${item.shipper}</td>
                    <td>${item.shipDate}</td>
                `;
                tbody.appendChild(tr);
            });

            // 更新表格计数显示
            tableCount.textContent = `共${data.length}条 ${currentPage}/${totalPages}`;
        }

        /**
         * 切换到下一页
         */
        function nextPage() {
            // 计算总页数
            const totalPages = Math.ceil(tasksData.length / pageSize);
            // 如果当前是最后一页，则回到第一页；否则页码+1
            currentPage = currentPage >= totalPages ? 1 : currentPage + 1;
            // 重新渲染表格
            renderTable(tasksData);
        }

        /**
         * 启动自动翻页功能
         */
        function startAutoPage() {
            // 设置定时器，每3000毫秒（3秒）执行一次nextPage函数
            autoPageInterval = setInterval(nextPage, 3000);
        }

        /**
         * 通过AJAX获取任务数据
         */
        function fetchTasksData() {
            fetch(API_CONFIG.tasksUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('网络响应异常');
                    }
                    return response.json();
                })
                .then(data => {
                    // 假设后端返回的数据直接是任务数组
                    tasksData = data.data;
                    // 数据获取成功后渲染表格
                    renderTable(tasksData);
                    // 启动自动翻页
                    startAutoPage();
                })
                .catch(error => {
                    console.error('获取任务数据失败:', error);
                    // 可以在这里添加错误提示
                    const tbody = document.getElementById('tableBody');
                    tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;color:#ff4d4f;">数据加载失败，请稍后重试</td></tr>';
                });
        }

        /**
         * 通过AJAX获取时间轴数据
         */
        function fetchTimelineData() {
            fetch(API_CONFIG.timelineUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('网络响应异常');
                    }
                    return response.json();
                })
                .then(data => {
                    // 数据获取成功后渲染时间轴
                    renderTimelineTable(data);
                })
                .catch(error => {
                    console.error('获取时间轴数据失败:', error);
                    // 使用静态数据作为备用
                    renderTimelineTable(timelineData);
                });
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 获取时间轴数据
            fetchTimelineData();
            // 获取任务数据
            fetchTasksData();
        });
    </script>
</body>
</html>
