<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS仓库数据看板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #1a2340;
            color: #ffffff;
            overflow: hidden;
        }
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 20px;
            background-color: #161e38;
            border-bottom: 1px solid #2a385f;
            position: relative;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
            position: absolute;
            left: 20px;
        }
        .date-time {
            font-size: 14px;
            color: #8fa4d9;
        }
        .header-title {
            font-size: 18px;
            font-weight: bold;
            color: #40a9ff;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
            position: absolute;
            right: 20px;
        }
        .date-picker {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #1e2847;
            padding: 6px 12px;
            border-radius: 4px;
        }
        .date-picker input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 14px;
            width: 120px;
        }
        .btn {
            background-color: #40a9ff;
            color: #ffffff;
            border: none;
            padding: 6px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .link-btn {
            background: transparent;
            border: none;
            color: #8fa4d9;
            cursor: pointer;
            font-size: 14px;
        }
        .main-container {
            padding: 20px;
        }
        .timeline-section {
            background-color: #1e2847;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .timeline-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #2a385f;
        }
        .timeline-header-title {
            font-size: 16px;
            color: #40a9ff;
            font-weight: bold;
        }
        .timeline-header-container {
            display: flex;
            background-color: #161e38;
            border: 1px solid #2a385f;
            border-bottom: none;
        }
        .timeline-header-left {
            width: 100px;
            flex-shrink: 0;
        }
        .timeline-header-right {
            flex: 1;
            display: flex;
        }
        .timeline-container {
            display: flex;
            height: 25vh;
            overflow-y: auto;
            border: 1px solid #2a385f;
            border-top: none;
            border-bottom: none;
        }
        .timeline-footer-container {
            display: flex;
            background-color: #161e38;
            border: 1px solid #2a385f;
            border-top: none;
        }
        .timeline-footer-left {
            width: 100px;
            flex-shrink: 0;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #40a9ff;
            font-size: 14px;
            font-weight: bold;
        }
        .timeline-footer-right {
            flex: 1;
            display: flex;
        }
        .timeline-footer-item {
            flex: 1;
            min-width: 0;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 12px;
            border-right: 1px solid #2a385f;
        }
        .timeline-footer-item:last-child {
            border-right: none;
        }
        .timeline-left {
            width: 100px;
            flex-shrink: 0;
            position: relative;
        }
        .timeline-line {
            display: none;
        }
        .timeline-time-item {
            height: 60px;
            display: flex;
            align-items: center;
            position: relative;
            padding-right: 20px;
        }
        .timeline-time-item .time-text {
            font-size: 14px;
            color: #ffffff;
            font-weight: 500;
            z-index: 2;
            position: absolute;
            right: 60px;
            text-align: right;
        }
        .timeline-time-item .dot {
            position: absolute;
            right: 20px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #40a9ff;
            box-shadow: 0 0 10px rgba(64, 169, 255, 0.8);
            z-index: 3;
        }
        .timeline-time-item .dot-small {
            width: 6px;
            height: 6px;
            background-color: #2a385f;
            box-shadow: none;
        }
        .timeline-right {
            flex: 1;
            display: flex;
            border-left: 1px solid #2a385f;
        }
        .timeline-column {
            flex: 1;
            min-width: 0;
            border-right: 1px solid #2a385f;
        }
        .timeline-header-container .timeline-column {
            border-right: 1px solid #2a385f;
        }
        .timeline-header-container .timeline-column:last-child {
            border-right: none;
        }
        .timeline-column:last-child {
            border-right: none;
        }
        .timeline-column-header {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #161e38;
            color: #8fa4d9;
            font-size: 14px;
        }
        .timeline-column-content {
            display: flex;
            flex-direction: column;
        }
        .timeline-data-item {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #ffffff;
            border-bottom: 1px solid #2a385f;
        }
        .timeline-container::-webkit-scrollbar {
            width: 6px;
        }
        .timeline-container::-webkit-scrollbar-track {
            background: #161e38;
        }
        .timeline-container::-webkit-scrollbar-thumb {
            background: #40a9ff;
            border-radius: 3px;
        }
        .table-section {
            background-color: #1e2847;
            border-radius: 8px;
            padding: 20px;
        }
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .table-header h3 {
            font-size: 16px;
        }
        .table-count {
            font-size: 14px;
            color: #8fa4d9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #161e38;
            color: #8fa4d9;
            font-weight: normal;
        }
        tr {
            border-bottom: 1px solid #2a385f;
        }
        tr:hover {
            background-color: #25315a;
        }
        .status-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .status-tag.unstarted {
            background-color: #8c8c8c;
            color: #1a2340;
        }
        .status-tag.picking {
            background-color: #faad14;
            color: #1a2340;
        }
        .status-tag.completed {
            background-color: #52c41a;
            color: #1a2340;
        }
        .status-tag.error {
            background-color: #ff4d4f;
            color: #ffffff;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background-color: #1e2847;
            border-radius: 8px;
            padding: 24px;
            width: 400px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid #2a385f;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #2a385f;
        }
        .modal-header h3 {
            font-size: 18px;
            color: #40a9ff;
            font-weight: bold;
        }
        .modal-close {
            background: transparent;
            border: none;
            color: #8fa4d9;
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
        }
        .modal-close:hover {
            color: #ffffff;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #8fa4d9;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 8px 12px;
            background-color: #161e38;
            border: 1px solid #2a385f;
            border-radius: 4px;
            color: #ffffff;
            font-size: 14px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #40a9ff;
        }
        .form-hint {
            font-size: 12px;
            color: #5d77a8;
            margin-top: 4px;
        }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #2a385f;
        }
        .btn-cancel {
            background-color: transparent;
            border: 1px solid #2a385f;
            color: #8fa4d9;
        }
        .btn-cancel:hover {
            border-color: #40a9ff;
            color: #40a9ff;
        }
        .detail-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .detail-overlay.active {
            display: flex;
        }
        .detail-modal {
            background-color: #1e2847;
            border-radius: 8px;
            padding: 24px;
            width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid #2a385f;
        }
        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #2a385f;
        }
        .detail-header h3 {
            font-size: 18px;
            color: #40a9ff;
            font-weight: bold;
        }
        .detail-close {
            background: transparent;
            border: none;
            color: #8fa4d9;
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
        }
        .detail-close:hover {
            color: #ffffff;
        }
        .detail-item {
            margin-bottom: 16px;
        }
        .detail-label {
            display: block;
            margin-bottom: 8px;
            color: #8fa4d9;
            font-size: 14px;
        }
        .detail-value {
            color: #ffffff;
            font-size: 14px;
        }
        .detail-photos {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }
        .detail-photo {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #2a385f;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .detail-photo:hover {
            transform: scale(1.05);
        }
        .photo-viewer-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .photo-viewer-overlay.active {
            display: flex;
        }
        .photo-viewer-img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }
        .photo-viewer-close {
            position: absolute;
            top: 20px;
            right: 30px;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 40px;
            cursor: pointer;
            line-height: 1;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a2340;
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-content {
            text-align: center;
        }

        .loader {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top-color: #40a9ff;
            border-right-color: #52c41a;
            border-bottom-color: #faad14;
            border-left-color: #ff4d4f;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .loader.error {
            border: none;
            width: 80px;
            height: 80px;
            animation: none;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            color: #ff4d4f;
        }

        .loader.error::after {
            content: "!";
            font-weight: bold;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 18px;
            color: #8fa4d9;
        }

        .loading-text.error {
            color: #ff4d4f;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="date-time" id="dateTime">2025.04.07 09:28:24 星期二 天气晴</div>
        </div>
        <div class="header-title">WMS仓库数据看板</div>
        <div class="header-right">

            <button class="link-btn">设置</button>
            <button class="link-btn">退出</button>
        </div>
    </div>
    <div class="main-container">
        <div class="timeline-section">
            <div class="timeline-header">
                <div class="timeline-header-title">24小时时间轴</div>
            </div>
            <div class="timeline-header-container">
                <div class="timeline-header-left"></div>
                <div class="timeline-header-right" id="timelineHeaderRight"></div>
            </div>
            <div class="timeline-container" id="timelineContainer">
                <div class="timeline-left" id="timelineLeft">
                    <div class="timeline-line"></div>
                </div>
                <div class="timeline-right" id="timelineRight"></div>
            </div>
            <div class="timeline-footer-container">
                <div class="timeline-footer-left">总数</div>
                <div class="timeline-footer-right" id="timelineFooterRight"></div>
            </div>
        </div>
        <div class="table-section">
            <div class="table-header">
                <h3>仓库任务</h3>
                <div class="table-count" id="tableCount">共0条 1/1</div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>金蝶单号</th>
                        <th>客户名称</th>
                        <th>业务员</th>
                        <th>状态</th>
                        <th>下单时间</th>
                        <th>拣货人</th>
                        <th>开始拣货时间</th>
                        <th>用时</th>
                        <th>发货员</th>
                        <th>发货时间</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h3>系统设置</h3>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="refreshInterval">数据刷新间隔（秒）</label>
                    <input type="number" id="refreshInterval" min="10" value="60">
                    <div class="form-hint">建议值：180-600秒</div>
                </div>
                <div class="form-group">
                    <label for="refreshNum">自动翻页间隔（秒）</label>
                    <input type="number" id="refreshNum" min="1" value="1">
                    <div class="form-hint">建议值：1-3秒</div>
                </div>
                <div class="form-group">
                    <label for="pageSize">每页显示条数</label>
                    <input type="number" id="pageSize" min="1" value="5">
                    <div class="form-hint">建议值：5-20条</div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" id="cancelBtn">取消</button>
                <button class="btn" id="saveBtn">保存</button>
            </div>
        </div>
    </div>

    <div class="detail-overlay" id="detailOverlay">
        <div class="detail-modal">
            <div class="detail-header">
                <h3 id="detailTitle">订单详情</h3>
                <button class="detail-close" id="detailClose">&times;</button>
            </div>
            <div class="detail-content" id="detailContent">
            </div>
        </div>
    </div>

    <div class="photo-viewer-overlay" id="photoViewerOverlay">
        <button class="photo-viewer-close" id="photoViewerClose">&times;</button>
        <img class="photo-viewer-img" id="photoViewerImg" src="">
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loader" id="loader"></div>
            <div class="loading-text" id="loadingText">数据加载中，请等待</div>
        </div>
    </div>

    <script>
        // =========================================================================
        // 全局变量定义区域 - 所有全局变量都放在这里
        // =========================================================================

        /**
         * 仓库任务数据数组
         * 用于存储从后端API获取的任务列表，初始化为空数组
         * 等数据加载成功后会被填充
         */
        let tasksData = [];

        /**
         * 配置获取数据的天数
         * 指定从API获取多少天的数据，可根据需要修改
         */
        const DATA_DAYS = 1;

        /**
         * 定时刷新配置（毫秒）
         * 控制数据自动刷新的时间间隔
         * 默认值：5*60秒 = 3*60 * 1000毫秒
         */
        let REFRESH_INTERVAL = 5*60 * 1000;

        /**
         * 翻页定时刷新配置（秒）
         * 控制表格自动翻页的时间间隔
         * 默认值：1秒
         */
        let refreshNum = 2;

        /**
         * 数据刷新定时器ID
         * 存储setInterval的返回值，用于后续可能需要清除定时器
         */
        let refreshTimer;

        /**
         * 每页显示的数据条数
         * 控制任务表格每页显示的记录数量
         * 默认值：9条
         */
        let pageSize = 9;

        /**
         * 当前页码
         * 表格分页的当前页码，从1开始计数
         */
        let currentPage = 1;

        /**
         * 自动翻页的定时器变量
         * 用于存储setInterval的返回值，后续可以通过这个变量来停止定时器
         */
        let autoPageInterval;

        /**
         * 标记是否是首次加载
         * 用于控制只在网页刚开始加载时显示等待界面
         */
        let isFirstLoad = true;

        /**
         * 时间轴自动滚动管理器
         * 采用模块化设计，提供初始化、开始、停止、滚动等方法
         */
        const timelineAutoScroll = {
            /** 滚动定时器ID */
            scrollTimer: null,
            /** 滚动容器DOM元素 */
            container: null,
            /** 滚动速度（保留，当前未使用） */
            scrollSpeed: 50,
            /** 滚动间隔（毫秒），数值越小滚动越快 */
            scrollInterval: 20,
            /** 是否正在滚动的标志 */
            isScrolling: false,

            /**
             * 初始化滚动管理器
             * @param {string} containerId - 滚动容器的DOM元素ID
             */
            init(containerId) {
                this.container = document.getElementById(containerId);
            },

            /**
             * 开始自动滚动
             * 从顶部开始，平滑向下滚动
             */
            start() {
                if (!this.container || this.isScrolling) return;
                this.isScrolling = true;
                this.container.scrollTop = 0;
                this.scroll();
            },

            /**
             * 停止自动滚动
             * 清除定时器，重置滚动标志
             */
            stop() {
                this.isScrolling = false;
                if (this.scrollTimer) {
                    clearTimeout(this.scrollTimer);
                    this.scrollTimer = null;
                }
            },

            /**
             * 核心滚动逻辑
             * 每次滚动1px，到达底部后回到顶部循环
             */
            scroll() {
                if (!this.isScrolling || !this.container) return;
                this.container.scrollTop += 1;
                if (this.container.scrollTop >= this.container.scrollHeight - this.container.clientHeight) {
                    this.container.scrollTop = 0;
                }
                this.scrollTimer = setTimeout(() => this.scroll(), this.scrollInterval);
            },

            /**
             * 重新启动滚动
             * 先停止再开始，避免重复启动
             */
            restart() {
                this.stop();
                setTimeout(() => this.start(), 100);
            }
        };

        /**
         * 后端API地址配置对象
         * 集中管理所有接口地址，如果需要修改接口地址，只需要修改这里即可
         */
        const API_CONFIG = {
            /**
             * 任务列表API地址
             * 用于获取仓库任务数据，包含日期范围参数
             * start_date和end_date是毫秒级时间戳
             */
            get tasksUrl() {
                return generateTasksUrl(DATA_DAYS);
            }
        };

        // =========================================================================
        // 工具函数区域
        // =========================================================================

        /**
         * 生成任务数据API的URL
         * 根据指定的天数生成包含日期范围的API地址
         * @param {number} days - 需要获取数据的天数
         * @returns {string} 生成的API URL
         */
        function generateTasksUrl(days) {
            const now = new Date();
            const endDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
            const startDate = new Date(endDate);
            startDate.setDate(startDate.getDate() - (days - 1));
            startDate.setHours(0, 0, 0, 0);
            const startTimestamp = startDate.getTime();
            const endTimestamp = endDate.getTime();
            return `/new/api/dashboard_crm_wms?start_date=${startTimestamp}&end_date=${endTimestamp}`;
        }

        /**
         * 格式化时间戳
         * 将后端返回的秒级时间戳转换为可读的日期时间格式
         * @param {number|string} timestamp - 秒级时间戳，可以是数字或字符串类型
         * @returns {string} 格式化后的时间字符串，格式为"YYYY-MM-DD HH:mm:ss"
         */
        function formatTimestamp(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp * 1000);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }

        /**
         * 处理空值
         * 检查传入的值是否为空，如果为空则返回"-"，否则返回原值
         * @param {*} value - 原始值，可以是任意类型
         * @returns {*} 处理后的值，如果为空返回"-"，否则返回原值
         */
        function handleEmpty(value) {
            return (value === null || value === undefined || value === '') ? '-' : value;
        }

        /**
         * 脱敏处理字符串
         * 将字符串的中间部分用"*"号替换，替换的字符数量为字符串长度的二分之一
         * 主要用于保护客户名称等敏感信息
         * @param {string} str - 原始字符串
         * @returns {string} 脱敏后的字符串
         */
        function maskName(str) {
            if (!str || str === '-') return '-';
            const length = str.length;
            if (length <= 1) return str;
            const maskCount = Math.floor(length / 2);
            const startCount = Math.ceil((length - maskCount) / 2);
            const endCount = length - maskCount - startCount;
            return str.substring(0, startCount) + '*'.repeat(maskCount) + str.substring(length - endCount);
        }

        /**
         * 处理状态显示
         * 将后端返回的状态值转换为带样式的HTML标签，并根据数据异常标识添加异常提示
         * @param {number|string} status - 状态值，0=未开始，1=正在拣货，2=已完成
         * @param {number|string} isDataExistsWmsKeywd - 数据异常标识，2表示数据异常
         * @returns {string} 处理后的状态HTML标签
         */
        function formatStatus(status, isDataExistsWmsKeywd) {
            const statusMap = {
                '0': { text: '未开始', class: 'unstarted' },
                '1': { text: '正在拣货', class: 'picking' },
                '2': { text: '已完成', class: 'completed' }
            };
            const statusInfo = statusMap[String(status)] || { text: handleEmpty(status), class: '' };
            let statusText = statusInfo.text;
            let className = statusInfo.class;

            if (isDataExistsWmsKeywd == 2) {
                statusText += '（数据异常）';
                className = 'error';
            }

            return `<span class="status-tag ${className}">${statusText}</span>`;
        }

        /**
         * 计算用时
         * 只对正在拣货的任务计算从开始拣货到现在的时间
         * @param {number|string} status - 状态值，1=正在拣货
         * @param {number|string} jhdateTimestamp - 开始拣货时间戳（秒级）
         * @returns {string} 用时，格式为"X小时Y分钟"，其他状态返回"-"
         */
        function calculateDuration(status, jhdateTimestamp) {
            if (status != 1 || !jhdateTimestamp) {
                return '-';
            }

            const now = Date.now();
            const startTime = jhdateTimestamp * 1000;
            const diffMs = now - startTime;

            if (diffMs < 0) {
                return '-';
            }

            const diffMinutes = Math.floor(diffMs / (1000 * 60));
            const hours = Math.floor(diffMinutes / 60);
            const minutes = diffMinutes % 60;

            if (hours > 0) {
                return `${hours}小时${minutes}分钟`;
            } else {
                return `${minutes}分钟`;
            }
        }

        /**
         * 打开详情页
         * @param {Object} task - 任务数据对象
         */
        function openDetail(task) {
            const detailOverlay = document.getElementById('detailOverlay');
            const detailTitle = document.getElementById('detailTitle');
            const detailContent = document.getElementById('detailContent');

            detailTitle.textContent = `金蝶单号：${handleEmpty(task.pono_new)}`;

            let photosHtml = '';
            if (task.photos) {
                const photoFiles = task.photos.split(',').filter(p => p.trim());
                if (photoFiles.length > 0) {
                    photosHtml = '<div class="detail-photos">';
                    photoFiles.forEach(photoFile => {
                        const photoUrl = `https://jh.fsbbr.net/uploads/${photoFile.trim()}`;
                        photosHtml += `<img class="detail-photo" src="${photoUrl}" onclick="openPhotoViewer('${photoUrl}')" alt="照片">`;
                    });
                    photosHtml += '</div>';
                }
            }

            let shipperContent = '';
            if (handleEmpty(task.shipper) === '-') {
                shipperContent = '<span style="color: #faad14;">此商品还未发货</span>';
            } else {
                shipperContent = handleEmpty(task.shipper);
            }

            detailContent.innerHTML = `
                <div class="detail-item">
                    <span class="detail-label">发货员</span>
                    <span class="detail-value">${shipperContent}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">发货时间</span>
                    <span class="detail-value">${formatTimestamp(task.shipDate)}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">图片</span>
                    <span class="detail-value">${photosHtml || '暂无图片'}</span>
                </div>
            `;

            detailOverlay.classList.add('active');
        }

        /**
         * 关闭详情页
         */
        function closeDetail() {
            const detailOverlay = document.getElementById('detailOverlay');
            detailOverlay.classList.remove('active');
        }

        /**
         * 打开图片查看器
         * @param {string} imgSrc - 图片地址
         */
        function openPhotoViewer(imgSrc) {
            const photoViewerOverlay = document.getElementById('photoViewerOverlay');
            const photoViewerImg = document.getElementById('photoViewerImg');
            photoViewerImg.src = imgSrc;
            photoViewerOverlay.classList.add('active');
        }

        /**
         * 关闭图片查看器
         */
        function closePhotoViewer() {
            const photoViewerOverlay = document.getElementById('photoViewerOverlay');
            photoViewerOverlay.classList.remove('active');
        }

        /**
         * 初始化详情页事件监听
         */
        function initDetailModal() {
            const detailClose = document.getElementById('detailClose');
            const detailOverlay = document.getElementById('detailOverlay');
            const photoViewerClose = document.getElementById('photoViewerClose');
            const photoViewerOverlay = document.getElementById('photoViewerOverlay');

            detailClose.addEventListener('click', closeDetail);
            detailOverlay.addEventListener('click', function(e) {
                if (e.target === detailOverlay) {
                    closeDetail();
                }
            });

            photoViewerClose.addEventListener('click', closePhotoViewer);
            photoViewerOverlay.addEventListener('click', function(e) {
                if (e.target === photoViewerOverlay) {
                    closePhotoViewer();
                }
            });
        }

        // =========================================================================
        // 时间轴数据处理函数
        // =========================================================================

        /**
         * 处理后端任务数据，生成24小时时间轴数据
         * 将任务数据按30分钟时间槽分组，并计算各业务员的待拣和已拣数量
         * @param {Array} tasks - 后端返回的任务数据数组
         * @returns {Object} 包含时间轴数据、业务员列表和总数统计的对象
         */
        function processTimelineData(tasks) {
            const timeSlots = {};
            const salesmen = new Set();
            const totals = {
                unassigned: 0,
                salesmen: {}
            };

            for (let hour = 0; hour < 24; hour++) {
                for (let minute = 0; minute < 60; minute += 30) {
                    const timeStr = `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
                    timeSlots[timeStr] = {
                        time: timeStr,
                        unassigned: 0,
                        salesmen: {}
                    };
                }
            }

            tasks.forEach(task => {
                const createDate = new Date(task.create_date_crm * 1000);
                const hour = createDate.getHours();
                const minute = createDate.getMinutes();

                let slotHour = hour;
                let slotMinute = 0;
                if (minute >= 30) {
                    slotMinute = 30;
                }
                const timeStr = `${String(slotHour).padStart(2, '0')}:${String(slotMinute).padStart(2, '0')}`;

                if (task.status_wms == 0) {
                    const qty = Number(task.qty_wms) || 0;
                    timeSlots[timeStr].unassigned += qty;
                    totals.unassigned += qty;
                }

                const salesman = task.name_wms;
                if (salesman) {
                    salesmen.add(salesman);
                    const waitPick = Number(task.wait_pick_num_wms) || 0;
                    const picked = Number(task.toqty_wms) || 0;

                    if (!timeSlots[timeStr].salesmen[salesman]) {
                        timeSlots[timeStr].salesmen[salesman] = { waitPick: 0, picked: 0 };
                    }
                    timeSlots[timeStr].salesmen[salesman].waitPick += waitPick;
                    timeSlots[timeStr].salesmen[salesman].picked += picked;

                    if (!totals.salesmen[salesman]) {
                        totals.salesmen[salesman] = { waitPick: 0, picked: 0 };
                    }
                    totals.salesmen[salesman].waitPick += waitPick;
                    totals.salesmen[salesman].picked += picked;
                }
            });

            const sortedSalesmen = Array.from(salesmen).sort();
            const timelineData = Object.values(timeSlots);

            return { timelineData, salesmen: sortedSalesmen, totals };
        }

        // =========================================================================
        // 时间轴渲染函数
        // =========================================================================

        /**
         * 渲染24小时时间轴
         * 包括表头、内容区域和底部总数行
         * @param {Object} result - 包含 timelineData、salesmen 和 totals 的对象
         */
        function renderTimelineTable(result) {
            const { timelineData, salesmen, totals } = result;
            console.log(timelineData, salesmen, totals);
            const timelineLeft = document.getElementById('timelineLeft');
            const timelineRight = document.getElementById('timelineRight');
            const timelineHeaderRight = document.getElementById('timelineHeaderRight');
            const timelineFooterRight = document.getElementById('timelineFooterRight');

            timelineLeft.innerHTML = '<div class="timeline-line"></div>';
            timelineRight.innerHTML = '';
            timelineHeaderRight.innerHTML = '';
            timelineFooterRight.innerHTML = '';

            const headerUnassigned = document.createElement('div');
            headerUnassigned.className = 'timeline-column';
            headerUnassigned.innerHTML = `<div class="timeline-column-header">未分配</div>`;
            timelineHeaderRight.appendChild(headerUnassigned);

            salesmen.forEach(salesman => {
                const headerColumn = document.createElement('div');
                headerColumn.className = 'timeline-column';
                headerColumn.innerHTML = `<div class="timeline-column-header">${salesman}</div>`;
                timelineHeaderRight.appendChild(headerColumn);
            });

            const unassignedColumn = document.createElement('div');
            unassignedColumn.className = 'timeline-column';
            unassignedColumn.innerHTML = `<div class="timeline-column-content" id="unassignedCol"></div>`;
            timelineRight.appendChild(unassignedColumn);
            const unassignedCol = document.getElementById('unassignedCol');

            const salesmanCols = {};
            salesmen.forEach(salesman => {
                const column = document.createElement('div');
                column.className = 'timeline-column';
                const colId = `salesman-${salesman}`;
                column.innerHTML = `<div class="timeline-column-content" id="${colId}"></div>`;
                timelineRight.appendChild(column);
                salesmanCols[salesman] = document.getElementById(colId);
            });

            timelineData.forEach((item, index) => {
                const isHour = item.time.endsWith(':00');

                const timeItem = document.createElement('div');
                timeItem.className = 'timeline-time-item';
                timeItem.innerHTML = `
                    ${isHour ? `<span class="time-text">${item.time}</span>` : ''}
                    <span class="dot ${isHour ? '' : 'dot-small'}"></span>
                `;
                timelineLeft.appendChild(timeItem);

                const unassignedItem = document.createElement('div');
                unassignedItem.className = 'timeline-data-item';
                 unassignedItem.textContent = item.unassigned || '';
                // unassignedItem.textContent = item.unassigned !== undefined && item.unassigned !== null ? item.unassigned : '';
                unassignedCol.appendChild(unassignedItem);

                salesmen.forEach(salesman => {
                    const dataItem = document.createElement('div');
                    dataItem.className = 'timeline-data-item';
                    const salesmanData = item.salesmen[salesman];
                    if (salesmanData) {
                        dataItem.textContent = `${salesmanData.waitPick}个/${salesmanData.picked}个`;
                    } else {
                        dataItem.textContent = '';
                        // dataItem.textContent = '0个/0个';
                    }
                    salesmanCols[salesman].appendChild(dataItem);
                });
            });

            const footerUnassigned = document.createElement('div');
            footerUnassigned.className = 'timeline-footer-item';
            footerUnassigned.textContent = totals.unassigned || '';
            // footerUnassigned.textContent = totals.unassigned !== undefined && totals.unassigned !== null ? totals.unassigned : '';
            timelineFooterRight.appendChild(footerUnassigned);

            salesmen.forEach(salesman => {
                const footerItem = document.createElement('div');
                footerItem.className = 'timeline-footer-item';
                const salesmanTotal = totals.salesmen[salesman];
                if (salesmanTotal) {
                    footerItem.textContent = `${salesmanTotal.waitPick}个/${salesmanTotal.picked}个`;
                } else {
                    footerItem.textContent = '';
                    // footerItem.textContent = '0个/0个';
                }
                timelineFooterRight.appendChild(footerItem);
            });

            timelineAutoScroll.start();
        }

        // =========================================================================
        // 任务表格渲染函数
        // =========================================================================

        /**
         * 渲染任务表格
         * 这个函数会清空表格原有内容，然后根据传入的数据和当前页码渲染任务表格
         * @param {Array} data - 任务数据数组，包含所有仓库任务
         */
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            const tableCount = document.getElementById('tableCount');

            tbody.innerHTML = '';

            const totalPages = Math.ceil(data.length / pageSize);
            const startIndex = (currentPage - 1) * pageSize;
            const endIndex = startIndex + pageSize;
            const pageData = data.slice(startIndex, endIndex);

            pageData.forEach((item, index) => {
                const tr = document.createElement('tr');
                const serialNumber = (currentPage - 1) * pageSize + index + 1;
                tr.innerHTML = `
                    <td>${serialNumber}</td>
                    <td>${handleEmpty(item.pono_new)}</td>
                    <td>${maskName(handleEmpty(item.fullname_crm))}</td>
                    <td>${handleEmpty(item.handler_crm)}</td>
                    <td></td>
                    <td>${formatTimestamp(item.create_date_crm)}</td>
                    <td>${handleEmpty(item.name_wms)}</td>
                    <td>${formatTimestamp(item.jhdate_timestamp)}</td>
                    <td></td>
                    <td>${handleEmpty(item.shipper)}</td>
                    <td>${handleEmpty(item.shipDate)}</td>
                `;
                const statusTd = tr.children[4];
                statusTd.innerHTML = formatStatus(item.status_wms, item.is_data_exists_wms_keywd);
                const durationTd = tr.children[8];
                durationTd.textContent = calculateDuration(item.status_wms, item.jhdate_timestamp);

                tr.style.cursor = 'pointer';
                tr.addEventListener('click', () => openDetail(item));

                tbody.appendChild(tr);
            });

            tableCount.textContent = `共${data.length}条 ${currentPage}/${totalPages}`;
        }

        // =========================================================================
        // 分页控制函数
        // =========================================================================

        /**
         * 切换到下一页
         * 如果当前是最后一页，则回到第一页；否则页码+1
         */
        function nextPage() {
            const totalPages = Math.ceil(tasksData.length / pageSize);
            currentPage = currentPage >= totalPages ? 1 : currentPage + 1;
            renderTable(tasksData);
        }

        /**
         * 启动自动翻页功能
         * 设置定时器，每隔固定时间自动切换到下一页
         */
        function startAutoPage() {
            autoPageInterval = setInterval(nextPage, refreshNum * 1000);
        }

        // =========================================================================
        // 数据获取函数（AJAX请求）
        // =========================================================================

        /**
         * 通过AJAX获取任务数据
         * 从后端API获取仓库任务数据，成功后渲染表格并启动自动翻页
         */
        function fetchTasksData() {
            timelineAutoScroll.stop();

            const loadingOverlay = document.getElementById('loadingOverlay');
            const loader = document.getElementById('loader');
            const loadingText = document.getElementById('loadingText');

            if (isFirstLoad) {
                loadingOverlay.classList.add('active');
                loader.classList.remove('error');
                loadingText.classList.remove('error');
                loadingText.textContent = '数据加载中，请等待';
            }

            fetch(API_CONFIG.tasksUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('网络响应异常');
                    }
                    return response.json();
                })
                .then(data => {
                    tasksData = data.data;
                    renderTable(tasksData);
                    const timelineResult = processTimelineData(tasksData);
                    renderTimelineTable(timelineResult);

                    if (isFirstLoad) {
                        loadingOverlay.classList.remove('active');
                        isFirstLoad = false;
                    }
                })
                .catch(error => {
                    console.error('获取任务数据失败:', error);

                    if (isFirstLoad) {
                        loader.classList.add('error');
                        loadingText.classList.add('error');
                        loadingText.textContent = '请检查token';
                    } else {
                        const tbody = document.getElementById('tableBody');
                        tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;color:#ff4d4f;">数据加载失败，请稍后重试</td></tr>';
                        const timelineResult = processTimelineData([]);
                        renderTimelineTable(timelineResult);
                    }
                });
        }

        // =========================================================================
        // 定时刷新函数
        // =========================================================================

        /**
         * 启动定时刷新功能
         * 每隔REFRESH_INTERVAL毫秒自动刷新数据
         */
        function startAutoRefresh() {
            if (refreshTimer) {
                clearInterval(refreshTimer);
            }
            refreshTimer = setInterval(function() {
                console.log('自动刷新数据...');
                fetchTasksData();
            }, REFRESH_INTERVAL);
        }

        // =========================================================================
        // 设置弹窗相关函数
        // =========================================================================

        /**
         * 初始化设置弹窗
         * 绑定设置按钮、关闭按钮、保存按钮等的事件监听器
         */
        function initSettingsModal() {
            const settingsBtn = document.querySelector('.header-right .link-btn:first-child');
            const settingsModal = document.getElementById('settingsModal');
            const closeModal = document.getElementById('closeModal');
            const cancelBtn = document.getElementById('cancelBtn');
            const saveBtn = document.getElementById('saveBtn');

            settingsBtn.addEventListener('click', function() {
                openSettingsModal();
            });

            closeModal.addEventListener('click', function() {
                closeSettingsModal();
            });

            settingsModal.addEventListener('click', function(e) {
                if (e.target === settingsModal) {
                    closeSettingsModal();
                }
            });

            cancelBtn.addEventListener('click', function() {
                closeSettingsModal();
            });

            saveBtn.addEventListener('click', function() {
                saveSettings();
            });
        }

        /**
         * 打开设置弹窗并填充当前值
         * 将当前的配置值填充到表单输入框中
         */
        function openSettingsModal() {
            const settingsModal = document.getElementById('settingsModal');
            const refreshIntervalInput = document.getElementById('refreshInterval');
            const refreshNumInput = document.getElementById('refreshNum');
            const pageSizeInput = document.getElementById('pageSize');

            refreshIntervalInput.value = REFRESH_INTERVAL / 1000;
            refreshNumInput.value = refreshNum;
            pageSizeInput.value = pageSize;

            settingsModal.classList.add('active');
        }

        /**
         * 关闭设置弹窗
         * 隐藏设置弹窗遮罩层
         */
        function closeSettingsModal() {
            const settingsModal = document.getElementById('settingsModal');
            settingsModal.classList.remove('active');
        }

        /**
         * 保存设置
         * 验证用户输入，更新配置变量，重启相关定时器，重新渲染表格
         */
        function saveSettings() {
            const refreshIntervalInput = document.getElementById('refreshInterval');
            const refreshNumInput = document.getElementById('refreshNum');
            const pageSizeInput = document.getElementById('pageSize');

            const newRefreshInterval = parseInt(refreshIntervalInput.value) * 1000;
            const newRefreshNum = parseInt(refreshNumInput.value);
            const newPageSize = parseInt(pageSizeInput.value);

            if (isNaN(newRefreshInterval) || newRefreshInterval < 10000) {
                alert('数据刷新间隔不能小于10秒');
                return;
            }
            if (isNaN(newRefreshNum) || newRefreshNum < 1) {
                alert('自动翻页间隔不能小于1秒');
                return;
            }
            if (isNaN(newPageSize) || newPageSize < 1) {
                alert('每页显示条数不能小于1');
                return;
            }

            REFRESH_INTERVAL = newRefreshInterval;
            refreshNum = newRefreshNum;
            pageSize = newPageSize;

            if (autoPageInterval) {
                clearInterval(autoPageInterval);
            }
            startAutoPage();

            startAutoRefresh();

            currentPage = 1;
            renderTable(tasksData);

            closeSettingsModal();
            alert('设置已保存！');
        }

        // =========================================================================
        // 实时时间更新函数
        // =========================================================================

        /**
         * 更新时间显示
         * 格式化当前时间并更新到页面上
         */
        function updateDateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const weekDay = weekDays[now.getDay()];

            const dateTimeElement = document.getElementById('dateTime');
            if (dateTimeElement) {
                dateTimeElement.textContent = `${year}.${month}.${day} ${hours}:${minutes}:${seconds} ${weekDay} 天气晴`;
            }
        }

        /**
         * 启动实时时间更新
         * 每秒更新一次时间显示
         */
        function startRealTimeClock() {
            updateDateTime();
            setInterval(updateDateTime, 1000);
        }

        // =========================================================================
        // 页面初始化
        // =========================================================================

        /**
         * 监听DOMContentLoaded事件
         * 当页面HTML结构加载完成后执行初始化操作
         */
        document.addEventListener('DOMContentLoaded', function() {
            startRealTimeClock();
            timelineAutoScroll.init('timelineContainer');
            fetchTasksData();
            startAutoPage();
            startAutoRefresh();
            initSettingsModal();
            initDetailModal();
        });
    </script>
</body>
</html>
