<!-- ECharts 本地引入 -->
<script src="{{ url_for('static', filename='js/lib/echarts.min.js') }}"></script>

<!-- VIN码维度 -->
<div id="tab-vin" class="tab-pane">
    <style>
        /* 单元格文本超出显示省略号，且禁止换行以固定行高 */
        #handsontable-vin-oenum-container .handsontable .htCore td,
        #handsontable-vin-engine-container .handsontable .htCore td,
        #handsontable-vin-chassis-container .handsontable .htCore td {
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            vertical-align: middle !important;
        }

        /* 统一所有行高度为 24px */
        #handsontable-vin-oenum-container .handsontable .htCore tbody tr,
        #handsontable-vin-engine-container .handsontable .htCore tbody tr,
        #handsontable-vin-chassis-container .handsontable .htCore tbody tr {
            height: 24px !important;
            min-height: 24px !important;
            max-height: 24px !important;
        }

        .vin-chart {
            height: 300px;
            width: 100%;
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 4px;
        }

        .vin-grid-wrapper {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .vin-grid {
            height: 300px;
            width: 100%;
            overflow: hidden;
        }
    </style>

    <!-- 第一行：三个柱状图并排（自适应宽度） -->
    <div style="display: flex; gap: 20px; margin-bottom: 20px;">
        <div style="flex: 1; min-width: 0;">
            <div style="font-size: 16px; font-weight: 600; color: #333; margin: 10px 0 10px 0;">OE TOP 10</div>
            <div id="vinOenumChart" class="vin-chart"></div>
        </div>
        <div style="flex: 1; min-width: 0;">
            <div style="font-size: 16px; font-weight: 600; color: #333; margin: 10px 0 10px 0;">发动机 TOP 10</div>
            <div id="vinEngineChart" class="vin-chart"></div>
        </div>
        <div style="flex: 1; min-width: 0;">
            <div style="font-size: 16px; font-weight: 600; color: #333; margin: 10px 0 10px 0;">底盘 TOP 10</div>
            <div id="vinChassisChart" class="vin-chart"></div>
        </div>
    </div>

    <!-- 第二行：三个表格并排（自适应宽度） -->
    <div style="display: flex; gap: 20px; margin-bottom: 10px;">
        <div class="vin-grid-wrapper">
            <div style="font-size: 16px; font-weight: 600; color: #333; margin: 10px 0 10px 0;">OE统计</div>
            <div id="handsontable-vin-oenum-container" class="vin-grid"></div>
        </div>
        <div class="vin-grid-wrapper">
            <div style="font-size: 16px; font-weight: 600; color: #333; margin: 10px 0 10px 0;">发动机统计</div>
            <div id="handsontable-vin-engine-container" class="vin-grid"></div>
        </div>
        <div class="vin-grid-wrapper">
            <div style="font-size: 16px; font-weight: 600; color: #333; margin: 10px 0 10px 0;">底盘统计</div>
            <div id="handsontable-vin-chassis-container" class="vin-grid"></div>
        </div>
    </div>
</div>

<script>
(function() {
    // ECharts 实例
    var oenumChartInstance = null;
    var engineChartInstance = null;
    var chassisChartInstance = null;

    // 初始化图表（等待 echarts 加载完成）
    function initCharts() {
        if (typeof echarts === 'undefined') {
            setTimeout(initCharts, 100);
            return;
        }
        var oenumDom = document.getElementById('vinOenumChart');
        var engineDom = document.getElementById('vinEngineChart');
        var chassisDom = document.getElementById('vinChassisChart');
        if (oenumDom && !oenumChartInstance) oenumChartInstance = echarts.init(oenumDom);
        if (engineDom && !engineChartInstance) engineChartInstance = echarts.init(engineDom);
        if (chassisDom && !chassisChartInstance) chassisChartInstance = echarts.init(chassisDom);

        setEmptyChart(oenumChartInstance);
        setEmptyChart(engineChartInstance);
        setEmptyChart(chassisChartInstance);
    }

    // 设置空状态
    function setEmptyChart(instance) {
        if (!instance) return;
        instance.clear();
        instance.setOption({
            title: { text: '暂无数据', left: 'center', top: 'middle', textStyle: { color: '#999', fontSize: 14, fontWeight: 'normal' } }
        });
    }

    // 渲染柱状图（TOP 10）
    function renderChart(instance, list, labelField, title, color) {
        if (!instance) return;
        if (!list || list.length === 0) {
            setEmptyChart(instance);
            return;
        }
        var top10 = list.slice(0, 10);
        var categories = top10.map(function(item) { return item[labelField] || ''; });
        var values = top10.map(function(item) { return item.occurrence_count || 0; });

        instance.setOption({
            title: null,
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
            grid: { left: '3%', right: '4%', bottom: '18%', top: '8%', containLabel: true },
            xAxis: {
                type: 'category',
                data: categories,
                axisLabel: { rotate: 30, fontSize: 11, interval: 0 }
            },
            yAxis: { type: 'value', name: '次数' },
            series: [{
                name: title,
                type: 'bar',
                data: values,
                itemStyle: { color: color, borderRadius: [4, 4, 0, 0] },
                label: { show: true, position: 'top', fontSize: 11 }
            }]
        }, true);
    }

    // 窗口尺寸变化时图表自适应
    window.addEventListener('resize', function() {
        oenumChartInstance && oenumChartInstance.resize();
        engineChartInstance && engineChartInstance.resize();
        chassisChartInstance && chassisChartInstance.resize();
    });

    // 通用组件配置
    var vinComponents = {
        pagination: {
            pageSizeOptions: [50, 100, 200, 500],
            defaultPageSize: 100,
            showScrollToTop: true
        },
        columnMenu: { persist: true },
        doubleClickCopy: true,
        copyToast: true,
        contextMenu: false,
        shortcuts: true
    };

    // 创建 Builder 配置
    function createVinConfig(baseConfig, chartInstance, labelField, title, color) {
        return Object.assign({}, baseConfig, {
            pageKey: QplQuoteGridConfig.pageKey,
            components: vinComponents,
            afterLoad: function(result) {
                var list = result && result.data && result.data.list ? result.data.list : [];
                renderChart(chartInstance, list, labelField, title, color);
            }
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        initCharts();

        // OE 统计
        var oenumConfig = createVinConfig(
            QplQuoteGridConfig.vinStatsOeNum,
            oenumChartInstance,
            'item_oe',
            'OE',
            '#5470c6'
        );
        window.qplVinOenumBuilder = HandsontableBuilder.create(
            oenumConfig.containerSelector,
            oenumConfig
        );

        // 发动机统计
        var engineConfig = createVinConfig(
            QplQuoteGridConfig.vinStatsEngine,
            engineChartInstance,
            'engine',
            '发动机',
            '#91cc75'
        );
        window.qplVinEngineBuilder = HandsontableBuilder.create(
            engineConfig.containerSelector,
            engineConfig
        );

        // 底盘统计
        var chassisConfig = createVinConfig(
            QplQuoteGridConfig.vinStatsChassis,
            chassisChartInstance,
            'chassis',
            '底盘',
            '#fac858'
        );
        window.qplVinChassisBuilder = HandsontableBuilder.create(
            chassisConfig.containerSelector,
            chassisConfig
        );

        // 暴露刷新方法
        window.refreshVinOenumData = function(page, pageSize) {
            if (window.qplVinOenumBuilder) window.qplVinOenumBuilder.refresh(page, pageSize);
        };
        window.refreshVinEngineData = function(page, pageSize) {
            if (window.qplVinEngineBuilder) window.qplVinEngineBuilder.refresh(page, pageSize);
        };
        window.refreshVinChassisData = function(page, pageSize) {
            if (window.qplVinChassisBuilder) window.qplVinChassisBuilder.refresh(page, pageSize);
        };

        window.refreshVinAll = function() {
            window.refreshVinOenumData();
            window.refreshVinEngineData();
            window.refreshVinChassisData();
        };

        window.resizeVinCharts = function() {
            oenumChartInstance && oenumChartInstance.resize();
            engineChartInstance && engineChartInstance.resize();
            chassisChartInstance && chassisChartInstance.resize();
        };

        // 初始化后短暂延迟 resize，以适配可能的 tab 切换
        setTimeout(function() {
            window.resizeVinCharts();
        }, 50);
    });
})();
</script>
