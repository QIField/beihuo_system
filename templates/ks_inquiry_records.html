<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开思询价明细</title>
    
    <!-- AG Grid CSS - 使用本地文件 -->
    <link rel="stylesheet" href="/static/ag-grid/ag-grid.css">
    <link rel="stylesheet" href="/static/ag-grid/ag-theme-alpine.css">
    <link rel="stylesheet" href="/static/ag-grid/ag-custom-checkbox.css">
    
    <!-- LayUI -->
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <script src="/static/layui/layui.js"></script>

    <!-- Filter Panel Component -->
    <link rel="stylesheet" href="/static/js/components/filter_panel/filter-panel.css">
    <script src="/static/js/components/filter_panel/filter-panel.js"></script>
    
    <!-- 一键置顶按钮组件 -->
    <link rel="stylesheet" href="/static/js/components/scroll-to-top/scroll-to-top.css?v=1">
    <script src="/static/js/components/scroll-to-top/scroll-to-top.js?v=1"></script>

    <!-- 自定义分页组件 -->
    <script src="/static/js/components/custom-pagination/custom-pagination.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #f5f5f5;
            padding: 20px;
        }
        
        .container { max-width: 100%; margin: 0 auto; }
        
        /* 搜索筛选区域 - 保持原样 */
        .search-panel {
            background: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        /* 日期输入框样式 */
        .search-panel .layui-input {
            height: 36px;
            line-height: 34px;
            padding: 0 12px;
            font-size: 13px;
            box-sizing: border-box;
        }
        
        /* 筛选按钮样式 - 关键：去掉默认上下margin */
        .search-panel .filter-btn {
            height: 36px !important;
            line-height: 34px !important;
            padding: 0 12px !important;
            box-sizing: border-box !important;
            margin: 0 4px !important;
        }
        
        /* FilterPanel容器样式 */
        .search-panel #ksInquiryFilterButtons {
            display: inline-flex;
            align-items: center;
            height: 36px;
        }
        
        .table-container {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        #ksInquiryGrid {
            height: calc(100vh - 200px);
            min-height: 500px;
            width: 100%;
        }
        
        /* 分页条数选择器 */
        .ag-paging-panel {
            position: relative;
        }

        /* 分页条数选择器 */
        .page-size-selector {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #666;
        }

        .page-size-selector select {
            padding: 4px 8px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            background: #fff;
        }

        .page-size-selector select:hover {
            border-color: #1890ff;
        }

        .page-size-selector select:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
        }

        /* 页码跳转器 */
        .page-jumper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 20px;
            font-size: 13px;
            color: #666;
        }

        .page-jumper input {
            width: 50px;
            padding: 4px 8px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 13px;
            text-align: center;
        }

        .page-jumper input:hover {
            border-color: #1890ff;
        }

        .page-jumper input:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
        }

        .page-jumper button {
            padding: 4px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            background: #fff;
            font-size: 13px;
            cursor: pointer;
            color: #666;
        }

        .page-jumper button:hover {
            border-color: #1890ff;
            color: #1890ff;
        }
        
        /* AG Grid 自定义样式 - 紧凑版 */
        .ag-theme-alpine {
            --ag-font-size: 12px;
            --ag-font-family: 'Microsoft YaHei', Arial, sans-serif;
            --ag-header-height: 36px;
            --ag-row-height: 36px;
            --ag-header-background-color: #fafafa;
            --ag-odd-row-background-color: #fff;
            --ag-even-row-background-color: #fafafa;
            --ag-cell-horizontal-padding: 6px;
        }
        
        .ag-theme-alpine .ag-header-cell-text {
            font-size: 12px;
            font-weight: 600;
        }
        
        .ag-theme-alpine .ag-cell {
            font-size: 12px;
            line-height: 36px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 搜索筛选区域 - 保持原样 -->
        <div class="search-panel">
            <!-- 日期选择器 -->
            <span style="font-size: 14px; color: #666;">日期范围：</span>
            <input type="text" id="dateRange" placeholder="请选择日期范围" class="layui-input" style="width: 220px;" readonly>
            
            <!-- 分隔符 -->
            <span style="color: #999;">|</span>

            <!-- 筛选按钮 -->
            <div id="ksInquiryFilterButtons"></div>

            <!-- 分隔符 -->
            <span style="color: #999;">|</span>

            <!-- 筛选按钮容器（品牌和卖家状态） -->
            <div id="ksFilterButtons"></div>

            <!-- 分隔符 -->
            <span style="color: #999;">|</span>

            <!-- 重置按钮 -->
            <button class="filter-btn" onclick="resetAll()">重置</button>

            <input type="hidden" id="searchInquiryId">
            <input type="hidden" id="searchPartsNum">
            <input type="hidden" id="searchPartsName">
            <input type="hidden" id="searchBrandName">
            <input type="hidden" id="searchSellerStatus">
            <input type="hidden" id="searchBrand">
        </div>
        
        <!-- 表格容器 -->
        <div class="table-container">
            <div id="ksInquiryGrid" class="ag-theme-alpine"></div>
        </div>
    </div>

    <!-- AG Grid JS - 使用本地文件 -->
    <script src="/static/ag-grid/ag-grid-community.min.js"></script>
    
    <!-- 通用复制工具 -->
    <script src="/static/js/copy-utils.js"></script>
    
    <script>
        // 全局变量
        let gridApi = null;
        let gridColumnApi = null;
        let currentData = [];
        let currentPage = 1;
        let currentPageSize = 200;
        let totalRecords = 0;
        
        // 用户门店信息（从后端传入）
        const userCompany = '{{ session.get("store", "") }}';

        // AG Grid 列定义（已删除：报价日期、配件类型、配件品质、公司、创建时间、更新时间）
        const columnDefs = [
            {
                headerName: '行号',
                field: 'rowNumber',
                width: 80,
                pinned: 'left',
                sortable: false,
                filter: false,
                valueGetter: params => {
                    const rowIndex = params.node?.rowIndex;
                    return rowIndex !== undefined ? rowIndex + 1 : '';
                }
            },
            { field: 'inquiryId', headerName: '询价单号', width: 150, pinned: 'left', sortable: true, filter: true },
            { field: 'partsNum', headerName: 'OE号', width: 150, sortable: true, filter: true },
            { field: 'partsName', headerName: '配件名称', width: 200, sortable: true, filter: true },
            { field: 'brandName', headerName: '品牌', width: 120, sortable: true, filter: true },
            { field: 'brandNormalized', headerName: '标准化品牌', width: 120, sortable: true, filter: true },
            { field: 'brandId', headerName: '品牌ID', width: 100, sortable: true, filter: true },
            { field: 'sellerBtPrice', headerName: '卖家BT价格', width: 120, sortable: true, filter: true },
            { field: 'sellerPrice', headerName: '卖家价格', width: 120, sortable: true, filter: true },
            {
                field: 'displaySellerStatus',
                headerName: '卖家状态',
                width: 120,
                sortable: true,
                filter: true
            },
            { field: 'remark', headerName: '备注', width: 200, sortable: true, filter: true },
            { field: 'vin', headerName: '车架号', width: 150, sortable: true, filter: true },
            { field: 'engine', headerName: '发动机', width: 120, sortable: true, filter: true },
            { field: 'productionDate', headerName: '车辆生产日期', width: 140, sortable: true, filter: true },
            { field: 'chassis', headerName: '底盘', width: 120, sortable: true, filter: true }
        ];
        
        // Grid 配置
        const gridOptions = {
            columnDefs: columnDefs,
            rowData: [],
            defaultColDef: {
                sortable: true,
                filter: true,
                resizable: true,
                suppressMenu: true
            },
            rowHeight: 36,
            headerHeight: 36,
            // 禁用 AG Grid 自带分页栏，使用自定义分页组件
            pagination: false,
            animateRows: true,
            onGridReady: function(event) {
                gridApi = event.api;
                gridColumnApi = event.columnApi;

                gridApi.sizeColumnsToFit();

                // 初始化双击复制功能
                initDoubleClickCopy();

                // 初始化自定义分页组件
                initCustomPagination();

                // 加载初始数据
                refreshGrid();
            }
        };
        
        // 初始化双击复制功能
        function initDoubleClickCopy() {
            const gridDiv = document.querySelector('#ksInquiryGrid');
            
            gridDiv.addEventListener('dblclick', function(e) {
                const cellElement = e.target.closest('.ag-cell');
                if (!cellElement) return;
                
                const rowId = cellElement.closest('.ag-row')?.getAttribute('row-id');
                const colId = cellElement.getAttribute('col-id');
                
                if (rowId && colId) {
                    const rowNode = gridApi.getRowNode(rowId);
                    if (rowNode && rowNode.data) {
                        const value = rowNode.data[colId];
                        if (value !== undefined && value !== null) {
                            const textToCopy = String(value);
                            navigator.clipboard.writeText(textToCopy).then(() => {
                                layui.layer.msg('已复制到剪贴板', {icon: 1, time: 1000});
                            }).catch(err => {
                                console.error('复制失败:', err);
                                layui.layer.msg('复制失败', {icon: 2});
                            });
                        }
                    }
                }
            });
        }
        
        // 自定义分页组件实例
        let customPagination = null;

        // 初始化自定义分页组件
        function initCustomPagination() {
            if (typeof CustomPagination === 'undefined') {
                console.error('[KsInquiryRecords] CustomPagination 组件未加载');
                return;
            }

            customPagination = CustomPagination.init({
                gridSelector: '#ksInquiryGrid',
                pageSizeOptions: [50, 100, 200, 500],
                defaultPageSize: 200,
                showScrollToTop: true,
                onPageChange: function(page, pageSize) {
                    currentPage = page;
                    currentPageSize = pageSize;
                    refreshGrid(page, pageSize);
                },
                onPageSizeChange: function(pageSize) {
                    currentPageSize = pageSize;
                }
            });

            console.log('[KsInquiryRecords] 自定义分页组件已初始化');
        }

        // 更新分页信息（在 refreshGrid 中调用）
        function updatePaginationInfo() {
            if (customPagination) {
                customPagination.update(totalRecords, currentPage, currentPageSize);
            }
        }

        // 初始化 Grid
        document.addEventListener('DOMContentLoaded', function() {
            const gridDiv = document.querySelector('#ksInquiryGrid');
            new agGrid.Grid(gridDiv, gridOptions);
            
            // 初始化筛选面板（只保留询价单号、OE号、配件名称）
            FilterPanel.initSearch({
                container: '#ksInquiryFilterButtons',
                fields: [
                    { label: '询价单号', inputId: 'searchInquiryId' },
                    { label: 'OE号', inputId: 'searchPartsNum' },
                    { label: '配件名称', inputId: 'searchPartsName' }
                ],
                onApply: function(field, value) {
                    refreshGrid();
                }
            });

            // 初始化品牌ID和卖家状态筛选按钮（使用FilterPanel）
            initKsFilterButtons();
            
            // 初始化layui日期组件
            layui.use(['laydate'], function() {
                const laydate = layui.laydate;

                // 获取今天的日期字符串
                const today = new Date();
                const todayStr = today.getFullYear() + '-' +
                    String(today.getMonth() + 1).padStart(2, '0') + '-' +
                    String(today.getDate()).padStart(2, '0');

                // 设置默认日期范围（今天）
                document.getElementById('dateRange').value = todayStr + ' - ' + todayStr;

                laydate.render({
                    elem: '#dateRange',
                    trigger: 'focus',
                    format: 'yyyy-MM-dd',
                    range: true,
                    max: 0,
                    value: todayStr + ' - ' + todayStr,  // 默认选中今天
                    done: function(value, date, endDate) {
                        // 日期选择完成后自动刷新数据
                        console.log('日期选择完成:', value);
                        refreshGrid();
                    },
                    change: function(value, date, endDate) {
                        // 日期变化时也可以触发
                        console.log('日期变化:', value);
                    }
                });
            });
        });
        
        // 品牌选项数据
        let brandOptions = [];

        // 初始化品牌和卖家状态筛选按钮（使用FilterPanel）
        function initKsFilterButtons() {
            // 先创建按钮（无论API是否成功）
            createKsFilterButtons();

            // 然后获取品牌列表（brandNormalized）
            fetch('/new/api/ks_inquiry/brands?' + new URLSearchParams({
                company: userCompany
            }))
            .then(response => response.json())
            .then(data => {
                if (data.code === 0 || data.code === '0') {
                    brandOptions = data.data || [];
                }
            })
            .catch(error => {
                console.error('获取品牌列表失败:', error);
            });
        }

        // 创建筛选按钮（使用FilterPanel样式）
        function createKsFilterButtons() {
            const container = document.getElementById('ksFilterButtons');
            if (!container) return;

            // 创建品牌筛选按钮
            const brandBtn = document.createElement('button');
            brandBtn.className = 'filter-btn';
            brandBtn.id = 'ksFilterBtn_brand';
            brandBtn.textContent = '品牌';
            brandBtn.onclick = function(e) {
                e.stopPropagation();
                toggleKsFilterPanel('brand', this);
            };
            container.appendChild(brandBtn);

            // 创建卖家状态筛选按钮
            const statusBtn = document.createElement('button');
            statusBtn.className = 'filter-btn';
            statusBtn.id = 'ksFilterBtn_sellerStatus';
            statusBtn.textContent = '卖家状态';
            statusBtn.onclick = function(e) {
                e.stopPropagation();
                toggleKsFilterPanel('sellerStatus', this);
            };
            container.appendChild(statusBtn);
        }

        // 当前面板状态
        let ksCurrentPanel = null;
        let ksCurrentField = null;

        // 切换筛选面板
        function toggleKsFilterPanel(field, btnElement) {
            if (ksCurrentPanel && ksCurrentField === field) {
                closeKsFilterPanel();
                return;
            }
            closeKsFilterPanel();
            createKsFilterPanel(field, btnElement);
        }

        // 创建筛选面板（完全模仿FilterPanel.init的样式）
        function createKsFilterPanel(field, btnElement) {
            ksCurrentField = field;

            const panel = document.createElement('div');
            panel.className = 'filter-dropdown-panel show';
            panel.id = 'ks-filter-dropdown-panel';
            panel.style.display = 'block';

            let title, options;
            if (field === 'brand') {
                title = '品牌';
                options = brandOptions.map(name => ({ value: name, text: name }));
            } else {
                title = '卖家状态';
                options = [
                    { value: '未下单', text: '未下单' },
                    { value: '本店下单', text: '本店下单' },
                    { value: '非本店下单', text: '非本店下单' }
                ];
            }

            // 获取当前选中的值
            const currentValue = field === 'brand'
                ? document.getElementById('searchBrand').value
                : document.getElementById('searchSellerStatus').value;

            // 构建选项列表（使用FilterPanel的样式）
            let listHtml = '';
            options.forEach(opt => {
                const isChecked = currentValue === opt.value ? 'checked' : '';
                listHtml += '<div class="filter-dropdown-item" onclick="FilterPanel.toggleItemCheckbox(this)">' +
                    '<input type="checkbox" value="' + opt.value + '" ' + isChecked + ' onclick="event.stopPropagation()">' +
                    '<label>' + opt.text + '</label>' +
                '</div>';
            });

            panel.innerHTML =
                '<div class="filter-dropdown-header">' + title + '筛选</div>' +
                '<div class="filter-dropdown-list">' + listHtml + '</div>' +
                '<div class="filter-dropdown-footer">' +
                    '<button onclick="ksSelectAll()">全选</button>' +
                    '<button onclick="ksInvert()">反选</button>' +
                    '<button class="btn-confirm" onclick="ksApplyFilter(\'' + field + '\')">确定</button>' +
                    '<button onclick="ksCancelFilter()">取消</button>' +
                '</div>';

            // 定位到按钮下方
            const rect = btnElement.getBoundingClientRect();
            panel.style.position = 'fixed';
            panel.style.left = rect.left + 'px';
            panel.style.top = (rect.bottom + 4) + 'px';
            panel.style.zIndex = '999999999';

            document.body.appendChild(panel);
            ksCurrentPanel = panel;

            // 高亮按钮
            btnElement.classList.add('active');
        }

        // 全选
        function ksSelectAll() {
            const checkboxes = ksCurrentPanel.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = true);
        }

        // 反选
        function ksInvert() {
            const checkboxes = ksCurrentPanel.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = !cb.checked);
        }

        // 应用筛选
        function ksApplyFilter(field) {
            const checkboxes = ksCurrentPanel.querySelectorAll('input[type="checkbox"]:checked');
            const selectedValues = Array.from(checkboxes).map(cb => cb.value);

            if (field === 'brand') {
                document.getElementById('searchBrand').value = selectedValues.join(',');
            } else {
                document.getElementById('searchSellerStatus').value = selectedValues.join(',');
            }

            closeKsFilterPanel();
            refreshGrid();
        }

        // 取消筛选
        function ksCancelFilter() {
            closeKsFilterPanel();
        }

        // 关闭筛选面板
        function closeKsFilterPanel() {
            if (ksCurrentPanel) {
                ksCurrentPanel.remove();
                ksCurrentPanel = null;
            }
            ksCurrentField = null;

            // 移除按钮高亮
            document.querySelectorAll('#ksFilterButtons .filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // 恢复有值的按钮高亮
            updateKsFilterButtonStates();
        }

        // 更新筛选按钮状态
        function updateKsFilterButtonStates() {
            const brandBtn = document.getElementById('ksFilterBtn_brand');
            const statusBtn = document.getElementById('ksFilterBtn_sellerStatus');

            // 重置所有按钮样式
            if (brandBtn) {
                brandBtn.classList.remove('active');
                if (document.getElementById('searchBrand').value) {
                    brandBtn.classList.add('active');
                }
            }
            if (statusBtn) {
                statusBtn.classList.remove('active');
                if (document.getElementById('searchSellerStatus').value) {
                    statusBtn.classList.add('active');
                }
            }
        }

        // 点击外部关闭面板
        document.addEventListener('click', function(e) {
            if (!e.target.closest('#ksFilterButtons') && !e.target.closest('.filter-dropdown-panel')) {
                closeKsFilterPanel();
            }
        });

        // 重置所有筛选条件
        function resetAll() {
            document.getElementById('dateRange').value = '';
            document.getElementById('searchInquiryId').value = '';
            document.getElementById('searchPartsNum').value = '';
            document.getElementById('searchPartsName').value = '';
            document.getElementById('searchBrandName').value = '';
            document.getElementById('searchSellerStatus').value = '';
            document.getElementById('searchBrand').value = '';

            // 重置筛选按钮样式
            updateKsFilterButtonStates();

            if (typeof FilterPanel !== 'undefined' && FilterPanel.clearAll) {
                FilterPanel.clearAll();
            }

            refreshGrid();
        }
        
        // 获取查询参数
        function getSearchParams() {
            let beginDate = '', endDate = '';
            const dateRangeValue = document.getElementById('dateRange').value;
            if (dateRangeValue) {
                const dates = dateRangeValue.split(' - ');
                beginDate = dates[0] || '';
                endDate = dates[1] || '';
            }

            return {
                inquiry_id: document.getElementById('searchInquiryId').value || '',
                parts_num: document.getElementById('searchPartsNum').value || '',
                parts_name: document.getElementById('searchPartsName').value || '',
                brand_name: document.getElementById('searchBrandName').value || '',
                brand: document.getElementById('searchBrand').value || '',  // 品牌筛选（brandNormalized）
                seller_status: document.getElementById('searchSellerStatus').value || '',
                begin_date: beginDate,
                end_date: endDate,
                company: userCompany  // 添加用户门店筛选
            };
        }
        
        // 刷新表格数据
        function refreshGrid(page = 1, pageSize = currentPageSize) {
            currentPage = page;
            currentPageSize = pageSize;

            const params = getSearchParams();
            params.page = page;
            params.page_size = pageSize;

            console.log(`[refreshGrid] 请求第 ${page} 页, 每页 ${pageSize} 条`);

            fetch('/new/api/ks_inquiry/records?' + new URLSearchParams(params))
                .then(response => response.json())
                .then(data => {
                    if (data.code === 0 || data.code === '0') {
                        currentData = data.data.list;
                        totalRecords = data.data.total;
                        gridApi.setRowData(currentData);

                        console.log(`[refreshGrid] 总条数: ${totalRecords}, 当前页: ${data.data.page}, 返回 ${currentData.length} 条`);

                        // 更新分页信息
                        updatePaginationInfo();
                    }
                })
                .catch(error => {
                    console.error('请求失败:', error);
                });
        }


    </script>
</body>
</html>
