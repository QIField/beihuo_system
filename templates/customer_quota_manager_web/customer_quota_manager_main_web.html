<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>客户额度管理系统</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='layui/css/layui.css') }}">
</head>
<body class="layui-layout-body">
  <div class="layui-layout layui-layout-admin">
    <!-- 侧边导航 -->
    <div class="layui-side layui-bg-black">
      <div class="layui-side-scroll">
        <ul class="layui-nav layui-nav-tree" lay-filter="side-nav">
          <li class="layui-nav-item"><a href="#/customer_quota">客户额度管理</a></li>
          <li class="layui-nav-item"><a href="#/unpaid_customer">未付款客户</a></li>
          <li class="layui-nav-item"><a href="#/expected_unpaid_customers">逾期未付款客户</a></li>
          <li class="layui-nav-item"><a href="#/display_unpaid_customer_limit">未付款客户额度展示</a></li>
          <li class="layui-nav-item"><a href="#/transaction_sum">客户交易金额汇总</a></li>
          <li class="layui-nav-item"><a href="#/customer_quota_settings">应收单数据导入</a></li>
        </ul>
      </div>
    </div>

    <!-- 主内容区（路由视图出口） -->
    <div class="layui-body" id="main-view" style="padding: 15px;">
      <!-- 页面内容动态加载 -->
    </div>
  </div>

  <script src="{{ url_for('static', filename='layui/layui.js') }}"></script>
  <script>
  layui.use(['jquery', 'layer', 'table', 'form', 'dropdown'], function(){
    const $ = layui.jquery;

    // 1. 路由表按需实际情况填写
    const routes = {
      '/unpaid_customer': 'unpaid_customer',
      '/expected_unpaid_customers': 'expected_unpaid_customers',
      '/display_unpaid_customer_limit': 'display_unpaid_customer_limit',
      '/transaction_sum': 'transaction_sum',
      '/customer_quota' : 'customer_quota',
      '/customer_quota_settings': 'customer_quota_settings'
    };

    // 2. 渲染视图函数
    function renderView() {
      const hash = location.hash.replace('#', '') || '/home';
      const url = routes[hash];
      if (!url) {
        $('#main-view').html('<div>404 页面不存在</div>');
        return;
      }
      // 加载HTML片段
      $('#main-view').load(url, function(response, status, xhr) {
        if (status === 'error') {
          $('#main-view').html('<div>页面加载失败: ' + xhr.status + ' ' + xhr.statusText + '</div>');
        }
      });
    }

    // 3. 监听hash变化
    window.addEventListener('hashchange', renderView);
    renderView(); // 首次加载
  });
  </script>
</body>
</html>
