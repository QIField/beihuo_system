<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BB配件库 - 配件详情查询</title>
  <link rel="stylesheet" href="/static/layui/css/layui.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f0f2f5;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      background: #fff;
      padding: 20px 24px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .header-title {
      font-size: 24px;
      font-weight: 600;
      color: #262626;
    }

    .header-subtitle {
      font-size: 14px;
      color: #8c8c8c;
      margin-top: 4px;
    }

    .search-panel {
      background: #fff;
      padding: 20px 24px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .search-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .search-item label {
      font-size: 14px;
      color: #595959;
      margin-right: 8px;
      white-space: nowrap;
    }

    .search-item input {
      width: 300px;
      padding: 8px 12px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      font-size: 14px;
      transition: all 0.3s;
    }

    .search-item input:focus {
      outline: none;
      border-color: #1890ff;
      box-shadow: 0 0 0 2px rgba(24,144,255,0.2);
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: #1890ff;
      color: #fff;
    }

    .btn-primary:hover {
      background: #40a9ff;
    }

    .btn-success {
      background: #52c41a;
      color: #fff;
    }

    .btn-success:hover {
      background: #73d13d;
    }

    .btn-default {
      background: #fff;
      color: #595959;
      border: 1px solid #d9d9d9;
    }

    .btn-default:hover {
      color: #40a9ff;
      border-color: #40a9ff;
    }

    .detail-card {
      background: #fff;
      border: 1px solid #f0f0f0;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .detail-card-title {
      font-size: 16px;
      font-weight: 600;
      color: #262626;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #1890ff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .detail-card-title i {
      color: #1890ff;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .info-item {
      display: flex;
      padding: 8px 12px;
      background: #fafafa;
      border-radius: 4px;
      border-left: 3px solid #1890ff;
    }

    .info-label {
      color: #8c8c8c;
      font-size: 13px;
      white-space: nowrap;
      min-width: 100px;
    }

    .info-value {
      color: #262626;
      font-size: 13px;
      font-weight: 500;
      word-break: break-all;
    }

    .price-value {
      color: #ff5722;
      font-weight: 600;
    }

    .stock-positive {
      color: #52c41a;
      font-weight: 600;
    }

    .stock-empty {
      text-align: center;
      color: #999;
      padding: 80px 30px 30px;
      font-size: 14px;
    }

    .warehouse-table {
      width: 100%;
    }

    .warehouse-table th {
      background: #f0f7ff;
      color: #1890ff;
      font-weight: 600;
      text-align: center;
    }

    .warehouse-table td {
      text-align: center;
    }

    .detail-header {
      background: linear-gradient(135deg, #1890ff 0%, #096dd9 100%);
      color: #fff;
      padding: 24px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(24,144,255,0.3);
    }

    .detail-header h2 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #fff;
    }

    .detail-header .part-number {
      font-size: 16px;
      opacity: 0.95;
      margin-bottom: 12px;
      font-family: Consolas, Monaco, monospace;
    }

    .detail-header .meta {
      display: flex;
      gap: 20px;
      font-size: 13px;
      opacity: 0.9;
      flex-wrap: wrap;
    }

    .detail-header .price-box {
      display: flex;
      gap: 30px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.2);
    }

    .price-item {
      text-align: center;
    }

    .price-item-label {
      font-size: 12px;
      opacity: 0.85;
      margin-bottom: 4px;
    }

    .price-item-value {
      font-size: 20px;
      font-weight: 700;
      font-family: Consolas, Monaco, monospace;
    }

    .empty-state {
      background: #fff;
      border-radius: 8px;
      padding: 80px 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .empty-state i {
      font-size: 60px;
      color: #d9d9d9;
    }

    .empty-state p {
      margin-top: 20px;
      color: #8c8c8c;
      font-size: 16px;
    }

    .loading-state {
      text-align: center;
      padding: 80px;
    }

    .loading-state i {
      font-size: 40px;
      color: #1890ff;
    }

    .loading-state p {
      margin-top: 20px;
      color: #595959;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <div class="header-title">BB配件库 - 配件详情查询</div>
        <div class="header-subtitle">BB零件号精确查询</div>
      </div>
    </div>

    <div class="search-panel">
      <div class="search-row">
        <div class="search-item">
          <label>配件编号：</label>
          <input type="text" id="partNumber" placeholder="请输入配件编号（OE号），精确匹配" autocomplete="off" />
        </div>
        <div class="search-item">
          <button class="btn btn-primary" id="searchBtn">
            <i class="layui-icon layui-icon-search"></i> 查询
          </button>
          <button class="btn btn-success" id="addFavoriteBtn">
            <i class="layui-icon layui-icon-star"></i> 添加收藏
          </button>
          <button class="btn btn-default" id="viewFavoritesBtn">
            <i class="layui-icon layui-icon-star-fill"></i> 查看收藏
          </button>
          <button class="btn btn-default" id="resetBtn">
            <i class="layui-icon layui-icon-refresh"></i> 重置
          </button>
          <button class="btn btn-default" id="backBtn">
            <a href="/web/car_parts_library/bmw" >返回列表</a>
          </button>
        </div>
      </div>
    </div>

    <div id="detailContainer">
      <div class="empty-state">
        <i class="layui-icon layui-icon-search"></i>
        <p>请在上方输入配件编号后点击"查询"按钮</p>
      </div>
    </div>
  </div>

  <!-- 收藏列表弹窗模板 -->
  <script type="text/html" id="favoritesTemplate">
    <div style="padding: 20px;">
      <div style="margin-bottom: 20px;">
        <div class="layui-inline" style="margin-right: 10px;">
          <label class="layui-form-label">分类筛选</label>
          <div class="layui-input-inline" style="width: auto;">
            <button class="layui-btn layui-btn-primary" id="favoritesCategoryBtn">
              <span>宝马主收藏</span>
              <i class="layui-icon layui-icon-down layui-font-12"></i>
            </button>
          </div>
        </div>
        <div class="layui-inline" style="margin-left: 20px;">
          <button class="layui-btn layui-btn-primary layui-btn-sm" id="saveFavoriteColumnConfigBtn">
            <i class="layui-icon layui-icon-save"></i> 保存收藏列配置
          </button>
          <button class="layui-btn layui-btn-primary layui-btn-sm" id="resetFavoriteColumnConfigBtn">
            <i class="layui-icon layui-icon-refresh"></i> 重置收藏列配置
          </button>
        </div>
      </div>
      <table id="favoritesTable" lay-filter="favoritesTable"></table>
    </div>
  </script>

  <!-- 收藏列表头部工具栏模板 -->
  <script type="text/html" id="favoritesTableToolBar">
    <div class="layui-btn-container">
      <button class="layui-btn layui-btn-sm layui-btn-normal" lay-event="batchMoveToMain">
        <i class="layui-icon layui-icon-transfer"></i> 移动到BB主收藏
      </button>
      <button class="layui-btn layui-btn-sm layui-btn-primary" lay-event="batchCopyToMain">
        <i class="layui-icon layui-icon-template"></i> 复制到BB主收藏
      </button>
      <button class="layui-btn layui-btn-sm layui-btn-warm" lay-event="batchRefreshFavorite">
        <i class="layui-icon layui-icon-refresh"></i> 更新选中数据
      </button>
      <button class="layui-btn layui-btn-sm layui-btn-danger" lay-event="batchRemoveFavorite">
        <i class="layui-icon layui-icon-close"></i> 批量删除
      </button>
      <button class="layui-btn layui-btn-sm layui-btn-danger" lay-event="clearCategoryFavorites">
        <i class="layui-icon layui-icon-delete"></i> 清空当前分类
      </button>
    </div>
  </script>

  <!-- 收藏列表操作列模板 -->
  <script type="text/html" id="favoritesRowToolBar">
    <div class="action-btns">
      <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="removeFavorite">
        <i class="layui-icon layui-icon-close"></i> 删除
      </a>
    </div>
  </script>

  <script src="/static/layui/layui.js"></script>
  <script>
  layui.use(['jquery', 'layer', 'table', 'form', 'dropdown'], function() {
    var $ = layui.jquery;
    var layer = layui.layer;
    var table = layui.table;
    var form = layui.form;
    var dropdown = layui.dropdown;

    // 内部状态变量
    var state = {
      currentData: null,
      favoriteTableIns: null,
      favoriteCategory: '宝马主收藏',
      favoriteColumnConfig: null,
      favoriteColumnOrder: null
    };

    // ==================== 工具函数 ====================
    function emptyVal(val) {
      return val ? val : '-';
    }

    function formatPrice(val) {
      if (val === undefined || val === null || val === '') return '-';
      var num = Number(val);
      if (isNaN(num)) return '-';
      return num.toFixed(2);
    }

    // ==================== 列配置管理 ====================
    function loadColumnConfig(callback) {
      $.ajax({
        url: '/new/api/car-parts/bmw/get-column-config',
        method: 'GET',
        success: function(res) {
          if (res.code === 200 && res.data) {
            if (res.data.favorite_column_config) {
              state.favoriteColumnConfig = res.data.favorite_column_config;
            }
            if (res.data.favorite_column_order) {
              state.favoriteColumnOrder = res.data.favorite_column_order;
            }
          }
          if (callback) callback();
        },
        error: function() {
          if (callback) callback();
        }
      });
    }

    function saveFavoriteColumnConfig(columnConfig, columnOrder, callback) {
      if (typeof columnOrder === 'function') {
        callback = columnOrder;
        columnOrder = null;
      }
      var requestData = { favorite_column_config: columnConfig };
      if (columnOrder) {
        requestData.favorite_column_order = columnOrder;
      }
      $.ajax({
        url: '/new/api/car-parts/bmw/set-column-config',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(requestData),
        success: function(saveRes) {
          if (saveRes.code === 200) {
            state.favoriteColumnConfig = columnConfig;
            if (columnOrder) {
              state.favoriteColumnOrder = columnOrder;
            }
            layer.msg('列配置保存成功', { icon: 1 });
          } else {
            layer.msg('列配置保存失败: ' + (saveRes.msg || '未知错误'), { icon: 2 });
          }
          if (callback) callback(saveRes);
        },
        error: function() {
          layer.msg('保存列配置失败，请稍后重试', { icon: 2 });
          if (callback) callback();
        }
      });
    }

    function extractFavoriteColumnConfig() {
      if (!state.favoriteTableIns || !state.favoriteTableIns.config || !state.favoriteTableIns.config.cols) {
        return null;
      }
      var cols = state.favoriteTableIns.config.cols[0];
      var config = {};
      cols.forEach(function(col) {
        if (col.field) {
          config[col.field] = {
            hide: col.hide || false,
            width: col.width
          };
        }
      });
      return config;
    }

    function extractColumnOrder(tableIns) {
      if (!tableIns || !tableIns.config || !tableIns.config.cols) {
        return null;
      }
      var cols = tableIns.config.cols[0];
      var order = [];
      cols.forEach(function(col) {
        if (col.field || col.type) {
          order.push(col.field || col.type);
        }
      });
      return order;
    }

    function applyColumnConfig(columns, config, order) {
      var result = columns;
      if (config) {
        result = result.map(function(col) {
          if (!col.field) return col;
          var colConfig = config[col.field];
          if (colConfig) {
            return $.extend({}, col, colConfig);
          }
          return col;
        });
      }
      if (order && order.length > 0) {
        var sorted = [];
        var remaining = result.slice();
        order.forEach(function(key) {
          for (var i = 0; i < remaining.length; i++) {
            var col = remaining[i];
            var colKey = col.field || col.type;
            if (colKey === key) {
              sorted.push(col);
              remaining.splice(i, 1);
              break;
            }
          }
        });
        result = sorted.concat(remaining);
      }
      return result;
    }

    // ==================== 详情渲染 ====================
    function renderDetail(data) {
      var formattedData = {
        part_number: emptyVal(data.part_number),
        part_name: emptyVal(data.part_name),
        sales_unit: emptyVal(data.sales_unit),
        material_group: emptyVal(data.material_group),
        gross_weight: emptyVal(data.gross_weight),
        net_weight: emptyVal(data.net_weight),
        volume: emptyVal(data.volume),
        retail_price: emptyVal(data.retail_price),
        price_4s_tax_in: formatPrice(data.price_4s_tax_in),
        discount_stock: emptyVal(data.discount_stock),
        discount_rush: emptyVal(data.discount_rush),
        dealer_net_stock: emptyVal(data.dealer_net_stock),
        dealer_net_rush: emptyVal(data.dealer_net_rush),
        available_stock: emptyVal(data.available_stock),
        data_collect_time: emptyVal(data.data_collect_time),
        data_source: (function() {
          var source = data.data_source;
          if (source === 'dwp.bmw-brilliance.cn') return '线路一';
          if (source === 'zhaopeiyun.com') return '线路二';
          return emptyVal(source);
        })(),
        updated_at: data.updated_at ? new Date(data.updated_at).toLocaleString('zh-CN') : '-',
        stock_info: data.stock_info || null,
      };

      var hasStockInfo = formattedData.stock_info ? true : false;
      var si = formattedData.stock_info || {};

      var html =
        '<div class="detail-header">' +
          '<h2>' + formattedData.part_name + '</h2>' +
          '<div class="part-number">配件编号：' + formattedData.part_number + '</div>' +
          '<div class="meta">' +
            '<span>销售单位：' + formattedData.sales_unit + '</span>' +
            '<span>物料组：' + formattedData.material_group + '</span>' +
            '<span>采集时间：' + formattedData.data_collect_time + '</span>' +
          '</div>' +
          '<div class="price-box">' +
            '<div class="price-item">' +
              '<div class="price-item-label">零售价</div>' +
              '<div class="price-item-value">' + formattedData.retail_price + '</div>' +
            '</div>' +
            '<div class="price-item">' +
              '<div class="price-item-label">4S含税进价</div>' +
              '<div class="price-item-value">' + formattedData.price_4s_tax_in + '</div>' +
            '</div>' +
            '<div class="price-item">' +
              '<div class="price-item-label">经销商净值(Stock)</div>' +
              '<div class="price-item-value">' + formattedData.dealer_net_stock + '</div>' +
            '</div>' +
            '<div class="price-item">' +
              '<div class="price-item-label">经销商净值(Rush)</div>' +
              '<div class="price-item-value">' + formattedData.dealer_net_rush + '</div>' +
            '</div>' +
            '<div class="price-item">' +
              '<div class="price-item-label">可用库存</div>' +
              '<div class="price-item-value">' + formattedData.available_stock + '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="detail-card">' +
          '<div class="detail-card-title">' +
            '<i class="layui-icon layui-icon-form"></i>基本信息' +
          '</div>' +
          '<div class="info-grid">' +
            '<div class="info-item"><div class="info-label">配件编号：</div><div class="info-value">' + formattedData.part_number + '</div></div>' +
            '<div class="info-item"><div class="info-label">零件名称：</div><div class="info-value">' + formattedData.part_name + '</div></div>' +
            '<div class="info-item"><div class="info-label">销售单位：</div><div class="info-value">' + formattedData.sales_unit + '</div></div>' +
            '<div class="info-item"><div class="info-label">物料组：</div><div class="info-value">' + formattedData.material_group + '</div></div>' +
            '<div class="info-item"><div class="info-label">毛重：</div><div class="info-value">' + formattedData.gross_weight + '</div></div>' +
            '<div class="info-item"><div class="info-label">净重：</div><div class="info-value">' + formattedData.net_weight + '</div></div>' +
            '<div class="info-item"><div class="info-label">体积：</div><div class="info-value">' + formattedData.volume + '</div></div>' +
            '<div class="info-item"><div class="info-label">采集时间：</div><div class="info-value">' + formattedData.data_collect_time + '</div></div>' +
            '<div class="info-item"><div class="info-label">数据来源：</div><div class="info-value">' + formattedData.data_source + '</div></div>' +
            '<div class="info-item"><div class="info-label">更新时间：</div><div class="info-value">' + formattedData.updated_at + '</div></div>' +
          '</div>' +
        '</div>' +

        '<div class="detail-card">' +
          '<div class="detail-card-title">' +
            '<i class="layui-icon layui-icon-rmb"></i>价格与折扣信息' +
          '</div>' +
          '<div class="info-grid">' +
            '<div class="info-item"><div class="info-label">零售价：</div><div class="info-value price-value">' + formattedData.retail_price + '</div></div>' +
            '<div class="info-item"><div class="info-label">4S含税进价：</div><div class="info-value price-value">' + formattedData.price_4s_tax_in + '</div></div>' +
            '<div class="info-item"><div class="info-label">折扣(Stock)：</div><div class="info-value">' + formattedData.discount_stock + '</div></div>' +
            '<div class="info-item"><div class="info-label">折扣(Rush)：</div><div class="info-value">' + formattedData.discount_rush + '</div></div>' +
            '<div class="info-item"><div class="info-label">经销商净值(Stock)：</div><div class="info-value price-value">' + formattedData.dealer_net_stock + '</div></div>' +
            '<div class="info-item"><div class="info-label">经销商净值(Rush)：</div><div class="info-value price-value">' + formattedData.dealer_net_rush + '</div></div>' +
            '<div class="info-item"><div class="info-label">可用库存：</div><div class="info-value stock-positive">' + formattedData.available_stock + '</div></div>' +
          '</div>' +
        '</div>' +

        '<div class="detail-card">' +
          '<div class="detail-card-title">' +
            '<i class="layui-icon layui-icon-location"></i>多仓库库存详情' +
          '</div>';

      if (hasStockInfo) {
        html +=
          '<table class="layui-table warehouse-table" lay-skin="line">' +
            '<thead><tr><th>仓库</th><th>库房数量</th><th>在途数量</th><th>再定购点</th><th>主仓数量</th></tr></thead>' +
            '<tbody>' +
              '<tr><td style="font-weight:600;color:#1890ff;">北京</td><td>' + emptyVal(si.warehouse_beijing) + '</td><td>' + emptyVal(si.in_transit_beijing) + '</td><td>' + emptyVal(si.reorder_point_beijing) + '</td><td>' + emptyVal(si.main_warehouse_beijing) + '</td></tr>' +
              '<tr><td style="font-weight:600;color:#1890ff;">上海</td><td>' + emptyVal(si.warehouse_shanghai) + '</td><td>' + emptyVal(si.in_transit_shanghai) + '</td><td>' + emptyVal(si.reorder_point_shanghai) + '</td><td>' + emptyVal(si.main_warehouse_shanghai) + '</td></tr>' +
              '<tr><td style="font-weight:600;color:#1890ff;">佛山</td><td>' + emptyVal(si.warehouse_foshan) + '</td><td>' + emptyVal(si.in_transit_foshan) + '</td><td>' + emptyVal(si.reorder_point_foshan) + '</td><td>' + emptyVal(si.main_warehouse_foshan) + '</td></tr>' +
              '<tr><td style="font-weight:600;color:#1890ff;">成都</td><td>' + emptyVal(si.warehouse_chengdu) + '</td><td>' + emptyVal(si.in_transit_chengdu) + '</td><td>' + emptyVal(si.reorder_point_chengdu) + '</td><td>' + emptyVal(si.main_warehouse_chengdu) + '</td></tr>' +
              '<tr><td style="font-weight:600;color:#1890ff;">沈阳</td><td>' + emptyVal(si.warehouse_shenyang) + '</td><td>' + emptyVal(si.in_transit_shenyang) + '</td><td>' + emptyVal(si.reorder_point_shenyang) + '</td><td>' + emptyVal(si.main_warehouse_shenyang) + '</td></tr>' +
              '<tr><td style="font-weight:600;color:#1890ff;">合肥</td><td>' + emptyVal(si.warehouse_hefei) + '</td><td>' + emptyVal(si.in_transit_hefei) + '</td><td>' + emptyVal(si.reorder_point_hefei) + '</td><td>' + emptyVal(si.main_warehouse_hefei) + '</td></tr>' +
              '<tr><td style="font-weight:600;color:#1890ff;">宁波</td><td>' + emptyVal(si.warehouse_ningbo) + '</td><td>' + emptyVal(si.in_transit_ningbo) + '</td><td>' + emptyVal(si.reorder_point_ningbo) + '</td><td>' + emptyVal(si.main_warehouse_ningbo) + '</td></tr>' +
            '</tbody>' +
          '</table>';
      } else {
        html += '<div class="stock-empty">暂无库存信息</div>';
      }

      html += '</div>';

      $('#detailContainer').html(html);
    }

    function showEmpty(msg) {
      $('#detailContainer').html(
        '<div class="empty-state">' +
          '<i class="layui-icon layui-icon-face-cry"></i>' +
          '<p>' + msg + '</p>' +
        '</div>'
      );
    }

    function showLoading() {
      $('#detailContainer').html(
        '<div class="detail-card loading-state">' +
          '<i class="layui-icon layui-icon-loading-1" style="animation:layui-anim-rotate 1s linear infinite;"></i>' +
          '<p>正在查询中，请稍候...</p>' +
        '</div>'
      );
    }

    // ==================== 查询 ====================
    function doSearch() {
      var partNumber = $.trim($('#partNumber').val());
      if (!partNumber) {
        layer.msg('请输入配件编号', { icon: 0 });
        $('#partNumber').focus();
        return;
      }

      showLoading();

      $.ajax({
        url: '/new/api/car-parts/bmw/detail',
        method: 'GET',
        data: { part_number: partNumber },
        success: function(res) {
          if (res.code === 200 && res.data) {
            state.currentData = res.data;
            renderDetail(res.data);
          } else if (res.code === 404) {
            state.currentData = null;
            showEmpty('未查询到编号为 "' + partNumber + '" 的配件');
          } else {
            state.currentData = null;
            showEmpty(res.msg || '查询失败');
          }
        },
        error: function(xhr, status, error) {
          state.currentData = null;
          showEmpty('网络请求失败：' + error);
        }
      });
    }

    // ==================== 添加收藏 ====================
    function addToFavorites(partNumbers) {
      if (!partNumbers || partNumbers.length === 0) {
        layer.msg('没有可添加的配件编号', { icon: 0 });
        return;
      }
      var category = '宝马主收藏';
      var countText = partNumbers.length + ' 个配件';

      layer.confirm('确定要将 ' + countText + ' 添加到"' + category + '"吗？', {
        btn: ['确定', '取消'],
        icon: 3,
        title: '添加到收藏'
      }, function(index) {
        layer.close(index);
        var loadingIdx = layer.load(1, { shade: [0.3, '#000'], content: '正在添加收藏...' });

        $.ajax({
          url: '/new/api/car-parts/add-bmw-favorites',
          method: 'POST',
          contentType: 'application/json',
          data: JSON.stringify({
            part_numbers: partNumbers,
            category: category
          }),
          success: function(res) {
            layer.close(loadingIdx);
            if (res.code === 200) {
              layer.msg(res.msg || '添加收藏成功', { icon: 1 });
            } else {
              layer.msg(res.msg || '添加收藏失败', { icon: 2 });
            }
          },
          error: function(xhr, status, error) {
            layer.close(loadingIdx);
            layer.msg('请求失败: ' + error, { icon: 2 });
          }
        });
      });
    }

    // ==================== 查看收藏 ====================
    function openFavorites() {
      var getTpl = document.getElementById('favoritesTemplate').innerHTML;
      layer.open({
        type: 1,
        title: '我的收藏 - ' + state.favoriteCategory,
        area: ['1200px', '700px'],
        content: getTpl,
        success: function(layero, index) {
          // 加载收藏分类列表
          $.ajax({
            url: '/new/api/car-parts/get-bmw-categories',
            method: 'GET',
            success: function(res) {
              if (res.code === 200 && res.data && res.data.categories) {
                var bmwCategories = res.data.categories;
                var categories = bmwCategories.length > 0 ? bmwCategories : ['宝马主收藏'];

                var dropdownData = categories.map(function(cat) {
                  return { title: cat, id: cat };
                });

                var defaultCategory = '宝马主收藏';
                if (categories.indexOf(defaultCategory) === -1) {
                  categories.unshift(defaultCategory);
                  dropdownData.unshift({ title: defaultCategory, id: defaultCategory });
                }

                dropdown.render({
                  elem: layero.find('#favoritesCategoryBtn'),
                  data: dropdownData,
                  click: function(data) {
                    state.favoriteCategory = data.id;
                    layero.find('#favoritesCategoryBtn span').text(data.title);
                    table.reload('favoritesTable', {
                      where: { category: state.favoriteCategory },
                      page: { curr: 1 }
                    });
                    layer.title('我的收藏 - ' + data.title, index);
                  }
                });
              }
              renderFavoriteTable();
            },
            error: function() {
              renderFavoriteTable();
            }
          });

          function renderFavoriteTable() {
            var defaultFavoriteColumns = [
              { type: 'checkbox', fixed: 'left', width: 50 },
              { field: 'part_number', title: '配件编号', width: 200, fixed: 'left', templet: function(d) {
                return '<a href="javascript:;" style="color:#1890ff;font-weight:600;" class="view-detail-link" data-part="' + d.part_number + '">' + d.part_number + '</a>';
              }},
              { field: 'part_name', title: '零件名称', width: 250, templet: function(d) {
                return emptyVal(d.part_name);
              }},
              { field: 'retail_price', title: '零售价', width: 120, templet: function(d) {
                return '<span style="color:#ff5722;font-weight:600;">' + emptyVal(d.retail_price) + '</span>';
              }},
              { field: 'price_4s_tax_in', title: '4S含税进价', width: 130, templet: function(d) {
                return '<span style="color:#ff9800;font-weight:600;">' + formatPrice(d.price_4s_tax_in) + '</span>';
              }},
              { field: 'dealer_net_stock', title: '经销商净值(Stock)', width: 160, templet: function(d) {
                return '<span style="color:#ff5722;font-weight:600;">' + emptyVal(d.dealer_net_stock) + '</span>';
              }},
              { field: 'available_stock', title: '可用库存', width: 120, templet: function(d) {
                return '<span style="color:#52c41a;font-weight:600;">' + emptyVal(d.available_stock) + '</span>';
              }},
              { field: 'data_source', title: '数据来源', width: 100, templet: function(d) {
                var source = d.data_source;
                if (source === 'dwp.bmw-brilliance.cn') return '<span style="color:#52c41a;font-weight:600;">线路一</span>';
                if (source === 'zhaopeiyun.com') return '<span style="color:#1890ff;font-weight:600;">线路二</span>';
                return emptyVal(source);
              }},
              { field: 'favorite_created_at', title: '收藏时间', width: 180, templet: function(d) {
                if (!d.favorite_created_at) return '-';
                return new Date(d.favorite_created_at).toLocaleString('zh-CN');
              }},
              { title: '操作', width: 120, fixed: 'right', toolbar: '#favoritesRowToolBar', align: 'center' }
            ];

            var favoriteColumns = applyColumnConfig(defaultFavoriteColumns, state.favoriteColumnConfig, state.favoriteColumnOrder);

            state.favoriteTableIns = table.render({
              elem: '#favoritesTable',
              url: '/new/api/car-parts/get-bmw-favorites',
              method: 'get',
              where: { category: state.favoriteCategory },
              page: true,
              limit: 20,
              limits: [10, 20, 50, 100],
              height: 'full-220',
              cols: [favoriteColumns],
              toolbar: '#favoritesTableToolBar',
              defaultToolbar: ['filter', 'exports'],
              parseData: function(res) {
                if (res.code === 200 && res.data && res.data.status) {
                  return {
                    code: 0,
                    msg: res.data.msg,
                    count: res.data.count,
                    data: res.data.data || []
                  };
                } else {
                  return {
                    code: 0,
                    msg: res.msg || '查询成功',
                    count: 0,
                    data: []
                  };
                }
              }
            });

            // 收藏表格工具栏事件
            table.on('toolbar(favoritesTable)', function(obj) {
              var checkStatus = table.checkStatus(obj.config.id);
              var selectedData = checkStatus.data;

              switch(obj.event) {
                case 'batchMoveToMain':
                  if (selectedData.length === 0) {
                    layer.msg('请先选择要移动的收藏', { icon: 0 });
                    return;
                  }
                  var movePartNumbers = selectedData.map(function(item) { return item.part_number; });
                  layer.confirm('确定要将选中的 ' + movePartNumbers.length + ' 个收藏移动到宝马主收藏吗？', {
                    icon: 3, title: '确认移动'
                  }, function(confirmIndex) {
                    layer.close(confirmIndex);
                    var loadingIdx = layer.load(1, { shade: [0.3, '#000'], content: '正在移动...' });
                    var requestData = { part_numbers: movePartNumbers };
                    if (state.favoriteCategory && state.favoriteCategory !== '宝马主收藏') {
                      requestData.source_category = state.favoriteCategory;
                    }
                    $.ajax({
                      url: '/new/api/car-parts/move-bmw-to-main',
                      method: 'POST',
                      contentType: 'application/json',
                      data: JSON.stringify(requestData),
                      success: function(res) {
                        layer.close(loadingIdx);
                        if (res.code === 200) {
                          layer.msg(res.msg || '移动成功', { icon: 1 });
                          table.reload('favoritesTable');
                        } else {
                          layer.msg(res.msg || '移动失败', { icon: 2 });
                        }
                      },
                      error: function(xhr, status, error) {
                        layer.close(loadingIdx);
                        layer.msg('请求失败: ' + error, { icon: 2 });
                      }
                    });
                  });
                  break;

                case 'batchCopyToMain':
                  if (selectedData.length === 0) {
                    layer.msg('请先选择要复制的收藏', { icon: 0 });
                    return;
                  }
                  var copyPartNumbers = selectedData.map(function(item) { return item.part_number; });
                  layer.confirm('确定要将选中的 ' + copyPartNumbers.length + ' 个收藏复制到宝马主收藏吗？（原分类保留）', {
                    icon: 3, title: '确认复制'
                  }, function(confirmIndex) {
                    layer.close(confirmIndex);
                    var loadingIdx = layer.load(1, { shade: [0.3, '#000'], content: '正在复制...' });
                    $.ajax({
                      url: '/new/api/car-parts/copy-bmw-to-main',
                      method: 'POST',
                      contentType: 'application/json',
                      data: JSON.stringify({ part_numbers: copyPartNumbers }),
                      success: function(res) {
                        layer.close(loadingIdx);
                        if (res.code === 200) {
                          layer.msg(res.msg || '复制成功', { icon: 1 });
                          table.reload('favoritesTable');
                        } else {
                          layer.msg(res.msg || '复制失败', { icon: 2 });
                        }
                      },
                      error: function(xhr, status, error) {
                        layer.close(loadingIdx);
                        layer.msg('请求失败: ' + error, { icon: 2 });
                      }
                    });
                  });
                  break;

                case 'batchRefreshFavorite':
                  if (selectedData.length === 0) {
                    layer.msg('请先选择要更新的数据', { icon: 0 });
                    return;
                  }
                  batchRefreshParts(selectedData);
                  break;

                case 'batchRemoveFavorite':
                  if (selectedData.length === 0) {
                    layer.msg('请先选择要删除的收藏', { icon: 0 });
                    return;
                  }
                  var rmPartNumbers = selectedData.map(function(item) { return item.part_number; });
                  layer.confirm('确定要删除选中的 ' + rmPartNumbers.length + ' 个收藏吗？', {
                    icon: 3, title: '确认删除'
                  }, function(confirmIndex) {
                    layer.close(confirmIndex);
                    var loadingIdx = layer.load(1, { shade: [0.3, '#000'], content: '正在删除...' });
                    $.ajax({
                      url: '/new/api/car-parts/remove-bmw-favorites',
                      method: 'POST',
                      contentType: 'application/json',
                      data: JSON.stringify({
                        part_numbers: rmPartNumbers,
                        category: state.favoriteCategory
                      }),
                      success: function(res) {
                        layer.close(loadingIdx);
                        if (res.code === 200) {
                          layer.msg(res.msg || '删除成功', { icon: 1 });
                          table.reload('favoritesTable');
                        } else {
                          layer.msg(res.msg || '删除失败', { icon: 2 });
                        }
                      },
                      error: function(xhr, status, error) {
                        layer.close(loadingIdx);
                        layer.msg('请求失败: ' + error, { icon: 2 });
                      }
                    });
                  });
                  break;

                case 'clearCategoryFavorites':
                  layer.confirm('确定要清空"' + state.favoriteCategory + '"分类下的所有收藏吗？此操作不可恢复！', {
                    icon: 3, title: '确认清空'
                  }, function(confirmIndex) {
                    layer.close(confirmIndex);
                    var loadingIdx = layer.load(1, { shade: [0.3, '#000'], content: '正在清空...' });
                    $.ajax({
                      url: '/new/api/car-parts/clear-bmw-category',
                      method: 'POST',
                      contentType: 'application/json',
                      data: JSON.stringify({ category: state.favoriteCategory }),
                      success: function(res) {
                        layer.close(loadingIdx);
                        if (res.code === 200) {
                          layer.msg(res.msg || '清空成功', { icon: 1 });
                          table.reload('favoritesTable');
                        } else {
                          layer.msg(res.msg || '清空失败', { icon: 2 });
                        }
                      },
                      error: function(xhr, status, error) {
                        layer.close(loadingIdx);
                        layer.msg('请求失败: ' + error, { icon: 2 });
                      }
                    });
                  });
                  break;
              }
            });

            // 收藏表格行事件
            table.on('tool(favoritesTable)', function(obj) {
              var data = obj.data;
              if (obj.event === 'removeFavorite') {
                layer.confirm('确定要从收藏中删除配件 ' + data.part_number + ' 吗？', {
                  icon: 3, title: '确认删除'
                }, function(confirmIndex) {
                  layer.close(confirmIndex);
                  var loadingIdx = layer.load(1, { shade: [0.3, '#000'], content: '正在删除...' });
                  $.ajax({
                    url: '/new/api/car-parts/remove-bmw-favorites',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                      part_numbers: [data.part_number],
                      category: state.favoriteCategory
                    }),
                    success: function(res) {
                      layer.close(loadingIdx);
                      if (res.code === 200) {
                        layer.msg(res.msg || '删除成功', { icon: 1 });
                        table.reload('favoritesTable');
                      } else {
                        layer.msg(res.msg || '删除失败', { icon: 2 });
                      }
                    },
                    error: function(xhr, status, error) {
                      layer.close(loadingIdx);
                      layer.msg('请求失败: ' + error, { icon: 2 });
                    }
                  });
                });
              }
            });

            // 收藏表格配件编号点击事件
            $(document).off('click', '#favoritesTable .view-detail-link').on('click', '#favoritesTable .view-detail-link', function() {
              var partNumber = $(this).data('part');
              if (partNumber) {
                $('#partNumber').val(partNumber);
                layer.closeAll();
                doSearch();
              }
            });
          }
        }
      });
    }

    // ==================== 批量刷新数据 ====================
    function batchRefreshParts(selectedData) {
      var partNumbers = selectedData.map(function(item) {
        return item.part_number;
      });

      layer.confirm('确定要更新以下 ' + partNumbers.length + ' 个配件数据吗？<br><br><span style="color:#1890ff;font-family:Consolas,monospace;">' +
        partNumbers.slice(0, 5).join(', ') + (partNumbers.length > 5 ? '...' : '') + '</span>', {
        icon: 3,
        title: '确认更新'
      }, function(index) {
        layer.close(index);

        var loadingIdx = layer.load(2, {
          shade: [0.1, '#000'],
          content: '正在爬取并更新数据...'
        });

        $.ajax({
          url: '/new/api/car-parts/bmw/batch-refresh',
          method: 'POST',
          contentType: 'application/json',
          data: JSON.stringify({
            part_numbers: partNumbers
          }),
          success: function(res) {
            layer.close(loadingIdx);
            if (res.code === 200) {
              layer.msg('数据更新完成: ' + (res.data && res.data.msg ? res.data.msg : '成功'), { icon: 1 });
              setTimeout(function() {
                if (state.favoriteTableIns) {
                  table.reload('favoritesTable');
                }
              }, 1000);
            } else {
              layer.msg('更新失败: ' + (res.msg || '未知错误'), { icon: 2 });
            }
          },
          error: function(xhr, status, error) {
            layer.close(loadingIdx);
            layer.msg('请求失败: ' + error, { icon: 2 });
          }
        });
      });
    }

    // ==================== DOM 事件绑定 ====================
    $('#searchBtn').on('click', doSearch);

    $('#partNumber').on('keydown', function(e) {
      if (e.keyCode === 13) {
        doSearch();
      }
    });

    $('#addFavoriteBtn').on('click', function() {
      var partNumber = $.trim($('#partNumber').val());
      if (!partNumber) {
        layer.msg('请先输入配件编号', { icon: 0 });
        $('#partNumber').focus();
        return;
      }
      if (!state.currentData) {
        layer.msg('请先查询到配件数据后再添加收藏', { icon: 0 });
        return;
      }
      addToFavorites([state.currentData.part_number]);
    });

    $('#viewFavoritesBtn').on('click', function() {
      openFavorites();
    });

    $(document).on('click', '#saveFavoriteColumnConfigBtn', function() {
      if (!state.favoriteTableIns) {
        layer.msg('请先打开收藏列表', { icon: 0 });
        return;
      }
      var columnConfig = extractFavoriteColumnConfig();
      var columnOrder = extractColumnOrder(state.favoriteTableIns);
      if (columnConfig) {
        saveFavoriteColumnConfig(columnConfig, columnOrder);
      }
    });

    $(document).on('click', '#resetFavoriteColumnConfigBtn', function() {
      layer.confirm('确定要重置收藏列表为默认列配置吗？', function(confirmIndex) {
        state.favoriteColumnConfig = null;
        state.favoriteColumnOrder = null;

        $.ajax({
          url: '/new/api/car-parts/bmw/set-column-config',
          method: 'POST',
          contentType: 'application/json',
          data: JSON.stringify({
            favorite_column_config: {},
            favorite_column_order: null
          }),
          success: function(res) {
            if (res.code === 200) {
              layer.close(confirmIndex);
              layer.msg('收藏列表列配置已重置', { icon: 1 });
              table.reload('favoritesTable');
            } else {
              layer.msg('重置失败: ' + (res.msg || '未知错误'), { icon: 2 });
            }
          },
          error: function() {
            layer.msg('重置收藏列表列配置失败，请稍后重试', { icon: 2 });
          }
        });
      });
    });

    $('#resetBtn').on('click', function() {
      $('#partNumber').val('');
      state.currentData = null;
      $('#detailContainer').html(
        '<div class="empty-state">' +
          '<i class="layui-icon layui-icon-search"></i>' +
          '<p>请在上方输入配件编号后点击"查询"按钮</p>' +
        '</div>'
      );
      $('#partNumber').focus();
    });

    loadColumnConfig();
  });
  </script>
</body>
</html>
