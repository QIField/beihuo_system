<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>BB配件库</title>
  <link rel="stylesheet" href="/static/layui/css/layui.css">
  <link rel="stylesheet" href="/static/soulTable/soulTable.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f0f2f5;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1800px;
      margin: 0 auto;
    }

    /* 头部 */
    .header {
      background: #fff;
      padding: 20px 24px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .header-title {
      font-size: 24px;
      font-weight: 600;
      color: #262626;
    }

    .header-subtitle {
      font-size: 14px;
      color: #8c8c8c;
      margin-top: 4px;
    }

    /* 标签页样式 */
    .layui-tabs {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      min-height: 700px;
    }

    .layui-tabs-header {
      padding: 0 20px;
      border-radius: 8px 8px 0 0;
      background: #f8f8f8;
      border-bottom: 1px solid #e8e8e8;
    }

    .layui-tabs-body {
      padding: 20px;
      min-height: 600px;
    }

    .layui-tabs-item {
      min-height: 600px;
    }

    .tab-content {
      min-height: 600px;
      width: 100%;
    }

    /* 搜索区域 */
    .search-panel {
      background: #fff;
      padding: 20px 24px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .search-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .search-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-item label {
      font-size: 14px;
      color: #595959;
      white-space: nowrap;
    }

    .search-item input {
      width: 200px;
      padding: 8px 12px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      font-size: 14px;
      transition: all 0.3s;
    }

    .search-item input:focus {
      outline: none;
      border-color: #1890ff;
      box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
    }

    /* 按钮 */
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: #1890ff;
      color: #fff;
    }

    .btn-primary:hover {
      background: #40a9ff;
    }

    .btn-success {
      background: #52c41a;
      color: #fff;
    }

    .btn-success:hover {
      background: #73d13d;
    }

    .btn-default {
      background: #fff;
      color: #595959;
      border: 1px solid #d9d9d9;
    }

    .btn-default:hover {
      color: #40a9ff;
      border-color: #40a9ff;
    }

    /* 主内容区 */
    .main-content {
      background: #fff;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    /* 工具栏 */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #f0f0f0;
    }

    .toolbar-left {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .toolbar-right {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* 表格样式 */
    .layui-table-view {
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      border: 1px solid #e8e8e8;
    }

    .layui-table-header {
      background-color: #fafafa;
      border-bottom: 2px solid #e8e8e8;
    }

    .layui-table th {
      font-weight: 600;
      color: #333;
      font-size: 13px;
      padding: 10px 5px;
    }

    .layui-table td {
      padding: 6px 5px;
      font-size: 13px;
      height: 36px;
      line-height: 1.5;
    }

    .layui-table tbody tr:hover {
      background-color: #f5f7fa;
    }

    /* 操作按钮组 */
    .action-btns {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    /* 详情卡片样式 */
    .detail-card {
      background: #fff;
      border: 1px solid #f0f0f0;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .detail-card-title {
      font-size: 16px;
      font-weight: 600;
      color: #262626;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #1890ff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .detail-card-title i {
      color: #1890ff;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .info-item {
      display: flex;
      padding: 8px 12px;
      background: #fafafa;
      border-radius: 4px;
      border-left: 3px solid #1890ff;
    }

    .info-label {
      color: #8c8c8c;
      font-size: 13px;
      white-space: nowrap;
      min-width: 100px;
    }

    .info-value {
      color: #262626;
      font-size: 13px;
      font-weight: 500;
      word-break: break-all;
    }

    .price-value {
      color: #ff5722;
      font-weight: 600;
    }

    .stock-positive {
      color: #52c41a;
      font-weight: 600;
    }

    .stock-zero {
      color: #bfbfbf;
    }

    .stock-empty {
      text-align: center;
      color: #999;
      padding: 30px;
      font-size: 14px;
    }

    /* 仓库库存表格 */
    .warehouse-table {
      width: 100%;
    }

    .warehouse-table th {
      background: #f0f7ff;
      color: #1890ff;
      font-weight: 600;
      text-align: center;
    }

    .warehouse-table td {
      text-align: center;
    }

    /* 详情头部 */
    .detail-header {
      background: linear-gradient(135deg, #1890ff 0%, #096dd9 100%);
      color: #fff;
      padding: 24px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(24, 144, 255, 0.3);
    }

    .detail-header h2 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #fff;
    }

    .detail-header .part-number {
      font-size: 16px;
      opacity: 0.95;
      margin-bottom: 12px;
      font-family: Consolas, Monaco, monospace;
    }

    .detail-header .meta {
      display: flex;
      gap: 20px;
      font-size: 13px;
      opacity: 0.9;
      flex-wrap: wrap;
    }

    .detail-header .price-box {
      display: flex;
      gap: 30px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .price-item {
      text-align: center;
    }

    .price-item-label {
      font-size: 12px;
      opacity: 0.85;
      margin-bottom: 4px;
    }

    .price-item-value {
      font-size: 20px;
      font-weight: 700;
      font-family: Consolas, Monaco, monospace;
    }
  </style>
</head>

<body>
  {% raw %}
  <div class="container">
    <!-- 头部 -->
    <div class="header">
      <div>
        <div class="header-title">BB配件库</div>
        <div class="header-subtitle">BB零件查询与管理系统</div>
      </div>
    </div>

    <!-- 标签页容器 -->
    <div class="layui-tabs" lay-filter="bmw-tabs" lay-allowclose="true">
      <ul class="layui-tabs-header" lay-allowclose="true">
        <li lay-id="list" class="layui-this">
          <i class="layui-icon layui-icon-list"></i> 配件列表
        </li>
      </ul>
      <div class="layui-tabs-body">
        <div class="layui-tabs-item layui-show" lay-id="list">
          <!-- 搜索区域 -->
          <div class="search-panel">
            <div class="search-row">
              <div class="search-item">
                <label>配件编号：</label>
                <input type="text" id="partNumber" placeholder="请输入配件编号（OE号）" />
              </div>

              <div class="search-item">
                <button class="btn btn-primary" id="searchBtn">
                  <i class="layui-icon layui-icon-search"></i> 查询
                </button>
                <button class="btn btn-success" id="crawlSearchBtn">
                  <i class="layui-icon layui-icon-export"></i> 更新搜索
                </button>
                <button class="btn btn-default" id="resetBtn">
                  <i class="layui-icon layui-icon-refresh"></i> 重置
                </button>
                <button class="btn btn-default" id="settingsBtn">
                  <i class="layui-icon layui-icon-set"></i> 设置
                </button>
                <button class="btn btn-default" id="backBtn">
                  <a href="/web/car_parts_library/bmw_detail">详情查询</a>
                </button>

              </div>
            </div>
          </div>

          <!-- 主内容区 -->
          <div class="main-content">
            <!-- 工具栏 -->
            <div class="toolbar">
              <div class="toolbar-left">
                <button class="btn btn-default" id="importBtn">
                  <i class="layui-icon layui-icon-upload-drag"></i> 批量导入
                </button>
                <button class="btn btn-default" id="viewFavorites">
                  <i class="layui-icon layui-icon-star"></i> 查看收藏
                </button>
              </div>
              <div class="toolbar-right">
                <button class="btn btn-default btn-sm" id="saveColumnConfigBtn">
                  <i class="layui-icon layui-icon-save"></i> 保存列配置
                </button>
                <button class="btn btn-default btn-sm" id="resetColumnConfigBtn">
                  <i class="layui-icon layui-icon-refresh"></i> 重置列配置
                </button>
                <span style="font-size: 14px; color: #595959;">共 <strong id="totalCount"
                    style="color:#1890ff;font-size:16px;">0</strong> 条记录</span>
              </div>
            </div>

            <!-- 表格 -->
            <table id="partsTable" lay-filter="partsTable"></table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 表格工具栏模板 -->
  <script type="text/html" id="tableToolBar">
    <div class="action-btns">
      <a class="layui-btn layui-btn-primary layui-btn-xs" lay-event="detail">查看详情</a>
    </div>
  </script>

  <!-- 表格头部工具栏模板 -->
  <script type="text/html" id="tableHeaderToolBar">
    <div class="layui-btn-container">
      <button class="layui-btn layui-btn-sm layui-btn-normal" lay-event="batchAddFavorite">
        <i class="layui-icon layui-icon-star"></i> 加入收藏
      </button>
      <button class="layui-btn layui-btn-sm layui-btn-warm" lay-event="batchRefresh">
        <i class="layui-icon layui-icon-refresh-3"></i> 更新选中数据
      </button>
    </div>
  </script>

  <!-- 设置弹窗模板 -->
  <script type="text/html" id="settingsTemplate">
    <form class="layui-form" lay-filter="settingsForm" style="padding: 30px;">
      <div class="layui-form-item">
        <label class="layui-form-label">Cookie</label>
        <div class="layui-input-block">
          <textarea name="cookie" id="cookieInput" placeholder="请输入 BMW Brilliance 登录态 Cookie" class="layui-textarea" style="min-height: 80px;"></textarea>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label">税率</label>
        <div class="layui-input-block">
          <input type="number" id="taxRateInput" name="tax_rate" placeholder="请输入税率，默认 1.13" step="0.01" class="layui-input">
        </div>
      </div>
      
      <div class="layui-form-item" style="text-align: center; padding-top: 20px;">
        <button type="button" class="layui-btn layui-btn-normal" id="saveSettingsBtn">保存</button>
        <button type="button" class="layui-btn layui-btn-primary" id="cancelSettingsBtn">取消</button>
      </div>
    </form>
  </script>

  <!-- 配件详情页面模板 -->
  <script type="text/html" id="partDetailTemplate">
    <!-- 详情头部 -->
  <div class="detail-header">
    <h2>{{ d.part_name || '-' }}</h2>
    <div class="part-number">配件编号：{{ d.part_number }}</div>
    <div class="meta">
      <span>销售单位：{{ d.sales_unit || '-' }}</span>
      <span>物料组：{{ d.material_group || '-' }}</span>
      <span>采集时间：{{ d.data_collect_time || '-' }}</span>
    </div>
    <div class="price-box">
      <div class="price-item">
        <div class="price-item-label">零售价</div>
        <div class="price-item-value">{{ d.retail_price || '-' }}</div>
      </div>
      <div class="price-item">
        <div class="price-item-label">4S含税进价</div>
        <div class="price-item-value">{{ d.price_4s_tax_in !== undefined && d.price_4s_tax_in !== null ?
          Number(d.price_4s_tax_in).toFixed(2) : '-' }}</div>
      </div>
      <div class="price-item">
        <div class="price-item-label">经销商净值(Stock)</div>
        <div class="price-item-value">{{ d.dealer_net_stock || '-' }}</div>
      </div>
      <div class="price-item">
        <div class="price-item-label">经销商净值(Rush)</div>
        <div class="price-item-value">{{ d.dealer_net_rush || '-' }}</div>
      </div>
      <div class="price-item">
        <div class="price-item-label">可用库存</div>
        <div class="price-item-value">{{ d.available_stock || '-' }}</div>
      </div>
    </div>
  </div>

  <!-- 基本信息卡片 -->
  <div class="detail-card">
    <div class="detail-card-title">
      <i class="layui-icon layui-icon-form"></i>基本信息
    </div>
    <div class="info-grid">
      <div class="info-item">
        <div class="info-label">配件编号：</div>
        <div class="info-value">{{ d.part_number }}</div>
      </div>
      <div class="info-item">
        <div class="info-label">零件名称：</div>
        <div class="info-value">{{ d.part_name || '-' }}</div>
      </div>
      <div class="info-item">
        <div class="info-label">销售单位：</div>
        <div class="info-value">{{ d.sales_unit || '-' }}</div>
      </div>
      <div class="info-item">
        <div class="info-label">物料组：</div>
        <div class="info-value">{{ d.material_group || '-' }}</div>
      </div>
      <div class="info-item">
        <div class="info-label">毛重：</div>
        <div class="info-value">{{ d.gross_weight || '-' }}</div>
      </div>
      <div class="info-item">
        <div class="info-label">净重：</div>
        <div class="info-value">{{ d.net_weight || '-' }}</div>
      </div>
      <div class="info-item">
        <div class="info-label">体积：</div>
        <div class="info-value">{{ d.volume || '-' }}</div>
      </div>
      <div class="info-item">
        <div class="info-label">采集时间：</div>
        <div class="info-value">{{ d.data_collect_time || '-' }}</div>
      </div>
      <div class="info-item">
        <div class="info-label">数据来源：</div>
        <div class="info-value">{{ d.data_source || '-' }}</div>
      </div>
      <div class="info-item">
        <div class="info-label">更新时间：</div>
        <div class="info-value">{{ d.updated_at }}</div>
      </div>
    </div>
  </div>

  <!-- 价格信息卡片 -->
  <div class="detail-card">
    <div class="detail-card-title">
      <i class="layui-icon layui-icon-rmb"></i>价格与折扣信息
    </div>
    <div class="info-grid">
      <div class="info-item">
        <div class="info-label">零售价：</div>
        <div class="info-value price-value">{{ d.retail_price || '-' }}</div>
      </div>
      <div class="info-item">
        <div class="info-label">4S含税进价：</div>
        <div class="info-value price-value">{{ d.price_4s_tax_in !== undefined && d.price_4s_tax_in !== null ?
          Number(d.price_4s_tax_in).toFixed(2) : '-' }}</div>
      </div>
      <div class="info-item">
        <div class="info-label">折扣(Stock)：</div>
        <div class="info-value">{{ d.discount_stock || '-' }}</div>
      </div>
      <div class="info-item">
        <div class="info-label">折扣(Rush)：</div>
        <div class="info-value">{{ d.discount_rush || '-' }}</div>
      </div>
      <div class="info-item">
        <div class="info-label">经销商净值(Stock)：</div>
        <div class="info-value price-value">{{ d.dealer_net_stock || '-' }}</div>
      </div>
      <div class="info-item">
        <div class="info-label">经销商净值(Rush)：</div>
        <div class="info-value price-value">{{ d.dealer_net_rush || '-' }}</div>
      </div>
      <div class="info-item">
        <div class="info-label">可用库存：</div>
        <div class="info-value stock-positive">{{ d.available_stock || '-' }}</div>
      </div>
    </div>
  </div>

  <!-- 多仓库库存卡片 -->
  <div class="detail-card">
    <div class="detail-card-title">
      <i class="layui-icon layui-icon-location"></i>多仓库库存详情
    </div>
    {{# if (d.stock_info) { }}
    <table class="layui-table warehouse-table" lay-skin="line">
      <thead>
        <tr>
          <th>仓库</th>
          <th>库房数量</th>
          <th>在途数量</th>
          <th>再定购点</th>
          <th>主仓数量</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td style="font-weight:600;color:#1890ff;">北京</td>
          <td>{{ d.stock_info.warehouse_beijing || '-' }}</td>
          <td>{{ d.stock_info.in_transit_beijing || '-' }}</td>
          <td>{{ d.stock_info.reorder_point_beijing || '-' }}</td>
          <td>{{ d.stock_info.main_warehouse_beijing || '-' }}</td>
        </tr>
        <tr>
          <td style="font-weight:600;color:#1890ff;">上海</td>
          <td>{{ d.stock_info.warehouse_shanghai || '-' }}</td>
          <td>{{ d.stock_info.in_transit_shanghai || '-' }}</td>
          <td>{{ d.stock_info.reorder_point_shanghai || '-' }}</td>
          <td>{{ d.stock_info.main_warehouse_shanghai || '-' }}</td>
        </tr>
        <tr>
          <td style="font-weight:600;color:#1890ff;">佛山</td>
          <td>{{ d.stock_info.warehouse_foshan || '-' }}</td>
          <td>{{ d.stock_info.in_transit_foshan || '-' }}</td>
          <td>{{ d.stock_info.reorder_point_foshan || '-' }}</td>
          <td>{{ d.stock_info.main_warehouse_foshan || '-' }}</td>
        </tr>
        <tr>
          <td style="font-weight:600;color:#1890ff;">成都</td>
          <td>{{ d.stock_info.warehouse_chengdu || '-' }}</td>
          <td>{{ d.stock_info.in_transit_chengdu || '-' }}</td>
          <td>{{ d.stock_info.reorder_point_chengdu || '-' }}</td>
          <td>{{ d.stock_info.main_warehouse_chengdu || '-' }}</td>
        </tr>
        <tr>
          <td style="font-weight:600;color:#1890ff;">沈阳</td>
          <td>{{ d.stock_info.warehouse_shenyang || '-' }}</td>
          <td>{{ d.stock_info.in_transit_shenyang || '-' }}</td>
          <td>{{ d.stock_info.reorder_point_shenyang || '-' }}</td>
          <td>{{ d.stock_info.main_warehouse_shenyang || '-' }}</td>
        </tr>
        <tr>
          <td style="font-weight:600;color:#1890ff;">合肥</td>
          <td>{{ d.stock_info.warehouse_hefei || '-' }}</td>
          <td>{{ d.stock_info.in_transit_hefei || '-' }}</td>
          <td>{{ d.stock_info.reorder_point_hefei || '-' }}</td>
          <td>{{ d.stock_info.main_warehouse_hefei || '-' }}</td>
        </tr>
        <tr>
          <td style="font-weight:600;color:#1890ff;">宁波</td>
          <td>{{ d.stock_info.warehouse_ningbo || '-' }}</td>
          <td>{{ d.stock_info.in_transit_ningbo || '-' }}</td>
          <td>{{ d.stock_info.reorder_point_ningbo || '-' }}</td>
          <td>{{ d.stock_info.main_warehouse_ningbo || '-' }}</td>
        </tr>
      </tbody>
    </table>
    {{# } else { }}
    <div class="stock-empty">暂无库存信息</div>
    {{# } }}
  </div>
  </script>

  <!-- 收藏列表弹窗模板 -->
  <script type="text/html" id="favoritesTemplate">
    <div style="padding: 20px;">
      <div style="margin-bottom: 20px;">
        <div class="layui-inline" style="margin-right: 10px;">
          <label class="layui-form-label">分类筛选</label>
          <div class="layui-input-inline" style="width: auto;">
            <button class="layui-btn layui-btn-primary" id="favoritesCategoryBtn">
              <span>宝马主收藏</span>
              <i class="layui-icon layui-icon-down layui-font-12"></i>
            </button>
          </div>
        </div>
        <div class="layui-inline" style="margin-left: 20px;">

  <!-- 导入弹窗模板 -->
  <script type="text/html" id="importTemplate">
    <div style="padding: 30px;">
      <div class="layui-upload-drag" id="uploadArea">
        <i class="layui-icon">&#xe67c;</i>
        <p>点击上传，或将文件拖拽到此处</p>
      </div>
      <div style="margin-top: 15px; padding: 10px 15px; background-color: #fff7e6; border-radius: 4px; border: 1px solid #ffd591;">
        <p style="color: #ff5722; margin: 0; font-size: 14px;">⚠️ 注意：.xls 格式文件暂不支持，请另存为 .xlsx 或 .csv 格式后上传</p>
      </div>
      <div style="margin-top: 15px; color: #666; font-size: 13px;">
        <p style="margin: 5px 0;">📄 支持文件类型：.xlsx / .csv</p>
        <p style="margin: 5px 0;">📏 文件大小：不超过 10MB</p>
        <p style="margin: 5px 0;">🔄 导入模式：存在则更新，不存在则插入</p>
      </div>
      <div style="margin-top: 20px; text-align: center;">
        <a href="#" id="downloadTemplateLink" style="color: #1890ff;">
          <i class="layui-icon layui-icon-template-1"></i> 下载导入模板
        </a>
      </div>
      <div id="importResult" style="margin-top: 20px; display: none;">
        <div class="layui-card">
          <div class="layui-card-header">导入结果</div>
          <div class="layui-card-body">
            <p>共处理 <strong id="resultTotal">0</strong> 条数据</p>
            <p>成功 <strong id="resultSuccess" style="color: #52c41a;">0</strong> 条</p>
            <p>失败 <strong id="resultFailed" style="color: #ff5722;">0</strong> 条</p>
            <div id="errorList" style="margin-top: 15px; max-height: 200px; overflow-y: auto; display: none;">
              <p style="font-weight: bold; margin-bottom: 10px;">错误详情：</p>
              <ul id="errorItems"></ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </script>

  <script src="/static/layui/layui.js"></script>
  <script>
    // ==================== Layui 模块配置 ====================
    layui.config({
      version: 'v1.9.0'
    }).extend({
      soulTable: '/static/soulTable/soulTable.slim'
    });

    // ==================== Layui 模块化定义 ====================
    layui.define(['jquery', 'layer', 'table', 'form', 'element', 'soulTable', 'laytpl', 'dropdown', 'upload'], function (exports) {
      var $ = layui.jquery;
      var element = layui.element;
      var layer = layui.layer;
      var table = layui.table;
      var form = layui.form;
      var soulTable = layui.soulTable;
      var laytpl = layui.laytpl;
      var upload = layui.upload;

      // 内部状态变量
      var state = {
        openedTabs: new Set(['list']),
        tableRendered: false,
        columnConfig: null,
        columnOrder: null,
        tableIns: null,
        favoriteColumnConfig: null,
        favoriteColumnOrder: null,
        favoriteTableIns: null,
        favoriteCategory: '宝马主收藏',
        settings: {
          cookie: ''
        }
      };

      // ==================== 工具函数 ====================

      // 处理空值
      function emptyVal(val) {
        return val ? val : '-';
      }

      // 格式化价格（保留2位小数，空值显示-）
      function formatPrice(val) {
        if (val === undefined || val === null || val === '') return '-';
        var num = Number(val);
        if (isNaN(num)) return '-';
        return num.toFixed(2);
      }

      // ==================== 列配置管理 ====================

      function loadColumnConfig(callback) {
        $.ajax({
          url: '/new/api/car-parts/bmw/get-column-config',
          method: 'GET',
          success: function (res) {
            if (res.code === 200 && res.data) {
              if (res.data.column_config) {
                state.columnConfig = res.data.column_config;
              }
              if (res.data.column_order) {
                state.columnOrder = res.data.column_order;
              }
              if (res.data.favorite_column_config) {
                state.favoriteColumnConfig = res.data.favorite_column_config;
              }
              if (res.data.favorite_column_order) {
                state.favoriteColumnOrder = res.data.favorite_column_order;
              }
            }
            if (callback) callback();
          },
          error: function () {
            if (callback) callback();
          }
        });
      }

      function saveColumnConfig(columnConfig, columnOrder, callback) {
        if (typeof columnOrder === 'function') {
          callback = columnOrder;
          columnOrder = null;
        }

        var requestData = { column_config: columnConfig };
        if (columnOrder) {
          requestData.column_order = columnOrder;
        }

        $.ajax({
          url: '/new/api/car-parts/bmw/set-column-config',
          method: 'POST',
          contentType: 'application/json',
          data: JSON.stringify(requestData),
          success: function (saveRes) {
            if (saveRes.code === 200) {
              state.columnConfig = columnConfig;
              if (columnOrder) {
                state.columnOrder = columnOrder;
              }
              layer.msg('列配置保存成功', { icon: 1 });
            } else {
              layer.msg('列配置保存失败: ' + (saveRes.msg || '未知错误'), { icon: 2 });
            }
            if (callback) callback(saveRes);
          },
          error: function () {
            layer.msg('保存列配置失败，请稍后重试', { icon: 2 });
            if (callback) callback();
          }
        });
      }

      function saveFavoriteColumnConfig(columnConfig, columnOrder, callback) {
        if (typeof columnOrder === 'function') {
          callback = columnOrder;
          columnOrder = null;
        }

        var requestData = { favorite_column_config: columnConfig };
        if (columnOrder) {
          requestData.favorite_column_order = columnOrder;
        }

        $.ajax({
          url: '/new/api/car-parts/bmw/set-column-config',
          method: 'POST',
          contentType: 'application/json',
          data: JSON.stringify(requestData),
          success: function (saveRes) {
            if (saveRes.code === 200) {
              state.favoriteColumnConfig = columnConfig;
              if (columnOrder) {
                state.favoriteColumnOrder = columnOrder;
              }
              layer.msg('收藏列表列配置保存成功', { icon: 1 });
            } else {
              layer.msg('收藏列表列配置保存失败: ' + (saveRes.msg || '未知错误'), { icon: 2 });
            }
            if (callback) callback(saveRes);
          },
          error: function () {
            layer.msg('保存收藏列表列配置失败，请稍后重试', { icon: 2 });
            if (callback) callback();
          }
        });
      }

      function extractColumnConfig() {
        if (!state.tableIns || !state.tableIns.config || !state.tableIns.config.cols) {
          return null;
        }
        var cols = state.tableIns.config.cols[0];
        var config = {};
        cols.forEach(function (col) {
          if (col.field) {
            config[col.field] = {
              hide: col.hide || false,
              width: col.width
            };
          }
        });
        return config;
      }

      function extractFavoriteColumnConfig() {
        if (!state.favoriteTableIns || !state.favoriteTableIns.config || !state.favoriteTableIns.config.cols) {
          return null;
        }
        var cols = state.favoriteTableIns.config.cols[0];
        var config = {};
        cols.forEach(function (col) {
          if (col.field) {
            config[col.field] = {
              hide: col.hide || false,
              width: col.width
            };
          }
        });
        return config;
      }

      function extractColumnOrder(tableIns) {
        if (!tableIns || !tableIns.config || !tableIns.config.cols) {
          return null;
        }
        var cols = tableIns.config.cols[0];
        var order = [];
        cols.forEach(function (col) {
          if (col.field || col.type) {
            order.push(col.field || col.type);
          }
        });
        return order;
      }

      function applyColumnConfig(columns, config, order) {
        var result = columns;

        if (config) {
          result = result.map(function (col) {
            if (!col.field) return col;
            var colConfig = config[col.field];
            if (colConfig) {
              return $.extend({}, col, colConfig);
            }
            return col;
          });
        }

        if (order && order.length > 0) {
          var sorted = [];
          var remaining = result.slice();
          order.forEach(function (key) {
            for (var i = 0; i < remaining.length; i++) {
              var col = remaining[i];
              var colKey = col.field || col.type;
              if (colKey === key) {
                sorted.push(col);
                remaining.splice(i, 1);
                break;
              }
            }
          });
          result = sorted.concat(remaining);
        }

        return result;
      }

      // ==================== 标签页管理 ====================

      // 打开详情标签页
      function openDetailTab(partNumber) {
        var tabId = 'detail-' + partNumber;

        // 检查标签页是否已存在，如已存在则切换
        if (state.openedTabs.has(tabId)) {
          switchToTab(tabId);
          return;
        }

        // 手动添加标签头
        var tabTitleHtml = '<li lay-id="' + tabId + '" class="layui-this">' +
          '<i class="layui-icon layui-icon-form"></i> 详情: ' + partNumber +
          '<i class="layui-icon layui-close layui-unselect">×</i></li>';
        $('.layui-tabs-header').append(tabTitleHtml);

        // 手动添加标签内容
        var tabContentHtml = '<div class="layui-tabs-item layui-show" lay-id="' + tabId + '">' +
          '<div id="tab-' + tabId + '-content" class="tab-content">' +
          '<div style="text-align: center; padding: 80px;"><i class="layui-icon layui-icon-loading-1" style="font-size: 40px; color: #1890ff; animation: layui-anim-rotate 1s linear infinite;"></i><p style="margin-top: 20px; color: #595959; font-size: 16px;">加载详情中...</p></div>' +
          '</div></div>';
        $('.layui-tabs-body').append(tabContentHtml);

        // 移除其他标签的 layui-show 类
        $('.layui-tabs-header li').not('[lay-id="' + tabId + '"]').removeClass('layui-this');
        $('.layui-tabs-item').not('[lay-id="' + tabId + '"]').removeClass('layui-show');

        state.openedTabs.add(tabId);

        // 加载详情内容
        loadDetailContent(tabId, partNumber);

        // 绑定关闭按钮事件
        bindTabCloseEvents();
      }

      // 切换到指定标签页
      function switchToTab(tabId) {
        $('.layui-tabs-header li').removeClass('layui-this');
        $('.layui-tabs-header li[lay-id="' + tabId + '"]').addClass('layui-this');
        $('.layui-tabs-item').removeClass('layui-show');
        $('.layui-tabs-item[lay-id="' + tabId + '"]').addClass('layui-show');
      }

      // 绑定标签关闭事件
      function bindTabCloseEvents() {
        $('.layui-tabs-header li .layui-close').off('click').on('click', function () {
          var $li = $(this).parent('li');
          var tabId = $li.attr('lay-id');

          if (tabId === 'list') {
            return;
          }

          if ($li.hasClass('layui-this')) {
            var $prevLi = $li.prev();
            if ($prevLi.length) {
              switchToTab($prevLi.attr('lay-id'));
            } else {
              switchToTab('list');
            }
          }

          $li.remove();
          $('.layui-tabs-item[lay-id="' + tabId + '"]').remove();
          state.openedTabs.delete(tabId);
        });

        // 绑定标签点击切换事件
        $('.layui-tabs-header li').off('click').on('click', function () {
          var tabId = $(this).attr('lay-id');
          if (tabId) {
            switchToTab(tabId);
          }
        });
      }

      // ==================== 详情加载与渲染 ====================

      // 加载详情内容
      function loadDetailContent(tabId, partNumber) {
        $.ajax({
          url: '/new/api/car-parts/bmw/detail',
          method: 'GET',
          data: { part_number: partNumber },
          success: function (res) {
            if (res.code === 200 && res.data) {
              renderDetail('#tab-' + tabId + '-content', res.data);
            } else {
              $('#tab-' + tabId + '-content').html(
                '<div style="text-align: center; padding: 80px;">' +
                '<i class="layui-icon layui-icon-face-cry" style="font-size: 50px; color: #999;"></i>' +
                '<p style="margin-top: 20px; color: #999; font-size: 16px;">' + (res.msg || '获取配件详情失败') + '</p>' +
                '</div>'
              );
            }
          },
          error: function (xhr, status, error) {
            $('#tab-' + tabId + '-content').html(
              '<div style="text-align: center; padding: 80px;">' +
              '<i class="layui-icon layui-icon-face-cry" style="font-size: 50px; color: #999;"></i>' +
              '<p style="margin-top: 20px; color: #999; font-size: 16px;">网络请求失败: ' + error + '</p>' +
              '</div>'
            );
          }
        });
      }

      // 渲染详情内容
      function renderDetail(container, data) {
        var formattedData = {
          part_number: emptyVal(data.part_number),
          part_name: emptyVal(data.part_name),
          sales_unit: emptyVal(data.sales_unit),
          material_group: emptyVal(data.material_group),
          gross_weight: emptyVal(data.gross_weight),
          net_weight: emptyVal(data.net_weight),
          volume: emptyVal(data.volume),
          retail_price: emptyVal(data.retail_price),
          price_4s_tax_in: formatPrice(data.price_4s_tax_in),
          discount_stock: emptyVal(data.discount_stock),
          discount_rush: emptyVal(data.discount_rush),
          dealer_net_stock: emptyVal(data.dealer_net_stock),
          dealer_net_rush: emptyVal(data.dealer_net_rush),
          available_stock: emptyVal(data.available_stock),
          data_collect_time: emptyVal(data.data_collect_time),
          data_source: (function() {
            var source = data.data_source;
            if (source === 'dwp.bmw-brilliance.cn') return '线路一';
            if (source === 'zhaopeiyun.com') return '线路二';
            return emptyVal(source);
          })(),
          updated_at: data.updated_at ? new Date(data.updated_at).toLocaleString('zh-CN') : '-',
          stock_info: data.stock_info || null,
        };

        var getTpl = document.getElementById('partDetailTemplate').innerHTML;
        laytpl(getTpl).render(formattedData, function (html) {
          $(container).html(html);
          form.render();
        });
      }

      // ==================== 表格管理 ====================

      // 默认列配置
      var defaultColumns = [
        { type: 'checkbox', fixed: 'left', width: 50 },
        {
          field: 'part_number', title: '配件编号', width: 200, fixed: 'left', templet: function (d) {
            return '<a href="javascript:;" style="color:#1890ff;font-weight:600;" class="view-detail-link" data-part="' + d.part_number + '">' + d.part_number + '</a>';
          }
        },
        { field: 'part_name', title: '零件名称', width: 250 },
        { field: 'sales_unit', title: '销售单位', width: 100, hide: true },
        { field: 'material_group', title: '物料组', width: 120, hide: true },
        { field: 'gross_weight', title: '毛重', width: 100, hide: true },
        { field: 'net_weight', title: '净重', width: 100, hide: true },
        { field: 'volume', title: '体积', width: 100, hide: true },
        {
          field: 'retail_price', title: '零售价', width: 120, templet: function (d) {
            return '<span style="color:#ff5722;font-weight:600;">' + emptyVal(d.retail_price) + '</span>';
          }
        },
        {
          field: 'price_4s_tax_in', title: '4S含税进价', width: 130, templet: function (d) {
            return '<span style="color:#ff9800;font-weight:600;">' + formatPrice(d.price_4s_tax_in) + '</span>';
          }
        },
        { field: 'discount_stock', title: '折扣(Stock)', width: 120, hide: true },
        { field: 'discount_rush', title: '折扣(Rush)', width: 120, hide: true },
        {
          field: 'dealer_net_stock', title: '经销商净值(Stock)', width: 160, templet: function (d) {
            return '<span style="color:#ff5722;font-weight:600;">' + emptyVal(d.dealer_net_stock) + '</span>';
          }
        },
        {
          field: 'dealer_net_rush', title: '经销商净值(Rush)', width: 160, hide: true, templet: function (d) {
            return '<span style="color:#ff5722;font-weight:600;">' + emptyVal(d.dealer_net_rush) + '</span>';
          }
        },
        {
          field: 'available_stock', title: '可用库存', width: 120, templet: function (d) {
            return '<span style="color:#52c41a;font-weight:600;">' + emptyVal(d.available_stock) + '</span>';
          }
        },
        { field: 'data_collect_time', title: '采集时间', width: 180, hide: true },
        {
          field: 'data_source', title: '数据来源', width: 100, templet: function (d) {
            var source = d.data_source;
            if (source === 'dwp.bmw-brilliance.cn') return '<span style="color:#52c41a;font-weight:600;">线路一</span>';
            if (source === 'zhaopeiyun.com') return '<span style="color:#1890ff;font-weight:600;">线路二</span>';
            return emptyVal(source);
          }
        },
        {
          field: 'updated_at', title: '更新时间', width: 180, templet: function (d) {
            if (!d.updated_at) return '-';
            return new Date(d.updated_at).toLocaleString('zh-CN');
          }
        },
        { title: '操作', width: 120, fixed: 'right', toolbar: '#tableToolBar', align: 'center' }
      ];

      // 初始化表格
      function initTable(partNumber) {
        var queryParams = {
          page: 1,
          page_size: 20,
          part_number: partNumber || ''
        };

        var tableColumns = applyColumnConfig(defaultColumns, state.columnConfig, state.columnOrder);

        state.tableIns = table.render({
          elem: '#partsTable',
          url: '/new/api/car-parts/bmw/list',
          method: 'get',
          where: queryParams,
          page: true,
          limit: 20,
          limits: [10, 20, 50, 100],
          height: 'full-280',
          cols: [tableColumns],
          toolbar: '#tableHeaderToolBar',
          defaultToolbar: ['filter', 'exports'],
          done: function (res, curr, count) {
            state.tableRendered = true;
            if (res.code === 200 && res.data) {
              $('#totalCount').text(res.data.count || count);
            } else {
              $('#totalCount').text(0);
            }
            soulTable.render(this);
          },
          parseData: function (res) {
            if (res.code === 200 && res.data && res.data.status) {
              return {
                code: 0,
                msg: res.data.msg,
                count: res.data.count,
                data: res.data.data || []
              };
            } else {
              return {
                code: 0,
                msg: res.msg || '查询成功',
                count: 0,
                data: []
              };
            }
          }
        });
      }

      // 刷新表格（保持当前条件）
      function refreshTable() {
        if (state.tableIns) {
          state.tableIns.reload();
        }
      }

      // ==================== 表格行事件监听 ====================

      // 监听工具栏事件
      table.on('toolbar(partsTable)', function (obj) {
        var checkStatus = table.checkStatus(obj.config.id);
        var selectedData = checkStatus.data;

        switch (obj.event) {
          case 'batchRefresh':
            if (selectedData.length === 0) {
              layer.msg('请先选择要更新的数据', { icon: 0 });
              return;
            }
            batchRefreshParts(selectedData);
            break;
          case 'batchAddFavorite':
            if (selectedData.length === 0) {
              layer.msg('请先选择要加入收藏的数据', { icon: 0 });
              return;
            }
            addToFavorites(selectedData);
            break;
        }
      });

      // 监听行工具事件
      table.on('tool(partsTable)', function (obj) {
        var data = obj.data;
        if (obj.event === 'detail') {
          openDetailTab(data.part_number);
        }
      });

      // 监听行双击事件 - 打开详情
      table.on('rowDouble(partsTable)', function (obj) {
        openDetailTab(obj.data.part_number);
      });

      // ==================== 批量刷新数据 ====================

      function batchRefreshParts(selectedData) {

        var partNumbers = selectedData.map(function (item) {
          return item.part_number;
        });

        layer.confirm('确定要更新以下 ' + partNumbers.length + ' 个配件数据吗？<br><br><span style="color:#1890ff;font-family:Consolas,monospace;">' +
          partNumbers.slice(0, 5).join(', ') + (partNumbers.length > 5 ? '...' : '') + '</span>', {
          icon: 3,
          title: '确认更新'
        }, function (index) {
          layer.close(index);

          var loadingIdx = layer.load(2, {
            shade: [0.1, '#000'],
            content: '正在爬取并更新数据...'
          });

          $.ajax({
            url: '/new/api/car-parts/bmw/batch-refresh',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
              part_numbers: partNumbers
            }),
            success: function (res) {
              layer.close(loadingIdx);
              if (res.code === 200) {
                layer.msg('数据更新完成: ' + (res.data && res.data.msg ? res.data.msg : '成功'), { icon: 1 });

                        error: function (xhr, status, error) {
                          layer.close(loadingIdx);
                          layer.msg('请求失败: ' + error, { icon: 2 });
                        }
                      });
                    });
                    break;
                }
              });

              // 收藏表格行事件
              table.on('tool(favoritesTable)', function (obj) {
                var data = obj.data;

      });

      $(document).on('click', '#resetFavoriteColumnConfigBtn', function () {
        layer.confirm('确定要重置收藏列表为默认列配置吗？', function (confirmIndex) {
          state.favoriteColumnConfig = null;
          state.favoriteColumnOrder = null;

          $.ajax({
            url: '/new/api/car-parts/bmw/set-column-config',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
              favorite_column_config: {},
              favorite_column_order: null
            }),
            success: function (res) {
              if (res.code === 200) {
                layer.close(confirmIndex);
                layer.msg('收藏列表列配置已重置', { icon: 1 });
                table.reload('favoritesTable');
              } else {
                layer.msg('重置失败: ' + (res.msg || '未知错误'), { icon: 2 });
              }
            },
            error: function () {
              layer.msg('重置收藏列表列配置失败，请稍后重试', { icon: 2 });
            }
          });
        });
      });

      // 初始化
      console.log('华晨宝马配件库页面已加载');
      // 加载已保存的列配置
      loadColumnConfig();
      // 页面初始不加载数据，需手动输入查询
    });
  </script>
  {% endraw %}
</body>

</html>
