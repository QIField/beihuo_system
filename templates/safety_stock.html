<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全库存管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .toolbar {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .toolbar-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        
        .toolbar-row:last-child {
            margin-bottom: 0;
        }
        
        input[type="text"] {
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
            width: 200px;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #1890ff;
        }
        
        select {
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
            background: #fff;
        }
        
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #1890ff;
            color: #fff;
        }
        
        .btn-primary:hover {
            background: #40a9ff;
        }
        
        .btn-success {
            background: #52c41a;
            color: #fff;
        }
        
        .btn-success:hover {
            background: #73d13d;
        }
        
        .btn-warning {
            background: #faad14;
            color: #fff;
        }
        
        .btn-warning:hover {
            background: #ffc53d;
        }
        
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .stat-card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .stat-card .number {
            font-size: 28px;
            font-weight: bold;
            color: #333;
        }
        
        .stat-card.danger .number {
            color: #ff4d4f;
        }
        
        .stat-card.warning .number {
            color: #faad14;
        }
        
        .table-container {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }
        
        th {
            background: #fafafa;
            font-weight: 600;
            color: #333;
        }
        
        tr:hover {
            background: #f5f7fa;
        }
        
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .status-normal {
            background: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
        }
        
        .status-warning {
            background: #fffbe6;
            color: #faad14;
            border: 1px solid #ffe58f;
        }
        
        .status-danger {
            background: #fff2f0;
            color: #ff4d4f;
            border: 1px solid #ffccc7;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 10px;
        }
        
        .pagination button {
            min-width: 32px;
            height: 32px;
            padding: 0 8px;
            background: #fff;
            border: 1px solid #d9d9d9;
            color: #333;
        }
        
        .pagination button:hover {
            border-color: #1890ff;
            color: #1890ff;
        }
        
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .pagination .current {
            background: #1890ff;
            color: #fff;
            border-color: #1890ff;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .empty {
            text-align: center;
            padding: 60px;
            color: #999;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: #fff;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h2 {
            font-size: 18px;
        }
        
        .modal-close {
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }
        
        .modal-close:hover {
            color: #333;
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .detail-row:last-child {
            border-bottom: none;
        }
        
        .detail-label {
            color: #666;
        }
        
        .detail-value {
            font-weight: 500;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>安全库存管理</h1>
        
        <!-- 统计卡片 -->
        <div class="stats-cards">
            <div class="stat-card">
                <h3>总SKU数</h3>
                <div class="number" id="totalSku">-</div>
            </div>
            <div class="stat-card danger">
                <h3>危险库存</h3>
                <div class="number" id="dangerCount">-</div>
            </div>
            <div class="stat-card warning">
                <h3>预警库存</h3>
                <div class="number" id="warningCount">-</div>
            </div>
            <div class="stat-card">
                <h3>正常库存</h3>
                <div class="number" id="normalCount">-</div>
            </div>
        </div>
        
        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="toolbar-row">
                <input type="text" id="searchSku" placeholder="输入SKU搜索">
                <select id="filterStatus">
                    <option value="">全部状态</option>
                    <option value="normal">正常</option>
                    <option value="warning">预警</option>
                    <option value="danger">危险</option>
                </select>
                <button class="btn-primary" onclick="search()">查询</button>
                <button class="btn-warning" onclick="reset()">重置</button>
            </div>
            <div class="toolbar-row">
                <button class="btn-success" onclick="calculatePilot()">试点计算</button>
                <button class="btn-primary" onclick="calculateAll()">全量计算</button>
            </div>
        </div>
        
        <!-- 数据表格 -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>SKU</th>
                        <th>产品名称</th>
                        <th>当前库存</th>
                        <th>安全库存</th>
                        <th>库存下限</th>
                        <th>再订货点</th>
                        <th>库存上限</th>
                        <th>建议补货</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="10" class="loading">加载中...</td>
                    </tr>
                </tbody>
            </table>
            
            <!-- 分页 -->
            <div class="pagination" id="pagination"></div>
        </div>
    </div>
    
    <!-- 详情弹窗 -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>SKU详情</h2>
                <span class="modal-close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- 动态填充 -->
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let currentPage = 1;
        let pageSize = 20;
        let totalItems = 0;
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            loadStats();
        });
        
        // 加载数据
        async function loadData() {
            const status = document.getElementById('filterStatus').value;
            const sku = document.getElementById('searchSku').value;
            
            try {
                let url = `/api/safety-stock/list?page=${currentPage}&page_size=${pageSize}`;
                if (status) url += `&status=${status}`;
                
                const response = await fetch(url);
                const result = await response.json();
                
                if (result.code === 200) {
                    renderTable(result.data.items);
                    totalItems = result.data.total;
                    renderPagination();
                } else {
                    showError(result.msg);
                }
            } catch (error) {
                showError('加载数据失败: ' + error.message);
            }
        }
        
        // 加载统计
        async function loadStats() {
            try {
                // 这里可以调用统计API
                // 暂时使用模拟数据
                document.getElementById('totalSku').textContent = '-';
                document.getElementById('dangerCount').textContent = '-';
                document.getElementById('warningCount').textContent = '-';
                document.getElementById('normalCount').textContent = '-';
            } catch (error) {
                console.error('加载统计失败:', error);
            }
        }
        
        // 渲染表格
        function renderTable(items) {
            const tbody = document.getElementById('tableBody');
            
            if (!items || items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" class="empty">暂无数据</td></tr>';
                return;
            }
            
            tbody.innerHTML = items.map(item => `
                <tr>
                    <td>${item.sku}</td>
                    <td>${item.sku_name || '-'}</td>
                    <td>${item.current_stock}</td>
                    <td>${item.safety_stock}</td>
                    <td>${item.inventory_min}</td>
                    <td>${item.reorder_point}</td>
                    <td>${item.inventory_max}</td>
                    <td>${item.suggested_qty > 0 ? item.suggested_qty : '-'}</td>
                    <td>
                        <span class="status-badge status-${item.stock_status}">
                            ${getStatusText(item.stock_status)}
                        </span>
                    </td>
                    <td>
                        <button class="btn-primary" onclick="showDetail('${item.sku}')">详情</button>
                    </td>
                </tr>
            `).join('');
        }
        
        // 渲染分页
        function renderPagination() {
            const totalPages = Math.ceil(totalItems / pageSize);
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }
            
            let html = '';
            
            // 上一页
            html += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})">上一页</button>`;
            
            // 页码
            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) {
                    html += `<button class="current">${i}</button>`;
                } else if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    html += `<button onclick="goPage(${i})">${i}</button>`;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += `<span>...</span>`;
                }
            }
            
            // 下一页
            html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="goPage(${currentPage + 1})">下一页</button>`;
            
            pagination.innerHTML = html;
        }
        
        // 跳转页面
        function goPage(page) {
            currentPage = page;
            loadData();
        }
        
        // 搜索
        function search() {
            currentPage = 1;
            loadData();
        }
        
        // 重置
        function reset() {
            document.getElementById('searchSku').value = '';
            document.getElementById('filterStatus').value = '';
            currentPage = 1;
            loadData();
        }
        
        // 试点计算
        async function calculatePilot() {
            if (!confirm('确定要执行试点计算吗？')) return;
            
            try {
                const response = await fetch('/api/safety-stock/calculate-pilot', {
                    method: 'POST'
                });
                const result = await response.json();
                
                alert(result.msg);
                if (result.code === 200) {
                    loadData();
                }
            } catch (error) {
                alert('计算失败: ' + error.message);
            }
        }
        
        // 全量计算
        async function calculateAll() {
            if (!confirm('确定要执行全量计算吗？这可能需要较长时间。')) return;
            
            try {
                const response = await fetch('/api/safety-stock/calculate-all', {
                    method: 'POST'
                });
                const result = await response.json();
                
                alert(result.msg);
                if (result.code === 200) {
                    loadData();
                }
            } catch (error) {
                alert('计算失败: ' + error.message);
            }
        }
        
        // 显示详情
        async function showDetail(sku) {
            try {
                const response = await fetch(`/api/safety-stock/detail/${sku}`);
                const result = await response.json();
                
                if (result.code === 200) {
                    renderModal(result.data);
                    document.getElementById('detailModal').classList.add('active');
                } else {
                    alert(result.msg);
                }
            } catch (error) {
                alert('加载详情失败: ' + error.message);
            }
        }
        
        // 渲染弹窗
        function renderModal(data) {
            const html = `
                <div class="detail-row">
                    <span class="detail-label">SKU</span>
                    <span class="detail-value">${data.sku}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">产品名称</span>
                    <span class="detail-value">${data.sku_name || '-'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">计算日期</span>
                    <span class="detail-value">${data.calc_date}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">日均需求</span>
                    <span class="detail-value">${data.demand_avg}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">需求峰值</span>
                    <span class="detail-value">${data.demand_max}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">平均交货期</span>
                    <span class="detail-value">${data.lead_time_avg}天</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">最长交货期</span>
                    <span class="detail-value">${data.lead_time_max}天</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">安全库存</span>
                    <span class="detail-value">${data.safety_stock}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">库存下限</span>
                    <span class="detail-value">${data.inventory_min}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">再订货点</span>
                    <span class="detail-value">${data.reorder_point}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">库存上限</span>
                    <span class="detail-value">${data.inventory_max}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">当前库存</span>
                    <span class="detail-value">${data.current_stock}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">建议补货量</span>
                    <span class="detail-value">${data.suggested_qty > 0 ? data.suggested_qty : '-'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">库存状态</span>
                    <span class="detail-value">
                        <span class="status-badge status-${data.stock_status}">
                            ${getStatusText(data.stock_status)}
                        </span>
                    </span>
                </div>
            `;
            document.getElementById('modalBody').innerHTML = html;
        }
        
        // 关闭弹窗
        function closeModal() {
            document.getElementById('detailModal').classList.remove('active');
        }
        
        // 获取状态文本
        function getStatusText(status) {
            const map = {
                'normal': '正常',
                'warning': '预警',
                'danger': '危险'
            };
            return map[status] || status;
        }
        
        // 显示错误
        function showError(msg) {
            document.getElementById('tableBody').innerHTML = 
                `<tr><td colspan="10" class="empty">${msg}</td></tr>`;
        }
        
        // 点击弹窗外部关闭
        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
