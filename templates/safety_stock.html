<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全库存管理</title>
    <!-- AG Grid CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='ag-grid/ag-grid.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='ag-grid/ag-theme-alpine.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='layui/css/layui.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f2f5;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        /* 头部 */
        .header {
            background: #fff;
            padding: 20px 24px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        
        .header-title {
            font-size: 24px;
            font-weight: 600;
            color: #262626;
        }
        
        .header-subtitle {
            font-size: 14px;
            color: #8c8c8c;
            margin-top: 4px;
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
        }
        
        /* 统计卡片 - 简约风格 */
        .stat-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-left: 4px solid #d9d9d9;
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }
        
        .stat-card.active {
            box-shadow: 0 0 0 2px #1890ff, 0 8px 24px rgba(0,0,0,0.12);
        }
        
        .stat-card.danger {
            border-left-color: #ff4d4f;
        }
        
        .stat-card.warning {
            border-left-color: #faad14;
        }
        
        .stat-card.info {
            border-left-color: #1890ff;
        }
        
        .stat-card.success {
            border-left-color: #52c41a;
        }
        
        .stat-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .stat-card-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: #f5f5f5;
        }
        
        .stat-card.danger .stat-card-icon {
            background: #fff1f0;
        }
        
        .stat-card.warning .stat-card-icon {
            background: #fffbe6;
        }
        
        .stat-card.info .stat-card-icon {
            background: #e6f7ff;
        }
        
        .stat-card.success .stat-card-icon {
            background: #f6ffed;
        }
        
        .stat-card-value {
            font-size: 32px;
            font-weight: 600;
            line-height: 1;
            margin-bottom: 8px;
            color: #262626;
        }
        
        .stat-card-label {
            font-size: 14px;
            color: #8c8c8c;
        }
        
        /* 主内容区 */
        .main-content {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        
        /* 工具栏 */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .toolbar-left {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .toolbar-right {
            display: flex;
            gap: 8px;
        }
        
        .filter-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .filter-item label {
            font-size: 14px;
            color: #595959;
            white-space: nowrap;
        }
        
        .filter-item input,
        .filter-item select {
            width: 140px;
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .filter-item input:focus,
        .filter-item select:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24,144,255,0.2);
        }
        
        /* 按钮 */
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-primary {
            background: #1890ff;
            color: #fff;
        }
        
        .btn-primary:hover {
            background: #40a9ff;
        }
        
        .btn-success {
            background: #52c41a;
            color: #fff;
        }
        
        .btn-success:hover {
            background: #73d13d;
        }
        
        .btn-default {
            background: #fff;
            color: #595959;
            border: 1px solid #d9d9d9;
        }
        
        .btn-default:hover {
            color: #40a9ff;
            border-color: #40a9ff;
        }
        
        /* AG Grid */
        .grid-container {
            height: 600px;
            width: 100%;
        }
        
        #safetyStockGrid {
            height: 100%;
            width: 100%;
        }
        
        .ag-theme-alpine {
            --ag-background-color: #fff;
            --ag-header-background-color: #fafafa;
            --ag-odd-row-background-color: #fafafa;
            --ag-header-foreground-color: #262626;
            --ag-foreground-color: #595959;
            --ag-border-color: #f0f0f0;
            --ag-row-hover-color: #e6f7ff;
            --ag-selected-row-background-color: #e6f7ff;
        }
        
        /* 状态单元格样式 - 简约 */
        .cell-status {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        
        .status-danger {
            background: #fff1f0;
            color: #ff4d4f;
        }
        
        .status-warning {
            background: #fffbe6;
            color: #faad14;
        }
        
        .status-info {
            background: #e6f7ff;
            color: #1890ff;
        }
        
        .status-success {
            background: #f6ffed;
            color: #52c41a;
        }
        
        /* ABC标签 - 简约 */
        .abc-tag {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 600;
            background: #f5f5f5;
            color: #595959;
        }
        
        .abc-a {
            background: #fff1f0;
            color: #ff4d4f;
        }
        
        .abc-b {
            background: #e6f7ff;
            color: #1890ff;
        }
        
        .abc-c {
            background: #f6ffed;
            color: #52c41a;
        }
        
        /* 数字格式化 */
        .cell-number {
            font-family: 'Roboto Mono', monospace;
            font-weight: 500;
        }
        
        /* 分页大小选择器 */
        .page-size-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #666;
        }

        .page-size-selector select {
            padding: 4px 8px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            background: #fff;
        }

        .page-size-selector select:hover {
            border-color: #1890ff;
        }

        .page-size-selector select:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
        }

        /* AG Grid 分页面板 */
        .ag-paging-panel {
            position: relative;
            height: auto !important;
            min-height: 60px;
            padding: 8px 0;
        }

        /* 隐藏 AG Grid 自带的行统计信息（第 X 到 Y 条，共 Z 条） */
        .ag-paging-row-summary-panel > span {
            display: none !important;
        }

        /* 统计信息面板 - 水平布局，与跳转器并排 */
        .ag-paging-row-summary-panel {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* 页码跳转器 */
         .page-jumper {
             display: flex;
             align-items: center;
             gap: 8px;
             font-size: 13px;
             color: #666;
         }

         .page-jumper input {
            width: 50px;
            padding: 4px 8px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 13px;
            text-align: center;
        }

        .page-jumper input:hover {
            border-color: #1890ff;
        }

        .page-jumper input:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
        }

        .page-jumper button {
            padding: 4px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            background: #fff;
            font-size: 13px;
            cursor: pointer;
            color: #666;
        }

        .page-jumper button:hover {
            border-color: #1890ff;
            color: #1890ff;
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            .stat-cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .stat-cards {
                grid-template-columns: 1fr;
            }
            
            .toolbar {
                flex-direction: column;
                gap: 12px;
            }
            
            .toolbar-left {
                flex-wrap: wrap;
            }
            
            .page-size-selector {
                 position: static;
                 transform: none;
                 margin-bottom: 10px;
             }
             
             .ag-paging-panel {
                 padding: 15px 0;
             }
             
             .ag-paging-row-summary-panel {
                 gap: 12px;
             }
         }
     </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div>
                <div class="header-title">安全库存管理</div>
                <div class="header-subtitle">基于ABC分类和季节性调整的智能库存预警系统</div>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" id="btnExport">
                    <i class="layui-icon">&#xe601;</i> 导出数据
                </button>
            </div>
        </div>
        
        <!-- 统计卡片 -->
        <div class="stat-cards">
            <div class="stat-card danger" data-status="需补货" id="cardDanger">
                <div class="stat-card-header">
                    <div class="stat-card-icon">🚨</div>
                </div>
                <div class="stat-card-value" id="countDanger">0</div>
                <div class="stat-card-label">需补货产品</div>
            </div>
            <div class="stat-card warning" data-status="库存偏低" id="cardWarning">
                <div class="stat-card-header">
                    <div class="stat-card-icon">⚠️</div>
                </div>
                <div class="stat-card-value" id="countWarning">0</div>
                <div class="stat-card-label">库存偏低产品</div>
            </div>
            <div class="stat-card info" data-status="库存积压" id="cardInfo">
                <div class="stat-card-header">
                    <div class="stat-card-icon">📦</div>
                </div>
                <div class="stat-card-value" id="countInfo">0</div>
                <div class="stat-card-label">库存积压产品</div>
            </div>
            <div class="stat-card success" data-status="正常" id="cardSuccess">
                <div class="stat-card-header">
                    <div class="stat-card-icon">✅</div>
                </div>
                <div class="stat-card-value" id="countSuccess">0</div>
                <div class="stat-card-label">库存正常产品</div>
            </div>
        </div>
        
        <!-- 说明区域 -->
        <div class="info-panel" style="background: #fff; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
            <div style="font-size: 14px; color: #262626; font-weight: 600; margin-bottom: 10px;">📊 ABC分类说明</div>
            <div style="display: flex; gap: 30px; flex-wrap: wrap; font-size: 13px; color: #595959;">
                <div><span class="abc-tag abc-a">A</span> <strong>前20%</strong> 高销量产品 | 高服务水平 | 覆盖10天</div>
                <div><span class="abc-tag abc-b">B</span> <strong>中间60%</strong> 中销量产品 | 中服务水平 | 覆盖20天</div>
                <div><span class="abc-tag abc-c">C</span> <strong>后20%</strong> 低销量产品 | 低服务水平 | 覆盖30天</div>
            </div>
            <div style="margin-top: 10px; font-size: 12px; color: #8c8c8c; border-top: 1px dashed #e8e8e8; padding-top: 10px;">
                💡 <strong>季节系数</strong>：根据过去12个月销量波动自动调整（0.7-1.3），旺季增加安全库存，淡季减少安全库存
            </div>
        </div>
        
        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 工具栏 -->
            <div class="toolbar">
                <div class="toolbar-left">
                    <div class="filter-item">
                        <label>关键词：</label>
                        <input type="text" id="filterKeyword" placeholder="OE/品牌/名称">
                    </div>
                    <div class="filter-item">
                        <label>库存状态：</label>
                        <select id="filterStatus">
                            <option value="">全部</option>
                            <option value="需补货">需补货</option>
                            <option value="库存偏低">库存偏低</option>
                            <option value="库存积压">库存积压</option>
                            <option value="正常">正常</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <label>ABC分类：</label>
                        <select id="filterABC">
                            <option value="">全部</option>
                            <option value="A">A类</option>
                            <option value="B">B类</option>
                            <option value="C">C类</option>
                        </select>
                    </div>
                </div>
                <div class="toolbar-right">
                    <button class="btn btn-primary" id="btnSearch">
                        <i class="layui-icon">&#xe615;</i> 查询
                    </button>
                    <button class="btn btn-default" id="btnReset">
                        <i class="layui-icon">&#xe669;</i> 重置
                    </button>
                </div>
            </div>
            
            <!-- AG Grid 表格 -->
            <div class="grid-container">
                <div id="safetyStockGrid" class="ag-theme-alpine"></div>
            </div>
        </div>
    </div>
    
    <!-- 依赖脚本 -->
    <script src="{{ url_for('static', filename='layui/layui.js') }}"></script>
    <script src="{{ url_for('static', filename='ag-grid/ag-grid-community.min.js') }}"></script>
    <script src="{{ url_for('static', filename='ag-grid/ag-grid-utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/safety_stock/safety_stock.js') }}"></script>
</body>
</html>
