<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>权限不足 - 巴博瑞科技</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='layui/css/layui.css') }}">
    <style>
        body {
            background-color: #f2f2f2;
        }
        .forbidden-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .forbidden-panel {
            width: 450px;
            padding: 40px 30px;
            background: #fff;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .forbidden-icon {
            font-size: 64px;
            color: #FF5722;
            margin-bottom: 20px;
        }
        .forbidden-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }
        .forbidden-message {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        .forbidden-permission {
            font-size: 13px;
            color: #999;
            background: #f6f6f6;
            padding: 8px 12px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 25px;
        }
        .forbidden-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .forbidden-footer {
            text-align: center;
            margin-top: 25px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="forbidden-container">
        <div class="forbidden-panel">
            <div class="forbidden-icon">
                <i class="layui-icon layui-icon-about"></i>
            </div>
            <div class="forbidden-title">权限不足</div>
            <div class="forbidden-message">您没有权限访问此页面</div>
            {% if required_permission %}
            <div class="forbidden-permission">
                需要权限：{{ required_permission }}
            </div>
            {% endif %}
            <div class="forbidden-actions">
                <button class="layui-btn layui-btn-primary" onclick="goBack()">返回上一页</button>
                <button class="layui-btn" onclick="goHome()">返回首页</button>
            </div>
            <div class="forbidden-footer">
                © 2025-2026 巴博瑞科技
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='layui/layui.js') }}"></script>
    <script>
        function goBack() {
            if (document.referrer) {
                window.history.back();
            } else {
                window.location.href = '/';
            }
        }

        function goHome() {
            window.location.href = '/';
        }
    </script>
</body>
</html>
