<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>采购计划</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='layui/css/layui.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='js/handsontable/handsontable.full.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/purchase_plan/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='js/components/grid-column-menu/grid-column-menu.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='js/components/filter_panel/filter-panel.css') }}">
    <script src="{{ url_for('static', filename='layui/layui.js') }}"></script>
    <script src="{{ url_for('static', filename='js/handsontable/handsontable.full.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/components/grid-column-menu/grid-column-menu.js') }}"></script>
    <script src="{{ url_for('static', filename='js/components/custom-pagination/custom-pagination.js') }}"></script>
    <script src="{{ url_for('static', filename='js/components/handsontable-builder/sortable-utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/components/handsontable-builder/handsontable-builder.js') }}"></script>
    <script src="{{ url_for('static', filename='js/purchase_plan/common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/date-range-picker.js') }}"></script>
    <script src="{{ url_for('static', filename='js/purchase_plan/inquiry_module.js') }}"></script>
    <script src="{{ url_for('static', filename='js/purchase_plan/compare_module.js') }}"></script>
    <style>
        .file-input {
            display: none;
        }

        .btn-danger {
            background-color: #fff2f0;
            border: 1px solid #ffccc7;
            color: #ff4d4f;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-danger:hover {
            background-color: #ff4d4f;
            color: #fff;
        }

        /* 加价设置 - 扁平组合式 */
        .markup-input-container {
            display: inline-flex;
            align-items: stretch;
            border: 1px solid #d9d9d9;
            height: 30px;
            line-height: 30px;
            border-radius: 3px;
            overflow: hidden;
        }

        .markup-btn {
            width: 30px;
            border: none;
            background-color: #fafafa;
            color: #595959;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .markup-btn:hover {
            background-color: #f1f5f9;
            color: #1e3a8a;
        }

        .markup-btn:active {
            background-color: #eff6ff;
        }

        .markup-input {
            width: 70px;
            border: none;
            border-left: 1px solid #d9d9d9;
            border-right: 1px solid #d9d9d9;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: #1e293b;
            background-color: #fff;
            padding: 0;
        }

        .markup-input:focus {
            outline: none;
        }

        /* 上传文件页操作按钮区 */
        .upload-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }

        /* 上传文件页工具栏：加价率 + 确认上传 */
        .upload-toolbar {
            margin-bottom: 12px;
        }

        .upload-markup-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .upload-markup-label {
            font-size: 13px;
            color: #475569;
        }

        .upload-markup-hint {
            font-size: 12px;
            color: #94a3b8;
            flex: 1;
        }

        /* 数据预览表格区域 */
        .preview-table-wrapper {
            border: 1px solid #e2e8f0;
            height: 520px;
            overflow: visible;
            display: flex;
            flex-direction: column;
        }

        #previewHandsontableContainer {
            flex: 1;
            width: 100%;
            min-height: 0;
        }

        /* 上传文件标签页容器 */
        .upload-container {
            background-color: #fff;
            border: 1px solid #e2e8f0;
            border-top: none;
            padding: 16px;
        }

        /* 数据容器扁平化 */
        .data-container {
            border: 1px solid #e2e8f0;
            border-radius: 0;
            box-shadow: none;
            margin-top: 0;
        }

        #handsontable-container {
            flex: 1;
            min-height: 0;
        }

        #mainPaginationBar {
            flex-shrink: 0;
        }

        /* 页面级模块布局 */
        .purchase-plan-page {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 32px);
            min-height: 600px;
        }

        .page-header {
            flex-shrink: 0;
            margin-bottom: 12px;
            border-bottom: none;
            border-radius: 3px;
            padding: 10px 16px;
        }

        .module-tabs {
            display: flex;
            gap: 4px;
        }

        .module-tab {
            padding: 8px 24px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            background-color: transparent;
            color: #cbd5e1;
            font-size: 14px;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s;
        }

        .module-tab:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.7);
            background-color: rgba(255, 255, 255, 0.08);
        }

        .module-tab.active {
            background-color: #fff;
            border-color: #fff;
            color: #1e3a8a;
            font-weight: 600;
        }

        .main-layout {
            display: flex;
            flex: 1;
            min-height: 0;
            gap: 12px;
        }

        .filter-panel {
            width: 260px;
            flex-shrink: 0;
            background-color: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 3px;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .filter-panel-title {
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
        }

        .filter-item {
            margin-bottom: 14px;
        }

        .filter-item label {
            display: block;
            font-size: 12px;
            color: #475569;
            margin-bottom: 6px;
        }

        .filter-item .search-input {
            width: 100%;
        }

        .filter-actions {
            margin-top: auto;
            display: flex;
            gap: 8px;
        }

        .filter-actions .btn {
            flex: 1;
        }

        .content-area {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background-color: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
        }

        .module-content {
            display: none;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .module-content.active {
            display: flex;
        }

        .module-content > .data-tabs {
            flex-shrink: 0;
        }

        .module-content > .upload-container,
        .module-content > .data-container {
            flex: 1;
            min-height: 0;
        }

        .compare-content {
            padding: 16px;
            overflow-y: auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="purchase-plan-page">
        <div class="page-header">
            <div class="module-tabs">
                <button class="module-tab active" id="moduleTabInquiry" data-module="inquiry">询价模块</button>
                <button class="module-tab" id="moduleTabCompare" data-module="compare">比价模块</button>
            </div>
        </div>

        <div class="main-layout">
            <!-- 左侧筛选面板 -->
            <aside class="filter-panel" id="filterPanel">
                <div class="filter-panel-title">筛选条件</div>
                <div class="filter-item">
                    <label>OE号</label>
                    <input type="text" class="search-input" id="searchOe" placeholder="请输入OE号">
                </div>
                <div class="filter-item">
                    <label>品牌</label>
                    <input type="text" class="search-input" id="searchBrand" placeholder="请输入品牌">
                </div>
                <div class="filter-item">
                    <label>供应商</label>
                    <input type="text" class="search-input" id="searchSupplier" placeholder="请输入供应商">
                </div>
                <div class="filter-item" id="dateRangeFilterItem" style="display: none;">
                    <label>日期范围</label>
                    <input type="text" class="search-input" id="gzbbrDateRange" placeholder="选择日期范围" readonly>
                </div>
                <div class="filter-actions">
                    <button type="button" class="btn btn-default" id="filterResetBtn">清空</button>
                    <button type="button" class="btn btn-primary" id="filterSearchBtn">搜索</button>
                </div>
            </aside>

            <!-- 右侧内容区 -->
            <main class="content-area">
                <!-- 询价模块 -->
                <div class="module-content active" id="inquiryModule" data-template-url="{{ url_for('static', filename='excel/virtual_inventory.xlsx') }}">
                    <!-- 数据标签页 -->
                    <div class="data-tabs">
                        <button class="data-tab active" id="tabUpload" data-type="upload">
                            上传文件
                        </button>
                        <button class="data-tab" id="tabNormal" data-type="normal">
                            正常询价数据<span class="tab-badge" id="normalBadge">0</span>
                        </button>
                        <button class="data-tab" id="tabDirect" data-type="direct">
                            友商价格记录<span class="tab-badge" id="directBadge">0</span>
                        </button>
                        <button class="data-tab" id="tabGzbbr" data-type="gzbbr">
                            失效时间调整<span class="tab-badge" id="gzbbrBadge">0</span>
                        </button>
                    </div>

                    <!-- 上传文件标签页内容 -->
                    <div class="upload-container" id="uploadContainer">
                        <!-- 操作按钮区 -->
                        <div class="upload-actions">
                            <button type="button" class="btn btn-primary" id="btnDownloadTemplate">下载询价模板</button>
                            <button type="button" class="btn btn-primary" id="btnImport">导入文件</button>
                        </div>

                        <!-- 隐藏的文件输入框 -->
                        <input type="file" class="file-input" id="fileInput" accept=".csv,.xls,.xlsx" style="display: none;">

                        <!-- 加价率设置与确认上传 -->
                        <div class="upload-toolbar" id="uploadMarkupSection" style="display: none;">
                            <div class="upload-markup-row">
                                <span class="upload-markup-label">加价率：</span>
                                <div class="markup-input-container">
                                    <button class="markup-btn" id="markupDecrease">−</button>
                                    <input type="number" class="markup-input" id="markupInput" value="1.00" min="0.05" step="0.05">
                                    <button class="markup-btn" id="markupIncrease">+</button>
                                </div>
                                <span class="upload-markup-hint">最终价格 = 原价 × 倍数</span>
                                <button type="button" class="btn btn-primary" id="btnUploadSystem">上传系统</button>
                                <button type="button" class="btn btn-primary" id="btnUploadRecordOnly">记录友商价格</button>
                            </div>
                        </div>

                        <!-- 数据预览表格 -->
                        <div class="preview-table-wrapper" id="previewTableWrapper" style="display: none;">
                            <div id="previewHandsontableContainer"></div>
                        </div>
                    </div>

                    <div class="data-container" id="mainDataContainer" style="display: none;">
                        <div class="data-header">
                            <span id="dataTitle">询价比价数据</span>
                        </div>
                        <div id="handsontable-container"></div>
                        <div id="mainPaginationBar"></div>
                    </div>

                    <!-- data.gzbbr 失效时间调整 -->
                    <div class="data-container" id="gzbbrContainer" style="display: none; flex-direction: column; flex: 1; min-height: 0;">
                        <div class="data-header">
                            <span>报价失效时间调整</span>
                            <div class="search-bar">
                                <input type="text" class="search-input" id="gzbbrSearchOe" placeholder="OE号">
                                <input type="text" class="search-input" id="gzbbrSearchSupplier" placeholder="供应商">
                                <input type="text" class="search-input" id="gzbbrSearchBrand" placeholder="品牌（前端过滤）">
                                <button class="btn btn-primary" id="gzbbrSearchBtn">搜索</button>
                            </div>
                        </div>
                        <div class="data-header" style="margin-top: 10px;">
                            <div class="search-bar">
                                <label style="font-size: 14px; color: #333;">新失效时间：</label>
                                <input type="datetime-local" class="search-input" id="gzbbrLoseDate" style="width: 200px;">
                                <button class="btn btn-primary" id="gzbbrUpdateBtn">批量更新失效时间</button>
                                <label style="margin-left: 15px; font-size: 14px;">
                                    <input type="checkbox" id="gzbbrSelectAll"> 全选
                                </label>
                            </div>
                        </div>
                        <div id="gzbbrHandsontableContainer" style="margin-top: 10px; flex: 1; min-height: 0;"></div>
                        <div id="gzbbrPaginationBar"></div>
                    </div>
                </div>

                <!-- 比价模块 -->
                <div class="module-content" id="compareModule" data-template-url="{{ url_for('static', filename='excel/OE_Brand_Price_brandcode.xlsx') }}">
                    <div class="compare-content">
                        <div class="upload-actions">
                            <a class="btn btn-default" id="btnCompareDownloadTemplate">下载模板</a>
                            <button type="button" class="btn btn-primary" id="btnCompareImport">导入文件</button>
                            <input type="file" id="compareFileInput" accept=".xlsx,.xls" style="display: none;">
                        </div>

                        <!-- 导入日志区域 -->
                        <div class="data-container" style="height: auto; min-height: 300px;">
                            <div class="data-header">
                                <span>导入日志</span>
                            </div>
                            <div style="padding: 16px; overflow-x: auto;">
                                <table id="importLogTable" class="bbr-table">
                                    <thead>
                                        <tr>
                                            <th>时间</th>
                                            <th>文件名</th>
                                            <th style="text-align: center;">导入条数</th>
                                            <th style="text-align: center;">匹配条数</th>
                                            <th>操作人</th>
                                            <th style="text-align: center;">操作</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr class="empty-row">
                                            <td colspan="6">暂无导入记录</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 批量更新 loading 提示 -->
    <div id="gzbbrLoadingMask" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center;">
        <div style="background: #fff; padding: 30px 50px; border-radius: 8px; text-align: center; font-size: 16px; color: #333;">
            <div style="margin-bottom: 15px;">正在更新，请稍候...</div>
            <div class="spinner" style="width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top: 4px solid #1e3a8a; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
        </div>
    </div>

    <script>
        // 模块切换
        function initModuleSwitch() {
            const tabInquiry = document.getElementById('moduleTabInquiry');
            const tabCompare = document.getElementById('moduleTabCompare');
            const inquiryModule = document.getElementById('inquiryModule');
            const compareModule = document.getElementById('compareModule');
            const dateRangeItem = document.getElementById('dateRangeFilterItem');

            function switchModule(module) {
                if (module === 'inquiry') {
                    tabInquiry.classList.add('active');
                    tabCompare.classList.remove('active');
                    inquiryModule.classList.add('active');
                    compareModule.classList.remove('active');
                    dateRangeItem.style.display = 'none';
                    // 根据当前标签决定是否显示日期筛选
                    if (window.InquiryModule && typeof window.InquiryModule.refreshFilterPanel === 'function') {
                        window.InquiryModule.refreshFilterPanel();
                    }
                } else {
                    tabInquiry.classList.remove('active');
                    tabCompare.classList.add('active');
                    inquiryModule.classList.remove('active');
                    compareModule.classList.add('active');
                    dateRangeItem.style.display = 'none';
                }
            }

            tabInquiry.addEventListener('click', () => switchModule('inquiry'));
            tabCompare.addEventListener('click', () => switchModule('compare'));

            // URL参数支持：?module=compare 直接打开比价模块
            const params = new URLSearchParams(window.location.search);
            if (params.get('module') === 'compare') {
                switchModule('compare');
            }
        }

        // 左侧筛选按钮绑定
        function initFilterPanel() {
            const searchBtn = document.getElementById('filterSearchBtn');
            const resetBtn = document.getElementById('filterResetBtn');

            searchBtn.addEventListener('click', () => {
                const inquiryModule = document.getElementById('inquiryModule');
                if (!inquiryModule.classList.contains('active')) return;

                const tabGzbbr = document.getElementById('tabGzbbr');
                if (tabGzbbr && tabGzbbr.classList.contains('active')) {
                    document.getElementById('gzbbrSearchBtn').click();
                    return;
                }

                const oe = document.getElementById('searchOe').value;
                const brand = document.getElementById('searchBrand').value;
                const supplier = document.getElementById('searchSupplier').value;

                // 同步到子标签内的搜索框（保持JS兼容）
                document.getElementById('gzbbrSearchOe').value = oe;
                document.getElementById('gzbbrSearchBrand').value = brand;
                document.getElementById('gzbbrSearchSupplier').value = supplier;

                if (window.InquiryModule && typeof window.InquiryModule.loadData === 'function') {
                    window.InquiryModule.loadData(oe, brand, supplier);
                }
            });

            resetBtn.addEventListener('click', () => {
                document.getElementById('searchOe').value = '';
                document.getElementById('searchBrand').value = '';
                document.getElementById('searchSupplier').value = '';
                document.getElementById('gzbbrSearchOe').value = '';
                document.getElementById('gzbbrSearchBrand').value = '';
                document.getElementById('gzbbrSearchSupplier').value = '';
                if (window.InquiryModule && typeof window.InquiryModule.loadData === 'function') {
                    window.InquiryModule.loadData();
                }
            });

            ['searchOe', 'searchBrand', 'searchSupplier'].forEach(id => {
                document.getElementById(id).addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        searchBtn.click();
                    }
                });
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            initModuleSwitch();
            initFilterPanel();
            if (window.InquiryModule) {
                window.InquiryModule.init();
            }
            if (window.CompareModule) {
                window.CompareModule.init();
            }
        });
    </script>
</body>
</html>
