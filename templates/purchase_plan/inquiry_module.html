<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>询价模块 - 采购计划</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='layui/css/layui.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='js/handsontable/handsontable.full.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/purchase_plan/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='js/components/grid-column-menu/grid-column-menu.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='js/components/filter_panel/filter-panel.css') }}">
    <script src="{{ url_for('static', filename='layui/layui.js') }}"></script>
    <script src="{{ url_for('static', filename='js/handsontable/handsontable.full.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/components/grid-column-menu/grid-column-menu.js') }}"></script>
    <script src="{{ url_for('static', filename='js/components/custom-pagination/custom-pagination.js') }}"></script>
    <script src="{{ url_for('static', filename='js/components/handsontable-builder/handsontable-builder.js') }}"></script>
    <script src="{{ url_for('static', filename='js/purchase_plan/common.js') }}"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .file-input {
            display: none;
        }

        .btn-danger {
            background-color: #fff2f0;
            border: 1px solid #ffccc7;
            color: #ff4d4f;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-danger:hover {
            background-color: #ff4d4f;
            color: #fff;
        }

        /* 加价设置 - 扁平组合式 */
        .markup-input-container {
            display: inline-flex;
            align-items: stretch;
            border: 1px solid #d9d9d9;
            height: 36px;
            line-height: 36px;
        }

        .markup-btn {
            width: 36px;
            border: none;
            background-color: #fafafa;
            color: #333;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .markup-btn:hover {
            background-color: #f0f0f0;
            color: #1890ff;
        }

        .markup-btn:active {
            background-color: #e6f7ff;
        }

        .markup-input {
            width: 80px;
            border: none;
            border-left: 1px solid #d9d9d9;
            border-right: 1px solid #d9d9d9;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            background-color: #fff;
            padding: 0;
        }

        .markup-input:focus {
            outline: none;
        }

        /* 上传文件页操作按钮区 */
        .upload-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        /* 上传文件页工具栏：加价率 + 确认上传 */
        .upload-toolbar {
            margin-bottom: 15px;
        }

        .upload-markup-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .upload-markup-label {
            font-size: 14px;
            color: #333;
        }

        .upload-markup-hint {
            font-size: 13px;
            color: #666;
            flex: 1;
        }

        /* 数据预览表格区域 */
        .preview-table-wrapper {
            margin-top: 15px;
            border: 1px solid #e8e8e8;
            height: 560px;
            overflow: visible;
            display: flex;
            flex-direction: column;
        }

        #previewHandsontableContainer {
            flex: 1;
            width: 100%;
            min-height: 0;
        }

        /* 标签页样式 */
        .data-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 0;
            border-bottom: 1px solid #e8e8e8;
            background-color: #fafafa;
            padding: 0 20px;
        }

        .data-tab {
            padding: 12px 24px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 14px;
            color: #666;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }

        .data-tab:hover {
            color: #1890ff;
        }

        .data-tab.active {
            color: #1890ff;
            border-bottom-color: #1890ff;
            background-color: #fff;
            font-weight: 500;
        }

        .tab-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            margin-left: 8px;
            background-color: #f0f0f0;
            color: #666;
        }

        .data-tab.active .tab-badge {
            background-color: #1890ff;
            color: #fff;
        }

        /* 上传文件标签页容器 */
        .upload-container {
            background-color: #fff;
            border: 1px solid #e8e8e8;
            padding: 20px;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        /* 数据容器扁平化 */
        .data-container {
            border: 1px solid #e8e8e8;
            border-radius: 0;
            box-shadow: none;
            margin-top: 20px;
        }

        #handsontable-container {
            height: calc(100vh - 220px);
        }

    </style>
</head>
<body>
    <div class="container">
        <h2>询价模块</h2>

        <!-- 数据标签页 -->
        <div class="data-tabs">
            <button class="data-tab active" id="tabUpload" data-type="upload">
                上传文件
            </button>
            <button class="data-tab" id="tabNormal" data-type="normal">
                正常询价数据<span class="tab-badge" id="normalBadge">0</span>
            </button>
            <button class="data-tab" id="tabDirect" data-type="direct">
                直接入库数据<span class="tab-badge" id="directBadge">0</span>
            </button>
            <button class="data-tab" id="tabGzbbr" data-type="gzbbr">
                失效时间调整<span class="tab-badge" id="gzbbrBadge">0</span>
            </button>
        </div>

        <!-- 上传文件标签页内容 -->
        <div class="upload-container" id="uploadContainer">
            <!-- 操作按钮区 -->
            <div class="upload-actions">
                <button type="button" class="btn btn-primary" id="btnDownloadTemplate">下载询价模板</button>
                <button type="button" class="btn btn-primary" id="btnImportUpload">导入文件（上传系统）</button>
                <button type="button" class="btn btn-primary" id="btnImportRecord">导入文件（仅记录入库不上传）</button>
                <button type="button" class="btn btn-default" id="btnDownloadCompareTemplate">下载比对模板</button>
                <button type="button" class="btn btn-default" id="btnCompareHistory">采购历史比对</button>
            </div>

            <!-- 隐藏的文件输入框 -->
            <input type="file" class="file-input" id="fileInput" accept=".csv,.xls,.xlsx" style="display: none;">

            <!-- 加价率设置与确认上传 -->
            <div class="upload-toolbar" id="uploadMarkupSection" style="display: none;">
                <div class="upload-markup-row">
                    <span class="upload-markup-label">加价率：</span>
                    <div class="markup-input-container">
                        <button class="markup-btn" id="markupDecrease">−</button>
                        <input type="number" class="markup-input" id="markupInput" value="1.00" min="0.05" step="0.05">
                        <button class="markup-btn" id="markupIncrease">+</button>
                    </div>
                    <span class="upload-markup-hint">最终价格 = 原价 × 倍数</span>
                    <button type="button" class="btn btn-primary" id="btnConfirmUpload">确认上传</button>
                </div>
            </div>

            <!-- 数据预览表格 -->
            <div class="preview-table-wrapper" id="previewTableWrapper" style="display: none;">
                <div id="previewHandsontableContainer"></div>
            </div>
        </div>

        <div class="data-container" id="mainDataContainer" style="display: none;">
            <div class="data-header">
                <span id="dataTitle">询价比价数据</span>
                <div class="search-bar">
                    <input type="text" class="search-input" id="searchOe" placeholder="搜索OE号">
                    <input type="text" class="search-input" id="searchBrand" placeholder="搜索品牌">
                    <input type="text" class="search-input" id="searchSupplier" placeholder="搜索供应商">
                    <button class="btn btn-default" id="searchBtn">搜索</button>
                    <button class="btn btn-default" id="refreshBtn">刷新</button>
                </div>
            </div>
            <div id="handsontable-container"></div>
        </div>

        <!-- data.gzbbr 失效时间调整 -->
        <div class="data-container" id="gzbbrContainer" style="display: none; flex-direction: column; flex: 1; min-height: 0;">
            <div class="data-header">
                <span>报价失效时间调整</span>
                <div class="search-bar">
                    <input type="text" class="search-input" id="gzbbrSearchOe" placeholder="OE号">
                    <input type="text" class="search-input" id="gzbbrSearchSupplier" placeholder="供应商">
                    <input type="text" class="search-input" id="gzbbrSearchBrand" placeholder="品牌（前端过滤）">
                    <button class="btn btn-primary" id="gzbbrSearchBtn">搜索</button>
                </div>
            </div>
            <div class="data-header" style="margin-top: 10px;">
                <div class="search-bar">
                    <label style="font-size: 14px; color: #333;">新失效时间：</label>
                    <input type="datetime-local" class="search-input" id="gzbbrLoseDate" style="width: 200px;">
                    <button class="btn btn-primary" id="gzbbrUpdateBtn">批量更新失效时间</button>
                    <label style="margin-left: 15px; font-size: 14px;">
                        <input type="checkbox" id="gzbbrSelectAll"> 全选
                    </label>
                </div>
            </div>
            <div id="gzbbrHandsontableContainer" style="margin-top: 10px; flex: 1; min-height: 0;"></div>
        </div>
    </div>

    <!-- 批量更新 loading 提示 -->
    <div id="gzbbrLoadingMask" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center;">
        <div style="background: #fff; padding: 30px 50px; border-radius: 8px; text-align: center; font-size: 16px; color: #333;">
            <div style="margin-bottom: 15px;">正在更新，请稍候...</div>
            <div class="spinner" style="width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #1890ff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
        </div>
    </div>

    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <script>
        // 抑制 Handsontable 14.1.0 内部事件兼容性问题（不影响功能）
        window.addEventListener('error', function(e) {
            const msg = e.message || '';
            if (msg.includes("Cannot read properties of undefined (reading 'toLowerCase')") &&
                e.filename && e.filename.includes('handsontable')) {
                e.preventDefault();
            }
        });

        let tableBuilder = null;
        let allData = [];

        // 当前数据类型：upload-上传文件, normal-正常询价数据, direct-直接入库数据
        let currentDataType = 'upload';

        // 行高固定为40px
        const DEFAULT_ROW_HEIGHT = 40;

        // 记录哪些行被展开（用数据索引）
        let expandedRows = new Set();

        // 格式化数据并计算合并单元格
        function formatDataAndMergeCells(data) {
            const formattedData = [];
            const mergeCells = [];
            let currentRow = 0;

            // 按OE分组（保持原始顺序）
            const oeGroups = {};
            const oeOrder = [];
            data.forEach(item => {
                if (!oeGroups[item.oe]) {
                    oeGroups[item.oe] = [];
                    oeOrder.push(item.oe);
                }
                oeGroups[item.oe].push(item);
            });

            for (const oe of oeOrder) {
                const oeItems = oeGroups[oe];
                const oeStartRow = currentRow;
                const oeRowCount = oeItems.length;

                // 按品牌分组
                const brandGroups = {};
                const brandOrder = [];
                oeItems.forEach(item => {
                    const brand = item.brand || '未知品牌';
                    if (!brandGroups[brand]) {
                        brandGroups[brand] = [];
                        brandOrder.push(brand);
                    }
                    brandGroups[brand].push(item);
                });

                for (const brand of brandOrder) {
                    const brandItems = brandGroups[brand];
                    const brandStartRow = currentRow;
                    const brandRowCount = brandItems.length;

                    brandItems.forEach((item, index) => {
                        formattedData.push({
                            rowNumber: currentRow + 1,
                            oe: index === 0 ? formatEmptyValue(item.oe) : '',
                            brand: index === 0 ? formatEmptyValue(item.brand) : '',
                            supplier: formatEmptyValue(item.supplier),
                            original_price: item.original_price ? '¥' + parseFloat(item.original_price).toFixed(2) : '',
                            price: item.price ? '¥' + parseFloat(item.price).toFixed(2) : '',
                            markup_rate: item.markup_rate ? ((parseFloat(item.markup_rate) - 1) * 100).toFixed(2) + '%' : '',
                            markup_amount: item.markup_amount ? '¥' + parseFloat(item.markup_amount).toFixed(2) : '',
                            warehouse: formatEmptyValue(item.warehouse),
                            expire_time: formatEmptyValue(item.expire_time),
                            remark: formatEmptyValue(item.remark),
                            stock_quantity: formatEmptyValue(item.stock_quantity),
                            common_number: formatEmptyValue(item.common_number),
                            import_time: formatEmptyValue(item.import_time)
                        });
                        currentRow++;
                    });

                    if (brandRowCount > 1) {
                        mergeCells.push({ row: brandStartRow, col: 2, rowspan: brandRowCount, colspan: 1 });
                    }
                }

                if (oeRowCount > 1) {
                    mergeCells.push({ row: oeStartRow, col: 1, rowspan: oeRowCount, colspan: 1 });
                }
            }

            return { formattedData, mergeCells };
        }

        // 创建带展开按钮的列renderer（适配Builder）
        function createExpandableRenderer(threshold) {
            return function(instance, td, row, col, prop, value, cellProperties) {
                const isExpanded = expandedRows.has(row);
                const hasContent = value && value.length > threshold;

                const container = document.createElement('div');
                container.style.width = '100%';
                container.style.height = '100%';
                container.style.position = 'relative';

                const textSpan = document.createElement('span');
                textSpan.textContent = value || '';
                textSpan.style.display = 'block';
                textSpan.style.width = '100%';
                textSpan.style.overflow = 'hidden';
                textSpan.style.textOverflow = isExpanded ? 'clip' : 'ellipsis';
                textSpan.style.whiteSpace = isExpanded ? 'normal' : 'nowrap';
                textSpan.style.paddingRight = hasContent ? '20px' : '0';

                container.appendChild(textSpan);

                if (hasContent) {
                    const btn = document.createElement('button');
                    btn.className = 'expand-btn' + (isExpanded ? ' expanded' : '');
                    btn.innerHTML = isExpanded ? '−' : '+';
                    btn.style.position = 'absolute';
                    btn.style.right = '2px';
                    btn.style.top = isExpanded ? '4px' : '50%';
                    btn.style.transform = isExpanded ? 'none' : 'translateY(-50%)';
                    btn.onclick = function(e) {
                        e.stopPropagation();
                        if (expandedRows.has(row)) {
                            expandedRows.delete(row);
                        } else {
                            expandedRows.add(row);
                        }
                        if (tableBuilder) tableBuilder.refresh();
                    };
                    container.appendChild(btn);
                }

                td.innerHTML = '';
                td.appendChild(container);
                return td;
            };
        }

        // 创建通用号列的renderer（适配Builder）
        function createCommonNumberRenderer(threshold) {
            return function(instance, td, row, col, prop, value, cellProperties) {
                const isExpanded = expandedRows.has(row);
                const hasContent = value && value.length > threshold;

                const container = document.createElement('div');
                container.style.width = '100%';
                container.style.height = '100%';
                container.style.position = 'relative';

                const textSpan = document.createElement('span');
                if (isExpanded && value) {
                    textSpan.innerHTML = value.replace(/,/g, ',<br>');
                } else {
                    textSpan.textContent = value || '';
                }
                textSpan.style.display = 'block';
                textSpan.style.width = '100%';
                textSpan.style.overflow = 'hidden';
                textSpan.style.textOverflow = isExpanded ? 'clip' : 'ellipsis';
                textSpan.style.whiteSpace = isExpanded ? 'normal' : 'nowrap';
                textSpan.style.paddingRight = hasContent ? '20px' : '0';
                textSpan.style.lineHeight = isExpanded ? '1.6' : 'normal';

                container.appendChild(textSpan);

                if (hasContent) {
                    const btn = document.createElement('button');
                    btn.className = 'expand-btn' + (isExpanded ? ' expanded' : '');
                    btn.innerHTML = isExpanded ? '−' : '+';
                    btn.style.position = 'absolute';
                    btn.style.right = '2px';
                    btn.style.top = isExpanded ? '4px' : '50%';
                    btn.style.transform = isExpanded ? 'none' : 'translateY(-50%)';
                    btn.onclick = function(e) {
                        e.stopPropagation();
                        if (expandedRows.has(row)) {
                            expandedRows.delete(row);
                        } else {
                            expandedRows.add(row);
                        }
                        if (tableBuilder) tableBuilder.refresh();
                    };
                    container.appendChild(btn);
                }

                td.innerHTML = '';
                td.appendChild(container);
                return td;
            };
        }

        function initTableBuilder(data, mergeCells) {
            const container = document.getElementById('handsontable-container');
            container.innerHTML = '';

            if (tableBuilder) {
                tableBuilder.destroy();
                tableBuilder = null;
            }

            const gridKey = currentDataType === 'direct' ? 'direct_list' : 'normal_list';

            tableBuilder = HandsontableBuilder.create('#handsontable-container', {
                columns: [
                    { data: 'rowNumber', title: '行号', width: 70, readOnly: true },
                    { data: 'oe', title: 'OE号', width: 150, readOnly: true },
                    { data: 'brand', title: '品牌', width: 120, readOnly: true },
                    { data: 'supplier', title: '供应商', width: 150, readOnly: true, renderer: createExpandableRenderer(10) },
                    { data: 'original_price', title: '原价', width: 100, readOnly: true },
                    { data: 'price', title: '售价', width: 100, readOnly: true },
                    { data: 'markup_rate', title: '加价率', width: 100, readOnly: true },
                    { data: 'markup_amount', title: '加价金额', width: 100, readOnly: true },
                    { data: 'warehouse', title: '仓库', width: 120, readOnly: true, renderer: createExpandableRenderer(8) },
                    { data: 'expire_time', title: '失效时间', width: 160, readOnly: true },
                    { data: 'remark', title: '备注', width: 150, readOnly: true, renderer: createExpandableRenderer(8) },
                    { data: 'stock_quantity', title: '库存数量', width: 100, readOnly: true },
                    { data: 'common_number', title: '通用号', width: 150, readOnly: true, renderer: createCommonNumberRenderer(10) },
                    { data: 'import_time', title: '上传时间', width: 160, readOnly: true }
                ],
                localData: data,
                readOnly: true,
                pageKey: 'inquiry_module',
                gridKey: gridKey,
                components: {
                    virtualScroll: false,
                    doubleClickCopy: true,
                    copyToast: true,
                    columnMenu: { persist: true },
                    pagination: { pageSizeOptions: [50, 100, 200], defaultPageSize: 100 },
                    toolbar: true
                },
                handsontableOptions: {
                    mergeCells: mergeCells,
                    rowHeaders: false,
                    height: '100%',
                    rowHeights: function(row) {
                        return expandedRows.has(row) ? undefined : DEFAULT_ROW_HEIGHT;
                    },
                    autoRowSize: false,
                    manualColumnResize: true,
                    manualRowResize: false,
                    columnSorting: true,
                    sortIndicator: true,
                    filters: false,
                    dropdownMenu: false
                }
            });
        }

        async function loadData(oe = '', brand = '', supplier = '') {
            try {
                const container = document.getElementById('handsontable-container');
                container.innerHTML = '<div class="loading-overlay">加载中...</div>';

                // 根据当前数据类型选择接口
                let url = currentDataType === 'direct'
                    ? '/api/purchase_plan/inquiry/direct/list'
                    : '/api/purchase_plan/inquiry/list';
                const params = new URLSearchParams();
                if (oe) params.append('oe', oe);
                if (brand) params.append('brand', brand);
                if (supplier) params.append('supplier', supplier);
                if (params.toString()) url += '?' + params.toString();

                const response = await fetch(url);
                const result = await response.json();

                if (result.code === 0) {
                    allData = result.data;
                    console.log('数据条数:', allData.length);

                    // 更新标签页上的数量
                    updateTabBadge(currentDataType, allData.length);

                    // 格式化数据并计算合并单元格，然后用Builder创建表格
                    const { formattedData, mergeCells } = formatDataAndMergeCells(allData);
                    initTableBuilder(formattedData, mergeCells);
                } else {
                    container.innerHTML = '<div class="loading-overlay">加载失败: ' + result.msg + '</div>';
                }
            } catch (error) {
                console.error('加载数据失败:', error);
                const container = document.getElementById('handsontable-container');
                container.innerHTML = '<div class="loading-overlay">加载失败: ' + error.message + '</div>';
            }
        }

        // 更新标签页数量
        function updateTabBadge(type, count) {
            const badgeId = type === 'direct' ? 'directBadge' : 'normalBadge';
            const badge = document.getElementById(badgeId);
            if (badge) {
                badge.textContent = count;
            }
        }

        // 初始化标签页
        function initTabs() {
            const tabUpload = document.getElementById('tabUpload');
            const tabNormal = document.getElementById('tabNormal');
            const tabDirect = document.getElementById('tabDirect');
            const tabGzbbr = document.getElementById('tabGzbbr');
            const dataTitle = document.getElementById('dataTitle');
            const uploadContainer = document.getElementById('uploadContainer');
            const mainContainer = document.getElementById('mainDataContainer');
            const gzbbrContainer = document.getElementById('gzbbrContainer');

            const tabs = [tabUpload, tabNormal, tabDirect, tabGzbbr];

            function switchTab(activeType, activeTab) {
                tabs.forEach(tab => tab.classList.remove('active'));
                activeTab.classList.add('active');
                currentDataType = activeType;

                if (activeType === 'upload') {
                    uploadContainer.style.display = 'block';
                    mainContainer.style.display = 'none';
                    gzbbrContainer.style.display = 'none';
                } else if (activeType === 'gzbbr') {
                    uploadContainer.style.display = 'none';
                    mainContainer.style.display = 'none';
                    gzbbrContainer.style.display = 'flex';
                    if (gzbbrHot) {
                        setTimeout(() => gzbbrHot.render(), 0);
                    }
                } else {
                    uploadContainer.style.display = 'none';
                    mainContainer.style.display = 'block';
                    gzbbrContainer.style.display = 'none';
                    dataTitle.textContent = activeType === 'normal' ? '询价比价数据' : '直接入库数据';
                    expandedRows.clear();
                    // 切换标签时销毁旧表格，避免gridKey冲突
                    if (tableBuilder) {
                        tableBuilder.destroy();
                        tableBuilder = null;
                    }
                    loadData();
                }
            }

            tabUpload.addEventListener('click', () => {
                if (currentDataType !== 'upload') {
                    switchTab('upload', tabUpload);
                }
            });

            tabNormal.addEventListener('click', () => {

        function formatTimestamp(value) {
            if (!value) return '';
            const ts = parseInt(value);
            if (isNaN(ts)) return value;
            const date = new Date(ts * 1000);
            const pad = n => n < 10 ? '0' + n : n;
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
        }

                    gzbbrAllData = res.data || [];

        function batchUpdateGzbbrLoseDate() {

        // 文件选择后处理
        async function handleFileSelect(file) {
            const validTypes = ['.csv', '.xls', '.xlsx'];

            if (validTypes.indexOf(fileExt) === -1) {

        // 解析预览数据

            const loadingLayer = layui.layer.open({
                type: 1,

                closeBtn: 0,

        // 操作列渲染器

        // 根据加价率更新最终价格（手动编辑过的行不再自动覆盖）
        function updateFinalPrices(markupRate) {
            previewData.forEach(row => {
                if (row._finalPriceManual) return;
                const price = parseFloat(row.price) || 0;
                row.final_price = (price * markupRate).toFixed(2);
            });
            if (previewBuilder) {
                previewBuilder.config.localData = previewData;
                previewBuilder.refresh();
            }
        }

        // 初始化加价率事件
        function initPreviewMarkupEvents() {
            const markupInput = document.getElementById('markupInput');
            const markupDecrease = document.getElementById('markupDecrease');
            const markupIncrease = document.getElementById('markupIncrease');

            if (!markupInput || !markupDecrease || !markupIncrease) return;

            markupDecrease.addEventListener('click', () => {
                let value = parseFloat(markupInput.value) || 1;
                value = Math.max(0.05, value - 0.05);
                markupInput.value = value.toFixed(2);
                updateFinalPrices(value);
            });

            markupIncrease.addEventListener('click', () => {
                let value = parseFloat(markupInput.value) || 1;
                value = value + 0.05;
                markupInput.value = value.toFixed(2);
                updateFinalPrices(value);
            });

            markupInput.addEventListener('input', () => {
                let value = markupInput.value;
                value = value.replace(/[^0-9.]/g, '');
                const parts = value.split('.');
                if (parts.length > 2) {
                    value = parts[0] + '.' + parts.slice(1).join('');
                }
                markupInput.value = value;
            });

            markupInput.addEventListener('blur', () => {
                let value = parseFloat(markupInput.value);
                if (isNaN(value) || value < 0.05) {
                    value = 1;
                }
                markupInput.value = value.toFixed(2);
                updateFinalPrices(value);
            });
        }

        // 确认上传
        async function handleConfirmUpload() {
            if (!pendingFile || previewData.length === 0) {
                layui.layer.msg('请先选择文件并解析数据', { icon: 0 });
                return;
            }

            // 校验有 product_id 的行的失效时间格式（YYYY-MM-DD HH:MM:SS）
            const expireTimeRegex = /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/;
            const invalidRows = [];
            previewData.forEach((row, idx) => {
                if (row.product_id) {
                    const et = String(row.expire_time || '').trim();
                    if (!et || !expireTimeRegex.test(et)) {
                        invalidRows.push(idx + 1);
                    }
                }
            });
            if (invalidRows.length > 0) {
                layui.layer.msg('第 ' + invalidRows.join(', ') + ' 行失效时间格式错误，请修改为 "YYYY-MM-DD HH:MM:SS" 格式后再上传', { icon: 2, time: 5000 });
                return;
            }

            const skipB2b = currentUploadMode === 'record';
            const markupRate = parseFloat(document.getElementById('markupInput').value) || 1;

            // 将预览数据（已删除的行已过滤）生成 CSV 文件上传
            const uploadFile = buildUploadFileFromPreview();

            const formData = new FormData();
            formData.append('file', uploadFile);
            formData.append('markup_rate', markupRate.toFixed(2));
            formData.append('skip_b2b', skipB2b ? 'true' : 'false');
            formData.append('enable_compare', 'false');

            const loadingIndex = layui.layer.load(2, { shade: [0.3, '#000'] });

            try {
                const response = await fetch('/api/purchase_plan/inquiry/import', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                layui.layer.close(loadingIndex);

                if (result.code !== 0) {
                    layui.layer.msg(result.msg || '提交失败', { icon: 2 });
                    return;
                }

                pollUploadStatus(result.data.task_id);

            } catch (error) {
                layui.layer.close(loadingIndex);
                layui.layer.msg('提交失败: ' + error.message, { icon: 2 });
            }
        }

        // 根据预览数据构建上传文件
        function buildUploadFileFromPreview() {
            const headers = ['oe', 'brand', 'supplier', 'price', 'warehouse', 'expire_time', 'remark', 'stock_quantity', 'matched_oe', 'matched_brand', 'matched_supplier', 'final_price', 'product_id'];
            const rows = previewData.map(row => headers.map(h => {
                const value = row[h] || '';
                return '"' + String(value).replace(/"/g, '""') + '"';
            }).join(','));
            const csvContent = '\uFEFF' + headers.join(',') + '\n' + rows.join('\n');
            return new File([csvContent], 'preview_data.csv', { type: 'text/csv' });
        }

        // 轮询上传任务状态（展示处理条数）
        function pollUploadStatus(taskId) {
            const progressLayer = layui.layer.open({
                type: 1,
                title: false,
                closeBtn: 0,
                area: '280px',
                shade: [0.3, '#000'],
                content: `<div style="padding:25px;text-align:center;">
                    <div style="margin-bottom:10px;font-size:14px;">正在处理...</div>
                    <div id="uploadProgressCount" style="font-size:12px;color:#999;">已处理 0 / ${previewData.length} 条</div>
                </div>`
            });

            const checkStatus = setInterval(async () => {
                try {
                    const statusRes = await fetch('/api/purchase_plan/inquiry/import/status/' + taskId);
                    const statusResult = await statusRes.json();

                    if (statusResult.code !== 0) {
                        clearInterval(checkStatus);
                        layui.layer.close(progressLayer);
                        layui.layer.msg(statusResult.msg || '查询状态失败', { icon: 2 });
                        return;
                    }

                    const status = statusResult.data;
                    const countEl = document.getElementById('uploadProgressCount');
                    const current = status.progress || 0;
                    const total = status.total || previewData.length;
                    if (countEl) {
                        countEl.innerText = `已处理 ${current} / ${total} 条`;
                    }

                    if (status.status === 'running') {
                        // 继续轮询
                    } else if (status.status === 'completed') {
                        clearInterval(checkStatus);
                        layui.layer.close(progressLayer);

                        // 将每行上传结果回显到预览表格
                        const rowResults = (status.result_data || {});
                        previewData.forEach((row, idx) => {
                            row.upload_result = rowResults[idx] || '';
                        });
                        if (previewBuilder) {
                            previewBuilder.config.localData = previewData;
                            previewBuilder.refresh();
                        }

                        const successCount = Object.values(rowResults).filter(msg => String(msg).indexOf('成功') !== -1).length;
                        const failCount = previewData.length - successCount;
                        layui.layer.msg(`处理完成：成功 ${successCount} 条，失败/跳过 ${failCount} 条`, { icon: 1 });
                    } else if (status.status === 'failed') {
                        clearInterval(checkStatus);
                        layui.layer.close(progressLayer);
                        layui.layer.msg(status.error || '处理失败', { icon: 2 });
                    }
                } catch (error) {
                    clearInterval(checkStatus);
                    layui.layer.close(progressLayer);
                    layui.layer.msg('查询状态失败: ' + error.message, { icon: 2 });
                }
            }, 2000);
        }

        // 重置上传区域
        function resetUploadArea() {
            previewData = [];
            if (previewBuilder) {
                previewBuilder.destroy();
                previewBuilder = null;
            }
            document.getElementById('uploadMarkupSection').style.display = 'none';
            document.getElementById('previewTableWrapper').style.display = 'none';

        // 采购历史比对（独立流程）
        async function handleCompareOnly(file) {
            let progressLayer = null;

            function showProgress(total) {
                progressLayer = layui.layer.open({
                    type: 1,
                    title: false,
                    closeBtn: 0,
                    area: '280px',
                    shade: [0.3, '#000'],
                    content: `<div style="padding:25px;text-align:center;">
                        <div style="margin-bottom:10px;font-size:14px;">正在比对采购历史...</div>
                        <div style="font-size:12px;color:#999;" id="compareProgressText">共 ${total} 条 OE，准备中...</div>
                    </div>`
                });
            }

            function updateProgress(current, total, message) {
                // 保持原有提示文本不变，仅用于轮询状态判断
            }

            function stopProgress() {
                if (progressLayer !== null) {
                    layui.layer.close(progressLayer);
                    progressLayer = null;
                }
            }

            const loadingIndex = layui.layer.load(2, { shade: [0.3, '#000'] });

            try {
                const formData = new FormData();
                formData.append('file', file);

                const parseRes = await fetch('/api/purchase_plan/inquiry/parse_oe_list', {
                    method: 'POST',
                    body: formData
                });
                const parseResult = await parseRes.json();

                if (parseResult.code !== 0) {
                    layui.layer.close(loadingIndex);
                    layui.layer.msg(parseResult.msg || '解析失败', { icon: 2 });
                    return;
                }

                const oeList = parseResult.data;
                if (!oeList || oeList.length === 0) {
                    layui.layer.close(loadingIndex);
                    layui.layer.msg('文件中没有找到OE数据', { icon: 0 });
                    return;
                }

                const items = oeList.map(item => ({
                    oe: item.oe,
                    brand: item.brand || '',
                    price: item.price || ''
                }));

                layui.layer.close(loadingIndex);
                showProgress(items.length);

                // 提交异步任务
                const submitRes = await fetch('/api/purchase_plan/purchase_history_compare/export_async', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({items: items})
                });
                const submitResult = await submitRes.json();
                if (submitResult.code !== 0) {
                    stopProgress();
                    layui.layer.msg(submitResult.msg || '提交失败', { icon: 2 });
                    return;
                }
                const taskId = submitResult.data.task_id;

                // 轮询任务进度
                const pollInterval = setInterval(async () => {
                    try {
                        const statusRes = await fetch(`/api/purchase_plan/purchase_history_compare/export_status/${taskId}`);
                        const statusResult = await statusRes.json();
                        if (statusResult.code !== 0) {
                            clearInterval(pollInterval);
                            stopProgress();
                            layui.layer.msg(statusResult.msg || '查询进度失败', { icon: 2 });
                            return;
                        }
                        const task = statusResult.data;
                        updateProgress(task.progress || 0, task.total || 100, task.message);

                        if (task.status === 'completed') {
                            clearInterval(pollInterval);
                            stopProgress();
                            const a = document.createElement('a');
                            a.href = `/api/purchase_plan/purchase_history_compare/export_download/${taskId}`;
                            a.download = 'purchase_history_compare.xlsx';
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            layui.layer.msg('比对结果已生成', { icon: 1 });
                        } else if (task.status === 'failed') {
                            clearInterval(pollInterval);
                            stopProgress();
                            layui.layer.msg(task.message || '生成失败', { icon: 2 });
                        }
                    } catch (err) {
                        clearInterval(pollInterval);
                        stopProgress();
                        layui.layer.msg('轮询进度失败: ' + err.message, { icon: 2 });
                    }
                }, 1000);

            } catch (error) {
                stopProgress();
                layui.layer.close(loadingIndex);
                layui.layer.msg('处理失败: ' + error.message, { icon: 2 });
            }

            document.getElementById('fileInput').value = '';
            pendingFile = null;
            currentUploadMode = null;
        }

        // 下载询价模板
        function downloadTemplate() {
            const link = document.createElement('a');
            link.href = "{{ url_for('static', filename='excel/virtual_inventory.xlsx') }}";
            link.download = 'inquiry_template.xlsx';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 下载采购历史比对模板
        function downloadCompareTemplate() {
            const link = document.createElement('a');
            link.href = "{{ url_for('static', filename='excel/OE_Brand_Price_brandcode.xlsx') }}";
            link.download = 'OE_Brand_Price_brandcode.xlsx';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function initSearch() {
            document.getElementById('searchBtn').addEventListener('click', () => {
                const oe = document.getElementById('searchOe').value;
                const brand = document.getElementById('searchBrand').value;
                const supplier = document.getElementById('searchSupplier').value;
                loadData(oe, brand, supplier);
            });

            document.getElementById('refreshBtn').addEventListener('click', () => {
                document.getElementById('searchOe').value = '';
                document.getElementById('searchBrand').value = '';
                document.getElementById('searchSupplier').value = '';
                loadData();
            });

            ['searchOe', 'searchBrand', 'searchSupplier'].forEach(id => {
                document.getElementById(id).addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        document.getElementById('searchBtn').click();
                    }
                });
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            initUpload();
            initSearch();
            initTabs();
            initGzbbrTab();
            if (currentDataType !== 'upload') {
                loadData();
            }
        });
    </script>
</body>
</html>
