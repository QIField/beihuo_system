 <!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开思询价明细</title>

    <!-- AG Grid CSS - 使用本地文件 -->
    <link rel="stylesheet" href="/static/ag-grid/ag-grid.css">
    <link rel="stylesheet" href="/static/ag-grid/ag-theme-alpine.css">
    <link rel="stylesheet" href="/static/ag-grid/ag-custom-checkbox.css">

    <!-- LayUI -->
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <script src="/static/layui/layui.js"></script>

    <!-- Filter Panel Component -->
    <link rel="stylesheet" href="/static/js/components/filter_panel/filter-panel.css">
    <script src="/static/js/components/filter_panel/filter-panel.js"></script>

    <!-- Grid Column Menu Component（表头列菜单：升降序、列勾选、值筛选）-->
    <link rel="stylesheet" href="/static/js/components/grid-column-menu/grid-column-menu.css">
    <script src="/static/js/components/grid-column-menu/grid-column-menu.js"></script>

    <!-- Column Preference Component（列状态持久化：按用户保存）-->
    <script src="/static/js/components/column-preference/column-preference.js"></script>

    <!-- 一键置顶按钮组件 -->
    <link rel="stylesheet" href="/static/js/components/scroll-to-top/scroll-to-top.css?v=1">
    <script src="/static/js/components/scroll-to-top/scroll-to-top.js?v=1"></script>

    <!-- 自定义分页组件 -->
    <script src="/static/js/components/custom-pagination/custom-pagination.js"></script>

    <!-- AG Grid Loader 组件 -->
    <script src="/static/js/components/ag-grid-loader/ag-grid-loader.js"></script>

    <!-- Grid Detail Panel 组件（主表-副表联动） -->
    <link rel="stylesheet" href="/static/js/components/grid-detail-panel/grid-detail-panel.css">
    <script src="/static/js/components/grid-detail-panel/grid-detail-panel.js"></script>

    <!-- AG Grid 合并单元格组件 -->
    <link rel="stylesheet" href="/static/js/components/merge-cell/merge-cell.css">
    <script src="/static/js/components/merge-cell/merge-cell.js"></script>

    <!-- TabNav 标签导航组件 -->
    <link rel="stylesheet" href="/static/js/components/tab-nav/tab-nav.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container { max-width: 100%; margin: 0 auto; }

        /* 搜索筛选区域 - 保持原样 */
        .search-panel {
            background: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* 日期输入框样式 */
        .search-panel .layui-input {
            height: 36px;
            line-height: 34px;
            padding: 0 12px;
            font-size: 13px;
            box-sizing: border-box;
        }

        /* 筛选按钮样式 - 关键：去掉默认上下margin */
        .search-panel .filter-btn {
            height: 36px !important;
            line-height: 34px !important;
            padding: 0 12px !important;
            box-sizing: border-box !important;
            margin: 0 4px !important;
        }

        /* FilterPanel容器样式 */
        .search-panel #ksInquiryFilterButtons {
            display: inline-flex;
            align-items: center;
            height: 36px;
        }

        .table-container {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        #ksInquiryGrid, #oeStatsGrid, #engineChassisGrid {
            height: calc(100vh - 200px);
            min-height: 500px;
            width: 100%;
        }

        /* 客户维度：左右分栏布局 */
        #tab-customer .customer-layout {
            display: flex;
            gap: 20px;
            height: calc(100vh - 200px);
            min-height: 500px;
        }

        #tab-customer .customer-layout > div {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* 分页条数选择器 */
        .ag-paging-panel {
            position: relative;
        }

        .page-size-selector select {
            padding: 4px 8px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            background: #fff;
        }

        .page-size-selector select:hover {
            border-color: #1890ff;
        }

        .page-size-selector select:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
        }

        /* 页码跳转器 */
        .page-jumper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 20px;
            font-size: 13px;
            color: #666;
        }

        .page-jumper input {
            width: 50px;
            padding: 4px 8px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 13px;
            text-align: center;
        }

        .page-jumper input:hover {
            border-color: #1890ff;
        }

        .page-jumper input:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
        }

        .page-jumper button {
            padding: 4px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            background: #fff;
            font-size: 13px;
            cursor: pointer;
            color: #666;
        }

        .page-jumper button:hover {
            border-color: #1890ff;
            color: #1890ff;
        }

        /* AG Grid 自定义样式 - 紧凑版 */
        .ag-theme-alpine {
            --ag-font-size: 12px;
            --ag-font-family: 'Microsoft YaHei', Arial, sans-serif;
            --ag-header-height: 36px;
            --ag-row-height: 36px;
            --ag-header-background-color: #fafafa;
            --ag-odd-row-background-color: #fff;
            --ag-even-row-background-color: #fafafa;
            --ag-cell-horizontal-padding: 6px;
        }

        .ag-theme-alpine .ag-header-cell-text {
            font-size: 12px;
            font-weight: 600;
        }

        .ag-theme-alpine .ag-cell {
            font-size: 12px;
            line-height: 36px;
        }
    </style>

    <!-- 全局变量声明（需在子模板脚本之前） -->
    <script>
        let gridApi = null;
        let gridColumnApi = null;
        let currentData = [];
        let currentPage = 1;
        let currentPageSize = 200;
        let totalRecords = 0;
        let customPagination = null;
        let currentTab = 'detail';
        const userCompany = '{{ session.get("store", "") }}';

        // 各标签页独立搜索状态
        const detailSearchState = {
            inquiry_id: '',
            parts_num: '',
            parts_name: '',
            brand: '',
            seller_status: '',
            car_brand_name: '',
            garage_name: ''
        };

        const oeSearchState = {
            parts_num: '',
            parts_name: '',
            brand: '',
            seller_status: '',
            car_brand_name: '',
            garage_name: ''
        };

        const engineSearchState = {
            garage_name: ''
        };

        const customerSearchState = {
            garage_name: ''
        };

        // 字段与隐藏输入框 ID 映射
        const searchStateFieldMap = {
            inquiry_id: 'searchInquiryId',
            parts_num: 'searchPartsNum',
            parts_name: 'searchPartsName',
            garage_name: 'searchGarageName'
        };

        // 将隐藏输入框的值同步到指定 state
        function syncHiddenInputsToState(state) {
            Object.keys(searchStateFieldMap).forEach(function(field) {
                if (field in state) {
                    const input = document.getElementById(searchStateFieldMap[field]);
                    state[field] = input ? (input.value || '') : '';
                }
            });
        }

        // 用指定 state 回填隐藏输入框
        function syncStateToHiddenInputs(state) {
            Object.keys(searchStateFieldMap).forEach(function(field) {
                if (field in state) {
                    const input = document.getElementById(searchStateFieldMap[field]);
                    if (input) input.value = state[field] || '';
                }
            });
        }

        // 清空指定 state 的所有字段
        function clearSearchState(state) {
            Object.keys(state).forEach(function(key) {
                state[key] = '';
            });
        }

        // 获取当前 tab 对应的 state
        function getCurrentSearchState(tabId) {
            if (tabId === 'detail') return detailSearchState;
            if (tabId === 'oe') return oeSearchState;
            if (tabId === 'engine') return engineSearchState;
            if (tabId === 'customer') return customerSearchState;
            return {};
        }
    </script>
</head>
<body>
    <div class="container">
        <!-- 标签导航 -->
        <div class="tab-nav">
            <div class="tab-title">开思询价单明细</div>
            <button class="tab-btn active" data-tab="detail">明细列表</button>
            <button class="tab-btn" data-tab="oe">OE统计维度</button>
            <button class="tab-btn" data-tab="engine">发动机及底盘维度</button>
            <button class="tab-btn" data-tab="customer">客户维度</button>
        </div>

        <!-- 搜索筛选区域 - 保持原样 -->
        <div class="search-panel">
            <!-- 日期选择器 -->
            <span style="font-size: 14px; color: #666;">日期范围：</span>
            <input type="text" id="dateRange" placeholder="请选择日期范围" class="layui-input" style="width: 220px;" readonly>

            <!-- 分隔符 -->
            <span style="color: #999;">|</span>

            <!-- 筛选按钮 -->
            <div id="ksInquiryFilterButtons"></div>

            <!-- 分隔符（重置前，始终显示） -->
            <span style="color: #999;">|</span>

            <!-- 重置按钮 -->
            <button class="filter-btn" onclick="resetAll()">重置</button>

            <input type="hidden" id="searchInquiryId">
            <input type="hidden" id="searchPartsNum">
            <input type="hidden" id="searchPartsName">
            <input type="hidden" id="searchBrandName">
            <input type="hidden" id="searchSellerStatus">
            <input type="hidden" id="searchBrand">
            <input type="hidden" id="searchEngine">
            <input type="hidden" id="searchChassis">
            <input type="hidden" id="searchVin">
            <input type="hidden" id="searchCarBrandName">
            <input type="hidden" id="searchGarageName">
        </div>

        <!-- 标签内容 -->
        <div class="tab-content">
            {% include 'ks_inquiry_records/detail_tab.html' %}
            {% include 'ks_inquiry_records/oe_stats_tab.html' %}
            {% include 'ks_inquiry_records/engine_stats_tab.html' %}
            {% include 'ks_inquiry_records/customer_stats_tab.html' %}
        </div>
    </div>

    <!-- AG Grid JS - 使用本地文件 -->
    <script src="/static/ag-grid/ag-grid-community.min.js"></script>

    <!-- TabNav 标签导航组件 -->
    <script src="/static/js/components/tab-nav/tab-nav.js"></script>

    <!-- 通用复制工具 -->
    <script src="/static/js/copy-utils.js"></script>

    <script>
        // 获取查询参数
        function getSearchParams(tabId) {
            let beginDate = '', endDate = '';
            const dateRangeValue = document.getElementById('dateRange').value;
            if (dateRangeValue) {
                const dates = dateRangeValue.split(' - ');
                beginDate = dates[0] || '';
                endDate = dates[1] || '';
            }

            let state = {};
            if (tabId === 'detail') {
                state = detailSearchState;
            } else if (tabId === 'oe') {
                state = oeSearchState;
            } else if (tabId === 'engine') {
                state = engineSearchState;
            } else if (tabId === 'customer') {
                state = customerSearchState;
            }

            return Object.assign({}, state, {
                begin_date: beginDate,
                end_date: endDate,
                company: userCompany
            });
        }

        // 重置所有筛选条件
        function resetAll() {
            // 清空日期范围
            document.getElementById('dateRange').value = '';

            // 只重置当前 tab 对应的 state
            const state = getCurrentSearchState(currentTab);
            clearSearchState(state);

            // 同步清空隐藏输入框
            document.getElementById('searchInquiryId').value = '';
            document.getElementById('searchPartsNum').value = '';
            document.getElementById('searchPartsName').value = '';
            document.getElementById('searchBrandName').value = '';
            document.getElementById('searchEngine').value = '';
            document.getElementById('searchChassis').value = '';
            document.getElementById('searchVin').value = '';
            document.getElementById('searchGarageName').value = '';

            if (typeof FilterPanel !== 'undefined' && FilterPanel.clearAll) {
                FilterPanel.clearAll();
            }

            if (currentTab === 'detail') {
                refreshGrid();
            } else if (currentTab === 'oe') {
                refreshOeStats();
            } else if (currentTab === 'engine') {
                refreshEngineChassis();
            } else if (currentTab === 'customer') {
                if (typeof refreshCustomerStats === 'function') {
                    refreshCustomerStats();
                }
            }
        }

        // 根据当前标签更新搜索栏显示
        function updateSearchPanelForTab(tabId) {
            // 切换标签前，先把当前隐藏输入框的值同步到当前 state
            syncHiddenInputsToState(getCurrentSearchState(currentTab));

            currentTab = tabId;

            // 重新初始化 FilterPanel
            const filterContainer = document.getElementById('ksInquiryFilterButtons');
            if (filterContainer) {
                filterContainer.innerHTML = '';
            }

            // 用目标 tab 的 state 回填隐藏输入框
            syncStateToHiddenInputs(getCurrentSearchState(currentTab));

            let fields = [];
            if (tabId === 'detail') {
                fields = [
                    { label: '询价单号', inputId: 'searchInquiryId' },
                    { label: 'OE号', inputId: 'searchPartsNum' },
                    { label: '配件名称', inputId: 'searchPartsName' }
                ];
            } else if (tabId === 'oe') {
                fields = [
                    { label: 'OE号', inputId: 'searchPartsNum' },
                    { label: '配件名称', inputId: 'searchPartsName' }
                ];
            } else if (tabId === 'engine') {
                fields = [
                    { label: '客户名称', inputId: 'searchGarageName' }
                ];
            } else if (tabId === 'customer') {
                fields = [
                    { label: '客户名称', inputId: 'searchGarageName' }
                ];
            }

            const labelToStateField = {
                '询价单号': 'inquiry_id',
                'OE号': 'parts_num',
                '配件名称': 'parts_name',
                '客户名称': 'garage_name'
            };

            FilterPanel.initSearch({
                container: '#ksInquiryFilterButtons',
                fields: fields,
                onApply: function(field, value) {
                    const state = getCurrentSearchState(currentTab);
                    const stateField = labelToStateField[field];
                    if (stateField && stateField in state) {
                        state[stateField] = value || '';
                    }

                    const fieldConfig = fields.find(function(f) { return f.label === field; });
                    if (fieldConfig) {
                        const input = document.getElementById(fieldConfig.inputId);
                        if (input) input.value = value || '';
                    }

                    if (currentTab === 'detail') {
                        refreshGrid();
                    } else if (currentTab === 'oe') {
                        refreshOeStats();
                    } else if (currentTab === 'engine') {
                        refreshEngineChassis();
                    } else if (currentTab === 'customer') {
                        if (typeof refreshCustomerStats === 'function') {
                            refreshCustomerStats();
                        }
                    }
                }
            });
        }

        // 初始化 Grid
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化标签导航组件
            TabNav.init({
                navSelector: '.tab-nav',
                contentSelector: '.tab-content',
                onSwitch: function(tabId) {
                    updateSearchPanelForTab(tabId);
                    if (tabId === 'detail' && gridApi) {
                        setTimeout(function() {
                            gridApi.sizeColumnsToFit();
                        }, 0);
                    } else if (tabId === 'oe' && typeof initOeStatsGrid === 'function') {
                        initOeStatsGrid();
                    } else if (tabId === 'engine' && typeof initEngineChassisGrid === 'function') {
                        initEngineChassisGrid();
                    } else if (tabId === 'customer' && typeof initCustomerStatsGrid === 'function') {
                        initCustomerStatsGrid();
                    }
                }
            });

            // 初始化筛选面板（根据当前标签动态显示）
            updateSearchPanelForTab('detail');

            // 初始化layui日期组件
            layui.use(['laydate'], function() {
                const laydate = layui.laydate;

                // 获取今天的日期字符串
                const today = new Date();
                const todayStr = today.getFullYear() + '-' +
                    String(today.getMonth() + 1).padStart(2, '0') + '-' +
                    String(today.getDate()).padStart(2, '0');

                // 设置默认日期范围（今天）
                document.getElementById('dateRange').value = todayStr + ' - ' + todayStr;

                laydate.render({
                    elem: '#dateRange',
                    trigger: 'focus',
                    format: 'yyyy-MM-dd',
                    range: true,
                    max: 0,
                    value: todayStr + ' - ' + todayStr,
                    done: function(value, date, endDate) {
                        console.log('日期选择完成:', value);
                        if (currentTab === 'detail') {
                            refreshGrid();
                        } else if (currentTab === 'oe') {
                            refreshOeStats();
                        } else if (currentTab === 'engine') {
                            refreshEngineChassis();
                        } else if (currentTab === 'customer') {
                            if (typeof refreshCustomerStats === 'function') {
                                refreshCustomerStats();
                            }
                        }
                    },
                    change: function(value, date, endDate) {
                        console.log('日期变化:', value);
                    }
                });
            });

            // 初始化明细列表 AG Grid
            const gridDiv = document.querySelector('#ksInquiryGrid');
            if (gridDiv && typeof gridOptions !== 'undefined') {
                new agGrid.Grid(gridDiv, gridOptions);
            }
        });
    </script>
</body>
</html>
