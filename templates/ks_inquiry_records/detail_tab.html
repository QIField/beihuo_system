<!-- 明细列表 -->
<div id="tab-detail" class="tab-pane active">
    <div class="table-container">
        <div id="ksInquiryGrid" class="ag-theme-alpine"></div>
    </div>
</div>

<script>
    // AG Grid 列定义（使用 MergeCellHelper 给指定列加跨行合并）
    let columnDefs = [
        MergeCellHelper.createRowNumberColumn({ width: 80, pinned: 'left' }),
        { field: 'inquiryId', headerName: '询价单号', width: 150, pinned: 'left', sortable: false, filter: true },
        { field: 'customerName', headerName: '客户名称', width: 150, sortable: false, filter: true },
        {
            field: 'partsNum',
            headerName: 'OE号',
            width: 150,
            sortable: false,
            filter: true,
            valueFormatter: function(params) {
                if (params.data && params.data._partsNumDisplayIndex) {
                    return params.data._partsNumDisplayIndex + '、' + params.value;
                }
                return params.value;
            }
        },
        { field: 'resolve_parts_name', headerName: '配件名称', width: 200, sortable: false, filter: true },
        { field: 'carBrandName', headerName: '车辆品牌', width: 120, sortable: false, filter: true },
        { field: 'brandName', headerName: '品牌', width: 120, sortable: false, filter: true },
        { field: 'brandNormalized', headerName: '标准化品牌', width: 120, sortable: false, filter: true },
        { field: 'brandId', headerName: '品牌ID', width: 100, sortable: false, filter: true },
        { field: 'sellerPrice', headerName: '含税价', width: 120, sortable: false, filter: true },
        { field: 'sellerBtPrice', headerName: '不含税价', width: 120, sortable: false, filter: true },
        {
            field: 'displaySellerStatus',
            headerName: '下单状态',
            width: 120,
            sortable: false,
            filter: true,
            rowSpan: function(params) {
                return (params.data && params.data._contentRowSpan) ? params.data._contentRowSpan : 1;
            },
            cellClassRules: {
                'merged-cell': function(params) {
                    return params.data && params.data._contentRowSpan >= 1;
                }
            }
        },
        { field: 'locationName', headerName: '发货地', width: 140, sortable: false, filter: true },
        { field: 'arrivalTime', headerName: '备货时间', width: 140, sortable: false, filter: true },
        { field: 'remark', headerName: '备注', width: 200, sortable: false, filter: true },
        { field: 'vin', headerName: '车架号', width: 150, sortable: false, filter: true },
        { field: 'engine', headerName: '发动机', width: 120, sortable: false, filter: true },
        { field: 'productionDate', headerName: '车辆生产日期', width: 140, sortable: false, filter: true },
        { field: 'chassis', headerName: '底盘', width: 120, sortable: false, filter: true }
    ];

    // 给需要合并的列应用 rowSpan 和 merged-cell 样式
    columnDefs = MergeCellHelper.applyMergeColumns(columnDefs, ['inquiryId', 'customerName'], {
        wrapTextFields: ['customerName']
    });

    // Grid 配置（合并必需配置通过 MergeCellHelper 获取）
    const gridOptions = Object.assign({
        columnDefs: columnDefs,
        rowData: [],
        defaultColDef: {
            sortable: false,
            filter: true,
            resizable: true,
            suppressMenu: true
        },
        rowHeight: 36,
        headerHeight: 36,
        // 禁用 AG Grid 自带分页栏，使用自定义分页组件
        pagination: false,
        overlayLoadingTemplate: '<span class="ag-overlay-loading-center">正在加载数据...</span>',
        overlayNoRowsTemplate: '<span class="ag-overlay-no-rows-center">暂无数据</span>',

        onGridReady: function(event) {
            gridApi = event.api;
            gridColumnApi = event.columnApi;

            // 初始化数据加载器
            gridLoader = new AgGridLoader(gridApi);

            gridApi.sizeColumnsToFit();

            // 初始化双击复制功能
            initDoubleClickCopy();

            // 初始化列菜单功能（含持久化）
            if (typeof GridColumnMenu !== 'undefined') {
                GridColumnMenu.init(gridApi, '#ksInquiryGrid', columnDefs, {
                    columnApi: gridColumnApi,
                    gridOptions: gridOptions,
                    persist: true,
                    pageKey: 'ks_inquiry_records',
                    gridKey: 'detail_grid',
                    onSort: function(colId, direction) {
                        refreshGrid(1, currentPageSize);
                    },
                    onDataRefresh: function(filterState) {
                        refreshGrid(currentPage, currentPageSize);
                    },
                    getFilterValues: function(colId, callback) {
                        fetchDetailColumnValues(colId, callback);
                    }
                });
            }

            // 初始化自定义分页组件
            initCustomPagination();

            // 加载初始数据
            refreshGrid();
        }
    }, MergeCellHelper.getGridOptions());

    // 初始化双击复制功能
    function initDoubleClickCopy() {
        const gridDiv = document.querySelector('#ksInquiryGrid');

        gridDiv.addEventListener('dblclick', function(e) {
            const cellElement = e.target.closest('.ag-cell');
            if (!cellElement) return;

            const rowId = cellElement.closest('.ag-row')?.getAttribute('row-id');
            const colId = cellElement.getAttribute('col-id');

            if (rowId && colId) {
                const rowNode = gridApi.getRowNode(rowId);
                if (rowNode && rowNode.data) {
                    const value = rowNode.data[colId];
                    if (value !== undefined && value !== null) {
                        const textToCopy = String(value);
                        copyToClipboardUniversal(textToCopy, function() {
                            layui.layer.msg('已复制到剪贴板', {icon: 1, time: 1000});
                        }, function() {
                            layui.layer.msg('复制失败', {icon: 2});
                        });
                    }
                }
            }
        });
    }

    // 初始化自定义分页组件
    function initCustomPagination() {
        if (typeof CustomPagination === 'undefined') {
            console.error('[KsInquiryRecords] CustomPagination 组件未加载');
            return;
        }

        customPagination = CustomPagination.init({
            gridSelector: '#ksInquiryGrid',
            pageSizeOptions: [50, 100, 200, 500],
            defaultPageSize: 200,
            showScrollToTop: true,
            onPageChange: function(page, pageSize) {
                currentPage = page;
                currentPageSize = pageSize;
                refreshGrid(page, pageSize);
            },
            onPageSizeChange: function(pageSize) {
                currentPageSize = pageSize;
            }
        });
    }

    // 更新分页信息（在 refreshGrid 中调用）
    function updatePaginationInfo() {
        if (customPagination) {
            customPagination.update(totalRecords, currentPage, currentPageSize);
        }
    }

    // 刷新表格数据
    function refreshGrid(page = 1, pageSize = currentPageSize) {
        currentPage = page;
        currentPageSize = pageSize;

        const params = getSearchParams(currentTab);
        params.page = page;
        params.page_size = pageSize;

        // 添加排序参数
        if (typeof GridColumnMenu !== 'undefined' && GridColumnMenu.getSortState) {
            const sortState = GridColumnMenu.getSortState('#ksInquiryGrid');
            if (sortState.sortColumn) {
                params.sort_column = sortState.sortColumn;
                params.sort_dir = sortState.sortDir;
            }
        }

        // 添加列头下拉筛选条件（后端全量数据筛选）
        if (typeof GridColumnMenu !== 'undefined' && GridColumnMenu.getFilterState) {
            const filterState = GridColumnMenu.getFilterState('#ksInquiryGrid');
            if (filterState.active && filterState.filters) {
                params.column_filters = JSON.stringify(filterState.filters);
            }
        }

        gridLoader.load('/new/api/ks_inquiry/records', params, (data) => {

            // 判断当前是否有活跃的自定义排序（通过 FilterPanel）
            const hasActiveSort = params.sort_column && params.sort_column.length > 0;

            let sortedList;
            if (hasActiveSort) {
                // 有排序列时：尊重后端 ORDER BY 结果，不再按 inquiryId 覆盖重排
                sortedList = data.list || [];
            } else {
                // 默认：按 inquiryId 排序，确保相同单号相邻以便合并单元格
                sortedList = (data.list || []).slice().sort((a, b) => {
                    const aId = a.inquiryId || '';
                    const bId = b.inquiryId || '';
                    return aId.localeCompare(bId);
                });

                // 生成 OE号显示序号：同一 content 内按当前顺序编号
                const groups = {};
                sortedList.forEach((item, idx) => {
                    if (!item.content_item_index) {
                        // 旧数据没有 content_item_index，不参与 content 级合并
                        item._contentStatusGroupKey = '__no_content_' + idx;
                        return;
                    }
                    const contentIdx = String(item.content_item_index).split('_')[0];
                    const key = (item.inquiryId || 'unknown') + '_' + contentIdx;
                    item._contentGroupKey = key;
                    item._contentStatusGroupKey = key + '_' + (item.displaySellerStatus || '');
                    if (!groups[key]) groups[key] = [];
                    groups[key].push(item);
                });
                Object.values(groups).forEach(group => {
                    group.forEach((item, idx) => {
                        item._partsNumDisplayIndex = idx + 1;
                    });
                });
            }

            currentData = sortedList;
            totalRecords = data.total;

            // 缓存原始数据到 GridColumnMenu，供列筛选下拉选项使用
            if (typeof GridColumnMenu !== 'undefined' && GridColumnMenu.setOriginalRows) {
                GridColumnMenu.setOriginalRows('#ksInquiryGrid', sortedList);
            }

            // 计算合并单元格所需 rowSpan
            MergeCellHelper.computeRowSpans(sortedList, 'inquiryId');
            MergeCellHelper.computeRowSpans(sortedList, '_contentStatusGroupKey', {
                spanField: '_contentRowSpan',
                indexField: '_contentStatusGroupIndex'
            });

            gridApi.setRowData(sortedList);

            // 更新分页信息
            updatePaginationInfo();
        }, (error) => {
            console.error('请求失败:', error);
        });
    }

    // 从后端获取指定列的全量不重复值（用于列头下拉筛选）
    function fetchDetailColumnValues(colId, callback) {
        const params = getSearchParams(currentTab);
        params.column = colId;
        params.grid_type = 'detail';

        // 带上其他列已激活的筛选条件（排除当前列本身，否则下拉里只会出现已选项）
        if (typeof GridColumnMenu !== 'undefined' && GridColumnMenu.getFilterState) {
            const filterState = GridColumnMenu.getFilterState('#ksInquiryGrid');
            if (filterState.active && filterState.filters) {
                const otherFilters = {};
                Object.keys(filterState.filters).forEach(function(key) {
                    if (key !== colId) {
                        otherFilters[key] = filterState.filters[key];
                    }
                });
                if (Object.keys(otherFilters).length > 0) {
                    params.column_filters = JSON.stringify(otherFilters);
                }
            }
        }

        fetch('/new/api/ks_inquiry/records/column_values?' + new URLSearchParams(params))
            .then(function(response) { return response.json(); })
            .then(function(result) {
                if (result.code === 0 || result.code === '0') {
                    callback(result.data?.values || []);
                } else {
                    console.error('[detail_tab] 获取列值失败:', result.message);
                    callback([]);
                }
            })
            .catch(function(error) {
                console.error('[detail_tab] 获取列值请求失败:', error);
                callback([]);
            });
    }
</script>
