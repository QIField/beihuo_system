<!-- 明细列表 -->
<div id="tab-detail" class="tab-pane active">
    <div class="table-container">
        <div id="ksInquiryGrid" class="ag-theme-alpine"></div>
    </div>
</div>

<style>
/* 合并单元格样式 */
.cell-span {
    background-color: white;
    border-bottom: 1px solid #e8e8e8 !important;
}
.ag-row .ag-cell.cell-span {
    display: flex;
    align-items: center;
    justify-content: flex-start;
}
/* 确保合并的单元格边框显示正确 */
.ag-cell.cell-span:not(.ag-cell-focus) {
    border-right: 1px solid #e8e8e8;
}
</style>

<script>
    // AG Grid 列定义
    const columnDefs = [
        {
            headerName: '行号',
            field: 'rowNumber',
            width: 80,
            pinned: 'left',
            sortable: false,
            filter: false,
            valueGetter: params => {
                const rowIndex = params.node?.rowIndex;
                return rowIndex !== undefined ? rowIndex + 1 : '';
            }
        },
        { field: 'inquiryId', headerName: '询价单号', width: 150, pinned: 'left', sortable: true, filter: true },
        { field: 'customerName', headerName: '客户名称', width: 150, sortable: true, filter: true },
        { field: 'partsNum', headerName: 'OE号', width: 150, sortable: true, filter: true },
        { field: 'partsName', headerName: '配件名称', width: 200, sortable: true, filter: true },
        { field: 'carBrandName', headerName: '车辆品牌', width: 120, sortable: true, filter: true },
        { field: 'brandName', headerName: '品牌', width: 120, sortable: true, filter: true },
        { field: 'brandNormalized', headerName: '标准化品牌', width: 120, sortable: true, filter: true },
        { field: 'brandId', headerName: '品牌ID', width: 100, sortable: true, filter: true },
        { field: 'sellerPrice', headerName: '含税价', width: 120, sortable: true, filter: true },
        { field: 'sellerBtPrice', headerName: '不含税价', width: 120, sortable: true, filter: true },
        {
            field: 'displaySellerStatus',
            headerName: '下单状态',
            width: 120,
            sortable: true,
            filter: true
        },
        { field: 'remark', headerName: '备注', width: 200, sortable: true, filter: true },
        { field: 'vin', headerName: '车架号', width: 150, sortable: true, filter: true },
        { field: 'engine', headerName: '发动机', width: 120, sortable: true, filter: true },
        { field: 'productionDate', headerName: '车辆生产日期', width: 140, sortable: true, filter: true },
        { field: 'chassis', headerName: '底盘', width: 120, sortable: true, filter: true }
    ];

    // Grid 配置
    const gridOptions = {
        columnDefs: columnDefs,
        rowData: [],
        defaultColDef: {
            sortable: true,
            filter: true,
            resizable: true,
            suppressMenu: true
        },
        rowHeight: 36,
        headerHeight: 36,
        // 禁用 AG Grid 自带分页栏，使用自定义分页组件
        pagination: false,
        animateRows: true,
        overlayLoadingTemplate: '<span class="ag-overlay-loading-center">正在加载数据...</span>',
        overlayNoRowsTemplate: '<span class="ag-overlay-no-rows-center">暂无数据</span>',
        onGridReady: function(event) {
            gridApi = event.api;
            gridColumnApi = event.columnApi;

            // 初始化数据加载器
            gridLoader = new AgGridLoader(gridApi);

            gridApi.sizeColumnsToFit();

            // 初始化双击复制功能
            initDoubleClickCopy();

            // 初始化自定义分页组件
            initCustomPagination();

            // 加载初始数据
            refreshGrid();
        }
    };

    // 初始化双击复制功能
    function initDoubleClickCopy() {
        const gridDiv = document.querySelector('#ksInquiryGrid');

        gridDiv.addEventListener('dblclick', function(e) {
            const cellElement = e.target.closest('.ag-cell');
            if (!cellElement) return;

            const rowId = cellElement.closest('.ag-row')?.getAttribute('row-id');
            const colId = cellElement.getAttribute('col-id');

            if (rowId && colId) {
                const rowNode = gridApi.getRowNode(rowId);
                if (rowNode && rowNode.data) {
                    const value = rowNode.data[colId];
                    if (value !== undefined && value !== null) {
                        const textToCopy = String(value);
                        copyToClipboardUniversal(textToCopy, function() {
                            layui.layer.msg('已复制到剪贴板', {icon: 1, time: 1000});
                        }, function() {
                            layui.layer.msg('复制失败', {icon: 2});
                        });
                    }
                }
            }
        });
    }

    // 初始化自定义分页组件
    function initCustomPagination() {
        if (typeof CustomPagination === 'undefined') {
            console.error('[KsInquiryRecords] CustomPagination 组件未加载');
            return;
        }

        customPagination = CustomPagination.init({
            gridSelector: '#ksInquiryGrid',
            pageSizeOptions: [50, 100, 200, 500],
            defaultPageSize: 200,
            showScrollToTop: true,
            onPageChange: function(page, pageSize) {
                currentPage = page;
                currentPageSize = pageSize;
                refreshGrid(page, pageSize);
            },
            onPageSizeChange: function(pageSize) {
                currentPageSize = pageSize;
            }
        });

        console.log('[KsInquiryRecords] 自定义分页组件已初始化');
    }

    // 更新分页信息（在 refreshGrid 中调用）
    function updatePaginationInfo() {
        if (customPagination) {
            customPagination.update(totalRecords, currentPage, currentPageSize);
        }
    }

    // 刷新表格数据
    function refreshGrid(page = 1, pageSize = currentPageSize) {
        currentPage = page;
        currentPageSize = pageSize;

        const params = getSearchParams();
        params.page = page;
        params.page_size = pageSize;

        console.log(`[refreshGrid] 请求第 ${page} 页, 每页 ${pageSize} 条`);

        gridLoader.load('/new/api/ks_inquiry/records', params, (data) => {
            // 按 inquiryId 排序，确保相同单号相邻以便合并
            const sortedList = (data.list || []).sort((a, b) => {
                const aId = a.inquiryId || '';
                const bId = b.inquiryId || '';
                return aId.localeCompare(bId);
            });

            console.log('[refreshGrid] 排序前数据条数:', (data.list || []).length);
            console.log('[refreshGrid] 排序后数据条数:', sortedList.length);

            // 统计合并组数
            const mergeGroups = {};
            sortedList.forEach(item => {
                const id = item.inquiryId || 'null';
                mergeGroups[id] = (mergeGroups[id] || 0) + 1;
            });
            const multiRowGroups = Object.entries(mergeGroups).filter(([k, v]) => v > 1);
            console.log('[refreshGrid] 需要合并的询价单号组:', multiRowGroups);
            console.log(`[refreshGrid] 共有 ${multiRowGroups.length} 个单号需要合并`);

            currentData = sortedList;
            totalRecords = data.total;

            console.log(`[refreshGrid] 总条数: ${totalRecords}, 当前页: ${data.page}, 返回 ${sortedList.length} 条`);

            // 手动设置数据到 grid
            gridApi.setRowData(sortedList);

            // 更新分页信息
            updatePaginationInfo();
        }, (error) => {
            console.error('请求失败:', error);
        });
    }
</script>
