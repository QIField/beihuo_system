<!-- 配件作战明细 -->
<div id="tab-detail" class="tab-pane active">
    <style>
        /* 单元格文本超出显示省略号，且禁止换行以固定行高 */
        #handsontable-container .handsontable .htCore td {
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            vertical-align: middle !important;
        }

        /* 统一所有行高度为 24px */
        #handsontable-container .handsontable .htCore tbody tr {
            height: 24px !important;
            min-height: 24px !important;
            max-height: 24px !important;
        }

        #tab-detail.active {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 200px);
        }

        #handsontable-container {
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
    </style>

    <div id="handsontable-container"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var detailConfig = Object.assign({}, KsInquiryGridConfig.detail, {
                pageKey: KsInquiryGridConfig.pageKey,
                components: {
                    pagination: {
                        pageSizeOptions: [50, 100, 200, 500],
                        defaultPageSize: 200,
                        showScrollToTop: true
                    },
                    columnMenu: { persist: true },
                    doubleClickCopy: true,
                    copyToast: true,
                    contextMenu: false,
                    shortcuts: true
                }
            });

            window.ksInquiryDetailBuilder = HandsontableBuilder.create(
                detailConfig.containerSelector,
                detailConfig
            );

            window.refreshGrid = function(page, pageSize) {
                if (window.ksInquiryDetailBuilder) {
                    window.ksInquiryDetailBuilder.refresh(page, pageSize);
                }
            };

            window.resetKsInquiryDetailFilters = function() {
                KsInquiryGridConfig.resetDetailFilterState();
            };
        });
    </script>
</div>
