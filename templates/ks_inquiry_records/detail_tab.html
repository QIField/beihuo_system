<!-- 询价单维度主表 -->
<div id="tab-detail" class="tab-pane active">
    <div class="table-container">
        <div id="ksInquiryGrid" class="ag-theme-alpine"></div>
    </div>
</div>

<style>
    .ag-row.resolve-group-even { background-color: #e8f5e9 !important; }
    .ag-row.resolve-group-odd { background-color: #ffffff !important; }
</style>

<script>
    // 主表列定义
    const columnDefs = [
        { headerName: '序号', valueGetter: params => params.node ? params.node.rowIndex + 1 : '', width: 80, sortable: false, filter: false, lockPosition: 'left' },
        { field: 'inquiryId', headerName: '询价单号', width: 150, sortable: false, filter: true },
        { field: 'customerName', headerName: '客户名称', width: 180, sortable: false, filter: true },
        { field: 'carBrandName', headerName: '车辆品牌', width: 120, sortable: false, filter: true },
        { field: 'vin', headerName: '车架号', width: 150, sortable: false, filter: true },
        { field: 'engine', headerName: '发动机', width: 120, sortable: false, filter: true },
        { field: 'productionDate', headerName: '车辆生产日期', width: 140, sortable: false, filter: true },
        { field: 'chassis', headerName: '底盘', width: 120, sortable: false, filter: true }
    ];

    // 副表列定义
    const detailColumnDefs = [
        { headerName: '序号', valueGetter: params => params.node ? params.node.rowIndex + 1 : '', width: 60, sortable: false, filter: false, lockPosition: 'left' },
        { field: 'resolve_parts_name', headerName: '配件名称', width: 200, sortable: false, filter: true },
        { field: 'partsNum', headerName: 'OE号', width: 150, sortable: false, filter: true },
        { field: 'brandName', headerName: '品牌', width: 120, sortable: false, filter: true },
        { field: 'brandNormalized', headerName: '标准化品牌', width: 120, sortable: false, filter: true },
        { field: 'brandId', headerName: '品牌ID', width: 100, sortable: false, filter: true },
        { field: 'sellerPrice', headerName: '含税价', width: 120, sortable: false, filter: true },
        { field: 'sellerBtPrice', headerName: '不含税价', width: 120, sortable: false, filter: true },
        { field: 'displaySellerStatus', headerName: '订单状态', width: 120, sortable: false, filter: true },
        { field: 'locationName', headerName: '发货地', width: 140, sortable: false, filter: true },
        { field: 'arrivalTime', headerName: '备货时间', width: 140, sortable: false, filter: true },
        { field: 'remark', headerName: '备注', width: 200, sortable: false, filter: true }
    ];

    // Grid 配置
    const gridOptions = {
        columnDefs: columnDefs,
        rowData: [],
        defaultColDef: {
            sortable: false,
            filter: true,
            resizable: true,
            suppressMenu: true
        },
        rowHeight: 36,
        headerHeight: 36,
        pagination: false,
        overlayLoadingTemplate: '<span class="ag-overlay-loading-center">正在加载数据...</span>',
        overlayNoRowsTemplate: '<span class="ag-overlay-no-rows-center">暂无数据</span>',
        rowSelection: 'single',

        onGridReady: function(event) {
            gridApi = event.api;
            gridColumnApi = event.columnApi;

            gridLoader = new AgGridLoader(gridApi);

            gridApi.sizeColumnsToFit();

            initDoubleClickCopy();

            if (typeof GridColumnMenu !== 'undefined') {
                GridColumnMenu.init(gridApi, '#ksInquiryGrid', columnDefs, {
                    columnApi: gridColumnApi,
                    gridOptions: gridOptions,
                    persist: true,
                    pageKey: 'ks_inquiry_records',
                    gridKey: 'master_grid',
                    onSort: function(colId, direction) {
                        refreshGrid(1, currentPageSize);
                    },
                    onDataRefresh: function(filterState) {
                        refreshGrid(1, currentPageSize);
                    },
                    getFilterValues: function(colId, callback) {
                        fetchMasterColumnValues(colId, callback);
                    }
                });
            }

            initCustomPagination();

            window.ksDetailPanel = GridDetailPanel.init({
                containerSelector: '#tab-detail',
                masterGridSelector: '#ksInquiryGrid',
                masterGridApi: gridApi,
                position: 'right',
                title: '询价明细',
                splitRatio: 0.5,
                showPagination: true,
                rowKeyField: 'inquiryId',
                columnDefs: detailColumnDefs,
                loadUrl: '/new/api/ks_inquiry/records',
                persistPageKey: 'ks_inquiry_records',
                persistGridKey: 'detail_panel_grid',
                buildParams: function(rowData) {
                    const params = getSearchParams('detail');
                    params.inquiry_id = rowData.inquiryId || '';
                    return params;
                },
                getRowClass: function(params) {
                    return params.data && params.data._resolveGroupClass ? params.data._resolveGroupClass : '';
                },
                onLoad: function(data) {
                    const list = data.list || [];
                    console.log('[detail_panel] raw rows:', list.length, list.map(r => r.resolve_parts_num));
                    // 按 resolve_parts_num 排序，使相同 OE 相邻
                    list.sort(function(a, b) {
                        return (a.resolve_parts_num || '').localeCompare(b.resolve_parts_num || '');
                    });
                    // 为相邻的 resolve_parts_num 组分配交替背景色
                    let currentGroup = null;
                    let groupIndex = -1;
                    list.forEach(function(row) {
                        const val = row.resolve_parts_num || '';
                        if (val !== currentGroup) {
                            currentGroup = val;
                            groupIndex++;
                        }
                        row._resolveGroupClass = (groupIndex % 2 === 0) ? 'resolve-group-even' : 'resolve-group-odd';
                        console.log('[detail_panel] row:', row.resolve_parts_num, 'class:', row._resolveGroupClass);
                    });

                    if (window.ksDetailPanel && window.ksDetailPanel.detailGridApi) {
                        window.ksDetailPanel.detailGridApi.setRowData(list);
                    }
                    if (window.ksDetailPanel && typeof GridColumnMenu !== 'undefined' && GridColumnMenu.setOriginalRows) {
                        GridColumnMenu.setOriginalRows('#' + window.ksDetailPanel.gridId, list);
                    }
                    if (typeof GridColumnMenu !== 'undefined' && GridColumnMenu.addMenuButtonsToHeaders) {
                        GridColumnMenu.addMenuButtonsToHeaders('#' + window.ksDetailPanel.gridId);
                    }
                },
                getFilterValues: function(colId, callback, rowData) {
                    fetchDetailColumnValues(colId, callback, rowData);
                }
            });

            refreshGrid();
        },

        onRowClicked: function(event) {
            if (window.ksDetailPanel) {
                window.ksDetailPanel.open(event.data);
            }
        }
    };

    // 初始化双击复制功能（主表）
    function initDoubleClickCopy() {
        const gridDiv = document.querySelector('#ksInquiryGrid');
        if (!gridDiv) return;

        gridDiv.addEventListener('dblclick', function(e) {
            const cellElement = e.target.closest('.ag-cell');
            if (!cellElement) return;

            const rowId = cellElement.closest('.ag-row')?.getAttribute('row-id');
            const colId = cellElement.getAttribute('col-id');

            if (rowId && colId && gridApi) {
                const rowNode = gridApi.getRowNode(rowId);
                if (rowNode && rowNode.data) {
                    const value = rowNode.data[colId];
                    if (value !== undefined && value !== null) {
                        copyToClipboardUniversal(String(value), function() {
                            layui.layer.msg('已复制到剪贴板', {icon: 1, time: 1000});
                        }, function() {
                            layui.layer.msg('复制失败', {icon: 2});
                        });
                    }
                }
            }
        });
    }

    // 初始化自定义分页组件
    function initCustomPagination() {
        if (typeof CustomPagination === 'undefined') {
            console.error('[KsInquiryRecords] CustomPagination 组件未加载');
            return;
        }

        customPagination = CustomPagination.init({
            gridSelector: '#ksInquiryGrid',
            pageSizeOptions: [50, 100, 200, 500],
            defaultPageSize: 200,
            showScrollToTop: true,
            onPageChange: function(page, pageSize) {
                currentPage = page;
                currentPageSize = pageSize;
                refreshGrid(page, pageSize);
            },
            onPageSizeChange: function(pageSize) {
                currentPageSize = pageSize;
            }
        });
    }

    // 更新分页信息
    function updatePaginationInfo() {
        if (customPagination) {
            customPagination.update(totalRecords, currentPage, currentPageSize);
        }
    }

    // 刷新主表数据
    function refreshGrid(page, pageSize) {
        currentPage = page || currentPage || 1;
        currentPageSize = pageSize || currentPageSize || 200;

        const params = getSearchParams('detail');
        params.page = currentPage;
        params.page_size = currentPageSize;

        if (typeof GridColumnMenu !== 'undefined' && GridColumnMenu.getSortState) {
            const sortState = GridColumnMenu.getSortState('#ksInquiryGrid');
            if (sortState.sortColumn) {
                params.sort_column = sortState.sortColumn;
                params.sort_dir = sortState.sortDir;
            }
        }

        if (typeof GridColumnMenu !== 'undefined' && GridColumnMenu.getFilterState) {
            const filterState = GridColumnMenu.getFilterState('#ksInquiryGrid');
            if (filterState.active && filterState.filters) {
                params.column_filters = JSON.stringify(filterState.filters);
            }
        }

        gridLoader.load('/new/api/ks_inquiry/records/master', params, (data) => {
            currentData = data.list || [];
            totalRecords = data.total;

            if (typeof GridColumnMenu !== 'undefined' && GridColumnMenu.setOriginalRows) {
                GridColumnMenu.setOriginalRows('#ksInquiryGrid', currentData);
            }
            if (typeof GridColumnMenu !== 'undefined' && GridColumnMenu.addMenuButtonsToHeaders) {
                GridColumnMenu.addMenuButtonsToHeaders('#ksInquiryGrid');
            }

            updatePaginationInfo();
        }, (error) => {
            console.error('主表请求失败:', error);
        });
    }

    // 从后端获取副表指定列的全量不重复值（限定在当前订单）
    function fetchDetailColumnValues(colId, callback, rowData) {
        const params = getSearchParams('detail');
        params.inquiry_id = rowData && rowData.inquiryId ? rowData.inquiryId : '';
        params.column = colId;
        params.grid_type = 'detail';

        if (window.ksDetailPanel && typeof GridColumnMenu !== 'undefined' && GridColumnMenu.getFilterState) {
            const filterState = GridColumnMenu.getFilterState('#' + window.ksDetailPanel.gridId);
            if (filterState.active && filterState.filters) {
                const otherFilters = {};
                Object.keys(filterState.filters).forEach(function(key) {
                    if (key !== colId) {
                        otherFilters[key] = filterState.filters[key];
                    }
                });
                if (Object.keys(otherFilters).length > 0) {
                    params.column_filters = JSON.stringify(otherFilters);
                }
            }
        }

        fetch('/new/api/ks_inquiry/records/column_values?' + new URLSearchParams(params))
            .then(function(response) { return response.json(); })
            .then(function(result) {
                if (result.code === 0 || result.code === '0') {
                    callback(result.data?.values || []);
                } else {
                    console.error('[detail_panel] 获取列值失败:', result.message);
                    callback([]);
                }
            })
            .catch(function(error) {
                console.error('[detail_panel] 获取列值请求失败:', error);
                callback([]);
            });
    }

    // 从后端获取主表指定列的全量不重复值
    function fetchMasterColumnValues(colId, callback) {
        const params = getSearchParams('detail');
        params.column = colId;
        params.grid_type = 'master';

        if (typeof GridColumnMenu !== 'undefined' && GridColumnMenu.getFilterState) {
            const filterState = GridColumnMenu.getFilterState('#ksInquiryGrid');
            if (filterState.active && filterState.filters) {
                const otherFilters = {};
                Object.keys(filterState.filters).forEach(function(key) {
                    if (key !== colId) {
                        otherFilters[key] = filterState.filters[key];
                    }
                });
                if (Object.keys(otherFilters).length > 0) {
                    params.column_filters = JSON.stringify(otherFilters);
                }
            }
        }

        fetch('/new/api/ks_inquiry/records/column_values?' + new URLSearchParams(params))
            .then(function(response) { return response.json(); })
            .then(function(result) {
                if (result.code === 0 || result.code === '0') {
                    callback(result.data?.values || []);
                } else {
                    console.error('[master] 获取列值失败:', result.message);
                    callback([]);
                }
            })
            .catch(function(error) {
                console.error('[master] 获取列值请求失败:', error);
                callback([]);
            });
    }
</script>
