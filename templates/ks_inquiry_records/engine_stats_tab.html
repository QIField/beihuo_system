<!-- ECharts 本地引入 -->
<script src="{{ url_for('static', filename='js/lib/echarts.min.js') }}"></script>

<!-- 发动机及底盘维度 -->
<div id="tab-engine" class="tab-pane">
    <!-- 第一行：三个柱状图并排（自适应宽度） -->
    <div style="display: flex; gap: 20px; margin-bottom: 20px;">
        <div style="flex: 1; min-width: 0;">
            <div style="font-size: 16px; font-weight: 600; color: #333; margin: 20px 0 10px 0;">底盘 TOP 10</div>
            <div id="chassisChart" style="height: 300px; width: 100%; background: #fff; border: 1px solid #e8e8e8; border-radius: 4px;"></div>
        </div>
        <div style="flex: 1; min-width: 0;">
            <div style="font-size: 16px; font-weight: 600; color: #333; margin: 20px 0 10px 0;">OE号码 TOP 10</div>
            <div id="oeNumChart" style="height: 300px; width: 100%; background: #fff; border: 1px solid #e8e8e8; border-radius: 4px;"></div>
        </div>
        <div style="flex: 1; min-width: 0;">
            <div style="font-size: 16px; font-weight: 600; color: #333; margin: 20px 0 10px 0;">发动机 TOP 10</div>
            <div id="engineChart" style="height: 300px; width: 100%; background: #fff; border: 1px solid #e8e8e8; border-radius: 4px;"></div>
        </div>
    </div>

    <!-- 第二行：三个表格并排（自适应宽度） -->
    <div style="display: flex; gap: 20px; margin-bottom: 10px;">
        <div style="flex: 1; min-width: 0;">
            <div style="font-size: 16px; font-weight: 600; color: #333; margin: 10px 0 10px 0;">底盘统计</div>
            <div id="chassisGrid" class="ag-theme-alpine" style="height: 300px; width: 100%;"></div>
        </div>
        <div style="flex: 1; min-width: 0;">
            <div style="font-size: 16px; font-weight: 600; color: #333; margin: 10px 0 10px 0;">OE号码统计</div>
            <div id="oeNumGrid" class="ag-theme-alpine" style="height: 300px; width: 100%;"></div>
        </div>
        <div style="flex: 1; min-width: 0;">
            <div style="font-size: 16px; font-weight: 600; color: #333; margin: 10px 0 10px 0;">发动机统计</div>
            <div id="engineGrid" class="ag-theme-alpine" style="height: 300px; width: 100%;"></div>
        </div>
    </div>
</div>

<script>
(function() {
    let chassisGridApi = null;
    let engineGridApi = null;
    let oeNumGridApi = null;

    // 标记初始化后是否需要自动加载
    let autoLoadAfterReady = false;

    // 检查三个表格是否都就绪，若已标记自动加载则刷新
    function checkAllGridsReady() {
        if (autoLoadAfterReady && chassisGridApi && engineGridApi && oeNumGridApi) {
            autoLoadAfterReady = false;
            refreshEngineChassis();
        }
    }

    // ECharts 实例
    let chassisChartInstance = null;
    let engineChartInstance = null;
    let oeNumChartInstance = null;

    // 初始化图表（等待 echarts 加载完成）
    function initCharts() {
        if (typeof echarts === 'undefined') {
            setTimeout(initCharts, 100);
            return;
        }
        const chassisDom = document.getElementById('chassisChart');
        const oeNumDom = document.getElementById('oeNumChart');
        const engineDom = document.getElementById('engineChart');
        if (chassisDom && !chassisChartInstance) chassisChartInstance = echarts.init(chassisDom);
        if (oeNumDom && !oeNumChartInstance) oeNumChartInstance = echarts.init(oeNumDom);
        if (engineDom && !engineChartInstance) engineChartInstance = echarts.init(engineDom);

        // 设置空状态
        setEmptyChart(chassisChartInstance);
        setEmptyChart(oeNumChartInstance);
        setEmptyChart(engineChartInstance);
    }

    // 设置空状态
    function setEmptyChart(instance) {
        if (!instance) return;
        instance.clear();
        instance.setOption({
            title: { text: '暂无数据', left: 'center', top: 'middle', textStyle: { color: '#999', fontSize: 14, fontWeight: 'normal' } }
        });
    }

    // 渲染柱状图（TOP 10）
    function renderChart(instance, list, labelField, title, color) {
        if (!instance) return;
        if (!list || list.length === 0) {
            setEmptyChart(instance);
            return;
        }
        const top10 = list.slice(0, 10);
        const categories = top10.map(item => item[labelField] || '未知');
        const values = top10.map(item => item.count || 0);

        instance.setOption({
            title: null,
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
            grid: { left: '3%', right: '4%', bottom: '18%', top: '8%', containLabel: true },
            xAxis: {
                type: 'category',
                data: categories,
                axisLabel: { rotate: 30, fontSize: 11, interval: 0 }
            },
            yAxis: { type: 'value', name: '次数' },
            series: [{
                name: title,
                type: 'bar',
                data: values,
                itemStyle: { color: color, borderRadius: [4, 4, 0, 0] },
                label: { show: true, position: 'top', fontSize: 11 }
            }]
        }, true);
    }

    // 窗口尺寸变化时图表自适应
    window.addEventListener('resize', function() {
        chassisChartInstance && chassisChartInstance.resize();
        engineChartInstance && engineChartInstance.resize();
        oeNumChartInstance && oeNumChartInstance.resize();
    });

    // 底盘表格列定义
    const chassisColumnDefs = [
        { headerName: '序号', valueGetter: params => params.node ? params.node.rowIndex + 1 : '', width: 60, sortable: false, suppressMenu: true, lockPosition: 'left' },
        { field: 'carBrandName', headerName: '车辆品牌', width: 140, sortable: false, suppressMenu: true },
        { field: 'chassis', headerName: '底盘', width: 140, sortable: false, suppressMenu: true },
        { field: 'count', headerName: '出现次数', width: 100, sortable: false, suppressMenu: true }
    ];

    // 发动机表格列定义
    const engineColumnDefs = [
        { headerName: '序号', valueGetter: params => params.node ? params.node.rowIndex + 1 : '', width: 60, sortable: false, suppressMenu: true, lockPosition: 'left' },
        { field: 'carBrandName', headerName: '车辆品牌', width: 140, sortable: false, suppressMenu: true },
        { field: 'engine', headerName: '发动机代码', width: 140, sortable: false, suppressMenu: true },
        { field: 'count', headerName: '出现次数', width: 100, sortable: false, suppressMenu: true }
    ];

    // OE号码表格列定义
    const oeNumColumnDefs = [
        { headerName: '序号', valueGetter: params => params.node ? params.node.rowIndex + 1 : '', width: 60, sortable: false, suppressMenu: true, lockPosition: 'left' },
        { field: 'carBrandName', headerName: '车辆品牌', width: 140, sortable: false, suppressMenu: true },
        { field: 'partsNum', headerName: 'OE号码', width: 140, sortable: false, suppressMenu: true },
        { field: 'count', headerName: '出现次数', width: 100, sortable: false, suppressMenu: true }
    ];

    // 通用表格配置
    function createGridOptions(columnDefs, gridType) {
        var gridOpts = {
            columnDefs: columnDefs,
            rowData: [],
            defaultColDef: { resizable: true },
            suppressHorizontalScroll: false,
            pagination: false,
            overlayLoadingTemplate: '<span class="ag-overlay-loading-center">正在加载数据...</span>',
            overlayNoRowsTemplate: '<span class="ag-overlay-no-rows-center">暂无数据</span>',
            rowSelection: 'single',
            suppressRowClickSelection: true,
            onGridReady: function(params) {
                if (gridType === 'chassis') chassisGridApi = params.api;
                else if (gridType === 'engine') engineGridApi = params.api;
                else if (gridType === 'oeNum') oeNumGridApi = params.api;

                // 三个表格都就绪后，若已标记自动加载则刷新
                checkAllGridsReady();

                var columnApi = params.columnApi;

                params.api.sizeColumnsToFit();

                // 添加双击复制功能
                setupDoubleClickCopy(params.api, gridType);

                // 添加列菜单功能（含持久化）
                var gridSelector = gridType === 'chassis' ? '#chassisGrid' :
                                   gridType === 'engine' ? '#engineGrid' : '#oeNumGrid';
                var gridKeyName = gridType === 'chassis' ? 'engine_chassis_grid' :
                                  gridType === 'engine' ? 'engine_engine_grid' : 'engine_oenum_grid';
                if (typeof GridColumnMenu !== 'undefined') {
                    GridColumnMenu.init(params.api, gridSelector, columnDefs, {
                        columnApi: columnApi,
                        gridOptions: gridOpts,
                        persist: true,
                        pageKey: 'ks_inquiry_records',
                        gridKey: gridKeyName,
                        onSort: function(colId, direction) {
                            // 排序改变，重新加载对应表格
                            const searchParams = getEngineSearchParams();
                            if (gridType === 'chassis') loadChassisStats(searchParams);
                            else if (gridType === 'engine') loadEngineStats(searchParams);
                            else if (gridType === 'oeNum') loadOeNumStats(searchParams);
                        },
                        onDataRefresh: function(filterState) {
                            // 列筛选改变，重新加载对应表格
                            const searchParams = getEngineSearchParams();
                            if (gridType === 'chassis') loadChassisStats(searchParams);
                            else if (gridType === 'engine') loadEngineStats(searchParams);
                            else if (gridType === 'oeNum') loadOeNumStats(searchParams);
                        },
                        getFilterValues: function(colId, callback) {
                            fetchEngineColumnValues(gridType, colId, callback);
                        }
                    });
                }
            }
        };
        return gridOpts;
    }

    // 设置双击复制功能
    function setupDoubleClickCopy(gridApi, gridType) {
        const gridId = gridType === 'chassis' ? 'chassisGrid' :
                       gridType === 'engine' ? 'engineGrid' : 'oeNumGrid';
        const gridDiv = document.querySelector('#' + gridId);
        if (!gridDiv) return;

        gridDiv.addEventListener('dblclick', function(e) {
            const cellElement = e.target.closest('.ag-cell');
            if (!cellElement) return;

            const rowId = cellElement.closest('.ag-row')?.getAttribute('row-id');
            const colId = cellElement.getAttribute('col-id');

            if (rowId && colId && gridApi) {
                const rowNode = gridApi.getRowNode(rowId);
                if (rowNode && rowNode.data) {
                    const value = rowNode.data[colId];
                    if (value !== undefined && value !== null) {
                        const textToCopy = String(value);
                        copyToClipboardUniversal(textToCopy, function() {
                            layui.layer.msg('已复制到剪贴板', {icon: 1, time: 1000});
                        }, function() {
                            layui.layer.msg('复制失败', {icon: 2});
                        });
                    }
                }
            }
        });
    }

    // 获取搜索参数（包含日期范围和客户名称）
    function getEngineSearchParams() {
        let beginDate = '', endDate = '';
        const dateRangeValue = document.getElementById('dateRange').value;
        if (dateRangeValue) {
            const dates = dateRangeValue.split(' - ');
            beginDate = dates[0] || '';
            endDate = dates[1] || '';
        }

        return {
            garage_name: document.getElementById('searchGarageName').value || '',
            begin_date: beginDate,
            end_date: endDate,
            company: userCompany
        };
    }

    // 获取指定表格的排序参数
    function getSortParams(gridSelector) {
        if (typeof GridColumnMenu !== 'undefined' && GridColumnMenu.getSortState) {
            const state = GridColumnMenu.getSortState(gridSelector);
            if (state.sortColumn) {
                return {
                    sort_column: state.sortColumn,
                    sort_dir: state.sortDir
                };
            }
        }
        return {};
    }

    // 搜索修理厂统计
    window.searchGarageStats = function() {
        const params = getEngineSearchParams();

        loadChassisStats(params);
        loadEngineStats(params);
        loadOeNumStats(params);
    };

    // 加载底盘统计
    function loadChassisStats(params) {
        if (!chassisGridApi) return;

        chassisGridApi.showLoadingOverlay();

        // 合并排序参数
        const sortParams = getSortParams('#chassisGrid');
        const finalParams = Object.assign({}, params, sortParams);

        // 合并列头下拉筛选条件（后端全量数据筛选）
        if (typeof GridColumnMenu !== 'undefined' && GridColumnMenu.getFilterState) {
            const filterState = GridColumnMenu.getFilterState('#chassisGrid');
            if (filterState.active && filterState.filters) {
                finalParams.column_filters = JSON.stringify(filterState.filters);
            }
        }

        fetch('/new/api/ks_inquiry/records/garage_chassis_stats?' + new URLSearchParams(finalParams))
        .then(response => response.json())
        .then(data => {
            if (data.code === 0 || data.code === '0') {
                const list = data.data?.list || [];
                // 缓存原始数据到 GridColumnMenu，供列筛选下拉选项使用
                if (typeof GridColumnMenu !== 'undefined' && GridColumnMenu.setOriginalRows) {
                    GridColumnMenu.setOriginalRows('#chassisGrid', list);
                }
                // 列筛选已由后端完成，前端不再二次过滤
                chassisGridApi.setRowData(list);
                renderChart(chassisChartInstance, list, 'chassis', '底盘', '#5470c6');
            } else {
                layui.layer.msg(data.message || '查询失败', {icon: 2});
                chassisGridApi.setRowData([]);
                setEmptyChart(chassisChartInstance);
            }
        })
        .catch(error => {
            console.error('底盘统计查询失败:', error);
            layui.layer.msg('查询失败，请稍后重试', {icon: 2});
            chassisGridApi.setRowData([]);
            setEmptyChart(chassisChartInstance);
        });
    }

    // 加载发动机统计
    function loadEngineStats(params) {
        if (!engineGridApi) return;

        engineGridApi.showLoadingOverlay();

        // 合并排序参数
        const sortParams = getSortParams('#engineGrid');
        const finalParams = Object.assign({}, params, sortParams);

        // 合并列头下拉筛选条件（后端全量数据筛选）
        if (typeof GridColumnMenu !== 'undefined' && GridColumnMenu.getFilterState) {
            const filterState = GridColumnMenu.getFilterState('#engineGrid');
            if (filterState.active && filterState.filters) {
                finalParams.column_filters = JSON.stringify(filterState.filters);
            }
        }

        fetch('/new/api/ks_inquiry/records/garage_engine_stats?' + new URLSearchParams(finalParams))
        .then(response => response.json())
        .then(data => {
            if (data.code === 0 || data.code === '0') {
                const list = data.data?.list || [];
                if (typeof GridColumnMenu !== 'undefined' && GridColumnMenu.setOriginalRows) {
                    GridColumnMenu.setOriginalRows('#engineGrid', list);
                }
                // 列筛选已由后端完成，前端不再二次过滤
                engineGridApi.setRowData(list);
                renderChart(engineChartInstance, list, 'engine', '发动机', '#91cc75');
            } else {
                layui.layer.msg(data.message || '查询失败', {icon: 2});
                engineGridApi.setRowData([]);
                setEmptyChart(engineChartInstance);
            }
        })
        .catch(error => {
            console.error('发动机统计查询失败:', error);
            layui.layer.msg('查询失败，请稍后重试', {icon: 2});
            engineGridApi.setRowData([]);
            setEmptyChart(engineChartInstance);
        });
    }

    // 加载OE号码统计
    function loadOeNumStats(params) {
        if (!oeNumGridApi) return;

        oeNumGridApi.showLoadingOverlay();

        // 合并排序参数
        const sortParams = getSortParams('#oeNumGrid');
        const finalParams = Object.assign({}, params, sortParams);

        // 合并列头下拉筛选条件（后端全量数据筛选）
        if (typeof GridColumnMenu !== 'undefined' && GridColumnMenu.getFilterState) {
            const filterState = GridColumnMenu.getFilterState('#oeNumGrid');
            if (filterState.active && filterState.filters) {
                finalParams.column_filters = JSON.stringify(filterState.filters);
            }
        }

        fetch('/new/api/ks_inquiry/records/garage_oenum_stats?' + new URLSearchParams(finalParams))
        .then(response => response.json())
        .then(data => {
            if (data.code === 0 || data.code === '0') {
                const list = data.data?.list || [];
                if (typeof GridColumnMenu !== 'undefined' && GridColumnMenu.setOriginalRows) {
                    GridColumnMenu.setOriginalRows('#oeNumGrid', list);
                }
                // 列筛选已由后端完成，前端不再二次过滤
                oeNumGridApi.setRowData(list);
                renderChart(oeNumChartInstance, list, 'partsNum', 'OE号码', '#fac858');
            } else {
                layui.layer.msg(data.message || '查询失败', {icon: 2});
                oeNumGridApi.setRowData([]);
                setEmptyChart(oeNumChartInstance);
            }
        })
        .catch(error => {
            console.error('OE号码统计查询失败:', error);
            layui.layer.msg('查询失败，请稍后重试', {icon: 2});
            oeNumGridApi.setRowData([]);
            setEmptyChart(oeNumChartInstance);
        });
    }

    // 初始化表格
    window.initEngineChassisGrid = function() {
        // 标记需要在三个表格都就绪后自动加载一次
        autoLoadAfterReady = true;

        // 初始化底盘表格
        if (!chassisGridApi) {
            const chassisDiv = document.querySelector('#chassisGrid');
            if (chassisDiv) {
                new agGrid.Grid(chassisDiv, createGridOptions(chassisColumnDefs, 'chassis'));
            }
        } else {
            setTimeout(() => chassisGridApi.sizeColumnsToFit(), 0);
        }

        // 初始化发动机表格
        if (!engineGridApi) {
            const engineDiv = document.querySelector('#engineGrid');
            if (engineDiv) {
                new agGrid.Grid(engineDiv, createGridOptions(engineColumnDefs, 'engine'));
            }
        } else {
            setTimeout(() => engineGridApi.sizeColumnsToFit(), 0);
        }

        // 初始化OE号码表格
        if (!oeNumGridApi) {
            const oeNumDiv = document.querySelector('#oeNumGrid');
            if (oeNumDiv) {
                new agGrid.Grid(oeNumDiv, createGridOptions(oeNumColumnDefs, 'oeNum'));
            }
        } else {
            setTimeout(() => oeNumGridApi.sizeColumnsToFit(), 0);
        }

        // 若表格之前已初始化，直接刷新
        checkAllGridsReady();

        // 初始化柱状图
        initCharts();
        // 切换 tab 后图表需要 resize 以适配显示尺寸
        setTimeout(() => {
            chassisChartInstance && chassisChartInstance.resize();
            engineChartInstance && engineChartInstance.resize();
            oeNumChartInstance && oeNumChartInstance.resize();
        }, 50);
    };

    // 刷新表格（供外部调用）
    window.refreshEngineChassis = function() {
        const params = getEngineSearchParams();
        loadChassisStats(params);
        loadEngineStats(params);
        loadOeNumStats(params);
    };

    // 从后端获取发动机及底盘维度指定列的全量不重复值（用于列头下拉筛选）
    function fetchEngineColumnValues(gridType, colId, callback) {
        const params = getEngineSearchParams();
        params.column = colId;
        params.grid_type = gridType === 'chassis' ? 'garage_chassis'
                         : gridType === 'engine' ? 'garage_engine'
                         : 'garage_oenum';

        const gridSelector = gridType === 'chassis' ? '#chassisGrid'
                            : gridType === 'engine' ? '#engineGrid'
                            : '#oeNumGrid';

        if (typeof GridColumnMenu !== 'undefined' && GridColumnMenu.getFilterState) {
            const filterState = GridColumnMenu.getFilterState(gridSelector);
            if (filterState.active && filterState.filters) {
                const otherFilters = {};
                Object.keys(filterState.filters).forEach(function(key) {
                    if (key !== colId) {
                        otherFilters[key] = filterState.filters[key];
                    }
                });
                if (Object.keys(otherFilters).length > 0) {
                    params.column_filters = JSON.stringify(otherFilters);
                }
            }
        }

        fetch('/new/api/ks_inquiry/records/column_values?' + new URLSearchParams(params))
            .then(function(response) { return response.json(); })
            .then(function(result) {
                if (result.code === 0 || result.code === '0') {
                    callback(result.data?.values || []);
                } else {
                    console.error('[engine_stats_tab] 获取列值失败:', result.message);
                    callback([]);
                }
            })
            .catch(function(error) {
                console.error('[engine_stats_tab] 获取列值请求失败:', error);
                callback([]);
            });
    }
})();
</script>
