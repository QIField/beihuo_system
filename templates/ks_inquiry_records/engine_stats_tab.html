<!-- 发动机及底盘维度 -->
<div id="tab-engine" class="tab-pane">
    <div class="table-container">
        <div id="engineChassisGrid" class="ag-theme-alpine"></div>
    </div>
</div>

<script>
(function() {
    let engineChassisGridApi = null;
    let engineChassisGridOptions = null;
    let engineChassisGridLoader = null;

    const engineChassisColumnDefs = [
        { field: 'engine', headerName: '发动机', width: 200, sortable: true, filter: true, pinned: 'left' },
        { field: 'chassis', headerName: '底盘', width: 200, sortable: true, filter: true, pinned: 'left' },
        { field: 'vin', headerName: 'VIN', width: 200, sortable: true, filter: true },
        { field: 'vehicleProductionDate', headerName: '车辆生产日期', width: 180, sortable: true, filter: true }
    ];

    engineChassisGridOptions = {
        columnDefs: engineChassisColumnDefs,
        rowData: [],
        defaultColDef: { resizable: true },
        suppressHorizontalScroll: false,
        pagination: false,
        overlayLoadingTemplate: '<span class="ag-overlay-loading-center">正在加载数据...</span>',
        overlayNoRowsTemplate: '<span class="ag-overlay-no-rows-center">暂无数据</span>',
        rowSelection: 'single',
        suppressRowClickSelection: true,
        onGridReady: function(params) {
            engineChassisGridApi = params.api;

            // 初始化数据加载器
            engineChassisGridLoader = new AgGridLoader(engineChassisGridApi);

            params.api.sizeColumnsToFit();
            refreshEngineChassisGrid();
        }
    };

    function getEngineChassisSearchParams() {
        let beginDate = '', endDate = '';
        const dateRangeValue = document.getElementById('dateRange').value;
        if (dateRangeValue) {
            const dates = dateRangeValue.split(' - ');
            beginDate = dates[0] || '';
            endDate = dates[1] || '';
        }

        return {
            begin_date: beginDate,
            end_date: endDate,
            company: userCompany,
            engine: document.getElementById('searchEngine').value || '',
            chassis: document.getElementById('searchChassis').value || '',
            vin: document.getElementById('searchVin').value || ''
        };
    }

    function refreshEngineChassisGrid() {
        if (!engineChassisGridApi || !engineChassisGridLoader) return;

        const params = getEngineChassisSearchParams();

        engineChassisGridLoader.load('/new/api/ks_inquiry/records/engine_chassis', params, (data) => {
            console.log('发动机及底盘维度第一条数据:', data.list[0] || null);
        }, (error) => {
            layui.layer.msg('查询失败，请稍后重试', {icon: 2});
        });
    }

    window.refreshEngineChassis = refreshEngineChassisGrid;

    window.initEngineChassisGrid = function() {
        if (engineChassisGridApi) {
            setTimeout(function() {
                engineChassisGridApi.sizeColumnsToFit();
            }, 0);
            refreshEngineChassisGrid();
            return;
        }

        const gridDiv = document.querySelector('#engineChassisGrid');
        if (!gridDiv) return;

        new agGrid.Grid(gridDiv, engineChassisGridOptions);

        gridDiv.addEventListener('dblclick', function(e) {
            const cellElement = e.target.closest('.ag-cell');
            if (!cellElement) return;

            const rowId = cellElement.closest('.ag-row')?.getAttribute('row-id');
            const colId = cellElement.getAttribute('col-id');

            if (rowId && colId && engineChassisGridApi) {
                const rowNode = engineChassisGridApi.getRowNode(rowId);
                if (rowNode && rowNode.data) {
                    const value = rowNode.data[colId];
                    if (value !== undefined && value !== null) {
                        const textToCopy = String(value);
                        navigator.clipboard.writeText(textToCopy).then(() => {
                            layui.layer.msg('已复制到剪贴板', {icon: 1, time: 1000});
                        }).catch(err => {
                            console.error('复制失败:', err);
                            layui.layer.msg('复制失败', {icon: 2});
                        });
                    }
                }
            }
        });

        refreshEngineChassisGrid();
    };
})();
</script>
