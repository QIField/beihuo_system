<!-- OE军备统计 -->
<div id="tab-oe" class="tab-pane">
    <div class="table-container">
        <div id="oeStatsGrid" class="ag-theme-alpine"></div>
    </div>
</div>

<script>
    var oeStatsGridApi = null;
    var oeStatsGridColumnApi = null;
    var oeStatsCurrentPage = 1;
    var oeStatsCurrentPageSize = 200;
    var oeStatsTotalRecords = 0;
    var oeStatsCustomPagination = null;
    var oeStatsGridLoader = null;

    const oeStatsColumnDefs = [
        { headerName: '序号', valueGetter: params => params.node ? params.node.rowIndex + 1 : '', width: 80, sortable: false, filter: false, lockPosition: 'left' },
        { field: 'resolve_parts_num', headerName: 'OE号', width: 150, sortable: false, filter: true },
        { field: 'count', headerName: '出现次数', width: 120, sortable: false, filter: true },
        { field: 'carBrandName', headerName: '车辆品牌', width: 180, sortable: false, filter: true },
        { field: 'partsName', headerName: '配件名称', width: 300, sortable: false, filter: true }
    ];

    const oeStatsGridOptions = {
        columnDefs: oeStatsColumnDefs,
        rowData: [],
        defaultColDef: {
            sortable: false,
            filter: true,
            resizable: true,
            suppressMenu: true
        },
        rowHeight: 36,
        headerHeight: 36,
        pagination: false,
        animateRows: true,
        overlayLoadingTemplate: '<span class="ag-overlay-loading-center">正在加载数据...</span>',
        overlayNoRowsTemplate: '<span class="ag-overlay-no-rows-center">暂无数据</span>',
        onGridReady: function(event) {
            oeStatsGridApi = event.api;
            oeStatsGridColumnApi = event.columnApi;

            // 初始化数据加载器
            oeStatsGridLoader = new AgGridLoader(oeStatsGridApi);

            oeStatsGridApi.sizeColumnsToFit();

            // 初始化列菜单功能（含持久化）
            if (typeof GridColumnMenu !== 'undefined') {
                GridColumnMenu.init(oeStatsGridApi, '#oeStatsGrid', oeStatsColumnDefs, {
                    columnApi: oeStatsGridColumnApi,
                    gridOptions: oeStatsGridOptions,
                    persist: true,
                    pageKey: 'ks_inquiry_records',
                    gridKey: 'oe_grid',
                    onSort: function(colId, direction) {
                        refreshOeStats(1, oeStatsCurrentPageSize);
                    },
                    onDataRefresh: function(filterState) {
                        refreshOeStats(1, oeStatsCurrentPageSize);
                    },
                    getFilterValues: function(colId, callback) {
                        fetchOeStatsColumnValues(colId, callback);
                    }
                });
            }

            refreshOeStats();
        },
        rowSelection: 'single',
        onRowClicked: function(event) {
            if (window.oeDetailPanel) {
                window.oeDetailPanel.open(event.data);
            }
        }
    };

    function initOeStatsGrid() {
        if (oeStatsGridApi) {
            refreshOeStats();
            return;
        }

        const gridDiv = document.querySelector('#oeStatsGrid');
        if (!gridDiv) return;

        new agGrid.Grid(gridDiv, oeStatsGridOptions);

        // 初始化双击复制功能
        gridDiv.addEventListener('dblclick', function(e) {
            const cellElement = e.target.closest('.ag-cell');
            if (!cellElement) return;

            const rowId = cellElement.closest('.ag-row')?.getAttribute('row-id');
            const colId = cellElement.getAttribute('col-id');

            if (rowId && colId && oeStatsGridApi) {
                const rowNode = oeStatsGridApi.getRowNode(rowId);
                if (rowNode && rowNode.data) {
                    const value = rowNode.data[colId];
                    if (value !== undefined && value !== null) {
                        const textToCopy = String(value);
                        copyToClipboardUniversal(textToCopy, function() {
                            layui.layer.msg('已复制到剪贴板', {icon: 1, time: 1000});
                        }, function() {
                            layui.layer.msg('复制失败', {icon: 2});
                        });
                    }
                }
            }
        });

        // 初始化自定义分页组件
        if (typeof CustomPagination !== 'undefined') {
            oeStatsCustomPagination = CustomPagination.init({
                gridSelector: '#oeStatsGrid',
                pageSizeOptions: [50, 100, 200, 500],
                defaultPageSize: 200,
                showScrollToTop: true,
                onPageChange: function(page, pageSize) {
                    oeStatsCurrentPage = page;
                    oeStatsCurrentPageSize = pageSize;
                    refreshOeStats(page, pageSize);
                },
                onPageSizeChange: function(pageSize) {
                    oeStatsCurrentPageSize = pageSize;
                }
            });
        }

        // 初始化右侧副表面板
        window.oeDetailPanel = GridDetailPanel.init({
            containerSelector: '#tab-oe',
            masterGridSelector: '#oeStatsGrid',
            masterGridApi: oeStatsGridApi,
            position: 'right',
            title: 'OE号客户统计',
            splitRatio: 0.5,
            showPagination: true,
            persistPageKey: 'ks_inquiry_records',
            persistGridKey: 'oe_detail_panel_grid',
            columnDefs: [
                { headerName: '序号', valueGetter: params => params.node ? params.node.rowIndex + 1 : '', width: 60, lockPosition: 'left' },
                { field: 'customerName', headerName: '客户名称', width: 220 },
                { field: 'count', headerName: '出现次数', width: 120 }
            ],
            loadUrl: '/new/api/ks_inquiry/records/customer_stats_by_oe',
            buildParams: function(rowData) {
                var params = getSearchParams(currentTab);
                params.resolve_parts_num = rowData.resolve_parts_num;
                return params;
            },
            onLoad: function(data) {
                var list = data.list || [];
                if (window.oeDetailPanel && typeof GridColumnMenu !== 'undefined') {
                    GridColumnMenu.setOriginalRows('#' + window.oeDetailPanel.gridId, list);
                    GridColumnMenu.addMenuButtonsToHeaders('#' + window.oeDetailPanel.gridId);
                }
            },
            getFilterValues: function(colId, callback, rowData) {
                fetchOeDetailColumnValues(colId, callback, rowData);
            }
        });
    }

    function updateOeStatsPaginationInfo() {
        if (oeStatsCustomPagination) {
            oeStatsCustomPagination.update(oeStatsTotalRecords, oeStatsCurrentPage, oeStatsCurrentPageSize);
        }
    }

    function refreshOeStats(page, pageSize) {
        page = page || oeStatsCurrentPage || 1;
        pageSize = pageSize || oeStatsCurrentPageSize || 200;
        oeStatsCurrentPage = page;
        oeStatsCurrentPageSize = pageSize;

        const params = getSearchParams(currentTab);
        params.page = page;
        params.page_size = pageSize;

        // 添加排序参数
        if (typeof GridColumnMenu !== 'undefined' && GridColumnMenu.getSortState) {
            const sortState = GridColumnMenu.getSortState('#oeStatsGrid');
            if (sortState.sortColumn) {
                params.sort_column = sortState.sortColumn;
                params.sort_dir = sortState.sortDir;
            }
        }

        // 添加列头下拉筛选条件（后端全量数据筛选）
        if (typeof GridColumnMenu !== 'undefined' && GridColumnMenu.getFilterState) {
            const filterState = GridColumnMenu.getFilterState('#oeStatsGrid');
            if (filterState.active && filterState.filters) {
                params.column_filters = JSON.stringify(filterState.filters);
            }
        }

        oeStatsGridLoader.load('/new/api/ks_inquiry/records/oe_stats', params, (data) => {
            oeStatsTotalRecords = data.total;
            updateOeStatsPaginationInfo();

            // 缓存原始数据到 GridColumnMenu，供列筛选下拉选项使用
            const list = data.list || [];
            if (typeof GridColumnMenu !== 'undefined' && GridColumnMenu.setOriginalRows) {
                GridColumnMenu.setOriginalRows('#oeStatsGrid', list);
            }

            // 列筛选已由后端完成，前端不再二次过滤
            oeStatsGridApi.setRowData(list);
        }, (error) => {
            console.error('OE统计请求失败:', error);
        });
    }

    // 从后端获取 OE 统计指定列的全量不重复值（用于列头下拉筛选）
    function fetchOeStatsColumnValues(colId, callback) {
        const params = getSearchParams(currentTab);
        params.column = colId;
        params.grid_type = 'oe_stats';

        if (typeof GridColumnMenu !== 'undefined' && GridColumnMenu.getFilterState) {
            const filterState = GridColumnMenu.getFilterState('#oeStatsGrid');
            if (filterState.active && filterState.filters) {
                const otherFilters = {};
                Object.keys(filterState.filters).forEach(function(key) {
                    if (key !== colId) {
                        otherFilters[key] = filterState.filters[key];
                    }
                });
                if (Object.keys(otherFilters).length > 0) {
                    params.column_filters = JSON.stringify(otherFilters);
                }
            }
        }

        fetch('/new/api/ks_inquiry/records/column_values?' + new URLSearchParams(params))
            .then(function(response) { return response.json(); })
            .then(function(result) {
                if (result.code === 0 || result.code === '0') {
                    callback(result.data?.values || []);
                } else {
                    console.error('[oe_stats_tab] 获取列值失败:', result.message);
                    callback([]);
                }
            })
            .catch(function(error) {
                console.error('[oe_stats_tab] 获取列值请求失败:', error);
                callback([]);
            });
    }

    // 从后端获取 OE 客户统计副表指定列的全量不重复值（限定当前 OE 号）
    function fetchOeDetailColumnValues(colId, callback, rowData) {
        const params = getSearchParams(currentTab);
        params.resolve_parts_num = rowData && rowData.resolve_parts_num ? rowData.resolve_parts_num : '';
        params.column = colId;
        params.grid_type = 'customer_stats_by_oe';

        if (window.oeDetailPanel && typeof GridColumnMenu !== 'undefined' && GridColumnMenu.getFilterState) {
            const filterState = GridColumnMenu.getFilterState('#' + window.oeDetailPanel.gridId);
            if (filterState.active && filterState.filters) {
                const otherFilters = {};
                Object.keys(filterState.filters).forEach(function(key) {
                    if (key !== colId) {
                        otherFilters[key] = filterState.filters[key];
                    }
                });
                if (Object.keys(otherFilters).length > 0) {
                    params.column_filters = JSON.stringify(otherFilters);
                }
            }
        }

        fetch('/new/api/ks_inquiry/records/column_values?' + new URLSearchParams(params))
            .then(function(response) { return response.json(); })
            .then(function(result) {
                if (result.code === 0 || result.code === '0') {
                    callback(result.data?.values || []);
                } else {
                    console.error('[oe_stats_tab] 获取副表列值失败:', result.message);
                    callback([]);
                }
            })
            .catch(function(error) {
                console.error('[oe_stats_tab] 获取副表列值请求失败:', error);
                callback([]);
            });
    }
</script>
