<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>替换号编辑</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='layui/css/layui.css') }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f2f5;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1600px; margin: 0 auto; }
        .header {
            background: #fff;
            padding: 20px 24px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .header-title { font-size: 20px; font-weight: 600; color: #262626; }
        .search-form {
            background: #fff;
            padding: 16px 24px;
            border-radius: 8px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .search-form label { font-size: 14px; color: #262626; white-space: nowrap; }
        .search-form input {
            padding: 7px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
            width: 200px;
            line-height: 1.4;
        }
        .search-form input:focus {
            outline: none;
            border-color: #40a9ff;
        }
        .btn {
            padding: 7px 18px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            line-height: 1.4;
            transition: all 0.2s;
        }
        .btn-primary { background: #1890ff; color: #fff; }
        .btn-primary:hover { background: #40a9ff; }
        .btn-default {
            background: #fff;
            color: #595959;
            border: 1px solid #d9d9d9;
        }
        .btn-default:hover { border-color: #40a9ff; color: #40a9ff; }
        .toolbar {
            background: #fff;
            padding: 12px 24px;
            border-radius: 8px 8px 0 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .toolbar-info { font-size: 14px; color: #595959; }
        .data-container {
            background: #fff;
            padding: 0 24px 24px;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .data-table th {
            background: #fafafa;
            padding: 12px 10px;
            text-align: left;
            font-weight: 600;
            color: #262626;
            border-bottom: 1px solid #f0f0f0;
        }
        .data-table td {
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
            color: #595959;
            vertical-align: middle;
        }
        .data-table tr:hover { background: #f6ffed; }
        .data-table tr.row-success { background: #f6ffed; }
        .data-table tr.row-fail { background: #fff1f0; }
        .data-table textarea {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 13px;
            color: #262626;
            resize: vertical;
            font-family: inherit;
            line-height: 1.4;
            min-height: 76px;
        }
        .data-table textarea:focus {
            outline: none;
            border-color: #40a9ff;
        }
        .data-table textarea:read-only {
            background: #f5f5f5;
            border-color: #d9d9d9;
        }
        .data-table select {
            padding: 6px 10px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
            color: #262626;
            background: #fff;
        }
        .data-table select:disabled {
            background: #f5f5f5;
            color: #999;
        }
        .col-seq { width: 5%; }
        .col-oe { width: 12%; }
        .col-brand { width: 8%; }
        .col-brand-number { width: 10%; }
        .col-original { width: 20%; }
        .col-other { width: 20%; }
        .col-upload { width: 8%; }
        .col-products { width: 14%; }
        .col-status { width: 8%; }
        .status-success { color: #52c41a; font-weight: 500; }
        .status-fail { color: #ff4d4f; font-weight: 500; }
        .status-wait { color: #1890ff; }
        .status-missing { color: #faad14; }
        .pagination-container {
            display: flex;
            justify-content: center;
            padding-top: 20px;
        }
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #8c8c8c;
            background: #fff;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #1890ff;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }
        .product-line {
            display: block;
            line-height: 1.5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-title">替换号编辑</div>
        </div>

        <div class="search-form">
            <label>OE号：</label>
            <input type="text" id="searchOe" placeholder="支持空格分隔多值">
            <label>品牌：</label>
            <input type="text" id="searchBrand" placeholder="输入一个品牌">
            <label>品牌号：</label>
            <input type="text" id="searchBrandNumber" placeholder="输入一个品牌号">
            <button class="btn btn-primary" onclick="searchByInput()">查询</button>
            <button class="btn btn-default" onclick="resetForm()">重置</button>
        </div>

        <div class="loading" id="loading" style="display: none;">加载中...</div>

        <div id="dataArea" style="display: none;">
            <div class="toolbar">
                <div class="toolbar-info">
                    共 <span id="totalCount">0</span> 条，当前第 <span id="currentPage">1</span> 页
                </div>
                <button class="btn btn-primary" onclick="bulkUpdate()">批量更新</button>
            </div>
            <div class="data-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th class="col-seq">序号</th>
                            <th class="col-oe">OE</th>
                            <th class="col-brand">品牌</th>
                            <th class="col-brand-number">品牌号</th>
                            <th class="col-original">原厂/4S 替换号</th>
                            <th class="col-other">其他品牌替换号</th>
                            <th class="col-upload">是否上传</th>
                            <th class="col-products">将会更新的产品</th>
                            <th class="col-status">状态</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody"></tbody>
                </table>
                <div class="pagination-container" id="pagination"></div>
            </div>
        </div>

        <div class="empty-state" id="emptyState">暂无数据</div>
    </div>

    <script src="{{ url_for('static', filename='layui/layui.js') }}"></script>
    <script>
        layui.use(['laypage', 'layer'], function(){
            var laypage = layui.laypage;
            var layer = layui.layer;

            var currentPage = 1;
            var currentLimit = 10;
            var currentTotal = 0;
            var allData = [];
            var pageData = [];

            function loadFromSession() {
                var stored = sessionStorage.getItem('replace_number_oe_brand_list');
                if (stored) {
                    try {
                        var list = JSON.parse(stored);
                        sessionStorage.removeItem('replace_number_oe_brand_list');
                        if (Array.isArray(list) && list.length > 0) {
                            searchFromList(list);
                            return true;
                        }
                    } catch (e) {}
                }
                return false;
            }

            function parseOes(input) {
                if (!input) return [];
                return input.split(/[\s,，]+/).filter(function(s) { return s.trim(); });
            }

            function searchByInput() {
                var oeInput = document.getElementById('searchOe').value.trim();
                var brandInput = document.getElementById('searchBrand').value.trim();
                var brandNumberInput = document.getElementById('searchBrandNumber').value.trim();
                var oeList = parseOes(oeInput);

                if (brandNumberInput) {
                    searchFromList([{oe: '', brand: '', brand_number: brandNumberInput}]);
                    return;
                }

                if (oeList.length === 0 || !brandInput) {
                    layer.msg('请输入 OE 号和品牌，或输入品牌号', {icon: 2});
                    return;
                }

                var list = oeList.map(function(oe) {
                    return {oe: oe, brand: brandInput};
                });
                searchFromList(list);
            }

            window.searchByInput = searchByInput;

            function searchFromList(list) {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('dataArea').style.display = 'none';
                document.getElementById('emptyState').style.display = 'none';

                fetch('/new/api/replace-number/edit-list', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({oe_brand_list: list, page: 1, limit: 100000})
                })
                .then(function(res) { return res.json(); })
                .then(function(result) {
                    document.getElementById('loading').style.display = 'none';

                    if (result.code !== 0) {
                        document.getElementById('emptyState').style.display = 'block';
                        document.getElementById('emptyState').textContent = '查询失败：' + result.msg;
                        return;
                    }

                    allData = result.data.list || [];
                    allData.forEach(function(item, index) {
                        item._index = index;
                        item._rowStatus = item.status || '待更新';
                    });

                    if (allData.length === 0) {
                        document.getElementById('emptyState').style.display = 'block';
                        document.getElementById('emptyState').textContent = '没有找到数据';
                        return;
                    }

                    currentPage = 1;
                    renderPage();
                })
                .catch(function(error) {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('emptyState').style.display = 'block';
                    document.getElementById('emptyState').textContent = '请求失败：' + error.message;
                });
            }

            window.searchFromList = searchFromList;

            function renderPage() {
                var start = (currentPage - 1) * currentLimit;
                var end = start + currentLimit;
                pageData = allData.slice(start, end);

                renderTable(pageData, start);
                renderPagination(allData.length, currentPage);

                document.getElementById('totalCount').textContent = allData.length;
                document.getElementById('currentPage').textContent = currentPage;
                document.getElementById('dataArea').style.display = 'block';
                document.getElementById('emptyState').style.display = 'none';
            }

            function renderTable(list, startIndex) {
                var tbody = document.getElementById('dataTableBody');
                tbody.innerHTML = '';

                list.forEach(function(item, idx) {
                    var globalIndex = startIndex + idx + 1;
                    var isSuccess = item._rowStatus.indexOf('更新成功') === 0;
                    var isFail = item._rowStatus.indexOf('更新失败') === 0;
                    var isMissing = item._rowStatus.indexOf('缺少字段') === 0 || item._rowStatus.indexOf('搜索失败') === 0;
                    var rowClass = isSuccess ? 'row-success' : (isFail ? 'row-fail' : '');
                    var readOnly = isSuccess || isMissing ? 'readonly' : '';
                    var selectDisabled = isSuccess || isMissing ? 'disabled' : '';

                    var statusClass = isSuccess ? 'status-success' : (isFail ? 'status-fail' : (isMissing ? 'status-missing' : 'status-wait'));

                    var tr = document.createElement('tr');
                    tr.className = rowClass;
                    tr.dataset.index = item._index;

                    var productsHtml = (item.will_update_products || []).map(function(p) {
                        return '<span class="product-line" title="' + p + '">' + p + '</span>';
                    }).join('');

                    tr.innerHTML =
                        '<td class="col-seq">' + globalIndex + '</td>' +
                        '<td class="col-oe">' + (item.oe || '-') + '</td>' +
                        '<td class="col-brand">' + (item.brand || '-') + '</td>' +
                        '<td class="col-brand-number">' + (item.brand_number || '') + '</td>' +
                        '<td class="col-original"><textarea class="original-input" data-field="original_numbers" ' + readOnly + '>' + (item.original_numbers || '') + '</textarea></td>' +
                        '<td class="col-other"><textarea class="other-input" data-field="other_numbers" ' + readOnly + '>' + (item.other_numbers || '') + '</textarea></td>' +
                        '<td class="col-upload">' +
                            '<select class="upload-select" data-field="is_upload" ' + selectDisabled + '>' +
                                '<option value="1" ' + (item.is_upload == 1 ? 'selected' : '') + '>1</option>' +
                                '<option value="0" ' + (item.is_upload == 0 ? 'selected' : '') + '>0</option>' +
                            '</select>' +
                        '</td>' +
                        '<td class="col-products">' + productsHtml + '</td>' +
                        '<td class="col-status"><span class="' + statusClass + '">' + item._rowStatus + '</span></td>';

                    tbody.appendChild(tr);
                });
            }

            function renderPagination(total, page) {
                laypage.render({
                    elem: 'pagination',
                    count: total,
                    limit: currentLimit,
                    curr: page,
                    layout: ['count', 'prev', 'page', 'next', 'limit', 'skip'],
                    jump: function(obj, first) {
                        if (!first) {
                            currentLimit = obj.limit;
                            currentPage = obj.curr;
                            renderPage();
                        }
                    }
                });
            }

            function resetForm() {
                document.getElementById('searchOe').value = '';
                document.getElementById('searchBrand').value = '';
                document.getElementById('searchBrandNumber').value = '';
                document.getElementById('dataArea').style.display = 'none';
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('emptyState').textContent = '请输入 OE 和品牌后点击查询';
                currentPage = 1;
                currentTotal = 0;
                allData = [];
                pageData = [];
            }

            window.resetForm = resetForm;

            function collectUpdates() {
                var updates = [];
                var rows = document.querySelectorAll('#dataTableBody tr');

                rows.forEach(function(tr) {
                    var index = parseInt(tr.dataset.index, 10);
                    var item = allData[index];
                    if (!item) return;

                    var isSuccess = item._rowStatus.indexOf('更新成功') === 0;
                    var isMissing = item._rowStatus.indexOf('缺少字段') === 0 || item._rowStatus.indexOf('搜索失败') === 0;
                    if (isSuccess || isMissing) return;

                    var isUpload = parseInt(tr.querySelector('.upload-select').value, 10);
                    if (isUpload !== 1) return;

                    var originalNumbers = tr.querySelector('.original-input').value.trim();
                    var otherNumbers = tr.querySelector('.other-input').value.trim();

                    var newOriginal = originalNumbers ? originalNumbers.split(',').map(function(s) { return s.trim(); }).filter(Boolean) : [];
                    var newOther = otherNumbers ? otherNumbers.split(',').map(function(s) { return s.trim(); }).filter(Boolean) : [];

                    var products = item.products || [];
                    products.forEach(function(p) {
                        var merged = [];
                        if (item.original_brands && item.original_brands.indexOf(p.brand_name) >= 0) {
                            merged = newOriginal;
                        } else {
                            merged = newOther;
                        }

                        var displayNumbers = p.display_numbers || [];
                        var finalNumbers = displayNumbers.slice();
                        merged.forEach(function(n) {
                            if (finalNumbers.indexOf(n) < 0) {
                                finalNumbers.push(n);
                            }
                        });

                        if (finalNumbers.length > 0) {
                            updates.push({
                                product_id: p.product_id,
                                numbers: finalNumbers,
                                _index: index
                            });
                        }
                    });
                });

                return updates;
            }

            function bulkUpdate() {
                var updates = collectUpdates();
                if (updates.length === 0) {
                    layer.msg('没有可更新的数据', {icon: 2});
                    return;
                }

                layer.confirm('确定要更新 ' + updates.length + ' 个产品吗？', {
                    icon: 3,
                    title: '确认更新'
                }, function(index) {
                    layer.close(index);
                    doBulkUpdate(updates);
                });
            }

            window.bulkUpdate = bulkUpdate;

            function doBulkUpdate(updates) {
                layer.msg('更新中，请稍候...', {icon: 16, time: 0, shade: 0.3});

                fetch('/new/api/replace-number/bulk-update', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({updates: updates})
                })
                .then(function(res) { return res.json(); })
                .then(function(result) {
                    layer.closeAll('msg');

                    if (result.code !== 0) {
                        layer.msg('更新失败：' + result.msg, {icon: 2});
                        return;
                    }

                    var details = result.data.details || [];
                    var indexMap = {};
                    details.forEach(function(d) {
                        if (d._index !== undefined) {
                            if (!indexMap[d._index]) indexMap[d._index] = [];
                            indexMap[d._index].push(d.status);
                        }
                    });

                    updates.forEach(function(u) {
                        var idx = u._index;
                        var statuses = indexMap[idx] || [];
                        var hasFail = statuses.some(function(s) { return s.indexOf('失败') >= 0; });
                        if (hasFail) {
                            var failMsg = statuses.find(function(s) { return s.indexOf('失败') >= 0; });
                            allData[idx]._rowStatus = failMsg;
                        } else {
                            allData[idx]._rowStatus = '更新成功';
                        }
                    });

                    renderPage();
                    layer.msg('更新完成：成功 ' + result.data.updated + ' 个，失败 ' + result.data.failed + ' 个', {
                        icon: result.data.failed > 0 ? 7 : 1,
                        time: 2500
                    });
                })
                .catch(function(error) {
                    layer.closeAll('msg');
                    layer.msg('请求失败：' + error.message, {icon: 2});
                });
            }

            loadFromSession();
        });
    </script>
</body>
</html>
