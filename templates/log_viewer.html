<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志查看器 - 巴博瑞科技</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='layui/css/layui.css') }}">
    <style>
        /* 页面整体样式 */
        body {
            background-color: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .log-container {
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* 统计卡片样式 */
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        }

        .stat-card .stat-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .stat-card .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: #333;
        }

        .stat-card.error .stat-value { color: #ff4d4f; }
        .stat-card.warning .stat-value { color: #faad14; }
        .stat-card.info .stat-value { color: #1890ff; }
        .stat-card.success .stat-value { color: #52c41a; }

        /* 搜索栏样式 */
        .search-bar {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .search-form {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }

        .search-form .layui-form-item {
            margin-bottom: 0;
        }

        .search-form .layui-input,
        .search-form .layui-select {
            width: 180px;
        }

        /* 日志内容区域样式 */
        .log-content-container {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .log-content-header {
            padding: 15px 20px;
            border-bottom: 1px solid #e8e8e8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .log-content-header h3 {
            margin: 0;
            font-size: 16px;
            color: #333;
        }

        .log-content-header .file-info {
            font-size: 13px;
            color: #666;
        }

        /* 日志文本框样式 */
        .log-text-box {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            min-height: 500px;
            max-height: 600px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .log-text-box .log-line {
            padding: 2px 0;
            border-bottom: 1px solid #2d2d2d;
        }

        .log-text-box .log-line:hover {
            background: #2d2d2d;
        }

        .log-text-box .log-line.error {
            color: #f48771;
            background: rgba(244, 135, 113, 0.1);
        }

        .log-text-box .log-line.warning {
            color: #dcdcaa;
            background: rgba(220, 220, 170, 0.1);
        }

        .log-text-box .log-line.info {
            color: #4ec9b0;
        }

        .log-text-box .log-line.debug {
            color: #808080;
        }

        /* 高亮搜索词 */
        .highlight {
            background: #ffeb3b;
            color: #333;
            padding: 0 2px;
            border-radius: 2px;
        }

        /* 行号样式 */
        .log-text-box .log-line {
            padding: 2px 0;
            border-bottom: 1px solid #2d2d2d;
            display: flex;
            align-items: flex-start;
        }

        .log-text-box .log-line:hover {
            background: #2d2d2d;
        }

        .log-text-box .log-line .line-num {
            display: inline-block;
            width: 60px;
            color: #666;
            text-align: right;
            margin-right: 10px;
            font-size: 12px;
            user-select: none;
            flex-shrink: 0;
            cursor: pointer;
            transition: color 0.2s;
        }

        .log-text-box .log-line .line-num:hover {
            color: #1890ff;
            text-decoration: underline;
        }

        .log-text-box .log-line .line-content {
            flex: 1;
            word-break: break-all;
        }

        /* 目标行高亮（跳转后） */
        .log-text-box .log-line.target-line {
            background: rgba(255, 235, 59, 0.15);
            border-left: 3px solid #ffeb3b;
            padding-left: 17px; /* 补偿边框宽度 */
        }

        .log-text-box .log-line.target-line .line-num {
            color: #ffeb3b;
            font-weight: bold;
        }

        /* 分页样式 */
        .pagination-container {
            padding: 15px 20px;
            border-top: 1px solid #e8e8e8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pagination-info {
            font-size: 13px;
            color: #666;
        }

        /* 自动刷新开关 */
        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .search-form {
                flex-direction: column;
            }
            
            .search-form .layui-input,
            .search-form .layui-select {
                width: 100%;
            }
        }
        
        /* 标签页样式 */
        .tab-nav {
            display: flex;
            background: #fff;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        
        .tab-item {
            flex: 1;
            padding: 15px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
            font-size: 15px;
            color: #666;
        }
        
        .tab-item:hover {
            background: #f5f5f5;
            color: #333;
        }
        
        .tab-item.active {
            color: #1890ff;
            border-bottom-color: #1890ff;
            background: #e6f7ff;
            font-weight: 500;
        }
        
        .tab-item i {
            margin-right: 8px;
            font-size: 16px;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* 服务器配置页面样式 */
        .config-container {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        
        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .config-card {
            background: #fafafa;
            border-radius: 8px;
            border: 1px solid #e8e8e8;
            overflow: hidden;
        }
        
        .config-card.full-width {
            grid-column: 1 / -1;
        }
        
        .config-header {
            background: #f0f0f0;
            padding: 12px 16px;
            font-weight: 500;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .config-header i {
            color: #1890ff;
            font-size: 18px;
        }
        
        .config-body {
            padding: 16px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.8;
        }
        
        .config-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed #e0e0e0;
        }
        
        .config-item:last-child {
            border-bottom: none;
        }
        
        .config-label {
            color: #666;
            font-weight: 500;
        }
        
        .config-value {
            color: #333;
            text-align: right;
            max-width: 60%;
            word-break: break-all;
        }
        
        .config-value.success {
            color: #52c41a;
        }
        
        .config-value.warning {
            color: #faad14;
        }
        
        .config-value.error {
            color: #ff4d4f;
        }
        
        .status-badge {
            margin-left: auto;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: normal;
        }
        
        .status-badge.success {
            background: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
        }
        
        .status-badge.warning {
            background: #fffbe6;
            color: #faad14;
            border: 1px solid #ffe58f;
        }
        
        .status-badge.error {
            background: #fff2f0;
            color: #ff4d4f;
            border: 1px solid #ffccc7;
        }
        
        .loading-text {
            color: #999;
            text-align: center;
            padding: 20px;
        }
        
        .config-actions {
            text-align: center;
            padding-top: 10px;
            border-top: 1px solid #e8e8e8;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }
        
        .progress-fill {
            height: 100%;
            background: #1890ff;
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        
        .progress-fill.warning {
            background: #faad14;
        }
        
        .progress-fill.error {
            background: #ff4d4f;
        }
    </style>
</head>
<body>
    <div class="log-container">
        <!-- 标签页导航 -->
        <div class="tab-nav">
            <div class="tab-item active" data-tab="logs">
                <i class="layui-icon layui-icon-log"></i> 日志查看
            </div>
            <div class="tab-item" data-tab="config">
                <i class="layui-icon layui-icon-set"></i> 服务器配置
            </div>
        </div>
        
        <!-- 日志查看标签页 -->
        <div id="logsTab" class="tab-content active">
        <!-- 统计卡片 -->
        <div class="stats-cards">
            <div class="stat-card">
                <div class="stat-title">总行数</div>
                <div class="stat-value" id="totalLines">-</div>
            </div>
            <div class="stat-card error">
                <div class="stat-title">错误数</div>
                <div class="stat-value" id="errorCount">-</div>
            </div>
            <div class="stat-card warning">
                <div class="stat-title">警告数</div>
                <div class="stat-value" id="warningCount">-</div>
            </div>
            <div class="stat-card info">
                <div class="stat-title">信息数</div>
                <div class="stat-value" id="infoCount">-</div>
            </div>
            <div class="stat-card success">
                <div class="stat-title">文件大小</div>
                <div class="stat-value" id="fileSize">-</div>
            </div>
        </div>

        <!-- 搜索栏 -->
        <div class="search-bar">
            <form class="layui-form search-form" id="searchForm" lay-filter="searchForm">
                <div class="layui-form-item">
                    <label class="layui-form-label">关键词</label>
                    <div class="layui-input-block">
                        <input type="text" name="keyword" placeholder="搜索日志内容..." autocomplete="off" class="layui-input">
                    </div>
                </div>
                
                <div class="layui-form-item">
                    <label class="layui-form-label">日志级别</label>
                    <div class="layui-input-block">
                        <select name="level">
                            <option value="">全部级别</option>
                            <option value="ERROR">错误</option>
                            <option value="WARNING">警告</option>
                            <option value="INFO">信息</option>
                            <option value="DEBUG">调试</option>
                        </select>
                    </div>
                </div>
                
                <div class="layui-form-item">
                    <label class="layui-form-label">开始日期</label>
                    <div class="layui-input-block">
                        <input type="text" name="start_date" id="startDate" placeholder="选择日期" autocomplete="off" class="layui-input">
                    </div>
                </div>
                
                <div class="layui-form-item">
                    <label class="layui-form-label">结束日期</label>
                    <div class="layui-input-block">
                        <input type="text" name="end_date" id="endDate" placeholder="选择日期" autocomplete="off" class="layui-input">
                    </div>
                </div>
                
                <div class="layui-form-item">
                    <button type="button" class="layui-btn layui-btn-normal" id="searchBtn">
                        <i class="layui-icon layui-icon-search"></i> 搜索
                    </button>
                    <button type="button" class="layui-btn layui-btn-primary" id="resetBtn">
                        <i class="layui-icon layui-icon-refresh"></i> 重置
                    </button>
                </div>
            </form>
        </div>

        <!-- 日志内容区域 -->
        <div class="log-content-container">
            <div class="log-content-header">
                <h3><i class="layui-icon layui-icon-log"></i> 日志内容</h3>
                <div class="file-info">
                    <span id="fileInfo">加载中...</span>
                    <span style="color: #1890ff; margin-left: 15px; font-size: 12px;">
                        <i class="layui-icon layui-icon-tips"></i> 点击行号跳转到该行在完整日志中的位置
                    </span>
                    <div class="auto-refresh" style="margin-left: 20px; display: inline-flex;">
                        <input type="checkbox" lay-skin="switch" lay-text="自动刷新|关闭" id="autoRefresh" lay-filter="autoRefresh">
                        <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" id="copyPageBtn">
                            <i class="layui-icon layui-icon-file-b"></i> 复制本页日志
                        </button>
                        <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="downloadBtn">
                            <i class="layui-icon layui-icon-download-circle"></i> 下载日志
                        </button>
                        <button type="button" class="layui-btn layui-btn-sm" id="refreshBtn">
                            <i class="layui-icon layui-icon-refresh"></i> 刷新
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- 日志文本框 -->
            <div class="log-text-box" id="logTextBox">
                <div class="empty-state">
                    <i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop"></i>
                    <p>正在加载日志...</p>
                </div>
            </div>
            
            <div class="pagination-container">
                <div class="pagination-info">
                    共 <span id="totalCount">0</span> 条记录，
                    第 <span id="currentPage">1</span> / <span id="totalPages">1</span> 页
                </div>
                <div id="pagination"></div>
            </div>
        </div>
        </div><!-- /#logsTab -->
        
        <!-- 服务器配置标签页 -->
        <div id="configTab" class="tab-content">
            <div class="config-container">
                <!-- 配置卡片网格 -->
                <div class="config-grid">
                    <!-- uWSGI配置 -->
                    <div class="config-card">
                        <div class="config-header">
                            <i class="layui-icon layui-icon-engine"></i>
                            <span>uWSGI 配置</span>
                            <span class="status-badge" id="uwsgiStatus">加载中...</span>
                        </div>
                        <div class="config-body" id="uwsgiConfig">
                            <div class="loading-text">加载中...</div>
                        </div>
                    </div>
                    
                    <!-- Python环境 -->
                    <div class="config-card">
                        <div class="config-header">
                            <i class="layui-icon layui-icon-code"></i>
                            <span>Python 环境</span>
                        </div>
                        <div class="config-body" id="pythonConfig">
                            <div class="loading-text">加载中...</div>
                        </div>
                    </div>
                    
                    <!-- 系统资源 -->
                    <div class="config-card">
                        <div class="config-header">
                            <i class="layui-icon layui-icon-chart"></i>
                            <span>系统资源</span>
                        </div>
                        <div class="config-body" id="systemConfig">
                            <div class="loading-text">加载中...</div>
                        </div>
                    </div>
                    
                    <!-- 数据库状态 -->
                    <div class="config-card">
                        <div class="config-header">
                            <i class="layui-icon layui-icon-senior"></i>
                            <span>数据库状态</span>
                            <span class="status-badge" id="dbStatus">加载中...</span>
                        </div>
                        <div class="config-body" id="databaseConfig">
                            <div class="loading-text">加载中...</div>
                        </div>
                    </div>
                    
                    <!-- 应用信息 -->
                    <div class="config-card full-width">
                        <div class="config-header">
                            <i class="layui-icon layui-icon-app"></i>
                            <span>应用运行信息</span>
                        </div>
                        <div class="config-body" id="appConfig">
                            <div class="loading-text">加载中...</div>
                        </div>
                    </div>
                </div>
                
                <!-- 刷新按钮 -->
                <div class="config-actions">
                    <button type="button" class="layui-btn layui-btn-normal" id="refreshConfigBtn">
                        <i class="layui-icon layui-icon-refresh"></i> 刷新配置
                    </button>
                </div>
            </div>
        </div><!-- /#configTab -->
    </div>

    <script src="{{ url_for('static', filename='layui/layui.js') }}"></script>
    <script>
        layui.use(['laypage', 'laydate', 'form', 'layer'], function(){
            var laypage = layui.laypage;
            var laydate = layui.laydate;
            var form = layui.form;
            var layer = layui.layer;
            
            // 当前页码和每页数量
            var currentPage = 1;
            var pageSize = 50;
            var currentKeyword = '';
            var currentLevel = '';
            var currentStartDate = '';
            var currentEndDate = '';
            var autoRefreshTimer = null;
            var currentLogs = []; // 保存当前日志数据用于复制
            var highlightLineNum = null; // 需要高亮显示的行号
            
            // 初始化日期选择器
            laydate.render({
                elem: '#startDate',
                format: 'yyyy-MM-dd'
            });
            
            laydate.render({
                elem: '#endDate',
                format: 'yyyy-MM-dd'
            });
            
            // 加载统计数据
            function loadStats() {
                fetch('/api/logs/stats')
                    .then(res => res.json())
                    .then(data => {
                        if (data.code === 0) {
                            var stats = data.data;
                            document.getElementById('totalLines').textContent = stats.total_lines.toLocaleString();
                            document.getElementById('errorCount').textContent = stats.error_count.toLocaleString();
                            document.getElementById('warningCount').textContent = stats.warning_count.toLocaleString();
                            document.getElementById('infoCount').textContent = stats.info_count.toLocaleString();
                            document.getElementById('fileSize').textContent = stats.file_size_readable;
                            document.getElementById('fileInfo').innerHTML = 
                                '文件大小: ' + stats.file_size_readable + 
                                ' | 最后修改: ' + stats.last_modified;
                        }
                    })
                    .catch(err => console.error('加载统计失败:', err));
            }
            
            // 加载日志数据
            function loadLogs(page, limit) {
                currentPage = page;
                pageSize = limit;
                
                var params = new URLSearchParams({
                    page: page,
                    limit: limit,
                    keyword: currentKeyword,
                    level: currentLevel,
                    start_date: currentStartDate,
                    end_date: currentEndDate
                });
                
                fetch('/api/logs?' + params.toString())
                    .then(res => res.json())
                    .then(data => {
                        if (data.code === 0) {
                            currentLogs = data.data; // 保存日志数据
                            renderLogs(data.data);
                            renderPagination(data.count, page, limit);
                            document.getElementById('totalCount').textContent = data.count.toLocaleString();
                            document.getElementById('currentPage').textContent = page;
                            document.getElementById('totalPages').textContent = data.total_pages;
                        } else {
                            layer.msg(data.msg, {icon: 2});
                            renderEmpty(data.msg);
                        }
                    })
                    .catch(err => {
                        console.error('加载日志失败:', err);
                        layer.msg('加载日志失败', {icon: 2});
                        renderEmpty('加载失败，请稍后重试');
                    });
            }
            
            // 渲染日志内容到文本框
            function renderLogs(logs) {
                var logBox = document.getElementById('logTextBox');

                if (!logs || logs.length === 0) {
                    renderEmpty('暂无匹配的日志记录');
                    return;
                }

                var html = '';
                logs.forEach(function(log) {
                    var content = escapeHtml(log.content);
                    // 高亮搜索词
                    if (currentKeyword) {
                        var regex = new RegExp('(' + escapeRegex(currentKeyword) + ')', 'gi');
                        content = content.replace(regex, '<span class="highlight">$1</span>');
                    }

                    // 根据级别添加样式类，并添加行号
                    var levelClass = log.level.toLowerCase();
                    // 如果是跳转后的目标行，添加高亮样式
                    var targetClass = (highlightLineNum && log.line_num === highlightLineNum) ? 'target-line' : '';

                    html += '<div class="log-line ' + levelClass + ' ' + targetClass + '">' +
                        '<span class="line-num" onclick="jumpToLine(' + log.line_num + ', event)">' + log.line_num + '</span>' +
                        '<span class="line-content">' + content + '</span>' +
                        '</div>';
                });

                logBox.innerHTML = html;

                // 如果有高亮行，滚动到该行
                if (highlightLineNum) {
                    setTimeout(function() {
                        var targetElement = logBox.querySelector('.log-line.target-line');
                        if (targetElement) {
                            targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }, 100);
                }
            }

            // 点击行号跳转到该行在完整日志中的位置
            window.jumpToLine = function(lineNum, event) {
                // 阻止事件冒泡
                if (event) {
                    event.stopPropagation();
                }

                // 显示加载中
                var loadingIndex = layer.load(2);

                // 调用API获取行号所在位置
                fetch('/api/logs/line-position?line_num=' + lineNum + '&limit=' + pageSize)
                    .then(res => res.json())
                    .then(data => {
                        layer.close(loadingIndex);

                        if (data.code === 0) {
                            var position = data.data;

                            // 清除搜索条件
                            clearSearchConditions();

                            // 设置高亮行号
                            highlightLineNum = lineNum;

                            // 跳转到对应页面
                            loadLogs(position.target_page, pageSize);

                            layer.msg('已跳转到第 ' + position.target_page + ' 页，第 ' + lineNum + ' 行', {icon: 1, time: 2000});
                        } else {
                            layer.msg(data.msg || '跳转失败', {icon: 2});
                        }
                    })
                    .catch(err => {
                        layer.close(loadingIndex);
                        console.error('跳转失败:', err);
                        layer.msg('跳转失败', {icon: 2});
                    });
            };

            // 清除搜索条件
            function clearSearchConditions() {
                document.getElementById('searchForm').reset();
                form.render();
                currentKeyword = '';
                currentLevel = '';
                currentStartDate = '';
                currentEndDate = '';
            }
            
            // 渲染空状态
            function renderEmpty(msg) {
                document.getElementById('logTextBox').innerHTML = 
                    '<div class="empty-state">' +
                    '<i class="layui-icon layui-icon-face-surprised"></i>' +
                    '<p>' + (msg || '暂无数据') + '</p>' +
                    '</div>';
            }
            
            // 渲染分页
            function renderPagination(total, current, limit) {
                laypage.render({
                    elem: 'pagination',
                    count: total,
                    limit: limit,
                    curr: current,
                    limits: [20, 50, 100, 200, 500],
                    layout: ['count', 'prev', 'page', 'next', 'limit', 'skip'],
                    jump: function(obj, first) {
                        if (!first) {
                            loadLogs(obj.curr, obj.limit);
                        }
                    }
                });
            }
            
            // HTML转义
            function escapeHtml(text) {
                var div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
            
            // 正则转义
            function escapeRegex(string) {
                return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }
            
            // 搜索按钮事件
            document.getElementById('searchBtn').addEventListener('click', function() {
                var formData = form.val('searchForm');
                currentKeyword = formData.keyword || '';
                currentLevel = formData.level || '';
                currentStartDate = formData.start_date || '';
                currentEndDate = formData.end_date || '';
                loadLogs(1, pageSize);
            });
            
            // 重置按钮事件
            document.getElementById('resetBtn').addEventListener('click', function() {
                document.getElementById('searchForm').reset();
                form.render(); // 重新渲染表单，确保select等组件重置
                currentKeyword = '';
                currentLevel = '';
                currentStartDate = '';
                currentEndDate = '';
                loadLogs(1, pageSize);
            });
            
            // 刷新按钮事件
            document.getElementById('refreshBtn').addEventListener('click', function() {
                loadLogs(currentPage, pageSize);
                loadStats();
                layer.msg('已刷新', {icon: 1, time: 1000});
            });
            
            // 下载按钮事件
            document.getElementById('downloadBtn').addEventListener('click', function() {
                layer.confirm('确定要下载完整日志文件吗？', function(index) {
                    window.location.href = '/api/logs/download';
                    layer.close(index);
                });
            });

            // 复制本页日志按钮事件
            document.getElementById('copyPageBtn').addEventListener('click', function() {
                copyCurrentPageLogs();
            });

            // 复制当前页日志到剪贴板
            function copyCurrentPageLogs() {
                if (!currentLogs || currentLogs.length === 0) {
                    layer.msg('当前没有可复制的日志', {icon: 0});
                    return;
                }

                var logText = '';
                currentLogs.forEach(function(log) {
                    logText += log.content + '\n';
                });

                if (logText) {
                    copyToClipboard(logText);
                }
            }

            // 复制文本到剪贴板
            function copyToClipboard(text) {
                if (navigator.clipboard && window.isSecureContext) {
                    // 使用现代 Clipboard API
                    navigator.clipboard.writeText(text).then(function() {
                        layer.msg('已复制本页日志到剪贴板！', {icon: 1, time: 2000});
                    }).catch(function(err) {
                        console.error('复制失败:', err);
                        fallbackCopyToClipboard(text);
                    });
                } else {
                    // 降级方案
                    fallbackCopyToClipboard(text);
                }
            }

            // 降级复制方案（兼容旧浏览器）
            function fallbackCopyToClipboard(text) {
                var textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.left = '-9999px';
                textarea.style.top = '0';
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();

                try {
                    var successful = document.execCommand('copy');
                    if (successful) {
                        layer.msg('已复制本页日志到剪贴板！', {icon: 1, time: 2000});
                    } else {
                        layer.msg('复制失败，请手动复制', {icon: 2});
                    }
                } catch (err) {
                    console.error('复制失败:', err);
                    layer.msg('复制失败，请手动复制', {icon: 2});
                }

                document.body.removeChild(textarea);
            }
            
            // 自动刷新开关
            form.on('switch(autoRefresh)', function(data) {
                if (data.elem.checked) {
                    autoRefreshTimer = setInterval(function() {
                        loadLogs(currentPage, pageSize);
                        loadStats();
                    }, 5000); // 每5秒刷新一次
                    layer.msg('已开启自动刷新 (5秒)', {icon: 1, time: 1500});
                } else {
                    if (autoRefreshTimer) {
                        clearInterval(autoRefreshTimer);
                        autoRefreshTimer = null;
                    }
                    layer.msg('已关闭自动刷新', {icon: 1, time: 1500});
                }
            });
            
            // 初始化加载
            loadStats();
            loadLogs(1, pageSize);
            
            // 标签页切换
            document.querySelectorAll('.tab-item').forEach(function(tab) {
                tab.addEventListener('click', function() {
                    var targetTab = this.getAttribute('data-tab');
                    
                    // 切换标签页样式
                    document.querySelectorAll('.tab-item').forEach(function(t) {
                        t.classList.remove('active');
                    });
                    this.classList.add('active');
                    
                    // 切换内容区域
                    document.querySelectorAll('.tab-content').forEach(function(content) {
                        content.classList.remove('active');
                    });
                    document.getElementById(targetTab + 'Tab').classList.add('active');
                    
                    // 如果是配置页，加载配置数据
                    if (targetTab === 'config') {
                        loadServerConfig();
                    }
                });
            });
            
            // 刷新配置按钮
            document.getElementById('refreshConfigBtn').addEventListener('click', function() {
                loadServerConfig();
                layer.msg('配置已刷新', {icon: 1, time: 1000});
            });
            
            // 加载服务器配置
            function loadServerConfig() {
                fetch('/api/server/config')
                    .then(res => res.json())
                    .then(data => {
                        if (data.code === 0) {
                            renderServerConfig(data.data);
                        } else {
                            layer.msg(data.msg, {icon: 2});
                        }
                    })
                    .catch(err => {
                        console.error('加载配置失败:', err);
                        layer.msg('加载配置失败', {icon: 2});
                    });
            }
            
            // 渲染服务器配置
            function renderServerConfig(config) {
                // 渲染uWSGI配置
                renderUwsgiConfig(config.uwsgi);
                // 渲染Python环境
                renderPythonConfig(config.python);
                // 渲染系统资源
                renderSystemConfig(config.system);
                // 渲染数据库状态
                renderDatabaseConfig(config.database);
                // 渲染应用信息
                renderAppConfig(config.application);
            }
            
            // 渲染uWSGI配置
            function renderUwsgiConfig(uwsgi) {
                var statusBadge = document.getElementById('uwsgiStatus');
                var configBody = document.getElementById('uwsgiConfig');
                
                if (uwsgi.running_in_uwsgi) {
                    statusBadge.textContent = '运行中';
                    statusBadge.className = 'status-badge success';
                } else {
                    statusBadge.textContent = '未运行';
                    statusBadge.className = 'status-badge warning';
                }
                
                var html = '';
                if (uwsgi.config_exists) {
                    var settings = uwsgi.settings;
                    html += createConfigItem('配置文件', 'uwsgi.ini');
                    html += createConfigItem('模块', settings.module || '未设置');
                    html += createConfigItem('进程数', settings.processes || '未设置');
                    html += createConfigItem('线程数', settings.threads || '未设置');
                    html += createConfigItem('单解释器模式', settings.single_interpreter === 'true' ? '✅ 已启用' : '❌ 未启用', 
                        settings.single_interpreter === 'true' ? 'success' : 'warning');
                    html += createConfigItem('延迟加载', settings.lazy_apps === 'true' ? '✅ 已启用' : '❌ 未启用',
                        settings.lazy_apps === 'true' ? 'success' : 'warning');
                    html += createConfigItem('HTTP监听', settings.http || '未设置');
                    html += createConfigItem('Master进程', settings.master === 'true' ? '启用' : '禁用');
                    html += createConfigItem('最大请求数', settings.max_requests || '未限制');
                    html += createConfigItem('超时时间', settings.harakiri + '秒' || '未设置');
                } else {
                    html = '<div class="config-item"><span class="config-value error">配置文件不存在</span></div>';
                }
                
                configBody.innerHTML = html;
            }
            
            // 渲染Python配置
            function renderPythonConfig(python) {
                var configBody = document.getElementById('pythonConfig');
                var html = '';
                
                html += createConfigItem('Python版本', python.version_info.major + '.' + python.version_info.minor + '.' + python.version_info.micro);
                html += createConfigItem('Flask版本', python.flask_version);
                html += createConfigItem('Pandas版本', python.pandas_version);
                html += createConfigItem('Numpy版本', python.numpy_version);
                html += createConfigItem('SQLAlchemy版本', python.sqlalchemy_version);
                html += createConfigItem('操作系统', python.platform);
                html += createConfigItem('机器类型', python.machine);
                html += createConfigItem('可执行文件', python.executable);
                
                configBody.innerHTML = html;
            }
            
            // 渲染系统资源
            function renderSystemConfig(system) {
                var configBody = document.getElementById('systemConfig');
                var html = '';
                
                html += createConfigItem('操作系统', system.os + ' ' + system.os_release);
                html += createConfigItem('主机名', system.hostname);
                html += createConfigItem('CPU核心数', system.cpu_count + ' 核');
                
                if (system.memory_total) {
                    html += createConfigItem('内存总量', system.memory_total);
                    html += createConfigItem('内存已用', system.memory_used);
                    html += createConfigItem('内存可用', system.memory_available);
                    html += createProgressItem('内存使用率', system.memory_usage_percent);
                } else {
                    html += createConfigItem('内存信息', system.memory_info || '无法获取');
                }
                
                if (system.disk_total) {
                    html += createConfigItem('磁盘总量', system.disk_total);
                    html += createConfigItem('磁盘已用', system.disk_used);
                    html += createConfigItem('磁盘可用', system.disk_free);
                    html += createProgressItem('磁盘使用率', system.disk_usage_percent);
                }
                
                configBody.innerHTML = html;
            }
            
            // 渲染数据库配置
            function renderDatabaseConfig(database) {
                var statusBadge = document.getElementById('dbStatus');
                var configBody = document.getElementById('databaseConfig');
                var html = '';
                
                // 设置状态标签
                if (database.status === '正常') {
                    statusBadge.textContent = '连接正常';
                    statusBadge.className = 'status-badge success';
                } else if (database.status === '连接失败') {
                    statusBadge.textContent = '连接失败';
                    statusBadge.className = 'status-badge error';
                } else {
                    statusBadge.textContent = database.status;
                    statusBadge.className = 'status-badge warning';
                }
                
                html += createConfigItem('配置状态', database.config_loaded ? '已加载' : '未加载');
                html += createConfigItem('连接测试', database.connection_test);
                if (database.pool_size) {
                    html += createConfigItem('连接池大小', database.pool_size);
                }
                if (database.connections) {
                    html += createConfigItem('当前连接数', database.connections);
                }
                
                configBody.innerHTML = html;
            }
            
            // 渲染应用信息
            function renderAppConfig(app) {
                var configBody = document.getElementById('appConfig');
                var html = '';
                
                html += createConfigItem('当前工作目录', app.current_working_directory);
                html += createConfigItem('进程ID (PID)', app.process_id);
                html += createConfigItem('父进程ID (PPID)', app.parent_process_id);
                html += createConfigItem('uWSGI模式', app.uwsgi_mode ? '是' : '否');
                html += createConfigItem('活跃线程数', app.active_threads || '未知');
                html += createConfigItem('已加载模块数', app.loaded_modules_count);
                html += createConfigItem('FLASK_ENV', app.environment_variables.FLASK_ENV);
                html += createConfigItem('FLASK_DEBUG', app.environment_variables.FLASK_DEBUG);
                
                configBody.innerHTML = html;
            }
            
            // 创建配置项HTML
            function createConfigItem(label, value, valueClass) {
                valueClass = valueClass || '';
                return '<div class="config-item">' +
                    '<span class="config-label">' + label + '</span>' +
                    '<span class="config-value ' + valueClass + '">' + (value || '-') + '</span>' +
                    '</div>';
            }
            
            // 创建进度条项
            function createProgressItem(label, percent) {
                var progressClass = percent > 80 ? 'error' : (percent > 60 ? 'warning' : '');
                return '<div class="config-item" style="flex-direction: column; align-items: stretch;">' +
                    '<div style="display: flex; justify-content: space-between; margin-bottom: 4px;">' +
                    '<span class="config-label">' + label + '</span>' +
                    '<span class="config-value">' + percent + '%</span>' +
                    '</div>' +
                    '<div class="progress-bar">' +
                    '<div class="progress-fill ' + progressClass + '" style="width: ' + percent + '%;"></div>' +
                    '</div>' +
                    '</div>';
            }
        });
    </script>
</body>
</html>
