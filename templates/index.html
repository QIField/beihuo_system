        .catch(error => {
            console.error('获取用户信息失败:', error);
            
            // 即使获取用户信息失败，也尝试使用默认值进行高亮
            var currentStore = 'default';
            
            // 遍历表格中的所有行
            var tableRows = document.querySelectorAll('#beihuoTable + .layui-table-view .layui-table-body tbody tr');
            
            tableRows.forEach(function(row, index) {
                // 获取物料条码 - 查找物料条码单元格
                var barcodeCell = row.querySelector('td[data-field="barcode"] div.layui-table-cell') || 
                                 row.querySelector('td[data-field="物料条码"] div.layui-table-cell') ||
                                 row.querySelector('td[data-field="barcode"]') ||
                                 row.querySelector('td[data-field="物料条码"]');
                                 
                if (barcodeCell) {
                    var barcode = (barcodeCell.textContent || barcodeCell.innerText || '').trim();
                    
                    // 检查当前行是否在购物车缓存中（使用本地缓存）
                    if (isInCartCache(currentStore, barcode)) {
                        // 高亮显示该行（设置背景色为红色）
                        row.style.backgroundColor = '#ffcccc'; // 浅红色背景
                    } else {

                    }
                }

}

            }
        }

        var currentFormData = layui.form.val('searchForm');
        
        // 构建当前搜索参数，过滤掉空值
        var currentParams = {};

                currentParams[key] = currentFormData[key];
            }
        }
        
        // 重新加载表格，保留搜索条件和应用新的排序

/**

 */
function bindQuantityEditEvents(cartTable) {
    // 绑定数量输入框的回车事件
    document.querySelectorAll('.quantity-input').forEach(function(input) {
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                updateQuantity(input, cartTable);
            }
        });
    });
    
    // 绑定更新按钮点击事件
    document.querySelectorAll('.update-quantity-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var input = this.previousElementSibling;
            updateQuantity(input, cartTable);
        });
    });
}

/**
 * 更新数量
 */
function updateQuantity(input, cartTable) {
    var row = input.closest('tr');
    var oeCell = row.querySelector('[data-field="oe"]');
    if (!oeCell) {
        // 如果找不到data-field="oe"的元素，尝试其他方式获取OE
        var cells = row.querySelectorAll('td');
        var oe = '';
        for (var i = 0; i < cells.length; i++) {
            if (cells[i].textContent.trim() !== '' && 
                (cells[i].textContent.trim().includes('OE') || cells[i].className.includes('layui-table-col-special'))) {
                // 尝试找到包含OE值的单元格
                continue;
            }
            // 找到第一列（OE列）的值
            if (i === 1) {  // 假设OE在第二列（第一列是复选框）
                oe = cells[i].textContent.trim();
                break;
            }
        }
        if (!oe) {
            // 重新获取表格数据，从表格实例中获取OE值
            var tr = input.closest('tr');
            var index = $(tr).data('index');
            var rowData = cartTable.config.data[index];
            if (rowData && rowData.oe) {
                oe = rowData.oe;
            }
        }
    } else {
        var oe = oeCell.textContent.trim();
    }
    
    // 从表格数据中获取OE值更可靠
    var tr = input.closest('tr');
    // 使用layui table的行数据获取方式
    var tableId = cartTable.config.id;
    var rowData = layui.table.getRowData(tableId, tr);
    var oe = rowData.oe;
    
    if (!oe) {
        // 如果无法从行数据获取，尝试从DOM中获取
        var oeCell = tr.querySelector('td[data-field="oe"]');
        if (oeCell) {
            oe = oeCell.textContent.trim();
        }
    }
    
    var quantity = parseInt(input.value);
    
    if (isNaN(quantity) || quantity <= 0) {
        layui.layer.msg('请输入有效数量', {icon: 2});
        return;
    }
    
    console.log('更新购物车数量:', {oe: oe, quantity: quantity});  // 调试信息
    
    // 发送请求更新数量
    fetch('/api/cart/update_quantity', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            item_oe: oe,
            quantity: quantity
        })
    })
    .then(response => response.json())
    .then(result => {
        if (result.code === 0) {
            layui.layer.msg('数量更新成功', {icon: 1});
            // 重新加载表格
            cartTable.reload({
                url: '/api/cart?' + new Date().getTime()
            });
            updateCartCount();
        } else {
            console.log('更新失败:', result.msg);  // 调试信息
            layui.layer.msg(result.msg, {icon: 2});
        }
    })
    .catch(error => {
        console.log('请求错误:', error);  // 调试信息
        layui.layer.msg('更新失败: ' + error.message, {icon: 2});
    });
}


/**
 * 从购物车移除商品
 * @param {string} itemOe 商品OE
 */
function removeFromCart(itemOe, itemBarcode, cartTable) {
    // 创建请求体，包含OE和物料条码
    const requestBody = { 
        item_oe: itemOe
    };
    
    // 如果提供了物料条码，则包含在请求中
    if (itemBarcode) {
        requestBody.item_barcode = itemBarcode;
    }
    
    fetch('/api/cart/remove', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(requestBody)
    })
    .then(response => response.json())
    .then(result => {
        if (result.code === 0) {
            layui.layer.msg('删除成功', {icon: 1});
            // 重新加载表格，保持当前维度
            if (window.cartTableInstance) {
                var currentDimension = window.currentCartDimension || 'product';
                // 重新加载表格
                if (window.cartTableInstance) {
                    var currentDimension = window.currentCartDimension || 'product';
                    layui.table.reload('cartTable', {
                        url: '/api/cart?' + new Date().getTime() + '&dimension=' + currentDimension,
                        page: { curr: 1 },
                        done: function(res, curr, count) {
                            // 检查是否有清理结果的返回数据
                            if (res.cleanup_result && res.cleanup_result.deleted_count > 0) {
                                layui.layer.msg(`库存大于20的商品已自动删除 ${res.cleanup_result.deleted_count} 个`, {
                                    icon: 1,
                                    time: 3000
                                });
                            }
                        }
                    });
                }
            } else {
                // 如果没有全局表格实例，尝试重新加载当前显示的购物车
                // 遍历所有可能的表格实例
                for (var i = 0; i < layui.table.config.instances.length; i++) {
                    var tableIns = layui.table.config.instances[i];
                    if (tableIns.config.id === 'cartTable') {
                        var currentDimension = window.currentCartDimension || 'product';
                        tableIns.reload({
                            url: '/api/cart?' + new Date().getTime() + '&dimension=' + currentDimension,
                            page: { curr: 1 }
                        });
                    }
                }
            }
            updateCartCount();
        } else {
            layui.layer.msg(result.msg, {icon: 2});
        }
    })
    .catch(error => {
        console.error('请求错误:', error);
        layui.layer.msg('删除失败: ' + error.message, {icon: 2});
    });
}

/**

function clearCart(cartTable) {

/**
 * 收集表单数据
 * @returns {object} 表单数据对象
 */
function collectFormData() {
    var formData = {};
    // 只收集实际的搜索字段，排除复选框和其他控件
    var searchInputs = document.querySelectorAll('#content input[type="text"], #content input[type="number"], #content select');
    searchInputs.forEach(function(el) {
        if (el.name && el.value.trim() !== '') {
            // 检查输入框内容是否包含换行符，如果是，则将其转换为数组
            var value = el.value.trim();
            if (value.includes('\n')) {
                // 如果包含换行符，分割为数组并过滤空值
                var values = value.split('\n')
                                .map(v => v.trim())  // 去除每行的空白字符
                                .filter(v => v !== ''); // 过滤空行
                if (values.length > 0) {
                    formData[el.name] = values; // 存储为数组
                }
            } else {
                // 排除数值比较操作符的字段，这些是下拉框，需要单独处理
                if (!el.name.endsWith('_op')) { // 不收集操作符字段，它们会单独处理
                    formData[el.name] = el.value.trim();
                }
            }
        }
    });
    
    // 收集数值比较操作符
    var comparisonInputs = document.querySelectorAll('#content select[name$="_op"], #content input[name$="_val"]');
    comparisonInputs.forEach(function(el) {
        if (el.name && el.value.trim() !== '') {
            formData[el.name] = el.value.trim();
        }
    });
    
    return formData;
}

// 添加导入购物车数据函数
function importCartData(cartTable) {
    // 创建文件输入元素
    var fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = '.xlsx,.xls,.csv';
    
    fileInput.onchange = function(e) {
        var file = e.target.files[0];
        if (!file) return;
        
        // 显示加载提示
        var loadingIndex = layui.layer.load(2, {
            content: '正在导入数据...',
            shade: [0.3, '#000']
        });
        
        // 创建FormData对象
        var formData = new FormData();
        formData.append('file', file);
        
        // 发送请求
        fetch('/api/cart/import', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(result => {
            layui.layer.close(loadingIndex);
            
            if (result.code === 0) {
                layui.layer.msg('导入成功！' + result.msg, {icon: 1});
                
                // 重新加载表格
                if (window.cartTableInstance) {
                    var currentDimension = window.currentCartDimension || 'product';
                    layui.table.reload('cartTable', {
                        url: '/api/cart?' + new Date().getTime() + '&dimension=' + currentDimension,
                        page: { curr: 1 },
                        done: function(res, curr, count) {
                            // 检查是否有清理结果的返回数据
                            if (res.cleanup_result && res.cleanup_result.deleted_count > 0) {
                                layui.layer.msg(`库存大于20的商品已自动删除 ${res.cleanup_result.deleted_count} 个`, {
                                    icon: 1,
                                    time: 3000
                                });
                            }
                        }
                    });
                }
                
                updateCartCount(); // 更新购物车计数
                
                // 如果有未匹配的数据，提示用户下载
                if (result.unmatched_count > 0) {
                    layui.layer.confirm(`导入完成，有 ${result.unmatched_count} 条数据在系统中不存在，是否下载这些数据的Excel文件？`, {
                        btn: ['下载', '取消']
                    }, function(index) {
                        // 下载未匹配的数据
                        var downloadLink = document.createElement('a');
                        downloadLink.href = '/api/cart/download_unmatched';
                        downloadLink.download = '';
                        downloadLink.click();
                        layui.layer.close(index);
                    });
                }
            } else {
                layui.layer.msg('导入失败: ' + result.msg, {icon: 2});
            }
        })
        .catch(error => {
            layui.layer.close(loadingIndex);
            layui.layer.msg('导入失败: ' + error.message, {icon: 2});
        });
    };
    
    fileInput.click();
}

function exportCartData(cartTable) {

    var currentDimension = window.currentCartDimension || 'product'; // 默认为产品维度
    
    // 从服务器获取购物车数据，带维度参数
    fetch('/api/cart?dimension=' + currentDimension)
        .then(response => response.json())
        .then(result => {
            if (result.code === 0) {
                var data = result.data;
                if (!data || data.length === 0) {
                    layui.layer.msg('购物车中没有数据', {icon: 2});
                    return;
                }
                
                // 定义表头
                var headers = ['OE', '供应商', '品牌', '物料名称', '物料条码', '车型品牌', '标签', '近1个月询价量', '近3个月月均询价量', '库存数量', '昨日销量', '本月销量', '今日销量', '全国近1个月询价量', '全国近3个月月均询价量', '内部备注', '品牌号', '库存金额', '成品可卖天数', '成本价', '近12个月月均销量', '近6个月月均销量', '近7天销量', '预警状态', '在途数量', '车型', '数量', '加入时间', '账户名'];
                
                // 转换数据为CSV格式
                var csvContent = headers.join(',') + '\n';
                data.forEach(function(row) {
                    var values = [
                        row.oe || '',
                        row.supplier || '',
                        row.brand || '',
                        row.material_name || '',
                        row.barcode || '',
                        row.car_brand || '',
                        row.tag || '',
                        row.inquiry_1m || '',
                        row.inquiry_3m || '',

                    values = values.map(function(value) {
                        if (typeof value === 'string' && (value.includes(',') || value.includes('"') || value.includes('\n'))) {
                            return '"' + value.replace(/"/g, '""') + '"';
                        }
                        return value;
                    });
                    csvContent += values.join(',') + '\n';
                });
                
                // 创建并下载文件
                var blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
                var link = document.createElement('a');

            }
        })
        .catch(error => {
            layui.layer.msg('导出失败: ' + error.message, {icon: 2});
        });
}

// 初始化日期查询功能
function initDateQuery() {
    layui.use(['laydate'], function() {
        var laydate = layui.laydate;
        
        // 开始日期
        laydate.render({
            elem: '#startDate',
            type: 'date',
            format: 'yyyy-MM-dd',
            done: function(value, date, endDate) {
                // 设置结束日期的最小值为开始日期
                if(value) {
                    laydate.render({
                        elem: '#endDate',
                        type: 'date',
                        format: 'yyyy-MM-dd',
                        min: value  // 设置最小日期
                    });
                }
            }
        });
        
        // 结束日期
        laydate.render({
            elem: '#endDate',
            type: 'date',
            format: 'yyyy-MM-dd'
        });
    });
    
    // 绑定日期查询按钮事件
    document.getElementById('dateQueryBtn').onclick = function() {
        var startDate = document.getElementById('startDate').value;
        var endDate = document.getElementById('endDate').value;
        
        if (!startDate || !endDate) {
            layui.layer.msg('请选择开始日期和结束日期', {icon: 2});
            return;
        }
        
        // 验证日期格式
        var dateRegex = /^\d{4}-\d{2}-\d{2}$/;
        if (!dateRegex.test(startDate) || !dateRegex.test(endDate)) {
            layui.layer.msg('日期格式不正确，请使用 YYYY-MM-DD 格式', {icon: 2});
            return;
        }
        
        // 验证结束日期不能早于开始日期
        var start = new Date(startDate);
        var end = new Date(endDate);
        if (end < start) {
            layui.layer.msg('结束日期不能早于开始日期', {icon: 2});
            return;
        }
        
        // 显示加载提示
        var loadingIndex = layui.layer.load(2, {
            content: '正在查询数据...',
            shade: [0.3, '#000']
        });
        
        // 发送日期查询请求
        fetch('/api/date_ordercount', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                start: startDate,
                end: endDate
            })
        })
        .then(response => response.json())
        .then(result => {
            layui.layer.close(loadingIndex);
            
            if (result.code === 0) {
                layui.layer.msg('查询成功', {icon: 1, time: 1000});
                
                // 保存当前日期范围到全局变量，以便重置时使用
                window.currentDateQueryStart = startDate;
                window.currentDateQueryEnd = endDate;
                
                // 显示查询结果表格
                showDateQueryResults(result.data);
            } else {
                layui.layer.msg(result.msg, {icon: 2});
            }
        })
        .catch(error => {
            layui.layer.close(loadingIndex);
            layui.layer.msg('查询失败: ' + error.message, {icon: 2});
            console.error('日期查询错误:', error);
        });
    };
}

// 收集表单数据
function collectFormData() {
    var formData = {};
    // 只收集实际的搜索字段，排除复选框和其他控件
    var searchInputs = document.querySelectorAll('#content input[type="text"], #content input[type="number"], #content select');
    searchInputs.forEach(function(el) {
        if (el.name && el.value.trim() !== '') {
            // 检查输入框内容是否包含换行符，如果是，则将其转换为数组
            var value = el.value.trim();
            if (value.includes('\n')) {
                // 如果包含换行符，分割为数组并过滤空值
                var values = value.split('\n')
                                .map(v => v.trim())  // 去除每行的空白字符
                                .filter(v => v !== ''); // 过滤空行
                if (values.length > 0) {
                    formData[el.name] = values; // 存储为数组
                }
            } else {
                // 排除数值比较操作符的字段，这些是下拉框，需要单独处理
                if (!el.name.endsWith('_op')) { // 不收集操作符字段，它们会单独处理
                    formData[el.name] = el.value.trim();
                }
            }
        }
    });

    // 收集数值比较操作符
    var comparisonInputs = document.querySelectorAll('#content select[name$="_op"], #content input[name$="_val"]');
    comparisonInputs.forEach(function(el) {
        if (el.name && el.value.trim() !== '') {
            formData[el.name] = el.value.trim();
        }
    });

    return formData;
}

// 高亮日期查询表格中购物车的商品
function highlightCartItemsForDateQueryTable() {
    // 获取当前用户门店信息
    fetch('/api/current_user')
        .then(response => response.json())
        .then(userResult => {
            var currentStore = userResult.store || 'default';
            
            // 遍历日期查询表格中的所有行
            var tableRows = document.querySelectorAll('#dateQueryTable + .layui-table-view .layui-table-body tbody tr');
            
            tableRows.forEach(function(row, index) {
                // 获取物料条码 - 查找物料条码单元格
                var barcodeCell = row.querySelector('td[data-field="barcode"] div.layui-table-cell') || 
                                 row.querySelector('td[data-field="物料条码"] div.layui-table-cell') ||
                                 row.querySelector('td[data-field="barcode"]') ||
                                 row.querySelector('td[data-field="物料条码"]');
                                 
                if (barcodeCell) {
                    var barcode = (barcodeCell.textContent || barcodeCell.innerText || '').trim();
                    
                    // 检查当前行是否在购物车缓存中 - 需要尝试多个可能的字段名
                    if (isInCartCache(currentStore, barcode)) {
                        // 高亮显示该行（设置背景色为红色）
                        row.style.backgroundColor = '#ffcccc'; // 浅红色背景
                    } else {
                        // 如果当前用户门店没有找到，尝试'default'门店
                        if (isInCartCache('default', barcode)) {
                            // 高亮显示该行（设置背景色为红色）
                            row.style.backgroundColor = '#ffcccc'; // 浅红色背景
                        } else {
                            // 恢复默认背景色
                            row.style.backgroundColor = '';
                        }
                    }
                }
            });
        })
        .catch(error => {
            console.error('获取用户信息失败:', error);
            
            // 即使获取用户信息失败，也尝试使用默认值进行高亮
            var currentStore = 'default';
            
            // 遍历日期查询表格中的所有行
            var tableRows = document.querySelectorAll('#dateQueryTable + .layui-table-view .layui-table-body tbody tr');
            
            tableRows.forEach(function(row, index) {
                // 获取物料条码 - 查找物料条码单元格
                var barcodeCell = row.querySelector('td[data-field="barcode"] div.layui-table-cell') ||

                                 row.querySelector('td[data-field="barcode"]') ||
                                 row.querySelector('td[data-field="物料条码"]');
                                 
                if (barcodeCell) {
                    var barcode = (barcodeCell.textContent || barcodeCell.innerText || '').trim();
                    
                    // 检查当前行是否在购物车缓存中
                    if (isInCartCache(currentStore, barcode)) {
                        // 高亮显示该行（设置背景色为红色）

                    } else {

// 专门用于dateQueryTable的单元格选择功能（处理弹窗环境下的坐标偏移问题）
function initExcelCellSelectionForDateQuery(tableId) {
    // 只对dateQueryTable生效
    if (tableId !== 'dateQueryTable') return;
    
    const tableView = document.querySelector('#' + tableId + ' + .layui-table-view');
    if (!tableView || tableView.__hasCellSelForCart__) return;
    tableView.__hasCellSelForCart__ = true;

    const tableBox = tableView.querySelector('.layui-table-box');
    const tableBody = tableView.querySelector('.layui-table-body');
    if (!tableBox || !tableBody) return;

    // 注入样式
    if (!document.getElementById('excel-cell-sel-style')) {
        const style = document.createElement('style');
        style.id = 'excel-cell-sel-style';
        style.textContent = `
            .cell-excel-selected {
                background-color: #d0e8ff !important;
                position: relative;
            }
            .cell-excel-selected::after {
                content: '';
                position: absolute;
                top: 0; left: 0; right: 0; bottom: 0;
                border: 2px solid #1e90ff;
                pointer-events: none;
                box-sizing: border-box;
            }
            #drag-sel-rect {
                position: absolute;
                border: 1px dashed #1e90ff;
                background: rgba(30,144,255,0.1);
                z-index: 2000;  /* 调整z-index层级，用于拖拽选择框 */
                pointer-events: none;
                display: none;
            }
        `;
        document.head.appendChild(style);
    }

    let rectDiv = document.getElementById('drag-sel-rect');
    if (!rectDiv) {
        rectDiv = document.createElement('div');
        rectDiv.id = 'drag-sel-rect';
    }

    let isDragging = false;
    let selectedCells = [];
    let startX, startY;

    // 清除选中
    function clearSelection() {
        document.querySelectorAll('.cell-excel-selected').forEach(el => el.classList.remove('cell-excel-selected'));
        selectedCells = [];
    }

    // 获取单元格相对于 tableView 的坐标（考虑滚动）
    function getCellRect(cell) {
        const cellRect = cell.getBoundingClientRect();
        const viewRect = tableView.getBoundingClientRect();
        return {
            left: cellRect.left - viewRect.left + tableView.scrollLeft,
            top: cellRect.top - viewRect.top + tableView.scrollTop,
            right: cellRect.right - viewRect.left + tableView.scrollLeft,
            bottom: cellRect.bottom - viewRect.top + tableView.scrollTop,
            element: cell
        };
    }

    function intersects(a, b) {
        return !(b.left > a.right || b.right < a.left || b.top > a.bottom || b.bottom < a.top);
    }

    function updateSelection(selRect) {
        clearSelection();
        const cells = tableBox.querySelectorAll('.layui-table-cell');
        const matched = [];

        cells.forEach(cell => {
            const cRect = getCellRect(cell);
            if (intersects(cRect, selRect)) {
                cell.classList.add('cell-excel-selected');
                const tr = cell.closest('tr[data-index]');
                if (!tr) return;
                const rowIndex = parseInt(tr.getAttribute('data-index'), 10);
                const td = cell.closest('td');
                const colIndex = Array.from(td.parentNode.children).indexOf(td);
                matched.push({
                    text: cell.innerText.trim(),
                    row: rowIndex,
                    col: colIndex
                });
            }
        });

        selectedCells = matched;
    }

    function generateCopyText() {
        if (selectedCells.length === 0) return '';
        const rows = {};
        let minR = Infinity, maxR = -Infinity, minC = Infinity, maxC = -Infinity;

        selectedCells.forEach(({row, col, text}) => {
            minR = Math.min(minR, row); maxR = Math.max(maxR, row);
            minC = Math.min(minC, col); maxC = Math.max(maxC, col);
            if (!rows[row]) rows[row] = {};
            rows[row][col] = text;
        });

        let lines = [];
        for (let r = minR; r <= maxR; r++) {
            let line = [];
            for (let c = minC; c <= maxC; c++) {
                line.push(rows[r] && rows[r][c] !== undefined ? rows[r][c] : '');
            }
            lines.push(line.join('\t'));
        }
        return lines.join('\n');
    }

    function copyText(text) {
        console.log('[Debug] 复制内容:', text); // 调试用
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(() => {
                layui.layer.msg('已复制选区内容', { icon: 1, time: 800 });
                // 自动清除选中
                clearSelection();
                selectedCells = [];
            }).catch(err => {
                console.error('Clipboard API 失败:', err);
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0;';
        document.body.appendChild(ta);
        ta.select();
        try {
            if (document.execCommand('copy')) {
                layui.layer.msg('已复制到剪贴板', { icon: 1, time: 800 });
                // 自动清除选中
                clearSelection();
                selectedCells = [];
            } else {
                layui.layer.msg('复制失败', { icon: 2 });
            }
        } catch (e) {
            console.error('execCommand 复制失败:', e);
            layui.layer.msg('浏览器不支持复制', { icon: 2 });
        }
        document.body.removeChild(ta);
    }

    // 添加选中商品到购物车的函数
    function addToCartFromSelection(selectedCells, tableId) {
        if (selectedCells.length === 0) {
            layui.layer.msg('未选中任何数据', { icon: 2 });
            return;
        }

        // 根据表格ID使用不同的方式获取表格实例
        let tableIns = null;
        let tableCache = null;
        
        if (tableId === 'dateQueryTable') {
            // 对于日期查询表格，使用全局变量或直接从layui.table.cache获取
            tableCache = layui.table.cache[tableId];
        } else {
            // 对于其他表格，尝试获取全局实例
            tableIns = window.beihuoTableInstance || window.beihuoTableIns;
            tableCache = layui.table.cache[tableId];
        }
        
        if (!tableCache) {
            layui.layer.msg('无法获取表格数据', { icon: 2 });
            return;
        }

        // 从选中的单元格中提取行数据，使用Map来确保每行只处理一次
        const selectedRows = new Map();

        selectedCells.forEach(cellData => {
            const rowIndex = cellData.row;
            if (tableCache[rowIndex] && !selectedRows.has(rowIndex)) {
                selectedRows.set(rowIndex, tableCache[rowIndex]);
            }
        });

        if (selectedRows.size === 0) {
            layui.layer.msg('没有有效的商品可以添加', { icon: 2 });
            return;
        }

        // 提取商品OE和物料条码的组合
        var itemDetails = [];
        selectedRows.forEach(function(item) {
            if (item.oe) {
                var barcode = item.barcode || item['物料条码'] || '';
                itemDetails.push({
                    oe: item.oe,
                    barcode: barcode
                });
            }
        });

        if (itemDetails.length === 0) {
            layui.layer.msg('没有有效的商品可以添加', { icon: 2 });
            return;
        }

        // 去重：确保相同的oe+barcode组合只添加一次
        const uniqueItems = [];
        const seen = new Set();
        itemDetails.forEach(item => {
            const key = item.oe + '|' + item.barcode;
            if (!seen.has(key)) {
                seen.add(key);
                uniqueItems.push(item);
            }
        });

        if (uniqueItems.length === 0) {
            layui.layer.msg('没有有效的商品可以添加', { icon: 2 });
            return;
        }
        
        // 发送请求添加到购物车
        fetch('/api/cart/add', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ item_details: itemDetails })
        })
        .then(response => response.json())
        .then(result => {
            console.log('服务器响应:', result);
            if (result.code === 0) {
                layui.layer.msg(result.msg, {icon: 1});
                updateCartCount();
                
                // 添加成功后，单独获取购物车数据更新界面
                fetch('/api/cart')
                    .then(response => response.json())
                    .then(cartResult => {
                        if (cartResult.code === 0) {
                            // 更新购物车缓存
                            window.cartCache.clear();
                            cartResult.data.forEach(item => {
                                var store = item.store || item['门店'] || window.currentUserStore || 'default';
                                var barcode = item.barcode || item['物料条码'] || '';
                                var cacheKey = store + '_' + barcode;
                                window.cartCache.add(cacheKey);
                            });
                            window.cartCacheLoaded = true;
                            
                            // 重新渲染相关表格
                            if (typeof layui !== 'undefined' && layui.table) {
                                layui.table.reload('beihuoTable', {
                                    url: '/api/beihuo?' + new Date().getTime()
                                });
                            } else {
                                // 如果 layui 不可用，刷新页面
                                location.reload();
                            }
                            if (window.dateQueryTableInstance) {
                                highlightCartItemsForDateQueryTable();
                            }
                        }
                    });
            } else {
                layui.layer.msg(result.msg, {icon: 2});
            }
        })
        .catch(error => {
            layui.layer.msg('添加失败: ' + error.message, {icon: 2});
        });
    }

    // 鼠标事件 - 为购物车表格使用特殊处理
    tableBox.addEventListener('mousedown', function(e) {
        if (e.button !== 0 || e.target.closest('.layui-table-tool,.layui-table-header,.layui-table-total')) return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;

        rectDiv.style.cssText = `
            position: absolute;
            left: ${startX}px;
            top: ${startY}px;
            width: 0;
            height: 0;
            display: block;
            border: 1px dashed #1e90ff;
            background: rgba(30,144,255,0.1);
            z-index: 9999;
            pointer-events: none;
        `;
        // 确保选择框添加到文档主体中
        if (rectDiv.parentNode !== document.body) {
            document.body.appendChild(rectDiv);
        }
        clearSelection();
        e.preventDefault();
    });

    document.addEventListener('mousemove', function(e) {
        if (!isDragging) return;
        let x = e.clientX, y = e.clientY;
        let w = x - startX, h = y - startY;
        let l = startX, t = startY;
        if (w < 0) { l = x; w = -w; }
        if (h < 0) { t = y; h = -h; }

        rectDiv.style.left = l + 'px';
        rectDiv.style.top = t + 'px';
        rectDiv.style.width = w + 'px';
        rectDiv.style.height = h + 'px';

        // 计算选择区域（相对于表格容器）
        const tableRect = tableView.getBoundingClientRect();
        const selRect = {
            left: l - tableRect.left + tableView.scrollLeft,
            top: t - tableRect.top + tableView.scrollTop,
            right: l + w - tableRect.left + tableView.scrollLeft,
            bottom: t + h - tableRect.top + tableView.scrollTop
        };

        updateSelection(selRect);
    });

    document.addEventListener('mouseup', function() {
        if (isDragging) {
            isDragging = false;
            rectDiv.style.display = 'none';
        }
    });

    // ====== 关键：绑定 Ctrl+C 复制 和 Alt+Q 功能 ======
    function handleKeydown(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'c' && selectedCells.length > 0) {
            e.preventDefault();
            copyText(generateCopyText());
        }
        // ====== 新增：绑定 Alt+Q 功能（仅在备货表格中添加商品） ======
        if (e.altKey && e.key.toLowerCase() === 'q' && selectedCells.length > 0) {
            e.preventDefault();
            addToCartFromSelection(selectedCells, tableId);
        }
    }

    // 移除可能存在的旧监听器
    if (tableView.__keyHandler) {
        document.removeEventListener('keydown', tableView.__keyHandler);
    }
    tableView.__keyHandler = handleKeydown;
    document.addEventListener('keydown', handleKeydown);
    
    // 添加点击屏幕任意地方取消选中（排除表格区域）
    document.addEventListener('click', function(e) {
        // 检查点击的是否是表格内部元素或表格相关元素
        const isTableElement = tableView.contains(e.target) || 
                              e.target.closest('.layui-table-cell') ||
                              e.target.closest('.layui-table-view') ||
                              e.target.closest('.layui-table-box');
        
        if (!isTableElement) {
            // 如果点击的不是表格相关元素，则清除选中
            setTimeout(() => {
                clearSelection();
                selectedCells = [];
            }, 100); // 延迟执行，确保不影响表格内部的点击事件
        }
    });
}

        return;
    }

    // 从选中的单元格中提取行数据
    const processedRows = new Set(); // 避免重复添加
    const selectedRows = [];

    selectedCells.forEach(cellData => {
        const rowIndex = cellData.row;
        console.log('处理行索引:', rowIndex);
        if (!processedRows.has(rowIndex) && tableCache[rowIndex]) {
            selectedRows.push(tableCache[rowIndex]);
            processedRows.add(rowIndex);
        }
    });

    if (selectedRows.length === 0) {
        layui.layer.msg('没有有效的商品可以添加', { icon: 2 });
        return;
    }

    // 提取商品OE和物料条码的组合
    var itemDetails = [];
    selectedRows.forEach(function(item) {
        console.log('处理商品:', item);
        if (item.oe) {
            var barcode = item.barcode || item['物料条码'] || '';
            console.log('提取OE:', item.oe, '条码:', barcode);
            itemDetails.push({
                oe: item.oe,
                barcode: barcode
            });
        }
    });

    if (itemDetails.length === 0) {
        layui.layer.msg('没有有效的商品可以添加', { icon: 2 });
        return;
    }

    console.log('准备发送到购物车的商品:', itemDetails);
    // 发送请求添加到购物车
    fetch('/api/cart/add', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ item_details: itemDetails })
    })
    .then(response => response.json())
    .then(result => {
        console.log('服务器响应:', result);
        if (result.code === 0) {
            layui.layer.msg(result.msg, {icon: 1});
            updateCartCount();
            
            // 添加成功后，单独获取购物车数据更新界面
            fetch('/api/cart')
                .then(response => response.json())
                .then(cartResult => {
                    if (cartResult.code === 0) {
                        // 更新购物车缓存
                        window.cartCache.clear();
                        cartResult.data.forEach(item => {
                            var store = item.store || item['门店'] || window.currentUserStore || 'default';
                            var barcode = item.barcode || item['物料条码'] || '';
                            var cacheKey = store + '_' + barcode;
                            window.cartCache.add(cacheKey);
                        });
                        window.cartCacheLoaded = true;
                        
                        // 重新渲染相关表格
                        if (typeof layui !== 'undefined' && layui.table) {
                            layui.table.reload('beihuoTable', {
                                url: '/api/beihuo?' + new Date().getTime()
                            });
                        } else {
                            // 如果 layui 不可用，刷新页面
                            location.reload();
                        }
                        if (window.dateQueryTableInstance) {
                            highlightCartItemsForDateQueryTable();
                        }
                    }
                });
        } else {
            layui.layer.msg(result.msg, {icon: 2});
        }
    })
    .catch(error => {
        layui.layer.msg('添加失败: ' + error.message, {icon: 2});
    });
}

</script>
</body>
</html>
