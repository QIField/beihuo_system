<script>
    layui.config({
        version: 'v1.9.0'
    }).extend({
        soulTable: '/static/soulTable/soulTable.slim',
        tableMerge: '/static/soulTable/tableMerge'
    });

    layui.use(['table', 'layer', 'form', 'jquery', 'laydate', 'dropdown', 'soulTable', 'tableMerge'], function () {
        const table = layui.table;
        const layer = layui.layer;
        const form = layui.form;
        const $ = layui.jquery;
        const laydate = layui.laydate;
        const dropdown = layui.dropdown;
        const soulTable = layui.soulTable;
        const tableMerge = layui.tableMerge;

        let currentGroupname = '全部';
        let groupnameList = [];
        let currentDealStatus = '';
        let dealStatusList = [
            { title: '全部', id: '' },
            { title: '未知', id: '0' },
            { title: '成交', id: '1' },
            { title: '未成交', id: '2' }
        ];

        function getTodayDate() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        const todayDate = getTodayDate();
        $('#date').val(todayDate);

        // 加载群名称列表
        function loadGroupnameList() {
            $.ajax({
                url: '/new/api/report_wx_quote_data/groupname_list_api',
                type: 'GET',
                success: function (res) {
                    if (res.code === 200 && res.data) {
                        groupnameList = [{ title: '全部', id: '全部' }];
                        res.data.forEach(function (groupname) {
                            groupnameList.push({ title: groupname, id: groupname });
                        });
                        initGroupnameDropdown();
                    }
                }
            });
        }

        // 初始化群名称下拉框
        function initGroupnameDropdown() {
            dropdown.render({
                elem: '#groupnameBtn',
                data: groupnameList,
                click: function (obj) {
                    this.elem.find('span').text(obj.title);
                    currentGroupname = obj.id;
                    reloadTable();
                }
            });
        }

        // 初始化成交状态下拉框
        function initDealStatusDropdown() {
            dropdown.render({
                elem: '#dealStatusBtn',
                data: dealStatusList,
                click: function (obj) {
                    this.elem.find('span').text(obj.title);
                    currentDealStatus = obj.id;
                    reloadTable();
                }
            });
        }

        // 加载群名称列表
        loadGroupnameList();
        // 初始化成交状态下拉框
        initDealStatusDropdown();

        // 渲染日期选择器
        laydate.render({
            elem: '#date',
            type: 'date'
        });

        function formatDate(dateStr) {
            if (!dateStr) return '';
            return dateStr.split(' ')[0];
        }

        table.render({
            elem: '#weixinDecodingResultTable',
            id: 'weixinDecodingResultTable',
            url: '/new/api/report_wx_quote_data/weixin_decoding_result_list_api',
            method: 'get',
            page: true,
            limits: [5, 10, 20, 50, 100],
            limit: 5,
            toolbar: '#toolbarTemplate',
            defaultToolbar: ['filter', 'exports'],
            request: {
                pageName: 'page',
                limitName: 'limit'
            },
            where: {
                start_date: todayDate,
                end_date: todayDate,
                groupname: '全部',
                nickname: $('#nickname').val(),
                deal_status: currentDealStatus
            },
            parseData: function (res) {
                const originalData = res.data.result || [];
                const formattedData = originalData.map(function (record) {
                    record.rowId = record.rowId || (record.weixin_decoding_result_id ? String(record.weixin_decoding_result_id) : '');
                    record.is_out_of_stock = record.is_out_of_stock || false;
                    record.deal_status = record.deal_status !== undefined ? record.deal_status : 0;
                    record.quantity = record.quantity || 0;
                    return record;
                });

                return {
                    "code": res.code === 200 ? 0 : res.code,
                    "msg": res.msg,
                    "count": res.data.total,
                    "data": formattedData
                };
            },
            cols: [[
                { field: 'create_date', title: '创建日期', width: 120, merge: 'rowId', templet: function (d) { return formatDate(d.create_date); } },
                { field: 'group_name', title: '群名称', width: 160, merge: 'rowId' },
                { field: 'user_name', title: '用户', width: 160, merge: 'rowId' },
                {
                    field: 'inquiry_customer',
                    title: '询价客户',
                    minWidth: 200,
                    merge: 'rowId',
                    templet: function (d) {
                        return '<div style="position:relative;min-height:24px;">' +
                            '<a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="editCustomer" style="float:right;margin-left:5px;"><i class="layui-icon layui-icon-edit"></i></a>' +
                            '<span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + (d.inquiry_customer || '') + '</span>' +
                            '</div>';
                    }
                },
                { field: 'inquiry', title: '询价', minWidth: 100, merge: 'rowId' },
                { field: 'original_quote', merge: ['rowId', 'original_quote'], title: '原始报价', minWidth: 300 },
                {
                    field: 'is_out_of_stock',
                    title: '缺货',
                    width: 80,
                    merge: ['rowId', 'original_quote'],
                    templet: function (d) {
                        const color = d.is_out_of_stock ? 'red' : 'green';
                        const text = d.is_out_of_stock ? '是' : '否';
                        return '<span style="color: ' + color + ';">' + text + '</span>';
                    }
                },
                { field: 'oe_code', title: 'OE码', width: 150, merge: ['rowId', 'original_quote'] },
                { field: 'part_name', title: '配件名称', width: 200, merge: ['rowId', 'original_quote'] },


                {
                    field: 'brand',
                    title: '品牌',
                    width: 220,
                    templet: function (d) {
                        var index = d.LAY_TABLE_INDEX !== undefined ? d.LAY_TABLE_INDEX : (d.id || '');
                        return '<div style="display:flex;align-items:center;justify-content:space-between;">' +
                            '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + (d.brand || '') + '</span>' +
                            '<div style="display:flex;align-items:center;margin-left:5px;">' +
                            '<button class="layui-btn layui-btn-xs layui-btn-primary" style="width:22px;height:22px;line-height:20px;padding:0;" data-idx="' + index + '" data-action="minus">-</button>' +
                            '<input type="text" value="' + (d.quantity || 0) + '" style="width:36px;height:22px;line-height:20px;text-align:center;border:1px solid #e6e6e6;border-left:none;border-right:none;font-size:12px;" data-idx="' + index + '" data-action="quantity" readonly>' +
                            '<button class="layui-btn layui-btn-xs layui-btn-primary" style="width:22px;height:22px;line-height:20px;padding:0;" data-idx="' + index + '" data-action="plus">+</button>' +
                            '</div>' +
                            '</div>';
                    }
                },
                { field: 'price', title: '价格', width: 100 },


                {
                    field: 'draft_link', title: '草稿链接', width: 400, merge: 'rowId', templet: function (d) {
                        var html = '';
                        if (d.draft_link) {
                            html += '<span class="draft-link-text" data-link="' + d.draft_link + '" title="点击复制，双击打开">' + d.draft_link + '</span>';
                        }
                        html += '<button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="generateDraftLink" style="margin-left:5px;">生成链接</button>';
                        var hasExtraItems = d.extra_items && d.extra_items.length > 0;
                        var btnClass = hasExtraItems ? 'layui-btn-danger' : 'layui-btn-warm';
                        html += '<button class="layui-btn layui-btn-xs ' + btnClass + '" lay-event="addExtraBrand" style="margin-left:5px;">添加额外品牌</button>';
                        return html;
                    }
                },

                {
                    field: 'deal_status',
                    title: '成交状态',
                    width: 100,
                    merge: ['rowId', 'original_quote'],
                    templet: function (d) {
                        const statusMap = { 0: '未知', 1: '成交', 2: '未成交' };
                        const colorMap = { 0: 'gray', 1: 'green', 2: 'red' };
                        const status = d.deal_status !== undefined ? d.deal_status : 0;
                        const color = colorMap[status];
                        const text = statusMap[status];
                        return '<span style="color: ' + color + ';">' + text + '</span>';
                    }
                },
                { field: 'deal_customer', title: '成交客户', minWidth: 120, merge: ['rowId', 'original_quote'] },
                { field: 'deal_brand', title: '成交品牌', minWidth: 120, merge: ['rowId', 'original_quote'] },
                {
                    field: 'deal_amount', title: '成交金额', minWidth: 120,
                    merge: ['rowId', 'original_quote'],

                    templet: function (d) {
                        if (d.deal_amount) {
                            return d.deal_amount;
                        }
                        return '';
                    }
                },


            ]],
            height: 'full-250',
            done: function (res, curr, count) {
                soulTable.render(this);
                tableMerge.render(this);
                bindQuantityEvents();
                bindDraftLinkEvents();
            }
        });

        function bindQuantityEvents() {
            var tableElem = $('#weixinDecodingResultTable').next('.layui-table-view');

            tableElem.off('click', '[data-action="plus"]').on('click', '[data-action="plus"]', function () {
                var btn = $(this);
                var tr = btn.closest('tr');
                var index = tr.data('index');
                var cache = layui.table.cache['weixinDecodingResultTable'];
                if (cache[index]) {
                    cache[index].quantity = (cache[index].quantity || 0) + 1;
                    btn.siblings('[data-action="quantity"]').val(cache[index].quantity);
                }
            });

            tableElem.off('click', '[data-action="minus"]').on('click', '[data-action="minus"]', function () {
                var btn = $(this);
                var tr = btn.closest('tr');
                var index = tr.data('index');
                var cache = layui.table.cache['weixinDecodingResultTable'];
                if (cache[index]) {
                    var qty = (cache[index].quantity || 0) - 1;
                    if (qty < 0) qty = 0;
                    cache[index].quantity = qty;
                    btn.siblings('[data-action="quantity"]').val(qty);
                }
            });
        }

        function reloadTable() {
            const selectedDate = $('#date').val();
            table.reload('weixinDecodingResultTable', {
                where: {
                    start_date: selectedDate,
                    end_date: selectedDate,
                    groupname: currentGroupname,
                    nickname: $('#nickname').val(),
                    deal_status: currentDealStatus
                },
                page: {
                    curr: 1
                }
            });
        }

        function reloadCurrentPage() {
            const selectedDate = $('#date').val();
            table.reload('weixinDecodingResultTable', {
                where: {
                    start_date: selectedDate,
                    end_date: selectedDate,
                    groupname: currentGroupname,
                    nickname: $('#nickname').val(),
                    deal_status: currentDealStatus
                }
            });
        }

        function bindDraftLinkEvents() {
            var tableElem = $('#weixinDecodingResultTable').next('.layui-table-view');
            tableElem.off('click', '.draft-link-text').on('click', '.draft-link-text', function (e) {
                e.stopPropagation();
                var link = $(this).attr('data-link');
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(link).then(function () {
                        layer.msg('链接已复制', { icon: 1, time: 1500 });
                    }).catch(function () {
                        fallbackCopy(link);
                    });
                } else {
                    fallbackCopy(link);
                }
            });
            tableElem.off('dblclick', '.draft-link-text').on('dblclick', '.draft-link-text', function (e) {
                e.stopPropagation();
                var link = $(this).attr('data-link');
                window.open(link, '_blank');
            });
        }

        function fallbackCopy(text) {
            var textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            textArea.style.top = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                var successful = document.execCommand('copy');
                if (successful) {
                    layer.msg('链接已复制', { icon: 1, time: 1500 });
                } else {
                    layer.msg('复制失败，请手动复制', { icon: 2 });
                }
            } catch (err) {
                layer.msg('复制失败，请手动复制', { icon: 2 });
            }
            document.body.removeChild(textArea);
        }

        $('#searchBtn').off().on('click', function () {
            reloadTable();
        });

        $('#resetBtn').off().on('click', function () {
            const today = getTodayDate();
            $('#date').val(today);
            $('#groupnameBtn span').text('全部');
            currentGroupname = '全部';
            $('#nickname').val('');
            $('#dealStatusBtn span').text('全部');
            currentDealStatus = '';
            reloadTable();
        });

        $('#updateDataBtn').off().on('click', function () {
            const selectedDate = $('#date').val();

            if (!selectedDate) {
                layer.msg('请先选择日期', { icon: 2 });
                return;
            }

            layer.confirm('确定要更新日期为 ' + selectedDate + ' 的数据吗？', {
                icon: 3,
                title: '确认更新'
            }, function (index) {
                layer.close(index);

                const loadingIndex = layer.load(1, {
                    shade: [0.3, '#000']
                });

                $.ajax({
                    url: '/new/api/report_wx_quote_data/fetch_data_and_save_to_database_api',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        start_date: selectedDate,
                        end_date: selectedDate
                    }),
                    success: function (res) {
                        layer.close(loadingIndex);
                        if (res.code === 200) {
                            layer.msg('数据更新成功', { icon: 1 });
                            reloadTable();
                        } else {
                            layer.msg(res.msg || '数据更新失败', { icon: 2 });
                        }
                    },
                    error: function (xhr, status, error) {
                        layer.close(loadingIndex);
                        layer.msg('数据更新失败: ' + error, { icon: 2 });
                    }
                });
            });
        });

        table.on('tool(weixinDecodingResultTable)', function (obj) {
            const data = obj.data;

            if (obj.event === 'editCustomer') {
                layer.open({
                    title: '编辑询价客户',
                    type: 1,
                    area: ['500px', '350px'],
                    content: $('#editCustomerTemplate').html(),
                    end: function () {
                        $(document).off('mousedown.customerSearch');
                    },
                    success: function (layero, index) {
                        form.render();

                        const inquiryCustomerInput = layero.find('#inquiryCustomerInput');
                        const suggestionDropdown = layero.find('#customerSuggestionDropdown');
                        const selectedCustomerTag = layero.find('#selectedCustomerTag');
                        const selectedCustomerNameSpan = layero.find('#selectedCustomerName');
                        const clearSelectedBtn = layero.find('#clearSelectedCustomer');
                        let selectedCustomerData = null;
                        let searchTimer = null;

                        function showSelectedTag(customerName) {
                            selectedCustomerNameSpan.text(customerName);
                            selectedCustomerTag.show();
                            inquiryCustomerInput.val('');
                            suggestionDropdown.hide();
                        }

                        function hideSelectedTag() {
                            selectedCustomerData = null;
                            selectedCustomerTag.hide();
                            inquiryCustomerInput.focus();
                        }

                        function renderSuggestions(items) {
                            suggestionDropdown.empty();
                            if (!items || items.length === 0) {
                                const emptyItem = $('<div></div>').css({
                                    padding: '10px 12px',
                                    color: '#999',
                                    fontSize: '13px',
                                    textAlign: 'center'
                                }).text('未找到匹配客户');
                                suggestionDropdown.append(emptyItem);
                            } else {
                                items.forEach(function (item) {
                                    let displayText = item.fullname;
                                    if (item.short_name) {
                                        displayText += ' (' + item.short_name + ')';
                                    }
                                    if (item.contacts_phone) {
                                        displayText += ' - ' + item.contacts_phone;
                                    }
                                    const suggestionItem = $('<div></div>').css({
                                        padding: '8px 12px',
                                        cursor: 'pointer',
                                        fontSize: '13px',
                                        borderBottom: '1px solid #f0f0f0',
                                        transition: 'background-color 0.2s'
                                    }).hover(
                                        function () { $(this).css('background-color', '#f5f7fa'); },
                                        function () { $(this).css('background-color', ''); }
                                    ).text(displayText);

                                    suggestionItem.on('click', function () {
                                        selectedCustomerData = {
                                            partner_id: item.partner_id,
                                            fullname: item.fullname
                                        };
                                        showSelectedTag(item.fullname);
                                    });

                                    suggestionDropdown.append(suggestionItem);
                                });
                            }
                            suggestionDropdown.show();
                        }

                        function searchCustomers(keyword) {
                            $.ajax({
                                url: '/new/api/report_wx_quote_data/search_crm_customer_api',
                                type: 'GET',
                                data: {
                                    keyword: keyword
                                },
                                success: function (res) {
                                    if (res.code === 200 && res.data) {
                                        renderSuggestions(res.data);
                                    } else {
                                        renderSuggestions([]);
                                    }
                                },
                                error: function () {
                                    renderSuggestions([]);
                                }
                            });
                        }

                        inquiryCustomerInput.on('input', function () {
                            const keyword = $(this).val().trim();
                            if (selectedCustomerData) {
                                hideSelectedTag();
                            }
                            if (searchTimer) {
                                clearTimeout(searchTimer);
                            }
                            if (!keyword) {
                                suggestionDropdown.hide();
                                return;
                            }
                            searchTimer = setTimeout(function () {
                                searchCustomers(keyword);
                            }, 300);
                        });

                        inquiryCustomerInput.on('focus', function () {
                            const keyword = $(this).val().trim();
                            if (keyword && !selectedCustomerData) {
                                searchCustomers(keyword);
                            }
                        });

                        clearSelectedBtn.on('click', function () {
                            hideSelectedTag();
                        });

                        $(document).on('mousedown.customerSearch', function (e) {
                            if (!layero.find('#customerSearchContainer').is(e.target) &&
                                layero.find('#customerSearchContainer').has(e.target).length === 0) {
                                suggestionDropdown.hide();
                            }
                        });

                        if (data.inquiry_customer && data.inquiry_customer_id) {
                            selectedCustomerData = {
                                partner_id: data.inquiry_customer_id,
                                fullname: data.inquiry_customer
                            };
                            showSelectedTag(data.inquiry_customer);
                        }

                        form.on('submit(saveCustomerEdit)', function () {
                            if (data.weixin_decoding_result_id === null) {
                                layer.msg('缺少必要参数，无法保存');
                                return false;
                            }

                            if (!selectedCustomerData) {
                                layer.msg('请先搜索并选择客户');
                                return false;
                            }

                            const submitCustomerId = selectedCustomerData.partner_id;
                            const submitCustomerName = selectedCustomerData.fullname;

                            $.ajax({
                                url: '/new/api/report_wx_quote_data/update_inquiry_customer_api',
                                type: 'POST',
                                contentType: 'application/json',
                                data: JSON.stringify({
                                    weixin_decoding_result_id: data.weixin_decoding_result_id,
                                    inquiry_customer_id: submitCustomerId,
                                    inquiry_customer: submitCustomerName
                                }),
                                success: function (res) {
                                    if (res.code === 200) {
                                        var cache = layui.table.cache['weixinDecodingResultTable'];
                                        for (var i = 0; i < cache.length; i++) {
                                            if (cache[i].weixin_decoding_result_id === data.weixin_decoding_result_id) {
                                                cache[i].inquiry_customer_id = submitCustomerId;
                                                cache[i].inquiry_customer = submitCustomerName;
                                            }
                                        }
                                        obj.update({
                                            inquiry_customer_id: submitCustomerId,
                                            inquiry_customer: submitCustomerName
                                        });
                                        layer.msg('保存成功');
                                        layer.close(index);
                                    } else {
                                        layer.msg(res.msg || '保存失败');
                                    }
                                },
                                error: function () {
                                    layer.msg('保存失败');
                                }
                            });

                            return false;
                        });

                        form.on('submit(cancelCustomerEdit)', function () {
                            layer.close(index);
                        });
                    }
                });
            } else if (obj.event === 'generateDraftLink') {
                handleGenerateDraftLink(obj);
            } else if (obj.event === 'addExtraBrand') {
                handleAddExtraBrand(obj);
            }
        });

        function handleGenerateDraftLink(obj) {
            var data = obj.data;
            var weixinDecodingResultId = data.weixin_decoding_result_id;

            var cache = layui.table.cache['weixinDecodingResultTable'];
            var selectedItems = [];

            for (var i = 0; i < cache.length; i++) {
                var row = cache[i];
                if (row.weixin_decoding_result_id === weixinDecodingResultId &&
                    row.quantity && row.quantity > 0) {
                    selectedItems.push({
                        oe_code: row.oe_code,
                        brand: row.brand,
                        price: row.price,
                        quantity: row.quantity,
                        is_out_of_stock: row.is_out_of_stock
                    });
                }
            }

            var extraItems = [];
            for (var i = 0; i < cache.length; i++) {
                var row = cache[i];
                if (row.weixin_decoding_result_id === weixinDecodingResultId &&
                    row.extra_items && row.extra_items.length > 0) {
                    extraItems = extraItems.concat(row.extra_items);
                    break;
                }
            }

            if (selectedItems.length === 0 && extraItems.length === 0) {
                layer.msg('请先选择至少一个配件的数量或添加额外品牌', { icon: 2 });
                return;
            }

            var hasDealStatus1 = false;
            for (var i = 0; i < cache.length; i++) {
                if (cache[i].weixin_decoding_result_id === weixinDecodingResultId) {
                    if (cache[i].deal_status == 1) {
                        hasDealStatus1 = true;
                        break;
                    }
                }
            }
            if (hasDealStatus1) {
                layer.msg('已成交的订单不能生成草稿链接', { icon: 2 });
                return;
            }

            var hasOutOfStock = selectedItems.some(function(item) {
                return item.is_out_of_stock == true;
            });
            if (hasOutOfStock) {
                layer.msg('包含缺货的配件，不能生成草稿链接', { icon: 2 });
                return;
            }

            var btn = obj.tr.find('[lay-event="generateDraftLink"]');
            var originalText = btn.text();
            btn.prop('disabled', true).text('生成中...').addClass('layui-btn-disabled');

            $.ajax({
                url: '/new/api/report_wx_quote_data/generate_draft_link_api',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    weixin_decoding_result_id: weixinDecodingResultId,
                    items: selectedItems,
                    extra_items: extraItems
                }),
                success: function (res) {
                    btn.prop('disabled', false).text(originalText).removeClass('layui-btn-disabled');
                    if (res.code === 200 && res.data && res.data.draft_link) {
                        var draftLink = res.data.draft_link;
                        for (var i = 0; i < cache.length; i++) {
                            if (cache[i].weixin_decoding_result_id === weixinDecodingResultId) {
                                cache[i].draft_link = draftLink;
                            }
                        }
                        obj.update({
                            draft_link: draftLink
                        });
                        layer.msg('生成成功', { icon: 1 });
                    } else {
                        layer.msg(res.msg || '生成失败', { icon: 2 });
                    }
                },
                error: function (xhr, status, error) {
                    layer.msg('生成失败: ' + error, { icon: 2 });
                    btn.prop('disabled', false).text(originalText).removeClass('layui-btn-disabled');
                }
            });
        }

        function updateAddExtraBrandBtnColor(weixinDecodingResultId, extraItemsCount) {
            var tableElem = $('#weixinDecodingResultTable').next('.layui-table-view');
            var trs = tableElem.find('tbody tr');
            trs.each(function () {
                var tr = $(this);
                var rowIndex = tr.data('index');
                var cache = layui.table.cache['weixinDecodingResultTable'];
                if (cache[rowIndex] && cache[rowIndex].weixin_decoding_result_id === weixinDecodingResultId) {
                    var btn = tr.find('[lay-event="addExtraBrand"]');
                    if (btn.length > 0) {
                        btn.removeClass('layui-btn-warm layui-btn-danger');
                        if (extraItemsCount > 0) {
                            btn.addClass('layui-btn-danger');
                        } else {
                            btn.addClass('layui-btn-warm');
                        }
                    }
                    return false;
                }
            });
        }

        function handleAddExtraBrand(obj) {
            var data = obj.data;
            var weixinDecodingResultId = data.weixin_decoding_result_id;

            layer.open({
                title: '添加额外品牌',
                type: 1,
                area: ['600px', '550px'],
                content: $('#addExtraBrandTemplate').html(),
                success: function (layero, index) {
                    form.render();

                    var oeCodeInput = layero.find('#extraOeCodeInput');
                    var searchOeBtn = layero.find('#searchOeBtn');
                    var productSelectBtn = layero.find('#productSelectBtn');
                    var selectedProductInfo = layero.find('#selectedProductInfo');
                    var quantityInput = layero.find('#extraQuantityInput');
                    var listBody = layero.find('#extraBrandListBody');
                    var selectedProductData = null;
                    var dropdownInstance = null;

                    function getExtraItems() {
                        var cache = layui.table.cache['weixinDecodingResultTable'];
                        for (var i = 0; i < cache.length; i++) {
                            if (cache[i].weixin_decoding_result_id === weixinDecodingResultId) {
                                return cache[i].extra_items || [];
                            }
                        }
                        return [];
                    }

                    function renderExtraBrandList() {
                        var items = getExtraItems();
                        listBody.empty();
                        if (items.length === 0) {
                            listBody.html('<tr><td colspan="4" style="text-align:center;color:#999;">暂无已添加的额外产品</td></tr>');
                            return;
                        }
                        items.forEach(function (item, idx) {
                            var tr = $('<tr>');
                            tr.append('<td>' + item.oe_code + '</td>');
                            tr.append('<td>' + item.brand + '</td>');
                            tr.append('<td>' + item.quantity + '</td>');
                            tr.append('<td><button class="layui-btn layui-btn-xs layui-btn-danger" data-idx="' + idx + '">删除</button></td>');
                            listBody.append(tr);
                        });

                        listBody.find('button[data-idx]').off('click').on('click', function () {
                            var idx = parseInt($(this).attr('data-idx'));
                            var cache = layui.table.cache['weixinDecodingResultTable'];
                            for (var i = 0; i < cache.length; i++) {
                                if (cache[i].weixin_decoding_result_id === weixinDecodingResultId) {
                                    if (cache[i].extra_items && cache[i].extra_items.length > idx) {
                                        cache[i].extra_items.splice(idx, 1);
                                        renderExtraBrandList();
                                        updateAddExtraBrandBtnColor(weixinDecodingResultId, cache[i].extra_items.length);
                                        break;
                                    }
                                }
                            }
                        });
                    }

                    renderExtraBrandList();

                    searchOeBtn.on('click', function () {
                        var oeCode = oeCodeInput.val().trim();
                        if (!oeCode) {
                            layer.msg('请输入OE码');
                            return;
                        }

                        $.ajax({
                            url: '/new/api/report_wx_quote_data/search_oe_product_api',
                            type: 'GET',
                            data: {
                                oe_code: oeCode
                            },
                            success: function (res) {
                                selectedProductData = null;
                                selectedProductInfo.hide();
                                productSelectBtn.find('span').text('请选择产品');

                                if (res.code === 200 && res.data && res.data.length > 0) {
                                    dropdownInstance = dropdown.render({
                                        elem: productSelectBtn[0],
                                        data: res.data,
                                        click: function (item) {
                                            if (item.productData) {
                                                selectedProductData = item.productData;
                                                productSelectBtn.find('span').text(
                                                    selectedProductData.number + ' / ' +
                                                    selectedProductData.brand_name + ' / ' +
                                                    selectedProductData.name
                                                );
                                                selectedProductInfo.html(
                                                    '<strong>已选择：</strong>' +
                                                    'OE码: ' + selectedProductData.number + ' | ' +
                                                    '品牌: ' + selectedProductData.brand_name + ' | ' +
                                                    '名称: ' + selectedProductData.name + ' | ' +
                                                    '价格: ' + selectedProductData.price + '元'
                                                ).show();
                                            }
                                        }
                                    });
                                    productSelectBtn.click();
                                } else if (res.code === 404) {
                                    layer.msg(res.msg || '未找到匹配的产品', { icon: 2 });
                                    productSelectBtn.find('span').text('未找到匹配产品');
                                } else if (res.code === 400) {
                                    layer.msg(res.msg || '参数错误', { icon: 2 });
                                } else {
                                    layer.msg(res.msg || '搜索失败', { icon: 2 });
                                    productSelectBtn.find('span').text('搜索失败');
                                }
                            },
                            error: function () {
                                layer.msg('搜索失败', { icon: 2 });
                            }
                        });
                    });

                    oeCodeInput.on('keydown', function (e) {
                        if (e.keyCode === 13) {
                            searchOeBtn.click();
                        }
                    });

                    form.on('submit(saveExtraBrand)', function () {
                        var quantity = parseInt(quantityInput.val().trim()) || 1;

                        if (!selectedProductData) {
                            layer.msg('请先搜索并选择产品');
                            return false;
                        }

                        if (quantity < 1) {
                            layer.msg('数量必须大于0');
                            return false;
                        }

                        var cache = layui.table.cache['weixinDecodingResultTable'];
                        var isUpdated = false;
                        for (var i = 0; i < cache.length; i++) {
                            if (cache[i].weixin_decoding_result_id === weixinDecodingResultId) {
                                if (!cache[i].extra_items) {
                                    cache[i].extra_items = [];
                                }
                                var existingItem = cache[i].extra_items.find(function (item) {
                                    return item.oe_code === selectedProductData.number && item.brand === selectedProductData.brand_name;
                                });
                                if (existingItem) {
                                    existingItem.quantity = quantity;
                                    isUpdated = true;
                                } else {
                                    cache[i].extra_items.push({
                                        oe_code: selectedProductData.number,
                                        brand: selectedProductData.brand_name,
                                        quantity: quantity,
                                        name: selectedProductData.name,
                                        price: selectedProductData.price,
                                        product_id: selectedProductData.product_id,
                                        stock: selectedProductData.stock
                                    });
                                }
                                break;
                            }
                        }

                        oeCodeInput.val('');
                        productSelectBtn.find('span').text('请先搜索OE码');
                        selectedProductData = null;
                        selectedProductInfo.hide();
                        quantityInput.val('1');
                        renderExtraBrandList();
                        var currentExtraItems = getExtraItems();
                        updateAddExtraBrandBtnColor(weixinDecodingResultId, currentExtraItems.length);
                        layer.msg(isUpdated ? '更新成功' : '添加成功');

                        return false;
                    });

                    form.on('submit(cancelExtraBrand)', function () {
                        layer.close(index);
                    });
                }
            });
        }
    });
</script>
