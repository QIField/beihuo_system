<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>微信报价数据报告</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='layui/css/layui.css') }}">
</head>
<body class="layui-layout-body">
  <div class="layui-layout layui-layout-admin">
    <!-- 侧边导航 -->
    <div class="layui-side layui-bg-black">
      <div class="layui-side-scroll">
        <ul class="layui-nav layui-nav-tree" lay-filter="side-nav">
          <li class="layui-nav-item"><a href="#/weixin_decoding_result">每日报价明细</a></li>
          <li class="layui-nav-item"><a href="#/daily_summary">每日汇总</a></li>
          <li class="layui-nav-item"><a href="#/monthly_summary">每月汇总</a></li>
        </ul>
      </div>
    </div>

    <!-- 主内容区（路由视图出口） -->
    <div class="layui-body" id="main-view" style="padding: 15px;">
      <!-- 页面内容动态加载 -->
    </div>
  </div>

  <script src="{{ url_for('static', filename='layui/layui.js') }}"></script>
  <script>
  layui.use(['jquery', 'layer', 'table', 'form', 'dropdown'], function(){
    const $ = layui.jquery;

    // 1. 路由表按需实际情况填写
    const routes = {
      '/weixin_decoding_result': 'weixin_decoding_result',
      '/daily_summary': 'daily_summary',
      '/monthly_summary': 'monthly_summary'
    };

    // 2. 渲染视图函数
    function renderView() {
      const hash = location.hash.replace('#', '') || '/weixin_decoding_result';
      const url = routes[hash];
      if (!url) {
        $('#main-view').html('<div>404 页面不存在</div>');
        return;
      }
      // 加载HTML片段
      $('#main-view').load(url, function(response, status, xhr) {
        if (status === 'error') {
          $('#main-view').html('<div>页面加载失败: ' + xhr.status + ' ' + xhr.statusText + '</div>');
        }
      });
    }

    // 3. 监听hash变化
    window.addEventListener('hashchange', renderView);
    renderView(); // 首次加载
  });
  </script>
</body>
</html>
