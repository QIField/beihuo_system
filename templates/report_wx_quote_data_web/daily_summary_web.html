<div class="layui-card">
    <div class="layui-card-header">每日汇总</div>
    <div class="layui-card-body">
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 80px;">日期</label>
                <div class="layui-input-inline" style="width: 200px;">
                    <input type="text" name="date" id="date" placeholder="选择日期" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 80px;">群名称</label>
                <div class="layui-input-inline" style="width: auto;">
                    <button class="layui-btn layui-btn-primary" id="groupnameBtn">
                        <span>全部</span>
                        <i class="layui-icon layui-icon-down layui-font-12"></i>
                    </button>
                </div>
            </div>

            <div class="layui-inline">
                <button class="layui-btn" id="searchBtn">
                    <i class="layui-icon layui-icon-search"></i> 查询
                </button>
                <button class="layui-btn layui-btn-primary" id="resetBtn">
                    <i class="layui-icon layui-icon-refresh"></i> 重置
                </button>
                <button class="layui-btn layui-btn-warm" id="updateDataBtn">
                    <i class="layui-icon layui-icon-upload-drag"></i> 更新数据
                </button>
            </div>
        </div>
        <table id="dailySummaryTable" lay-filter="dailySummaryTable"></table>
    </div>
</div>

<script>
layui.use(['table', 'layer', 'form', 'jquery', 'laydate', 'dropdown'], function(){
    const table = layui.table;
    const layer = layui.layer;
    const form = layui.form;
    const $ = layui.jquery;
    const laydate = layui.laydate;
    const dropdown = layui.dropdown;
    
    let currentGroupname = '全部';
    let groupnameList = [];
    
    // 获取今天的日期
    function getTodayDate(){
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }
    
    const todayDate = getTodayDate();
    $('#date').val(todayDate);
    
    // 检查用户群权限
    function checkUserPermissions() {
        $.ajax({
            url: '/new/api/report_wx_quote_data/user_group_permissions_api',
            type: 'GET',
            success: function(res) {
                if (res.code === 200 && res.data && res.data.length === 0) {
                    layer.msg('您没有任何群的查看权限，请联系管理员分配权限', { icon: 2, time: 3000 });
                }
            }
        });
    }
    
    // 加载群名称列表
    function loadGroupnameList() {
        $.ajax({
            url: '/new/api/report_wx_quote_data/groupname_list_api',
            type: 'GET',
            success: function(res) {
                if (res.code === 200 && res.data) {
                    groupnameList = [{title: '全部', id: '全部'}];
                    res.data.forEach(function(groupname) {
                        groupnameList.push({title: groupname, id: groupname});
                    });
                    initGroupnameDropdown();
                }
            }
        });
    }
    
    // 初始化群名称下拉框
    function initGroupnameDropdown() {
        dropdown.render({
            elem: '#groupnameBtn',
            data: groupnameList,
            click: function(obj){
                this.elem.find('span').text(obj.title);
                currentGroupname = obj.id;
                reloadTable();
            }
        });
    }
    
    // 检查用户权限
    checkUserPermissions();
    // 加载群名称列表
    loadGroupnameList();
    
    // 渲染日期选择器
    laydate.render({
        elem: '#date',
        type: 'date'
    });
    
    // 渲染表格
    table.render({
        elem: '#dailySummaryTable',
        url: '/new/api/report_wx_quote_data/daily_summary_list_api',
        method: 'get',
        page: true,
        limits: [10, 20, 50, 100],
        limit: 20,
        request: {
            pageName: 'page',
            limitName: 'limit'
        },
        where: {
            date: $('#date').val(),
            groupname: '全部'
        },
        parseData: function(res){
            if (res.code === 403) {
                layer.msg(res.msg || '权限不足', { icon: 2, time: 3000 });
                return {
                    "code": 403,
                    "msg": res.msg || '权限不足',
                    "count": 0,
                    "data": []
                };
            }
            return {
                "code": res.code === 200 ? 0 : res.code,
                "msg": res.msg,
                "count": res.data.total,
                "data": res.data.result
            };
        },
        cols: [[
            {field: 'create_date', title: '创建日期', width: 120},
            {field: 'groupname', title: '群名称', width: 200},
            {field: 'part_name', title: '配件名称', width: 200},
            {field: 'oe_code', title: 'OE码', width: 150},
            {
                field: 'quote_info', 
                title: '品牌价格', 
                width: 300,
                templet: function(d) {
                    if (!d.quote_info) return '';
                    return d.quote_info.split(/\s*\/\s*/).join('<br>');
                }
            },
            {field: 'inquiry_count', title: '询价次数', width: 100, sort: true},
            {field: 'out_of_stock_count', title: '缺货次数', width: 100, sort: true},
            {field: 'deal_count', title: '成交次数', width: 100, sort: true},
            {title: '成交率', width: 100, templet: function(d){ 
                if (d.inquiry_count > 0) {
                    var rate = (d.deal_count / d.inquiry_count * 100).toFixed(1);
                    return rate + '%';
                }
                return '0%';
            }}
        ]],
        height: 'full-250',
        error: function(xhr, status, error) {
            try {
                const res = JSON.parse(xhr.responseText);
                if (res.code === 403 || xhr.status === 403) {
                    layer.msg(res.msg || '权限不足', { icon: 2, time: 3000 });
                } else if (res.code === 401 || xhr.status === 401) {
                    layer.msg(res.msg || '未登录，请先登录', { icon: 2, time: 3000 });
                } else {
                    layer.msg(res.msg || '请求失败: ' + error, { icon: 2 });
                }
            } catch (e) {
                if (xhr.status === 403) {
                    layer.msg('权限不足', { icon: 2, time: 3000 });
                } else if (xhr.status === 401) {
                    layer.msg('未登录，请先登录', { icon: 2, time: 3000 });
                } else {
                    layer.msg('请求失败: ' + error, { icon: 2 });
                }
            }
        }
    });
    
    // 刷新表格
    function reloadTable(){
        table.reload('dailySummaryTable', {
            where: {
                date: $('#date').val(),
                groupname: currentGroupname
            },
            page: {
                curr: 1
            }
        });
    }
    
    // 查询按钮
    $('#searchBtn').off().on('click', function(){
        reloadTable();
    });
    
    // 重置按钮
    $('#resetBtn').off().on('click', function(){
        const today = getTodayDate();
        $('#date').val(today);
        $('#groupnameBtn span').text('全部');
        currentGroupname = '全部';
        reloadTable();
    });
    
    // 更新数据按钮
    $('#updateDataBtn').off().on('click', function(){
        const selectedDate = $('#date').val();
        
        if (!selectedDate) {
            layer.msg('请先选择日期', {icon: 2});
            return;
        }
        
        layer.confirm('确定要更新日期为 ' + selectedDate + ' 的数据吗？', {
            icon: 3,
            title: '确认更新'
        }, function(index){
            layer.close(index);
            
            // 显示加载层
            const loadingIndex = layer.load(1, {
                shade: [0.3, '#000']
            });
            
            $.ajax({
                url: '/new/api/report_wx_quote_data/fetch_data_and_save_to_database_api',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    start_date: selectedDate,
                    end_date: selectedDate
                }),
                success: function(res) {
                    layer.close(loadingIndex);
                    if (res.code === 200) {
                        layer.msg('数据更新成功', {icon: 1});
                        // 刷新表格
                        reloadTable();
                    } else {
                        layer.msg(res.msg || '数据更新失败', {icon: 2});
                    }
                },
                error: function(xhr, status, error) {
                    layer.close(loadingIndex);
                    layer.msg('数据更新失败: ' + error, {icon: 2});
                }
            });
        });
    });
});
</script>
