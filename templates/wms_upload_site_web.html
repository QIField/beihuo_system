<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS采购入库单管理</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='layui/css/layui.css') }}">
    <style>
        .layui-card {
            margin: 15px;
        }
        .layui-card-header {
            font-size: 16px;
            font-weight: bold;
        }
        .table-container {
            padding: 0;
        }
        .layui-table-view th {
            background-color: #f8f9fa;
        }
        .toolbar {
            margin-bottom: 15px;
        }
        /* 确保表格内容可以选中和复制 */
        .layui-table-view .layui-table td,
        .layui-table-view .layui-table th {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }
        /* 价格为0时高亮样式 */
        .price-zero-highlight {
            border-color: #FF5722 !important;
            background-color: #FFF5F0 !important;
        }
        /* 同步价格开关样式 */
        .sync-price-switch {
            display: inline-block;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 2px;
            font-size: 12px;
            border: 1px solid #d2d2d2;
        }
        .sync-price-switch.active {
            background-color: #1E9FFF;
            color: #fff;
            border-color: #1E9FFF;
        }
        .batch-crm-price {
            width: 100%;
            padding: 4px 6px;
            border: 1px solid #d2d2d2;
            border-radius: 2px;
            font-size: 12px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="layui-card">
        <div class="layui-card-header">WMS采购入库单管理</div>
        <div class="layui-card-body">
            <div class="toolbar">
                <form class="layui-form" lay-filter="searchForm">
                    <div class="layui-form-item" style="margin-bottom: 0;">
                        <label class="layui-form-label">供应商名称</label>
                        <div class="layui-input-inline" style="width: 200px;">
                            <input type="text" name="fullname" placeholder="请输入供应商名称" class="layui-input">
                        </div>
                        <label class="layui-form-label">推送状态</label>
                        <div class="layui-input-inline" style="width: 150px;">
                            <select name="has_pushed_ks" lay-filter="has_pushed_ks">
                                <option value="">全部</option>
                                <option value="0">未推送</option>
                                <option value="1">已推送</option>
                            </select>
                        </div>
                        <div class="layui-input-inline">
                            <button type="button" class="layui-btn layui-btn-normal" id="searchBtn">
                                <i class="layui-icon layui-icon-search"></i>搜索
                            </button>
                        </div>
                        <div class="layui-input-inline">
                            <button type="button" class="layui-btn layui-btn-normal" id="reCrawlBtn">
                                <i class="layui-icon layui-icon-download-circle"></i>重新爬取
                            </button>
                        </div>
                        <div class="layui-input-inline">
                            <button type="button" class="layui-btn layui-btn-primary" id="batchProcessBtn">
                                <i class="layui-icon layui-icon-template"></i>批量处理
                            </button>
                        </div>
                        <div class="layui-input-inline">
                            <button type="button" class="layui-btn layui-btn-warm" id="settingsBtn">
                                <i class="layui-icon layui-icon-set"></i>设置
                            </button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="table-container">
                <table id="returnItemsTable" lay-filter="returnItemsTable"></table>
            </div>
        </div>
    </div>

    <!-- 操作列模板 -->
    <script type="text/html" id="tableToolBar">
        <div class="layui-clear-space">
            <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
        </div>
    </script>



    <!-- 查询结果弹窗模板 -->
    <script type="text/html" id="searchResultTemplate">
        <form class="layui-form layui-form-pane" style="padding: 30px;">
            <div class="layui-form-item">
                <label class="layui-form-label">商品编号</label>
                <div class="layui-input-block">
                    <input type="text" id="productPartNum" readonly class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                  <label class="layui-form-label" style="width: 180px;">商家编码（FREY编号）</label>
                <div class="layui-input-block" style="margin-left: 180px;">
                    <input type="text" id="internalName" readonly class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">商品id</label>
                <div class="layui-input-block">
                    <input type="text" id="productId" readonly class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">商品名称</label>
                <div class="layui-input-block">
                    <input type="text" id="productName" readonly class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">品牌</label>
                <div class="layui-input-block">
                    <input type="text" id="productBrandName" readonly class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">品质</label>
                <div class="layui-input-block">
                    <input type="text" id="qualityName" readonly class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">价格</label>
                <div class="layui-input-block">
                    <input type="text" id="defaultPrice" readonly class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">CRM价格</label>
                <div class="layui-input-block">
                    <input type="number" step="0.01" id="crmPrice" class="layui-input" placeholder="请输入CRM价格">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">同步价格</label>
                <div class="layui-input-block">
                    <div id="syncPriceSwitch" class="sync-price-switch active" style="margin-top: 4px;">已开启</div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">数量</label>
                <div class="layui-input-block">
                    <input type="text" id="needqty" readonly class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">仓库名称</label>
                <div class="layui-input-block">
                    <input type="text" id="warehouse_name" readonly class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">报价状态</label>
                <div class="layui-input-block">
                    <input type="text" id="inquiryStatus" readonly class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">商城状态</label>
                <div class="layui-input-block">
                    <input type="text" id="mallStatus" readonly class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">上架状态</label>
                <div class="layui-input-block">
                    <input type="text" id="statusId" readonly class="layui-input">
                </div>
            </div>
            <div class="layui-form-item" style="text-align: center; padding-top: 20px;">
                <button type="button" class="layui-btn layui-btn-normal" id="pushToKaisi">推送到开思</button>
            </div>
        </form>
    </script>


    <!-- 批量处理弹窗模板 -->
    <script type="text/html" id="batchProcessTemplate">
        <!-- flex 布局使内容区高度自适应弹窗拉伸 -->
        <div style="padding: 20px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column;">
            <div id="batchLoading" style="text-align: center; padding: 50px; flex-shrink: 0;">
                <i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop" style="font-size: 50px; color: #1E9FFF;"></i>
                <p style="margin-top: 20px; font-size: 16px;">正在加载数据...</p>
            </div>
            <div id="batchContent" style="display: none; flex: 1; overflow-y: auto; box-sizing: border-box; min-height: 0;">
                <table class="layui-table" lay-skin="line">
                    <thead>
                        <tr>
                            <th>商品编号</th>
                            <th>商家编码</th>
                            <th>商品id</th>
                            <th>商品名称</th>
                            <th>品牌</th>
                            <th>crmOE编号</th>
                            <th style="width: 100px;">开思原始价格</th>
                            <th style="width: 110px;">CRM价格</th>
                            <th>数量</th>
                            <th>仓库名称</th>
                            <th style="width: 90px;">同步价格</th>
                        </tr>
                    </thead>
                    <tbody id="batchProductList">
                    </tbody>
                </table>
                <div style="text-align: center; margin-top: 20px;">
                    <button type="button" class="layui-btn layui-btn-normal" id="batchPushBtn">批量推送到开思</button>
                </div>
            </div>
        </div>
    </script>

    <!-- 设置弹窗模板 -->
    <script type="text/html" id="settingsTemplate">
        <form class="layui-form" lay-filter="settingsForm" style="padding: 30px;">
            <div class="layui-form-item layui-form-text">
                <label class="layui-form-label">备用Cookie</label>
                <div class="layui-input-block">
                    <textarea id="cookieInput" name="cookie" placeholder="自动登录失败时使用的备用Cookie" class="layui-textarea" style="height: 200px;"></textarea>
                </div>
            </div>
            <div class="layui-form-item" style="text-align: center; padding-top: 20px;">
                <button type="button" class="layui-btn layui-btn-normal" id="saveSettingsBtn">保存</button>
                <button type="button" class="layui-btn layui-btn-primary" id="cancelSettingsBtn">取消</button>
            </div>
        </form>
    </script>

    <script src="{{ url_for('static', filename='layui/layui.js') }}"></script>
    <script>
        layui.use(['table', 'layer', 'jquery', 'form'], function(){
            var table = layui.table;
            var layer = layui.layer;
            var $ = layui.$;
            var form = layui.form;
            
            // 定义渲染表格的函数
            function renderTable() {
                return table.render({
                    elem: '#returnItemsTable',
                    url: '/new/api/wms_upload_site/get_return_items_from_db_api',
                    method: 'GET',
                    where: {
                        fullname: '',
                        has_pushed_ks: ''
                    },
                    parseData: function(res){
                        var data = res.data || [];
                        
                        // 确保每条数据都有所有需要的字段
                        for(var i = 0; i < data.length; i++){
                            var item = data[i];
                            
                            // 处理空值显示
                            item.brand_code = item.brand_code || '-';
                            item.brand_name_en = item.brand_name_en || '-';
                            item.suffix = item.suffix || '-';
                            item.return_qty = item.return_qty !== undefined && item.return_qty !== null ? item.return_qty : '-';
                            item.frey_no = item.frey_no || '-';
                            item.number = item.number || '-';
                            item.qty = item.qty !== undefined && item.qty !== null ? item.qty : '-';
                            item.kw_no = item.kw_no || '-';
                            item.warehouse_name = item.warehouse_name || '-';
                            item.kc = item.kc !== undefined && item.kc !== null ? item.kc : '-';
                            item.brandname = item.brandname || '-';
                            item.l_name_zh = item.l_name_zh || '-';
                            item.product_remark = item.product_remark || '-';
                            item.pono = item.pono || '-';
                            item.orders_no = item.orders_no || '-';
                            item.orders_id = item.orders_id || '-';
                            item.has_pushed_ks = item.has_pushed_ks !== undefined && item.has_pushed_ks !== null ? item.has_pushed_ks : 0;
                        }
                        
                        return {
                            "code": res.code === 200 ? 0 : res.code,
                            "msg": res.msg,
                            "count": res.count || 0,
                            "data": data
                        };
                    },
                    cols: [[
                        {type: 'checkbox', fixed: 'left'},
                        {type: 'numbers', title: '序号', width: 80},
                        {field: 'orders_no', title: '订单编号', width: 160, sort: true},
                        {field: 'pono', title: '拣货单号', width: 200, sort: true},
                        {field: 'number', title: 'OE编号', width: 200, sort: true},
                        {field: 'brand_name_en', title: '品牌英文', width: 100},
                        {field: 'brandname', title: '品牌', width: 150},
                        {field: 'frey_no', title: 'FREY编号', width: 180},
                        {field: 'needqty', title: '数量', width: 80, sort: true},
                        {field: 'warehouse_name', title: '仓库名称', width: 120},
                        {field: 'fullname', title: '供应商名称', width: 200},
                        {field: 'has_pushed_ks', title: '是否已推送至快手', width: 200, templet: function(d){
                            if(d.has_pushed_ks == 1){
                                return '<span style="color: #5FB878;">是</span>';
                            } else {
                                return '<span style="color: #999;">否</span>';
                            }
                        }},
                        {fixed: 'right', title:'操作', width: 100, templet: '#tableToolBar'},
                    ]],
                    page: true,
                    limit: 10,
                    limits: [10, 20, 50, 100],
                    loading: true,
                    unselect: false,
                    text: {
                        none: '暂无退货商品数据'
                    }
                });
            }
            
            // 定义爬取数据的函数
            function crawlData(callback) {
                var loading = layer.load(2, {
                    shade: [0.3, '#000'],
                    content: '正在首次爬取数据，请稍候...'
                });
                
                $.ajax({
                    url: '/new/api/wms_upload_site/get_return_items_api',
                    type: 'GET',
                    success: function(res){
                        layer.close(loading);
                        if(res.code === 200){
                            // 爬取成功后执行回调
                            if(callback && typeof callback === 'function'){
                                callback();
                            }
                        } else {
                            layer.msg(res.msg, {icon: 2});
                            // 即使爬取失败也尝试渲染表格
                            if(callback && typeof callback === 'function'){
                                callback();
                            }
                        }
                    },
                    error: function(){
                        layer.close(loading);
                        layer.msg('首次爬取请求失败，直接加载数据库数据', {icon: 0});
                        // 请求失败也尝试渲染表格
                        if(callback && typeof callback === 'function'){
                            callback();
                        }
                    }
                });
            }
            
            // 页面加载时：先爬取数据，再渲染表格
            var tableIns;
            crawlData(function(){
                tableIns = renderTable();
            });

            // 重新爬取按钮
            $('#reCrawlBtn').click(function(){
                layer.confirm('确定要重新爬取数据吗？这可能需要一些时间。', {
                    btn: ['确定', '取消'],
                    icon: 3
                }, function(index){
                    var loading = layer.load(2, {
                        shade: [0.3, '#000'],
                        content: '正在重新爬取数据，请稍候...'
                    });
                    
                    $.ajax({
                        url: '/new/api/wms_upload_site/get_return_items_api',
                        type: 'GET',
                        success: function(res){
                            layer.close(loading);
                            layer.msg(res.msg, {
                                icon: res.code === 200 ? 1 : 2
                            });
                            // 爬取成功后刷新表格
                            if(res.code === 200){
                                tableIns.reload({
                                    page: {
                                        curr: 1
                                    }
                                });
                            }
                        },
                        error: function(){
                            layer.close(loading);
                            layer.msg('请求失败，请稍后重试', {icon: 2});
                        }
                    });
                    
                    layer.close(index);
                });
            });

            // 批量处理按钮
            $('#batchProcessBtn').click(function(){
                var checkStatus = table.checkStatus('returnItemsTable');
                var selectedData = checkStatus.data;
                
                if(selectedData.length === 0){
                    layer.msg('请先选择要处理的数据', {icon: 0});
                    return;
                }
                
                var getTpl = batchProcessTemplate.innerHTML;
                var layerIndex = layer.open({
                    title: '批量处理',
                    type: 1,
                    area: ['1500px', '750px'],
                    // 开启拖动右下角调整弹窗大小
                    resize: true,
                    maxmin: true,
                    content: getTpl,
                    success: function(layero, index){
                        // 存储所有选中行的数据和获取的商品信息
                        var batchData = [];
                        var loadedCount = 0;
                        
                        // 遍历选中的行，逐个获取商品信息
                        for(var i = 0; i < selectedData.length; i++){
                            (function(rowData, idx){
                                $.ajax({
                                    url: '/new/api/wms_upload_site/cassmall_product_list_search_api',
                                    type: 'GET',
                                    data: {
                                        frey_no: rowData.frey_no,
                                        number: rowData.number,
                                        brandname: rowData.brandname
                                    },
                                    success: function(res){
                                        // 检查是否是Cookie无效的情况
                                        var message = res.data && res.data.message ? res.data.message : '';
                                        if(message.indexOf('Cookie 无效或已过期') !== -1){
                                            layer.msg('Cookie 无效或已过期，请配置正确的COOKIE', {icon: 2});
                                        } else if(res.code === 200){
                                            var productList = res.data.data ? res.data.data : [];
                                            if(productList.length > 0){
                                                var product = productList[0];
                                                batchData.push({
                                                    rowData: rowData,
                                                    product: product
                                                });
                                            }
                                        }
                                    },
                                    complete: function(){
                                        loadedCount++;
                                        if(loadedCount === selectedData.length){
                                            renderBatchList(batchData);
                                        }
                                    }
                                });
                            })(selectedData[i], i);
                        }
                        
                        // 渲染批量列表
                        function renderBatchList(data){
                            // 隐藏加载区域，显示内容区域
                            $('#batchLoading').hide();
                            $('#batchContent').show();
                            
                            // 每行数据的状态存储
                            var rowStates = [];
                            for(var i = 0; i < data.length; i++){
                                var product = data[i].product;
                                var crmPriceVal = product.crm_price !== undefined && product.crm_price !== null && product.crm_price !== '-' ? parseFloat(product.crm_price) : 0;
                                rowStates.push({
                                    syncPrice: true,
                                    crmPrice: crmPriceVal > 0 ? crmPriceVal : 0
                                });
                            }
                            
                            var html = '';
                            for(var i = 0; i < data.length; i++){
                                var item = data[i];
                                var row = item.rowData;
                                var product = item.product;
                                var state = rowStates[i];
                                var priceInputClass = 'batch-crm-price';
                                if(state.crmPrice <= 0){
                                    priceInputClass += ' price-zero-highlight';
                                }
                                var switchClass = 'sync-price-switch' + (state.syncPrice ? ' active' : '');
                                var switchText = state.syncPrice ? '已开启' : '已关闭';
                                html += '<tr data-index="' + i + '">';
                                html += '<td>' + (product.productPartNum || '-') + '</td>';
                                html += '<td>' + (product.internalName || '-') + '</td>';
                                html += '<td>' + (product.productId || '-') + '</td>';
                                html += '<td>' + (product.productName || '-') + '</td>';
                                html += '<td>' + (product.productBrandName || '-') + '</td>';
                                // crmOE编号：CRM取价所使用的OE号，取自主表格行数据
                                html += '<td>' + (row.number || '-') + '</td>';
                                html += '<td>' + (product.defaultPrice || '-') + '</td>';
                                html += '<td><input type="number" step="0.01" class="' + priceInputClass + '" data-index="' + i + '" value="' + (state.crmPrice > 0 ? state.crmPrice : '') + '" placeholder="请输入价格"></td>';
                                html += '<td>' + (row.needqty || '-') + '</td>';
                                html += '<td>' + (row.warehouse_name || '-') + '</td>';
                                html += '<td style="text-align: center;"><div class="' + switchClass + '" data-index="' + i + '">' + switchText + '</div></td>';
                                html += '</tr>';
                            }
                            $('#batchProductList').html(html);
                            
                            // 绑定CRM价格输入框事件
                            $('#batchProductList').off('input', '.batch-crm-price').on('input', '.batch-crm-price', function(){
                                var idx = parseInt($(this).data('index'));
                                var val = parseFloat($(this).val());
                                if(isNaN(val)){
                                    val = 0;
                                }
                                rowStates[idx].crmPrice = val;
                                if(val <= 0){
                                    $(this).addClass('price-zero-highlight');
                                } else {
                                    $(this).removeClass('price-zero-highlight');
                                }
                            });
                            
                            // 绑定同步价格开关事件
                            $('#batchProductList').off('click', '.sync-price-switch').on('click', '.sync-price-switch', function(){
                                var idx = parseInt($(this).data('index'));
                                rowStates[idx].syncPrice = !rowStates[idx].syncPrice;
                                if(rowStates[idx].syncPrice){
                                    $(this).addClass('active').text('已开启');
                                } else {
                                    $(this).removeClass('active').text('已关闭');
                                }
                            });
                            
                            // 绑定批量推送事件
                            $('#batchPushBtn').off('click').on('click', function(){
                                if(data.length === 0){
                                    layer.msg('没有可推送的数据', {icon: 0});
                                    return;
                                }
                                
                                // 校验：检查是否有同步价格开启但价格为0的行
                                var errorRows = [];
                                for(var i = 0; i < rowStates.length; i++){
                                    if(rowStates[i].syncPrice && rowStates[i].crmPrice <= 0){
                                        errorRows.push(i + 1);
                                    }
                                }
                                if(errorRows.length > 0){
                                    layer.msg('第' + errorRows.join('、') + '行价格为0，请输入价格或者选择不更新价格', {icon: 0});
                                    return;
                                }
                                
                                layer.confirm('确定要批量推送 ' + data.length + ' 条数据到开思吗？', {
                                    btn: ['确定', '取消'],
                                    icon: 3
                                }, function(confirmIndex){
                                    var loading = layer.load(2, {
                                        shade: [0.3, '#000'],
                                        content: '正在批量推送...'
                                    });
                                    
                                    // 准备批量推送数据
                                    var items = [];
                                    for(var i = 0; i < data.length; i++){
                                        var item = data[i];
                                        var product = item.product;
                                        var row = item.rowData;
                                        var state = rowStates[i];
                                        if(product.productId){
                                            var pushItem = {
                                                product_id: product.productId,
                                                availableToPromiseTotal: row.needqty,
                                                record_id: row.id
                                            };
                                            if(state.syncPrice && state.crmPrice > 0){
                                                pushItem.price = state.crmPrice;
                                            }
                                            items.push(pushItem);
                                        }
                                    }
                                    
                                    if(items.length === 0){
                                        layer.close(loading);
                                        layer.msg('没有有效的商品id', {icon: 2});
                                        return;
                                    }
                                    
                                    // 调用批量推送API
                                    $.ajax({
                                        url: '/new/api/wms_upload_site/inventory_sync_batch_api',
                                        type: 'POST',
                                        contentType: 'application/json',
                                        data: JSON.stringify({ items: items }),
                                        success: function(res){
                                            layer.close(loading);
                                            if(res.code === 200){
                                                var successCount = res.data ? res.data.success_count : 0;
                                                var failedCount = res.data ? res.data.failed_count : 0;
                                                layer.msg('批量同步完成！成功：' + successCount + ' 条，失败：' + failedCount + ' 条', {
                                                    icon: 1,
                                                    time: 2000
                                                });
                                                layer.close(layerIndex);
                                                tableIns.reload({
                                                    page: {
                                                        curr: 1
                                                    }
                                                });
                                            } else {
                                                layer.msg(res.msg, {icon: 2});
                                            }
                                        },
                                        error: function(){
                                            layer.close(loading);
                                            layer.msg('请求失败，请稍后重试', {icon: 2});
                                        }
                                    });
                                    
                                    layer.close(confirmIndex);
                                });
                            });
                        }
                    }
                });
            });

            // 搜索按钮点击事件
            $('#searchBtn').click(function(){
                var fullname = $('input[name="fullname"]').val();
                var has_pushed_ks = $('select[name="has_pushed_ks"]').val();
                
                tableIns.reload({
                    where: {
                        fullname: fullname,
                        has_pushed_ks: has_pushed_ks
                    },
                    page: {
                        curr: 1
                    }
                });
            });

            // 供应商名称输入框回车触发搜索
            $('input[name="fullname"]').keydown(function(e){
                if(e.keyCode === 13){
                    $('#searchBtn').click();
                }
            });

            // 设置按钮点击事件
            $('#settingsBtn').click(function(){
                var getTpl = settingsTemplate.innerHTML;
                var layerIndex = layer.open({
                    title: '备用Cookie设置',
                    type: 1,
                    area: ['600px', '400px'],
                    content: getTpl,
                    success: function(layero, index){
                        // 保存按钮点击事件
                        $('#saveSettingsBtn').off('click').on('click', function(){
                            var cookie = $('#cookieInput').val();
                            
                            if(!cookie || cookie.trim() === ''){
                                layer.msg('备用Cookie不能为空', {icon: 0});
                                return;
                            }
                            
                            var loading = layer.load(2, {
                                shade: [0.3, '#000'],
                                content: '正在保存...'
                            });
                            
                            $.ajax({
                                url: '/new/api/wms_upload_site/set_cookie_api',
                                type: 'POST',
                                contentType: 'application/json',
                                data: JSON.stringify({ cookie: cookie }),
                                success: function(res){
                                    layer.close(loading);
                                    if(res.code === 200){
                                        layer.msg('保存成功', {icon: 1, time: 1500});
                                        layer.close(layerIndex);
                                    } else {
                                        layer.msg(res.msg || '保存失败', {icon: 2});
                                    }
                                },
                                error: function(){
                                    layer.close(loading);
                                    layer.msg('请求失败，请稍后重试', {icon: 2});
                                }
                            });
                        });
                        
                        // 取消按钮点击事件
                        $('#cancelSettingsBtn').off('click').on('click', function(){
                            layer.close(layerIndex);
                        });
                    }
                });
            });
            
            // 表格工具事件
            table.on('tool(returnItemsTable)', function(obj){
                var data = obj.data; // 获得当前行数据
                if(obj.event === 'edit'){
                    var loading = layer.load(2, {
                        shade: [0.3, '#000'],
                        content: '正在查询数据...'
                    });
                    
                    $.ajax({
                        url: '/new/api/wms_upload_site/cassmall_product_list_search_api',
                        type: 'GET',
                        data: {
                            frey_no: data.frey_no,
                            number: data.number,
                            brandname: data.brandname
                        },
                        success: function(res){
                            layer.close(loading);
                            // 检查是否是Cookie无效的情况
                            var message = res.data && res.data.message ? res.data.message : '';
                            if(message.indexOf('Cookie 无效或已过期') !== -1){
                                layer.msg('Cookie 无效或已过期，请配置正确的COOKIE', {icon: 2});
                            } else if(res.code === 200){
                                var productList = res.data.data ? res.data.data : [];
                                var displayMessage = message || '暂无数据';
                                
                                // 保存表格行的数量、仓库名称和 id
                                var rowNeedqty = data.needqty || '';
                                var rowWarehouseName = data.warehouse_name || '';
                                var rowRecordId = data.id || '';
                                
                                if(productList.length > 0){
                                    var currentIndex = 0;
                                    
                                    // 使用layui弹窗
                                    layui.use(['layer', 'jquery'], function(){
                                        var layer = layui.layer;
                                        var $ = layui.$;
                                        
                                        var getTpl = searchResultTemplate.innerHTML;
                                        
                                        // 打开弹窗
                                        layer.open({
                                            title: '查询结果',
                                            type: 1,
                                            area: ['700px', '650px'],
                                            content: '<div id="resultContent"></div>',
                                            success: function(layero, index){
                                                // 渲染函数
                                                function renderData(index){
                                                    var data = productList[index];
                                                    $('#resultContent').html(getTpl);
                                                    
                                                    // 设置表单值
                                                    $('#productPartNum').val(data.productPartNum || '');
                                                    $('#internalName').val(data.internalName || '');
                                                    $('#productId').val(data.productId || '');
                                                    $('#productName').val(data.productName || '');
                                                    $('#productBrandName').val(data.productBrandName || '');
                                                    $('#qualityName').val(data.qualityName || '');
                                                    $('#defaultPrice').val(data.defaultPrice || '');
                                                    var crmPriceVal = data.crm_price !== undefined && data.crm_price !== null && data.crm_price !== '-' ? parseFloat(data.crm_price) : 0;
                                                    $('#crmPrice').val(crmPriceVal > 0 ? crmPriceVal : '');
                                                    // 价格为0时高亮
                                                    if(crmPriceVal <= 0){
                                                        $('#crmPrice').addClass('price-zero-highlight');
                                                    }
                                                    $('#needqty').val(rowNeedqty);
                                                    $('#warehouse_name').val(rowWarehouseName);
                                                    $('#inquiryStatus').val(data.inquiryStatus || '');
                                                    $('#mallStatus').val(data.mallStatus || '');
                                                    $('#statusId').val(data.statusId || '');
                                                    
                                                    // 绑定CRM价格输入框事件
                                                    $('#crmPrice').off('input').on('input', function(){
                                                        var val = parseFloat($(this).val());
                                                        if(isNaN(val) || val <= 0){
                                                            $(this).addClass('price-zero-highlight');
                                                        } else {
                                                            $(this).removeClass('price-zero-highlight');
                                                        }
                                                    });
                                                    
                                                    // 绑定同步价格开关事件
                                                    $('#syncPriceSwitch').off('click').on('click', function(){
                                                        if($(this).hasClass('active')){
                                                            $(this).removeClass('active').text('已关闭');
                                                        } else {
                                                            $(this).addClass('active').text('已开启');
                                                        }
                                                    });
                                                    
                                                    // 添加分页按钮
                                                    var pagingHtml = '<div style="text-align: center; padding: 15px; border-top: 1px solid #eee;">';
                                                    pagingHtml += '<span style="margin-right: 20px;">' + (index + 1) + ' / ' + productList.length + '</span>';
                                                    
                                                    if(productList.length > 1){
                                                        if(index > 0){
                                                            pagingHtml += '<button type="button" class="layui-btn layui-btn-sm" id="prevBtn">上一条</button>';
                                                        }
                                                        if(index < productList.length - 1){
                                                            pagingHtml += '<button type="button" class="layui-btn layui-btn-sm" id="nextBtn" style="margin-left: 10px;">下一条</button>';
                                                        }
                                                    }
                                                    pagingHtml += '</div>';
                                                    
                                                    $('#resultContent').append(pagingHtml);
                                                    
                                                    // 绑定上一条事件
                                                    $('#prevBtn').off('click').on('click', function(){
                                                        if(currentIndex > 0){
                                                            currentIndex--;
                                                            renderData(currentIndex);
                                                        }
                                                    });
                                                    
                                                    // 绑定下一条事件
                                                    $('#nextBtn').off('click').on('click', function(){
                                                        if(currentIndex < productList.length - 1){
                                                            currentIndex++;
                                                            renderData(currentIndex);
                                                        }
                                                    });
                                                    
                                                    // 绑定推送到开思事件
                                                    $('#pushToKaisi').off('click').on('click', function(){
                                                        var productId = $('#productId').val();
                                                        var needqty = $('#needqty').val();
                                                        var crmPrice = $('#crmPrice').val();
                                                        var syncPrice = $('#syncPriceSwitch').hasClass('active');
                                                        
                                                        if(!productId){
                                                            layer.msg('商品id不能为空', {icon: 2});
                                                            return;
                                                        }
                                                        
                                                        if(!needqty){
                                                            layer.msg('数量不能为空', {icon: 2});
                                                            return;
                                                        }
                                                        
                                                        var priceVal = parseFloat(crmPrice);
                                                        if(syncPrice && (isNaN(priceVal) || priceVal <= 0)){
                                                            layer.msg('价格为0，请输入价格或者选择不更新价格', {icon: 0});
                                                            return;
                                                        }
                                                        
                                                        layer.confirm('确定要推送库存到开思吗？', {
                                                            btn: ['确定', '取消'],
                                                            icon: 3
                                                        }, function(index){
                                                            var loading = layer.load(2, {
                                                                shade: [0.3, '#000'],
                                                                content: '正在推送...'
                                                            });
                                                            
                                                            var ajaxData = {
                                                                product_id: productId,
                                                                availableToPromiseTotal: needqty,
                                                                record_id: rowRecordId
                                                            };
                                                            
                                                            if(syncPrice && priceVal > 0){
                                                                ajaxData.price = priceVal;
                                                            }
                                                            
                                                            $.ajax({
                                                                url: '/new/api/wms_upload_site/inventory_sync_api',
                                                                type: 'GET',
                                                                data: ajaxData,
                                                                success: function(res){
                                                                    layer.close(loading);
                                                                    layer.msg(res.msg, {
                                                                        icon: res.code === 200 ? 1 : 2,
                                                                        time: 2000
                                                                    });
                                                                    // 成功后关闭弹窗并刷新表格
                                                                    // if(res.code === 200){
                                                                    //     layer.closeAll();
                                                                    //     tableIns.reload({
                                                                    //         page: {
                                                                    //             curr: 1
                                                                    //         }
                                                                    //     });
                                                                    // }
                                                                },
                                                                error: function(){
                                                                    layer.close(loading);
                                                                    layer.msg('请求失败，请稍后重试', {icon: 2});
                                                                }
                                                            });
                                                            
                                                            layer.close(index);
                                                        });
                                                    });
                                                }
                                                
                                                // 渲染初始数据
                                                renderData(currentIndex);
                                            }
                                        });
                                    });
                                } else {
                                    layer.msg(displayMessage, {icon: 0});
                                }
                            } else {
                                layer.msg(res.msg, {icon: 2});
                            }
                        },
                        error: function(){
                            layer.close(loading);
                            layer.msg('请求失败，请稍后重试', {icon: 2});
                        }
                    });
                }
            });
        });
    </script>
</body>
</html>
