<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>替换号编辑</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='layui/css/layui.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/date-range-picker.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f2f5;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 头部 */
        .header {
            background: #fff;
            padding: 20px 24px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
            color: #262626;
        }

        /* 搜索表单 */
        .search-form {
            background: #fff;
            padding: 20px 24px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-form label {
            font-size: 14px;
            color: #595959;
            white-space: nowrap;
        }

        .search-form input {
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
            width: 300px;
        }

        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #1890ff;
            color: #fff;
        }

        .btn-primary:hover {
            background: #40a9ff;
        }

        .btn-default {
            background: #fff;
            color: #595959;
            border: 1px solid #d9d9d9;
        }

        .btn-default:hover {
            border-color: #40a9ff;
            color: #40a9ff;
        }

        /* 工具栏 */
        .toolbar {
            background: #fff;
            padding: 12px 24px;
            border-radius: 8px 8px 0 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toolbar-info {
            font-size: 14px;
            color: #595959;
        }

        /* 数据表格 */
        .data-container {
            background: #fff;
            padding: 0 24px 24px;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            background: #fafafa;
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: #262626;
            border-bottom: 1px solid #f0f0f0;
        }

        .data-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            color: #595959;
            vertical-align: middle;
        }

        .data-table tr:hover {
            background: #f6ffed;
        }

        .col-oe {
            width: 18%;
            font-weight: 500;
            color: #262626;
        }

        .col-original, .col-other {
            width: 36%;
        }

        .col-upload {
            width: 10%;
        }

        .data-table textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 13px;
            color: #262626;
            resize: vertical;
            font-family: inherit;
            line-height: 1.4;
        }

        .data-table textarea:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24,144,255,0.1);
        }

        .data-table textarea.small {
            min-height: 38px;
        }

        .data-table textarea.large {
            min-height: 124px;
        }

        .split-cell {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .split-cell-label {
            font-size: 12px;
            color: #8c8c8c;
            font-weight: 500;
            line-height: 1.2;
        }

        .data-table select {
            padding: 6px 10px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
            color: #262626;
            background: #fff;
        }

        /* 分页 */
        .pagination-container {
            display: flex;
            justify-content: center;
            padding-top: 20px;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #8c8c8c;
            background: #fff;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #1890ff;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div class="header-title">替换号编辑</div>
        </div>

        <!-- 搜索表单 -->
        <div class="search-form">
            <label>OE号：</label>
            <input type="text" id="searchOe" placeholder="支持空格分隔多值">
            <label>订单日期：</label>
            <input type="text" id="searchOrderdate" placeholder="请选择日期范围" readonly style="width: 220px;">
            <button class="btn btn-primary" onclick="searchData(1)">查询</button>
            <button class="btn btn-default" onclick="resetForm()">重置</button>
        </div>

        <!-- 加载中 -->
        <div class="loading" id="loading" style="display: none;">加载中...</div>

        <!-- 数据区域 -->
        <div id="dataArea" style="display: none;">
            <div class="toolbar">
                <div class="toolbar-info">
                    共 <span id="totalCount">0</span> 条，当前第 <span id="currentPage">1</span> 页
                </div>
                <button class="btn btn-primary" onclick="bulkUpdate()">批量更新</button>
            </div>
            <div class="data-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th class="col-oe">OE</th>
                            <th class="col-original">原厂/4S</th>
                            <th class="col-other">其他品牌</th>
                            <th class="col-upload">是否上传</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody"></tbody>
                </table>
                <div class="pagination-container" id="pagination"></div>
            </div>
        </div>

        <!-- 空状态 -->
        <div class="empty-state" id="emptyState">请输入 OE 号后点击查询</div>
    </div>

    <script src="{{ url_for('static', filename='layui/layui.js') }}"></script>
    <script src="{{ url_for('static', filename='js/date-range-picker.js') }}"></script>
    <script>
        layui.use(['laypage', 'layer'], function(){
            var laypage = layui.laypage;
            var layer = layui.layer;

            // 全局状态
            var currentPage = 1;
            var currentLimit = 10;
            var currentTotal = 0;
            var currentOeFilter = '';
            var currentDateRange = '';

            // 初始化日期选择器
            initDateRangePicker('searchOrderdate');

            // 查询数据
            window.searchData = function(page) {
                page = page || 1;
                currentPage = page;
                currentOeFilter = document.getElementById('searchOe').value.trim();
                currentDateRange = document.getElementById('searchOrderdate').value.trim();

                document.getElementById('loading').style.display = 'block';
                document.getElementById('dataArea').style.display = 'none';
                document.getElementById('emptyState').style.display = 'none';

                var startDate = '';
                var endDate = '';
                if (currentDateRange) {
                    var dates = currentDateRange.split(' - ');
                    if (dates.length === 2) {
                        startDate = dates[0].trim();
                        endDate = dates[1].trim();
                    }
                }

                var params = new URLSearchParams({
                    page: page,
                    limit: currentLimit
                });
                if (currentOeFilter) {
                    params.append('oe', currentOeFilter);
                }
                if (startDate) {
                    params.append('start_date', startDate);
                }
                if (endDate) {
                    params.append('end_date', endDate);
                }

                fetch('/new/api/compare/replace-number-edit-list?' + params.toString())
                    .then(function(response) { return response.json(); })
                    .then(function(result) {
                        document.getElementById('loading').style.display = 'none';

                        if (result.code !== 0) {
                            document.getElementById('emptyState').style.display = 'block';
                            document.getElementById('emptyState').textContent = '查询失败：' + result.message;
                            return;
                        }

                        var list = result.data.list || [];
                        currentTotal = result.data.total || 0;

                        if (list.length === 0) {
                            document.getElementById('emptyState').style.display = 'block';
                            document.getElementById('emptyState').textContent = '没有找到数据';
                            return;
                        }

                        renderTable(list);
                        renderPagination(currentTotal, page);

                        document.getElementById('totalCount').textContent = currentTotal;
                        document.getElementById('currentPage').textContent = page;
                        document.getElementById('dataArea').style.display = 'block';
                    })
                    .catch(function(error) {
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('emptyState').style.display = 'block';
                        document.getElementById('emptyState').textContent = '请求失败：' + error.message;
                    });
            };

            // 渲染表格
            function renderTable(list) {
                var tbody = document.getElementById('dataTableBody');
                tbody.innerHTML = '';

                list.forEach(function(item) {
                    var row = document.createElement('tr');
                    row.dataset.oe = item.oe;

                    row.innerHTML =
                        '<td class="col-oe">' + (item.oe || '-') + '</td>' +
                        '<td class="col-original">' +
                            '<div class="split-cell">' +
                                '<div>' +
                                    '<div class="split-cell-label">原厂</div>' +
                                    '<textarea class="original-input small" data-field="original_numbers">' + (item.original_numbers || '') + '</textarea>' +
                                '</div>' +
                                '<div>' +
                                    '<div class="split-cell-label">4S</div>' +
                                    '<textarea class="fs-input small" data-field="fs_numbers">' + (item.fs_numbers || '') + '</textarea>' +
                                '</div>' +
                            '</div>' +
                        '</td>' +
                        '<td class="col-other">' +
                            '<textarea class="other-input large" data-field="other_numbers">' + (item.other_numbers || '') + '</textarea>' +
                        '</td>' +
                        '<td class="col-upload">' +
                            '<select class="upload-select" data-field="is_upload">' +
                                '<option value="1" ' + (item.is_upload == 1 ? 'selected' : '') + '>1</option>' +
                                '<option value="0" ' + (item.is_upload == 0 ? 'selected' : '') + '>0</option>' +
                            '</select>' +
                        '</td>';

                    tbody.appendChild(row);
                });
            }

            // 渲染分页
            function renderPagination(total, page) {
                laypage.render({
                    elem: 'pagination',
                    count: total,
                    limit: currentLimit,
                    curr: page,
                    layout: ['count', 'prev', 'page', 'next', 'limit', 'skip'],
                    jump: function(obj, first) {
                        if (!first) {
                            currentLimit = obj.limit;
                            searchData(obj.curr);
                        }
                    }
                });
            }

            // 重置表单
            window.resetForm = function() {
                document.getElementById('searchOe').value = '';
                document.getElementById('searchOrderdate').value = '';
                document.getElementById('dataArea').style.display = 'none';
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('emptyState').textContent = '请输入 OE 号后点击查询';
                currentPage = 1;
                currentTotal = 0;
                currentOeFilter = '';
                currentDateRange = '';
            };

            // 批量更新
            window.bulkUpdate = function() {
                var rows = document.querySelectorAll('#dataTableBody tr');
                if (rows.length === 0) {
                    layer.msg('没有可更新的数据', {icon: 2});
                    return;
                }

                var updates = [];
                rows.forEach(function(row) {
                    var oe = row.dataset.oe;
                    var originalNumbers = row.querySelector('.original-input').value.trim();
                    var fsNumbers = row.querySelector('.fs-input').value.trim();
                    var otherNumbers = row.querySelector('.other-input').value.trim();
                    var isUpload = parseInt(row.querySelector('.upload-select').value, 10);

                    updates.push({
                        oe: oe,
                        original_numbers: originalNumbers,
                        fs_numbers: fsNumbers,
                        other_numbers: otherNumbers,
                        is_upload: isUpload
                    });
                });

                var uploadCount = updates.filter(function(u) { return u.is_upload === 1; }).length;
                if (uploadCount === 0) {
                    layer.msg('没有标记为上传（1）的数据', {icon: 2});
                    return;
                }

                layer.confirm('确定要更新当前页中 ' + uploadCount + ' 个标记为上传的 OE 吗？', {
                    icon: 3,
                    title: '确认更新'
                }, function(index) {
                    layer.close(index);
                    doBulkUpdate(updates);
                });
            };

            function doBulkUpdate(updates) {
                layer.msg('更新中，请稍候...', {icon: 16, time: 0, shade: 0.3});

                fetch('/new/api/compare/bulk-update-replace-numbers', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({updates: updates})
                })
                .then(function(response) { return response.json(); })
                .then(function(result) {
                    layer.closeAll('msg');

                    if (result.code !== 0) {
                        layer.msg('更新失败：' + result.message, {icon: 2});
                        return;
                    }

                    var data = result.data || {};
                    layer.msg('更新完成：成功 ' + data.updated + ' 个，失败 ' + data.failed + ' 个', {
                        icon: data.failed > 0 ? 7 : 1,
                        time: 2500
                    });
                })
                .catch(function(error) {
                    layer.closeAll('msg');
                    layer.msg('请求失败：' + error.message, {icon: 2});
                });
            }

            // 页面加载时检查 URL 参数或 sessionStorage
            (function initFromUrl() {
                var urlParams = new URLSearchParams(window.location.search);
                var oeParam = urlParams.get('oe');
                if (oeParam) {
                    document.getElementById('searchOe').value = oeParam;
                    searchData(1);
                    return;
                }

                var storedOeList = sessionStorage.getItem('diff_replace_number_oe_list');
                if (storedOeList) {
                    try {
                        var oeList = JSON.parse(storedOeList);
                        if (Array.isArray(oeList) && oeList.length > 0) {
                            document.getElementById('searchOe').value = oeList.join(' ');
                            sessionStorage.removeItem('diff_replace_number_oe_list');
                            searchData(1);
                        }
                    } catch (e) {
                        sessionStorage.removeItem('diff_replace_number_oe_list');
                    }
                }
            })();
        });
    </script>
</body>
</html>
