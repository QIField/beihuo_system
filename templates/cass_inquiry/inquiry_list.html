<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修理厂询价单</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='layui/css/layui.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='js/handsontable/handsontable.full.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/purchase_plan/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cass_inquiry/price_edit.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cass_inquiry/price_compare.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cass_inquiry/crawl_dialog.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='js/components/grid-column-menu/grid-column-menu.css') }}">
    <script src="{{ url_for('static', filename='layui/layui.js') }}"></script>
    <script src="{{ url_for('static', filename='js/handsontable/handsontable.full.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/components/grid-column-menu/grid-column-menu.js') }}"></script>
    <script src="{{ url_for('static', filename='js/components/custom-pagination/custom-pagination.js') }}"></script>
    <script src="{{ url_for('static', filename='js/components/handsontable-builder/sortable-utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/components/handsontable-builder/handsontable-builder.js') }}"></script>
    <script src="{{ url_for('static', filename='js/purchase_plan/common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/date-range-picker.js') }}"></script>
    <script src="{{ url_for('static', filename='js/cass_inquiry/price_edit_dialog.js') }}"></script>
    <script src="{{ url_for('static', filename='js/cass_inquiry/price_compare.js') }}"></script>
    <script src="{{ url_for('static', filename='js/cass_inquiry/inquiry_list.js') }}"></script>
    <style>
        /* 页面级模块布局（与询比价模块一致） */
        .purchase-plan-page {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 32px);
            min-height: 600px;
        }

        .page-header {
            flex-shrink: 0;
            margin-bottom: 12px;
            border-bottom: none;
            border-radius: 3px;
            padding: 10px 16px;
        }

        .main-layout {
            display: flex;
            flex: 1;
            min-height: 0;
            gap: 12px;
        }

        .filter-panel {
            width: 260px;
            flex-shrink: 0;
            background-color: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 3px;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .filter-panel-title {
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
        }

        .filter-item {
            margin-bottom: 14px;
        }

        .filter-item label {
            display: block;
            font-size: 12px;
            color: #475569;
            margin-bottom: 6px;
        }

        .filter-item .search-input {
            width: 100%;
        }

        .filter-actions {
            margin-top: auto;
            display: flex;
            gap: 8px;
        }

        .filter-actions .btn {
            flex: 1;
        }

        .content-area {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background-color: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
        }

        /* 数据容器扁平化 */
        .data-container {
            border: 1px solid #e2e8f0;
            border-radius: 0;
            box-shadow: none;
            flex: 1;
            min-height: 0;
        }

        #handsontable-container {
            flex: 1;
            min-height: 0;
        }

        #mainPaginationBar {
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="purchase-plan-page">
        <div class="page-header">
            <h2>修理厂询价单</h2>
            <div class="page-tabs">
                <button type="button" class="page-tab active" data-tab="quotes">报价数据</button>
                <button type="button" class="page-tab" data-tab="compare">供应商价格对比</button>
                <button type="button" class="page-tab" id="crawlDialogBtn">数据采集</button>
            </div>
        </div>

        <div class="main-layout">
            <!-- 左侧筛选面板 -->
            <aside class="filter-panel" id="filterPanel">
                <div class="filter-panel-title">筛选条件</div>
                <div class="filter-item">
                    <label>询单日期范围</label>
                    <input type="text" class="search-input" id="inquiryDateRange" placeholder="选择日期范围" readonly>
                </div>
                <div class="filter-item">
                    <label>译码OE号</label>
                    <input type="text" class="search-input" id="searchDecodeNum" placeholder="请输入OE号">
                </div>
                <div class="filter-item">
                    <label>品牌</label>
                    <input type="text" class="search-input" id="searchBrand" placeholder="请输入品牌">
                </div>
                <div class="filter-item">
                    <label>供应商</label>
                    <input type="text" class="search-input" id="searchStore" placeholder="请输入供应商">
                </div>
                <div class="filter-item">
                    <label>询单ID</label>
                    <input type="text" class="search-input" id="searchInquiryId" placeholder="请输入询单ID">
                </div>
                <div class="filter-actions">
                    <button type="button" class="btn btn-default" id="filterResetBtn">清空</button>
                    <button type="button" class="btn btn-primary" id="filterSearchBtn">搜索</button>
                </div>
            </aside>

            <!-- 右侧内容区：小标签页切换 -->
            <main class="content-area">
                <!-- Tab 1：报价数据（现有主表格） -->
                <div class="tab-pane active" id="tab-quotes">
                    <div class="data-container">
                        <div class="data-header">
                            <span>修理厂询单报价数据</span>
                        </div>
                        <div id="handsontable-container"></div>
                        <div id="mainPaginationBar"></div>
                    </div>
                </div>

                <!-- Tab 2：供应商价格对比（按译码OE号与巴博瑞比对） -->
                <div class="tab-pane" id="tab-compare">
                    <div class="compare-toolbar">
                        <span class="toolbar-label">供应商</span>
                        <div class="store-select">
                            <input type="text" class="text-input" id="compareStoreInput"
                                   placeholder="输入名称过滤或直接选择" autocomplete="off">
                            <span class="store-arrow"></span>
                            <div class="store-options" id="compareStoreOptions"></div>
                        </div>
                        <span class="toolbar-label">开始日期</span>
                        <input type="date" class="text-input date-input" id="compareStartDate">
                        <span class="toolbar-label">结束日期</span>
                        <input type="date" class="text-input date-input" id="compareEndDate">
                        <button type="button" class="btn btn-primary" id="compareStartBtn">开始比对</button>
                        <span class="toolbar-tip">与「佛山巴博瑞汽配」按译码OE号+品牌一对一比对，价格取卖家价格；日期留空为全部；基准为巴博瑞同OE同品牌最低价</span>
                    </div>
                    <div class="data-container compare-data-container">
                        <div class="data-header">
                            <span id="compareResultTitle">价格对比结果</span>
                        </div>
                        <div id="compare-handsontable-container"></div>
                        <div id="comparePaginationBar"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 数据采集弹窗 -->
    <div class="crawl-mask" id="crawlMask" style="display:none;">
        <div class="crawl-dialog">
            <div class="crawl-dialog-header">
                <span>数据采集（报价爬取）</span>
                <button type="button" class="crawl-close" id="crawlCloseBtn">&times;</button>
            </div>
            <div class="crawl-dialog-body">
                <div class="crawl-form-row">
                    <label>开始日期</label>
                    <input type="date" id="crawlStartDate">
                </div>
                <div class="crawl-form-row">
                    <label>结束日期</label>
                    <input type="date" id="crawlEndDate">
                </div>
                <div class="crawl-form-row">
                    <label>Cookie</label>
                    <textarea id="crawlCookie" rows="4" placeholder="粘贴登录 Cookie（仅本次采集使用，不保存）"></textarea>
                </div>
                <div class="crawl-progress" id="crawlProgress" style="display:none;">
                    <div class="crawl-progress-text" id="crawlProgressText">准备中...</div>
                    <div class="crawl-progress-bar"><div class="crawl-progress-inner" id="crawlProgressBar"></div></div>
                    <div class="crawl-failed-list" id="crawlFailedList"></div>
                </div>
                <div class="crawl-result" id="crawlResult" style="display:none;"></div>
            </div>
            <div class="crawl-dialog-footer">
                <button type="button" class="crawl-btn-primary" id="crawlStartBtn">开始爬取</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/cass_inquiry/crawl_dialog.js') }}"></script>
</body>
</html>
