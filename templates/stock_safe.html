<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全库存看板</title>
    <!-- 基础库 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='ag-grid/ag-grid.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='ag-grid/ag-theme-alpine.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='layui/css/layui.css') }}">
    <!--
        本模块不再引用任何项目自写公共组件的 CSS / JS（filter-panel、grid-column-menu、
        column-preference、custom-pagination 均不引用），只依赖第三方库 layui 和 AG Grid。
    -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f2f5;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1800px; margin: 0 auto; }

        /* ===== 头部 ===== */
        .header {
            background: #fff;
            padding: 24px 28px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border: 1px solid #f5f5f5;
        }
        .header-title { font-size: 26px; font-weight: 600; color: #262626; letter-spacing: 0.5px; }
        .header-subtitle { font-size: 14px; color: #8c8c8c; margin-top: 6px; }
        .header-actions { display: flex; gap: 12px; }

        /* ===== 统计卡片 ===== */
        .stat-cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 16px; }
        .stat-card {
            background: #fff;
            border-radius: 8px;
            padding: 12px 14px;
            transition: all 0.25s ease;
            box-shadow: 0 1px 6px rgba(0,0,0,0.05);
            border: 1px solid #f5f5f5;
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(0,0,0,0.10);
        }
        .stat-card.danger::before { background: #ff4d4f; }
        .stat-card.warning::before { background: #faad14; }
        .stat-card.info::before { background: #1890ff; }
        .stat-card.success::before { background: #52c41a; }
        .stat-card.dead::before { background: #8c8c8c; }
        .stat-card.slow::before { background: #fa8c16; }

        .stat-card-value { font-size: 22px; font-weight: 700; line-height: 1.1; margin-bottom: 2px; color: #262626; font-family: 'Roboto Mono', 'Consolas', monospace; }
        .stat-card-label { font-size: 13px; color: #8c8c8c; font-weight: 500; }

        /* ===== 工具栏 ===== */
        .toolbar {
            background: #fff;
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            border: 1px solid #f5f5f5;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
        }
        .toolbar-left {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            flex: 1 1 auto;
        }
        .filter-item { display: flex; align-items: center; gap: 6px; }
        .filter-item label { font-size: 14px; color: #595959; white-space: nowrap; }
        .filter-item input,
        .filter-item select {
            width: 150px;
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s;
            background: #fff;
        }
        .filter-item input:focus,
        .filter-item select:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24,144,255,0.2);
        }

        .toolbar-right {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-left: auto;
        }
        .toolbar-right .total-badge {
            background: #e6f7ff;
            color: #1890ff;
            padding: 6px 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            margin-right: 4px;
        }

        .btn {
            padding: 9px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }
        .btn-primary { background: #1890ff; color: #fff; }
        .btn-primary:hover { background: #40a9ff; box-shadow: 0 4px 10px rgba(24,144,255,0.3); }
        .btn-success { background: #52c41a; color: #fff; }
        .btn-success:hover { background: #73d13d; box-shadow: 0 4px 10px rgba(82,196,26,0.3); }
        .btn-default { background: #fff; color: #595959; border: 1px solid #d9d9d9; }
        .btn-default:hover { color: #1890ff; border-color: #1890ff; }

        /* ===== AG Grid ===== */
        .grid-wrapper {
            background: #fff;
            border-radius: 10px;
            padding: 0;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            border: 1px solid #f5f5f5;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .grid-container { height: 620px; width: 100%; padding: 14px 14px 0 14px; }
        #stockSafeGrid { height: 100%; width: 100%; }
        .ag-theme-alpine {
            --ag-background-color: #fff;
            --ag-header-background-color: #fafafa;
            --ag-odd-row-background-color: #fcfcfc;
            --ag-header-foreground-color: #262626;
            --ag-foreground-color: #434343;
            --ag-border-color: #f0f0f0;
            --ag-row-hover-color: #e6f7ff;
            --ag-selected-row-background-color: #e6f7ff;
            --ag-header-height: 44px;
            --ag-row-height: 42px;
            --ag-header-column-separator-display: block;
            --ag-header-column-separator-height: 40%;
            --ag-header-column-separator-color: #e8e8e8;
        }
        .ag-theme-alpine .ag-header-cell {
            font-weight: 600;
            font-size: 13px;
        }
        .ag-theme-alpine .ag-cell {
            font-size: 13px;
            padding-right: 14px;
        }
        .ag-theme-alpine .ag-cell-focus,
        .ag-theme-alpine .ag-cell:focus {
            outline: none;
        }

        /* ===== 单元格样式 ===== */
        .cell-status { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 4px; font-size: 12px; font-weight: 500; }
        .status-danger { background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; }
        .status-warning { background: #fffbe6; color: #d48806; border: 1px solid #ffe58f; }
        .status-info { background: #e6f7ff; color: #096dd9; border: 1px solid #91d5ff; }
        .status-success { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }
        .status-dead { background: #f5f5f5; color: #595959; border: 1px solid #d9d9d9; }
        .status-slow { background: #fff7e6; color: #d46b08; border: 1px solid #ffd591; }

        .abc-tag { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 4px; font-size: 12px; font-weight: 700; }
        .abc-a { background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; }
        .abc-b { background: #e6f7ff; color: #096dd9; border: 1px solid #91d5ff; }
        .abc-c { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }

        .cell-number { font-family: 'Roboto Mono', 'Consolas', monospace; font-weight: 500; text-align: right; }

        /* 表头菜单按钮状态高亮 */
        .ag-col-menu-btn.has-condition {
            color: #1890ff !important;
            font-weight: bold;
        }

        /* ===== 列显示设置 弹窗 ===== */
        .col-visibility-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.35);
            display: none;
            z-index: 9999999;
            align-items: center;
            justify-content: center;
        }
        .col-visibility-modal.show { display: flex; }
        .col-visibility-panel {
            background: #fff;
            width: 360px;
            max-width: 90vw;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .col-visibility-header {
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            font-weight: 600;
            color: #262626;
            display: flex; justify-content: space-between; align-items: center;
        }
        .col-visibility-header .close-btn {
            cursor: pointer; color: #8c8c8c;
            background: transparent; border: none; font-size: 18px; line-height: 1;
        }
        .col-visibility-header .close-btn:hover { color: #262626; }
        .col-visibility-actions {
            padding: 10px 20px;
            border-bottom: 1px dashed #f0f0f0;
            display: flex;
            gap: 8px;
        }
        .col-visibility-actions button {
            padding: 4px 12px;
            font-size: 12px;
            border: 1px solid #d9d9d9;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            color: #595959;
        }
        .col-visibility-actions button:hover { border-color: #1890ff; color: #1890ff; }
        .col-visibility-list {
            max-height: 360px;
            overflow-y: auto;
            padding: 8px 0;
        }
        .col-visibility-list label {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 20px;
            cursor: pointer; font-size: 13px; color: #434343;
        }
        .col-visibility-list label:hover { background: #f5faff; }
        .col-visibility-list input { margin: 0; }
        .col-visibility-footer {
            padding: 14px 20px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            background: #fafafa;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 1200px) {
            .stat-cards { grid-template-columns: repeat(5, 1fr); }
        }
        @media (max-width: 900px) {
            .stat-cards { grid-template-columns: repeat(3, 1fr); }
            .toolbar { flex-direction: column; gap: 14px; align-items: stretch; }
            .toolbar-right { margin-left: 0; justify-content: space-between; }
            .header { flex-direction: column; gap: 14px; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div>
                <div class="header-title">安全库存看板</div>
                <div class="header-subtitle">基于 ABC 分类和季节性调整的智能库存预警系统 · 数据每日自动刷新</div>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" id="btnExport">
                    <i class="layui-icon">&#xe601;</i> 导出数据
                </button>
            </div>
        </div>

        <!-- 统计卡片：紧凑排版 -->
        <div class="stat-cards">
            <div class="stat-card danger">
                <div class="stat-card-label">紧急补货</div>
                <div class="stat-card-value" id="count_紧急补货">0</div>
            </div>
            <div class="stat-card warning">
                <div class="stat-card-label">需补货</div>
                <div class="stat-card-value" id="count_需补货">0</div>
            </div>
            <div class="stat-card danger">
                <div class="stat-card-label">需补货|可卖天数较少</div>
                <div class="stat-card-value" id="count_需补货|可卖天数较少">0</div>
            </div>
            <div class="stat-card slow">
                <div class="stat-card-label">慢动销去库</div>
                <div class="stat-card-value" id="count_慢动销去库">0</div>
            </div>
            <div class="stat-card dead">
                <div class="stat-card-label">呆滞清库</div>
                <div class="stat-card-value" id="count_呆滞清库">0</div>
            </div>
            <div class="stat-card success">
                <div class="stat-card-label">库存正常</div>
                <div class="stat-card-value" id="count_库存正常">0</div>
            </div>
            <div class="stat-card dead">
                <div class="stat-card-label">无销售</div>
                <div class="stat-card-value" id="count_无销售">0</div>
            </div>
            <div class="stat-card slow">
                <div class="stat-card-label">销量极低</div>
                <div class="stat-card-value" id="count_销量极低">0</div>
            </div>
            <div class="stat-card slow">
                <div class="stat-card-label">销量低</div>
                <div class="stat-card-value" id="count_销量低">0</div>
            </div>
            <div class="stat-card success">
                <div class="stat-card-label">销量正常</div>
                <div class="stat-card-value" id="count_销量正常">0</div>
            </div>
        </div>

        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="toolbar-left">
                <div class="filter-item">
                    <label>关键词：</label>
                    <input type="text" id="filterKeyword" placeholder="OE号/品牌/名称/条码">
                </div>
                <div class="filter-item">
                    <label>销售状态：</label>
                    <select id="filterSalesStatus">
                        <option value="">全部</option>
                        <option value="无销售">无销售</option>
                        <option value="销量极低">销量极低</option>
                        <option value="销量低">销量低</option>
                        <option value="销量正常">销量正常</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label>库存状态：</label>
                    <select id="filterStockStatus">
                        <option value="">全部</option>
                        <option value="呆滞清库">呆滞清库</option>
                        <option value="慢动销去库">慢动销去库</option>
                        <option value="库存积压">库存积压</option>
                        <option value="需补货">需补货</option>
                        <option value="需补货|可卖天数较少">需补货|可卖天数较少</option>
                        <option value="紧急补货">紧急补货</option>
                        <option value="库存正常">库存正常</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label>ABC分类：</label>
                    <select id="filterABC">
                        <option value="">全部</option>
                        <option value="A">A类</option>
                        <option value="B">B类</option>
                        <option value="C">C类</option>
                    </select>
                </div>
                <button class="btn btn-primary" id="btnSearch">
                    <i class="layui-icon">&#xe615;</i> 查询
                </button>
                <button class="btn btn-default" id="btnReset">
                    <i class="layui-icon">&#x1006;</i> 重置
                </button>
            </div>
            <div class="toolbar-right">
                <span class="total-badge" id="totalBadge">共 0 条记录</span>
                <button class="btn btn-default" id="btnColumns">
                    <i class="layui-icon">&#xe629;</i> 列显示
                </button>
                <button class="btn btn-default" id="btnRefresh">
                    <i class="layui-icon">&#xe669;</i> 刷新
                </button>
            </div>
        </div>

        <!-- AG Grid 表格 + 分页（分页 div 直接放在模板中，由 pagination.js 渲染内容） -->
        <div class="grid-wrapper">
            <div class="grid-container">
                <div id="stockSafeGrid" class="ag-theme-alpine"></div>
            </div>
            <div id="stockSafePagination"></div>
        </div>
    </div>

    <!-- 列显示设置 弹窗 -->
    <div class="col-visibility-modal" id="colVisibilityModal">
        <div class="col-visibility-panel">
            <div class="col-visibility-header">
                <span>列显示设置</span>
                <button class="close-btn" id="btnColClose">&times;</button>
            </div>
            <div class="col-visibility-actions">
                <button id="btnColAll">全选</button>
                <button id="btnColNone">全不选</button>
            </div>
            <div class="col-visibility-list" id="colVisibilityList"></div>
            <div class="col-visibility-footer">
                <button class="btn btn-default" id="btnColCancel">取消</button>
                <button class="btn btn-primary" id="btnColConfirm">确定</button>
            </div>
        </div>
    </div>

    <!-- 第三方依赖：layui 和 AG Grid（仅此两个第三方库，不含任何项目自写公共组件） -->
    <script src="{{ url_for('static', filename='layui/layui.js') }}"></script>
    <script src="{{ url_for('static', filename='ag-grid/ag-grid-community.min.js') }}"></script>
    <script src="{{ url_for('static', filename='ag-grid/ag-grid-utils.js') }}"></script>
    <!-- 本模块私有代码：分页（复制自公共 CustomPagination 重新封装，零公共依赖）+ 页面逻辑 -->
    <script src="{{ url_for('static', filename='js/stock_safe/pagination.js') }}"></script>
    <script src="{{ url_for('static', filename='js/stock_safe/stock_safe.js') }}"></script>
</body>
</html>
