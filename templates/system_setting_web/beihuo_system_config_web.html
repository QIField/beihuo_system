<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>系统配置管理</title>
   <link rel="stylesheet" href="/static/layui/css/layui.css">
    <style>
        .container {
            padding: 20px;
        }
        .layui-table-view {
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .toolbar {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <blockquote class="layui-elem-quote">系统配置管理</blockquote>
        
        <!-- 工具栏 -->
        <div class="toolbar">
            <button class="layui-btn layui-btn-normal" onclick="openAddModal()">
                <i class="layui-icon layui-icon-add-1"></i> 新增配置
            </button>
        </div>
        
        <table id="configTable" lay-filter="configTable"></table>
    </div>

    <!-- 新增/编辑弹窗 -->
    <script type="text/html" id="configForm">
        <form class="layui-form layui-form-pane" lay-filter="configForm" style="padding: 20px;">
            <div class="layui-form-item">
                <label class="layui-form-label">配置键</label>
                <div class="layui-input-block">
                    <input type="text" name="config_key" lay-verify="required" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">标签</label>
                <div class="layui-input-block">
                    <input type="text" name="label" lay-verify="required" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">配置值</label>
                <div class="layui-input-block">
                    <input type="text" name="config_value" lay-verify="required" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">类型</label>
                    <div class="layui-input-inline">
                        <select name="config_type">
                            <option value="string">string</option>
                            <option value="number">number</option>
                            <option value="boolean">boolean</option>
                            <option value="json">json</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">分组</label>
                    <div class="layui-input-inline">
                        <input type="text" name="config_group" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">环境</label>
                    <div class="layui-input-inline">
                        <select name="env">
                            <option value="dev">dev</option>
                            <option value="test">test</option>
                            <option value="prod">prod</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">排序</label>
                    <div class="layui-input-inline">
                        <input type="number" name="sort" value="1" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-form-item" pane>
                <label class="layui-form-label">状态</label>
                <div class="layui-input-block">
                    <input type="checkbox" name="status" lay-skin="switch" lay-text="启用|禁用" checked>
                </div>
            </div>
            <div class="layui-form-item layui-form-text">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea name="remark" placeholder="请输入备注" class="layui-textarea"></textarea>
                </div>
            </div>
            <button type="submit" lay-submit lay-filter="configForm" style="display:none;"></button>
        </form>
    </script>

     <script src="/static/layui/layui.js"></script>
    <script>
        layui.use(['table', 'layer', 'form', 'jquery'], function(){
            var table = layui.table;
            var layer = layui.layer;
            var form = layui.form;
            var $ = layui.jquery;
            var modalIndex;
            var isEdit = false;
            var editId = null;
            
            table.render({
            elem: '#configTable',
            url: '/new/api/system_setting/get_paged_configs_api',
            method: 'get',
            page: {
                limits: [10, 20, 30, 50, 100],
                layout: ['count', 'prev', 'page', 'next', 'limit', 'refresh', 'skip'],
                prev: '上一页',
                next: '下一页',
                first: '首页',
                last: '尾页'
            },
            limit: 10,
            request: {
                pageName: 'page',
                limitName: 'limit'
            },
            parseData: function(res){
                return {
                    "code": res.code === 200 ? 0 : res.code,
                    "msg": res.msg,
                    "count": res.data ? res.data.total : 0,
                    "data": res.data ? res.data.data_list : []
                };
            },
            toolbar: false,
            defaultToolbar: ['filter', 'exports', 'print'],
            cols: [[
                {field: 'id', title: 'ID', width: 80, sort: true},
                {field: 'config_key', title: '配置键', width: 150},
                {field: 'label', title: '标签', width: 150},
                {field: 'config_value', title: '配置值', minWidth: 150},
                {field: 'config_type', title: '类型', width: 100},
                {field: 'config_group', title: '分组', width: 120},
                {field: 'sort', title: '排序', width: 80, sort: true},
                {field: 'status', title: '状态', width: 80, templet: function(d){
                    return d.status === 1 ? '<span style="color: #5FB878;">启用</span>' : '<span style="color: #FF5722;">禁用</span>';
                }},
                {field: 'env', title: '环境', width: 100},
                {field: 'remark', title: '备注', minWidth: 150},
                {field: 'created_at', title: '创建时间', width: 170},
                {field: 'updated_at', title: '更新时间', width: 170},
                {title: '操作', width: 120, fixed: 'right', toolbar: '#tableBar'}
            ]],
            height: 'full-100'
        });

        // 监听行工具事件
        table.on('tool(configTable)', function(obj){
            var data = obj.data;
            if(obj.event === 'edit'){
                openEditModal(data);
            }
        });

        // 监听表单提交
        form.on('submit(configForm)', function(data){
            var formData = data.field;
            formData.status = formData.status === 'on' ? 1 : 0;
            
            if(isEdit && editId){
                formData.id = editId;
                submitEditForm(formData);
            } else {
                submitAddForm(formData);
            }
            
            return false;
        });

        // 打开新增弹窗
        window.openAddModal = function() {
            isEdit = false;
            editId = null;
            
            modalIndex = layer.open({
                type: 1,
                title: '新增配置',
                area: ['600px', '550px'],
                content: $('#configForm').html(),
                btn: ['确定', '取消'],
                yes: function(index, layero){
                    layero.find('button[lay-submit]').trigger('click');
                },
                success: function(layero, index){
                    form.render();
                }
            });
        }

        // 打开编辑弹窗
        window.openEditModal = function(data) {
            isEdit = true;
            editId = data.id;
            
            modalIndex = layer.open({
                type: 1,
                title: '编辑配置',
                area: ['600px', '550px'],
                content: $('#configForm').html(),
                btn: ['确定', '取消'],
                yes: function(index, layero){
                    layero.find('button[lay-submit]').trigger('click');
                },
                success: function(layero, index){
                    // 填充数据
                    layero.find('input[name="config_key"]').val(data.config_key);
                    layero.find('input[name="label"]').val(data.label);
                    layero.find('input[name="config_value"]').val(data.config_value);
                    layero.find('select[name="config_type"]').val(data.config_type);
                    layero.find('input[name="config_group"]').val(data.config_group);
                    layero.find('select[name="env"]').val(data.env);
                    layero.find('input[name="sort"]').val(data.sort);
                    layero.find('textarea[name="remark"]').val(data.remark);
                    if(data.status === 1){
                        layero.find('input[name="status"]').prop('checked', true);
                    }
                    form.render();
                }
            });
        }

        // 提交新增表单
        function submitAddForm(formData) {
            $.ajax({
                url: '/new/api/system_setting/create_config_api',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(formData),
                success: function(res){
                    if(res.code === 200 || res.code === 0){
                        layer.msg('新增成功', {icon: 1});
                        layer.close(modalIndex);
                        table.reload('configTable');
                    } else {
                        layer.msg(res.msg || '新增失败', {icon: 2});
                    }
                },
                error: function(){
                    layer.msg('请求失败', {icon: 2});
                }
            });
        }

        // 提交编辑表单
        function submitEditForm(formData) {
            $.ajax({
                url: '/new/api/system_setting/update_config_api',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(formData),
                success: function(res){
                    if(res.code === 200 || res.code === 0){
                        layer.msg('更新成功', {icon: 1});
                        layer.close(modalIndex);
                        table.reload('configTable');
                    } else {
                        layer.msg(res.msg || '更新失败', {icon: 2});
                    }
                },
                error: function(){
                    layer.msg('请求失败', {icon: 2});
                }
            });
        }
        });
    </script>
    
    <!-- 表格工具栏模板 -->
    <script type="text/html" id="tableBar">
        <a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="edit">
            <i class="layui-icon layui-icon-edit"></i> 编辑
        </a>
    </script>
</body>
</html>
