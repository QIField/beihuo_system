[uwsgi]
# ============================================
# uWSGI 配置文件 - 针对 Flask 应用优化
# 目的：防止 worker 崩溃导致的应用不稳定
# ============================================

# --- 基础配置 ---
# 主应用文件
module = beihuo_system:app

# 启用 master 进程（必须）
master = true

# 工作进程数量（根据服务器 CPU 核心数调整）
# 建议：CPU 核心数 * 2 + 1
processes = 4

# 每个 worker 的线程数
threads = 2

# 启用线程支持
enable-threads = true

# --- 网络配置 ---
# 使用 Unix Socket（性能更好）或 HTTP
# 如果使用 Nginx 反向代理，使用 socket
# socket = /tmp/beihuo_system.sock
# chmod-socket = 666

# 或者使用 HTTP（直接对外服务）
http = 0.0.0.0:5000

# --- Worker 管理（防止崩溃的关键配置）---

# 1. 优雅重启：每个 worker 处理 1000 个请求后自动重启
# 这可以防止内存泄漏导致的崩溃
max-requests = 1000

# 2. 启用 max-requests 的随机性，避免所有 worker 同时重启
max-requests-delta = 50

# 3. 限制每个 worker 的内存使用（MB）
# 超过此限制，worker 会被优雅重启
limit-as = 512

# 4. worker 空闲超时（秒）
# 空闲超过 300 秒的 worker 会被回收
idle = 300

# 5. 启用 harakiri（请求超时处理）
# 单个请求超过 60 秒会被强制终止
harakiri = 60

# 6. 缓冲超时
harakiri-verbose = true

# --- 进程管理 ---

# 当进程退出时，自动清理进程表
vacuum = true

# 单例模式（某些情况下有用）
# single-interpreter = true

# --- 日志配置 ---

# 日志文件路径
logto = /www/wwwlogs/python/beihuo_system/uwsgi.log

# 日志格式
log-format = [%(ltime)] %(method) %(uri) => %(status) (%(rsize) bytes)

# 启用 master 进程的日志
log-master = true

# --- 性能优化 ---

# 启用 Python 自动重载（开发环境用，生产环境建议关闭）
# py-autoreload = 1

# 预加载应用（可以减少内存使用，但可能导致某些问题）
# lazy-apps = true

# 如果使用预加载，需要设置
# 确保每个 worker 独立初始化
lazy-apps = true

# --- 安全与稳定 ---

# 不启用 Python 线程的 GIL 优化（某些库需要）
# 如果你的应用使用了某些 C 扩展，可能需要关闭
# 默认启用即可

# 设置缓冲区大小
buffer-size = 32768

#  post-buffering 用于处理大请求
post-buffering = 8192

# --- 监控与调试 ---

# 启用 stats 接口（用于监控）
# stats = /tmp/uwsgi-stats.sock

# 内存报告
memory-report = true

# 当 worker 被杀死时打印详细信息
need-app = true

# --- 环境变量 ---

# 设置 Python 环境变量
env = PYTHONPATH=/www/server/pyporject_evn/beihuo_system_venv/lib/python3.x/site-packages

# 禁用自动启动开思对单任务（如果需要手动控制）
# env = AUTO_START_KS_BILL=false

# ============================================
# 重要说明：
#
# 1. lazy-apps = true 是关键配置！
#    它确保每个 worker 独立加载应用，避免共享状态问题
#
# 2. max-requests 防止内存泄漏
#    worker 处理一定请求后会自动重启
#
# 3. limit-as 防止内存溢出
#    worker 内存超过限制会被优雅重启
#
# 4. 如果仍然出现段错误，可以尝试：
#    - 减少 processes 数量
#    - 禁用 threads（设置为 1）
#    - 检查第三方库兼容性
#
# 启动命令：
# uwsgi --ini uwsgi.ini
#
# 后台运行：
# uwsgi --ini uwsgi.ini --daemonize /var/log/uwsgi/beihuo_system.log
# ============================================
