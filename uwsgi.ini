[uwsgi]
# ============================================
# uWSGI 生产环境配置 - 极简版
# ============================================

# --- 基础配置 ---
module = beihuo_system:app
master = true

# 工作目录
chdir = /www/wwwroot/beihuo_system

# 单进程多线程（简单稳定）
processes = 1
threads = 4
enable-threads = true

# --- 网络配置 ---
http = 0.0.0.0:5000

# --- 进程管理 ---
max-requests = 5000
harakiri = 120
die-on-term = true
pidfile = /tmp/beihuo_system.pid
vacuum = true

# --- 日志配置 ---
logto = /www/wwwlogs/python/beihuo_system/uwsgi.log
log-master = true

# --- 安全 ---
buffer-size = 32768

# ============================================
# 启动命令：uwsgi --ini uwsgi.ini
# ============================================
